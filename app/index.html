<!doctype html>
<!-- Redirect stub for the retired /app/ beta URL (#460 cutover). The React shell
     used to live at /Shohoj/app/; it is now the site root at /Shohoj/. The CI
     deploy copies this file to _deploy/app/index.html so the bare /app/ bookmark
     lands on the root shell. Deep links (/app/<route>) are rewritten by 404.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Shohoj — moved</title>
    <meta http-equiv="refresh" content="0; url=/Shohoj/" />
    <link rel="canonical" href="/Shohoj/" />
    <script>
      // Preserve any hash; the /app/ prefix is dropped — the shell owns the root.
      location.replace('/Shohoj/' + location.hash);
    </script>
  </head>
  <body>
    <p>The app moved to <a href="/Shohoj/">shohoj</a>.</p>
  </body>
</html>
