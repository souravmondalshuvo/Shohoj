name = "shohoj-papers"
main = "index.js"
compatibility_date = "2025-09-01"

# R2 bucket binding — create the bucket in the Cloudflare dashboard first.
[[r2_buckets]]
binding = "PAPERS_BUCKET"
bucket_name = "shohoj-papers"

# Per-UID rate limit. Each /upload and /reviews call increments a counter
# keyed on the Firebase UID (`<namespace>:<uid>`); over the threshold returns
# HTTP 429. The simple_action enforces a sliding-window limit on the worker.
# Tune `limit` and `period` for your traffic; current values target a single
# active student burst (≈ a dozen uploads / reviews per minute).
[[unsafe.bindings]]
name = "PAPERS_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Plain-text env vars — safe to commit. Do NOT put secrets here; use
# `wrangler secret put` for anything sensitive:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put SERVICE_ACCOUNT_JSON   # Firebase service-account JSON, used for /upload metadata and /reviews writes
#
# Admin authorization is enforced via the Firebase `admin` custom claim
# (see scripts/set_admin_claim.js).
[vars]
FIREBASE_PROJECT_ID = "shohoj"
ALLOWED_ORIGINS = "https://souravmondalshuvo.github.io,http://localhost:5173,http://127.0.0.1:5173"
ADMIN_EMAIL = "admin.shohoj@gmail.com"
ADMIN_MODERATION_URL = "https://souravmondalshuvo.github.io/Shohoj/admin/"
EMAIL_FROM = "Shohoj <onboarding@resend.dev>"
