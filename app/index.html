<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Content-Security-Policy (#460 follow-up). Mirrors the policy the legacy
         build3.py page ships, adapted for the shell: same Google/Firebase auth +
         App Check origins, the papers Worker, the CONNECT feed, and cdnjs for the
         on-demand pdf.js / jsPDF loaders (which also need blob: workers).
         The placeholder token in script-src below is replaced at build time with
         the sha256 of every inline script block, by the shohoj:shell-csp-hashes
         plugin, so no 'unsafe-inline' is needed in script-src (style-src keeps it
         — React and the route CSS set inline styles). Do NOT repeat that token
         anywhere else in this file: the plugin asserts it appears exactly once. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.gstatic.com https://www.google.com https://apis.google.com https://accounts.google.com 'sha256-H6Nut0AeGlIyACxQh0YdZxoyGojwUsG+GYQhCQOa0mw=' 'sha256-o0zSAid/iqiLHkGbM/oaAhexTuRJ1KFzrCFCK478L48='; worker-src 'self' https://cdnjs.cloudflare.com blob:; style-src 'self' https://fonts.googleapis.com https://accounts.google.com 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src 'self' blob: https://www.gstatic.com https://www.google.com https://accounts.google.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseappcheck.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.googleapis.com https://shohoj-papers.souravmondal033.workers.dev https://usis-cdn.eniamza.com; img-src 'self' data: https://*.googleusercontent.com; frame-src 'self' blob: https://accounts.google.com https://www.google.com https://*.firebaseapp.com; frame-ancestors 'none'"
    />
    <title>Shohoj</title>
    <script>
      // Apply the saved theme before first paint (no flash). Default dark, the
      // same shohoj_theme key the production app uses.
      (function () {
        try {
          var t = localStorage.getItem('shohoj_theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/Shohoj/app/assets/index-OPovrTXD.js"></script>
    <link rel="modulepreload" crossorigin href="/Shohoj/app/assets/jsx-runtime-Cltr0gcK.js">
    <link rel="modulepreload" crossorigin href="/Shohoj/app/assets/errors-N5yrIYTi.js">
    <link rel="modulepreload" crossorigin href="/Shohoj/app/assets/result-DC1aEgQR.js">
    <link rel="stylesheet" crossorigin href="/Shohoj/app/assets/index-DbcoBrjq.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- The generated runtime config (window._shohoj_* globals) — served/emitted
         by the vite.shell.config.js plugin; a comment stub when not generated,
         so the shell degrades to the offline capability set. Loaded before the
         module entry so the globals exist when providers read them. -->
    <script>
      // Deep-link restore for static hosting (#449): GitHub Pages has no SPA
      // fallback, so 404.html redirects /Shohoj/app/<route> here as ?/<route>
      // ('&' escaped as ~and~). Decode it back into the real pathname before
      // the router module boots. No-op when the query doesn't start with ?/.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname + decoded.slice(1) + l.hash);
        }
      })(window.location);
    </script>
    <script src="/Shohoj/app/runtime-config.js"></script>
  </body>
</html>
