// ── R2-backed paper storage (via Cloudflare Worker proxy) ─────────────────
// Download is keyed on the Firestore paper id, not the raw storage path. The
// worker re-fetches the paper doc using the caller's own ID token, so
// Firestore rules enforce that the requester is allowed to read it
// (approved == true OR uploaderUid == self OR admin). This closes the
// path-guessing bypass where an attacker who guessed a storagePath could
// download an unapproved file directly.
// Map a file's leading magic bytes to a renderable MIME type. Pre-migration R2
// objects can be served without a usable Content-Type (application/octet-stream
// or empty), so `res.blob()` yields a typeless blob and the preview <iframe>
// renders blank. Sniffing lets us re-tag the blob with a type the browser will
// render inline. Returns null when the signature isn't a supported preview type.
function _sniffPreviewMime(bytes) {
  const b = bytes;
  if (b.length < 4) return null;
  // %PDF
  if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return 'application/pdf';
  // PNG: 89 50 4E 47
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return 'image/png';
  // JPEG: FF D8 FF
  if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return 'image/jpeg';
  // GIF: "GIF"
  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return 'image/gif';
  // WEBP: "RIFF"…"WEBP"
  if (b.length >= 12 &&
      b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 &&
      b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'image/webp';
  return null;
}

// When the server hands back a generic/empty Content-Type, re-wrap the blob
// with a sniffed type so the preview renders inline instead of blank.
async function _retypeGenericBlob(blob) {
  const t = (blob.type || '').toLowerCase();
  if (t === 'application/pdf' || t.startsWith('image/')) return blob;
  try {
    const head = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
    const sniffed = _sniffPreviewMime(head);
    if (sniffed) return new Blob([blob], { type: sniffed });
  } catch { /* sniff failed — fall through to original blob */ }
  return blob;
}

window._shohoj_paperDownloadUrl = async function(paperId) {
  if (!currentUser || !paperId) return null;
  const base = getPapersWorkerUrl();
  if (!base) {
    console.warn('[Shohoj] papers worker URL not configured');
    return null;
  }
  const token = await getCurrentUserIdToken(currentUser);
  if (!token) return null;
  try {
    const res = await fetch(`${base}/download?paperId=${encodeURIComponent(paperId)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) {
      console.warn('[Shohoj] paperDownloadUrl: worker returned', res.status);
      return null;
    }
    const blob = await _retypeGenericBlob(await res.blob());
    const url = URL.createObjectURL(blob);
    setTimeout(() => URL.revokeObjectURL(url), 5 * 60 * 1000);
    return url;
  } catch (e) {
    console.warn('[Shohoj] paperDownloadUrl failed:', e);
    return null;
  }
};

window._shohoj_uploadPaper = async function({ file, courseCode, type, title, semester, facultyInitials }) {
  if (!currentUser) return { ok: false, error: 'Not signed in' };
  if (!file || !courseCode || !type || !title) return { ok: false, error: 'Missing fields' };
  const base = getPapersWorkerUrl();
  if (!base) return { ok: false, error: 'Upload service not configured. Contact admin.' };
  try {
    const safeCourse = String(courseCode).toUpperCase();
    const ext = (file.name.split('.').pop() || 'pdf').toLowerCase().replace(/[^a-z0-9]/g, '');
    const filename = `${Date.now()}_${Math.random().toString(36).slice(2, 10)}.${ext}`;

    const token = await getCurrentUserIdToken(currentUser);
    if (!token) return { ok: false, error: 'Could not get auth token' };

    // Extra metadata is passed as URL params so the Worker can validate the
    // upload, write the authoritative Firestore paper doc, and include the
    // fields in the admin notification email.
    const params = new URLSearchParams({
      courseCode: safeCourse,
      filename,
      title: String(title || '').slice(0, 120),
      type: String(type || ''),
    });
    if (semester)        params.set('semester', String(semester).slice(0, 40));
    if (facultyInitials) params.set('facultyInitials', String(facultyInitials).toUpperCase().slice(0, 20));

    const uploadRes = await fetch(
      `${base}/upload?${params.toString()}`,
      {
        method: 'POST',
        headers: {

window._shohoj_fetchAdminStats = async function() {
  if (!_isAdminUser()) return null;
  const since = Date.now() - 30 * 24 * 60 * 60 * 1000;
  const sinceTs = new Date(since);

  const _toMs = (ts) => {
    if (!ts) return 0;
    if (typeof ts === 'object' && ts.toMillis) return ts.toMillis();
    return Number(ts) || 0;
  };

  // Pull recent (last 30d) + a larger sample for top-N aggregation.
  const [reviewsRecent, papersRecent, feedbackRecent,
         reviewsAll, papersAll, feedbackAll,
         paperReports, reviewReports, pendingPapers] = await Promise.all([
    getDocs(query(collection(db, 'facultyReviews'),
                  where('createdAt', '>=', sinceTs), orderBy('createdAt', 'desc'),
                  qLimit(1000))).then(s => s.docs.map(d => d.data())).catch(() => []),
    getDocs(query(collection(db, 'papers'),
                  where('createdAt', '>=', sinceTs), orderBy('createdAt', 'desc'),
                  qLimit(1000))).then(s => s.docs.map(d => d.data())).catch(() => []),
    getDocs(query(collection(db, 'appFeedback'),
                  where('createdAt', '>=', sinceTs), orderBy('createdAt', 'desc'),
                  qLimit(1000))).then(s => s.docs.map(d => d.data())).catch(() => []),
    getDocs(query(collection(db, 'facultyReviews'),
                  orderBy('createdAt', 'desc'), qLimit(1000)))
      .then(s => s.docs.map(d => d.data())).catch(() => []),
    getDocs(query(collection(db, 'papers'),
                  orderBy('createdAt', 'desc'), qLimit(1000)))
      .then(s => s.docs.map(d => d.data())).catch(() => []),
    getDocs(query(collection(db, 'appFeedback'),
                  orderBy('createdAt', 'desc'), qLimit(1000)))
      .then(s => s.docs.map(d => d.data())).catch(() => []),
    window._shohoj_fetchPaperReports(),
    window._shohoj_fetchReviewReports(),
    window._shohoj_fetchUnapprovedPapers(),
  ]);

  // Build 30-day daily buckets (UTC date key). Pre-fill with zeros.
  const buckets = {};
  for (let i = 29; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const key = d.toISOString().slice(0, 10);
    buckets[key] = { date: key, reviews: 0, papers: 0, feedback: 0 };
  }
  const _bump = (rows, kind) => {
    rows.forEach(r => {
      const ms = _toMs(r.createdAt);
      if (!ms) return;
      const key = new Date(ms).toISOString().slice(0, 10);
      if (buckets[key]) buckets[key][kind]++;
    });
  };
  _bump(reviewsRecent,  'reviews');
  _bump(papersRecent,   'papers');
  _bump(feedbackRecent, 'feedback');

  // Filter seeded reviews from analytics so the chart reflects real activity.
  const reviewsRecentReal = reviewsRecent.filter(r => r.seeded !== true);
  const reviewsAllReal    = reviewsAll.filter(r => r.seeded !== true);

  // Re-bucket reviews using the real-only set (papers + feedback already real).
  Object.values(buckets).forEach(b => { b.reviews = 0; });
  _bump(reviewsRecentReal, 'reviews');

  // Top faculty (by review count) and top courses (by paper count).
  const facultyMap = new Map();
  reviewsAllReal.forEach(r => {
    const k = r.facultyInitials || '?';
    facultyMap.set(k, (facultyMap.get(k) || 0) + 1);
  });
  const topFaculty = [...facultyMap.entries()]
    .map(([initials, count]) => ({ initials, count }))
    .sort((a, b) => b.count - a.count).slice(0, 5);

  const courseMap = new Map();
  papersAll.forEach(p => {
    const k = p.courseCode || '?';
    courseMap.set(k, (courseMap.get(k) || 0) + 1);
  });
  const topCourses = [...courseMap.entries()]
    .map(([code, count]) => ({ code, count }))
    .sort((a, b) => b.count - a.count).slice(0, 5);

  // Type breakdowns.
  const paperTypes = {};
  papersAll.forEach(p => {
    const t = p.type || 'other';
    paperTypes[t] = (paperTypes[t] || 0) + 1;
  });
  const feedbackTypes = {};
  feedbackAll.forEach(f => {
    const t = f.type || 'general';
    feedbackTypes[t] = (feedbackTypes[t] || 0) + 1;
  });

  const approvedPapers = papersAll.filter(p => p.approved === true).length;

  return {
    counts: {
      reviews:        reviewsAllReal.length,
      papers:         approvedPapers,
      pendingPapers:  pendingPapers.length,
      feedback:       feedbackAll.length,
      paperReports:   paperReports.length,
      reviewReports:  reviewReports.length,
    },
    activity: Object.values(buckets),
    topFaculty,
    topCourses,
    paperTypes,
    feedbackTypes,
  };
};

  let yr = parseInt(startYear);
  for (let i = 0; i < count; i++) {
    names.push(`${order[si]} ${yr} (${ordinalSup(i + 1)} Semester)`);
    si++;
    if (si >= order.length) { si = 0; yr++; }
  }
  return names;
}

function getStartSeason() {
  const el = document.getElementById('startSeason');
  return el ? el.value : 'Fall';
}

function getStartYear() {
  const el = document.getElementById('startYear');
  return el ? el.value : '2024';
}

// ── js/core/dispatch.js ─────────────────────────────────────────
// ── ACTION DISPATCH ───────────────────────────────────────────────────────────
// Replaces inline onclick/onchange/oninput attributes with delegated listeners
// resolved from a single data-action attribute plus a registry of handlers.
// This lets the bundled HTML drop 'unsafe-inline' from script-src in CSP.
//
// Usage from a module's template literal:
//   <button data-action="addCourse" data-sem-id="${sem.id}">+ Add</button>
//
// And from the module's top-level code (runs once at module load):
//   registerAction('addCourse', (el) => addCourse(Number(el.dataset.semId)));
//
// The handler receives (element, event). The event type is whichever of
// click / change / input fired — each element should declare a data-action
// for exactly one event type.

const _actions = Object.create(null);

function registerAction(name, handler) {
  _actions[name] = handler;
}

function _dispatch(event) {
  const el = event.target.closest('[data-action]');
  if (!el) return;
  const fn = _actions[el.dataset.action];
  if (typeof fn === 'function') fn(el, event);
}

// Enter-to-submit, CSP-safe. An element can carry data-enter-action to run a
// registered action when Enter is pressed inside it (replaces inline
// onkeydown="...Enter..." attributes, which the bundle's CSP blocks).
function _dispatchEnter(event) {
  if (event.key !== 'Enter') return;
  // keydown can fire with document/window as target, which lack closest().
  if (!event.target || typeof event.target.closest !== 'function') return;
  const el = event.target.closest('[data-enter-action]');
  if (!el) return;
  const fn = _actions[el.dataset.enterAction];
  if (typeof fn === 'function') fn(el, event);
}

if (typeof document !== 'undefined') {
  ['click', 'change', 'input'].forEach(type => {
    document.addEventListener(type, _dispatch);
  });
  document.addEventListener('keydown', _dispatchEnter);
}

// Expose globally so modules can register without importing (e.g. firebase.js
// is a separate module script that does not consume the bundle's exports).
if (typeof window !== 'undefined') {
  window._shohoj_registerAction = registerAction;
}

// Returns the prefix portion of a course code (letters before the first digit).
function getCoursePrefix(code) {
  const m = String(code).match(/^([A-Z]+)/);
  return m ? m[1] : '';
}

// Returns the owning department code for a course, or null if unknown.
function getCourseDept(code) {
  const upper = String(code).toUpperCase();
  if (upper === 'CST333') return 'BBA';
  return PREFIX_DEPT_MAP[getCoursePrefix(upper)] ?? null;
}

// Storage hooks that firebase.js exposes on window._shohoj_* so the rest of
// the bundled code can browse, upload, and report papers without touching
// Firebase directly.

const PAPERS_COURSE_CODE_RE = /^[A-Z]{2,4}[0-9]{3}[A-Z]?$/;
const PAPER_TYPES = ['midterm', 'final', 'quiz', 'notes', 'assignment', 'lab', 'lab-quiz'];
const ALLOWED_PAPER_MIME_RE = /^application\/pdf$|^image\/(?:png|jpeg|webp|gif)$/;
const MAX_FILE_SIZE = 10 * 1024 * 1024;

const PAPER_TYPE_LABELS = {
  midterm:     'Midterm',
  final:       'Final',
  quiz:        'Quiz',
  notes:       'Notes',
  assignment:  'Assignment',
  lab:         'Lab Report',
  'lab-quiz':  'Lab Quiz',
};

function normalizeCourseCode(raw) {
  return String(raw || '').toUpperCase().trim();
}

function isKnownCourseCode(raw) {
  const code = normalizeCourseCode(raw);
  return PAPERS_COURSE_CODE_RE.test(code) && !!COURSE_DB[code];
}

function isValidPaperType(t) {
  return PAPER_TYPES.includes(String(t || '').toLowerCase());
}

function validatePaperUpload({ file, courseCode, type, title }) {
  if (!file) return 'File is required';
  if (file.size <= 0) return 'File is empty';
  if (file.size > MAX_FILE_SIZE) return 'File must be 10 MB or smaller';
  if (!ALLOWED_PAPER_MIME_RE.test(file.type || '')) return 'Only PDFs, PNG, JPEG, WebP, and GIF images are allowed';
  const code = normalizeCourseCode(courseCode);
  if (!isKnownCourseCode(code)) return 'Unknown course code';
  if (!isValidPaperType(type)) return 'Invalid paper type';
  const cleanTitle = String(title || '').trim();
  if (cleanTitle.length < 3) return 'Title must be at least 3 characters';
  if (cleanTitle.length > 120) return 'Title must be 120 characters or less';
  return null;
}

async function fetchPapersByCourse(courseCode) {
  if (typeof window._shohoj_fetchPapersByCourse !== 'function') return [];
  const code = normalizeCourseCode(courseCode);
  if (!isKnownCourseCode(code)) return [];
  return window._shohoj_fetchPapersByCourse(code);
}

async function fetchRecentPapers(n = 30) {
  if (typeof window._shohoj_fetchRecentPapers !== 'function') return [];
  return window._shohoj_fetchRecentPapers(n);
}

async function fetchMyPapers() {
  if (typeof window._shohoj_fetchMyPapers !== 'function') return [];
  return window._shohoj_fetchMyPapers();
}

async function getPaperDownloadUrl(paperId) {
  if (typeof window._shohoj_paperDownloadUrl !== 'function') return null;
  return window._shohoj_paperDownloadUrl(paperId);
}

async function uploadPaper(payload) {
  if (typeof window._shohoj_uploadPaper !== 'function') {
    return { ok: false, error: 'Upload unavailable' };
  }
  const err = validatePaperUpload(payload);
  if (err) return { ok: false, error: err };
  return window._shohoj_uploadPaper({
    ...payload,
    courseCode: normalizeCourseCode(payload.courseCode),
    type: String(payload.type).toLowerCase(),
    title: String(payload.title).trim(),
  });
}

async function reportPaper(paperId, reason) {
  if (typeof window._shohoj_reportPaper !== 'function') {
    return { ok: false, error: 'Reporting unavailable' };
  }
  return window._shohoj_reportPaper({ paperId, reason });
}

function paperTimestampMs(p) {
  if (!p || !p.createdAt) return 0;
  if (typeof p.createdAt.toMillis === 'function') return p.createdAt.toMillis();
  if (p.createdAt.seconds) return p.createdAt.seconds * 1000;
  return 0;
}

// ── js/ui/previewModalPdfjs.js ──────────────────────────────────
// ── js/ui/previewModalPdfjs.js ────────────────────────────────────────────────
// Alternative paper preview that renders PDFs with PDF.js to canvas inside the
// parent document, instead of handing them off to the browser's built-in PDF
// iframe viewer. Why: the iframe viewer runs cross-process (Chrome) or in a
// separate document (Safari/Firefox), so the parent never receives mousemove
// events while the pointer is over the PDF — the site's JS custom cursor
// freezes. Rendering each page to a <canvas> in the same document means
// mousemove fires normally and the custom cursor tracks across the whole modal.
//
// Trade-offs: loses the browser PDF toolbar (page jump field, native print,
// download button). We provide minimal page-count + zoom controls; the "Open
// in new tab" link still offers full browser PDF UI as an escape hatch.
//
// Activated by setting localStorage.setItem('shohoj_pdfjs_preview','1') in the
// console. Falls back to the legacy iframe modal for non-PDF mime types or
// when pdfjsLib isn't available.

const PDFJS_WORKER_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const BASE_RENDER_SCALE = 1.5; // canvas pixel density vs CSS pixel size

function _pdfjsAvailable() {
  return typeof window.pdfjsLib !== 'undefined';
}

function _ensureWorker() {
  if (!_pdfjsAvailable()) return false;
  if (!window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_SRC;
  }
  return true;
}

async function openPreviewModalPdfjs({ url, title, mimeType }) {
  if (!_ensureWorker()) {
    throw new Error('PDF.js not loaded');
  }

  const wrap = document.createElement('div');
  wrap.className = 'admin-preview-backdrop';
  wrap.innerHTML = `
    <div class="admin-preview-modal admin-preview-modal--pdfjs" role="dialog" aria-modal="true" aria-label="${escAttr(title)}">
      <header class="admin-preview-head">
        <div class="admin-preview-title">${escHtml(title)}</div>
        <div class="admin-preview-head-actions">
          <div class="admin-preview-toolbar">
            <span class="admin-preview-page-indicator" aria-live="polite">…</span>
            <button type="button" class="admin-preview-zoom-btn" data-act="zoom-out" aria-label="Zoom out">−</button>
            <span class="admin-preview-zoom-indicator" aria-live="polite">100%</span>
            <button type="button" class="admin-preview-zoom-btn" data-act="zoom-in" aria-label="Zoom in">+</button>
          </div>
          <a class="admin-preview-newtab" href="${escAttr(url)}" target="_blank" rel="noopener">Open in new tab ↗</a>
          <button type="button" class="admin-preview-close" aria-label="Close">×</button>
        </div>
      </header>
      <div class="admin-preview-body admin-preview-body--pdfjs">
        <div class="admin-preview-pdfjs-pages" tabindex="0"></div>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  const close = () => {
    wrap.remove();
    document.removeEventListener('keydown', onKey);
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  wrap.querySelector('.admin-preview-close').addEventListener('click', close);
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  document.addEventListener('keydown', onKey);

  const pagesContainer = wrap.querySelector('.admin-preview-pdfjs-pages');
  const pageInd = wrap.querySelector('.admin-preview-page-indicator');
  const zoomInd = wrap.querySelector('.admin-preview-zoom-indicator');
  let zoom = 1.0;
  let pdf = null;

  async function renderAll() {
    pagesContainer.innerHTML = '';
    if (!pdf) return;
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: zoom * BASE_RENDER_SCALE });
      const canvas = document.createElement('canvas');
      canvas.className = 'admin-preview-pdfjs-page';
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = (viewport.width / BASE_RENDER_SCALE) + 'px';
      canvas.style.height = (viewport.height / BASE_RENDER_SCALE) + 'px';
      pagesContainer.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    }
  }

  function setZoom(next) {
    zoom = Math.max(0.5, Math.min(next, 3));
    zoomInd.textContent = Math.round(zoom * 100) + '%';
    renderAll();
  }

  wrap.querySelectorAll('.admin-preview-zoom-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      setZoom(act === 'zoom-in' ? zoom * 1.25 : zoom / 1.25);
    });
  });

  try {
    // isEvalSupported:false closes CVE-2024-4367 (arbitrary JS execution via a
    // crafted PDF) on this pinned pdf.js 3.11.174; defence-in-depth alongside
    // the no-'unsafe-eval' CSP.
    pdf = await window.pdfjsLib.getDocument({ url, isEvalSupported: false }).promise;
    pageInd.textContent = `${pdf.numPages} page${pdf.numPages !== 1 ? 's' : ''}`;
    await renderAll();
  } catch (e) {
    console.error('[Shohoj] PDF.js render failed:', e);
    pagesContainer.innerHTML = `
      <div class="admin-preview-pdfjs-error">
        Failed to render PDF.
        <a href="${escAttr(url)}" target="_blank" rel="noopener">Open in new tab</a>
      </div>
    `;
  }
}

// ── js/ui/previewModal.js ───────────────────────────────────────
// ── js/ui/previewModal.js ─────────────────────────────────────────────────────
// Shared inline preview modal for paper PDFs and images. Used by both the admin
// moderation queue and the public Papers tab.
//
// PDFs render in an <iframe>, images in an <img>. The "Open in new tab" link is
// kept as a fallback for browsers that won't render PDFs inline (mobile Safari).
// The modal closes on × / backdrop click / Escape.
//
// Cursor.js tracks parent-document mousemove events, so iframe-internal mouse
// movement would otherwise freeze the custom cursor at the iframe edge. blob:
// URLs are same-origin, so we forward mousemove from iframe.contentDocument
// back to the parent with iframe-relative coords translated to viewport coords.

// Feature-flagged router: when localStorage.shohoj_pdfjs_preview === '1' and
// the file is a PDF, render via PDF.js inside the parent document so the JS
// custom cursor tracks normally. Otherwise fall back to the legacy <iframe>
// modal (which gives the browser's native PDF toolbar but freezes the custom
// cursor over the iframe area).
function openPreviewModal(opts) {
  const usePdfjs = (() => {
    try { return localStorage.getItem('shohoj_pdfjs_preview') === '1'; } catch { return false; }
  })();
  if (usePdfjs && opts && opts.mimeType === 'application/pdf') {
    return openPreviewModalPdfjs(opts).catch(err => {
      console.warn('[Shohoj] pdfjs preview failed, falling back to iframe:', err);
      return _openPreviewModalIframe(opts);
    });
  }
  return _openPreviewModalIframe(opts);
}

function _openPreviewModalIframe({ url, title, mimeType, path }) {
  const isImage = mimeType
    ? /^image\//i.test(mimeType)
    : /\.(png|jpe?g|gif|webp)$/i.test(path || '');
  const wrap = document.createElement('div');
  wrap.className = 'admin-preview-backdrop';
  const body = isImage
    ? `<img class="admin-preview-img" src="${escAttr(url)}" alt="${escAttr(title)}">`
    : `<iframe class="admin-preview-iframe" src="${escAttr(url)}" title="${escAttr(title)}"></iframe>`;
  wrap.innerHTML = `
    <div class="admin-preview-modal" role="dialog" aria-modal="true" aria-label="${escAttr(title)}">
      <header class="admin-preview-head">
        <div class="admin-preview-title">${escHtml(title)}</div>
        <div class="admin-preview-head-actions">
          <a class="admin-preview-newtab" href="${escAttr(url)}" target="_blank" rel="noopener">Open in new tab ↗</a>
          <button type="button" class="admin-preview-close" aria-label="Close">×</button>
        </div>
      </header>
      <div class="admin-preview-body">${body}</div>
    </div>
  `;
  document.body.appendChild(wrap);

  const close = () => {
    wrap.remove();
    document.removeEventListener('keydown', onKey);
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  wrap.querySelector('.admin-preview-close').addEventListener('click', close);
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  document.addEventListener('keydown', onKey);

  const iframe = wrap.querySelector('.admin-preview-iframe');
  if (iframe) {
    iframe.addEventListener('load', () => {
      try {
        const doc = iframe.contentDocument;
        if (!doc) return;
        doc.addEventListener('mousemove', e => {
          const rect = iframe.getBoundingClientRect();
          document.dispatchEvent(new MouseEvent('mousemove', {
            clientX: rect.left + e.clientX,
            clientY: rect.top + e.clientY,
          }));
        }, { passive: true });
      } catch { /* cross-origin iframe — nothing we can do */ }
    });
  }
}

// ── js/ui/adminDashboard.js ──────────────────────────────────────────────────
// Full-page admin/moderator dashboard. Hides the regular site shell and
// renders a dedicated page with stats, charts, and triage queues for:
//   • Pending paper uploads (approve / delete)
//   • Reports — paper + review (delete reported item or dismiss report)
//   • Feedback (delete)
//   • Lost & found posts (delete; #371 — removes the hidden contact doc too)
//
// Reuses the global window._shohoj_* admin helpers from firebase.js.
// Charts via Chart.js loaded from CDN in index.html.

let _open = false;
let _dedicated = false;
const _charts = {};

const ADMIN_STAT_DEFS = [
  ['Total reviews', 'reviews'],
  ['Approved papers', 'papers'],
  ['Pending papers', 'pendingPapers'],
  ['Feedback items', 'feedback'],
  ['Paper reports', 'paperReports'],
  ['Review reports', 'reviewReports'],
];

const EMPTY_ADMIN_STATS = {
  counts: {
    reviews: 0,
    papers: 0,
    pendingPapers: 0,
    feedback: 0,
    paperReports: 0,
    reviewReports: 0,
  },
  activity: [],
  topFaculty: [],
  topCourses: [],
  paperTypes: {},
  feedbackTypes: {},
};

function _nonNegativeNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) && n >= 0 ? n : 0;
}

function _stringLabel(value, fallback = '?') {
  const s = String(value ?? '').trim();
  return s || fallback;
}

function _normalizeBreakdown(obj) {
  if (!obj || typeof obj !== 'object') return {};
  return Object.fromEntries(
    Object.entries(obj).map(([key, value]) => [_stringLabel(key), _nonNegativeNumber(value)]),
  );
}

function _adminCheck() {
  return typeof window._shohoj_isAdmin === 'function' && window._shohoj_isAdmin();
}

function _adminToast(msg) {
  if (typeof window._shohoj_showToast === 'function') {
    window._shohoj_showToast(msg);
  } else {
    alert(msg);
  }
}

function _adminFormatDate(ts) {
  if (!ts) return '';
  const ms = typeof ts === 'object' && ts.toMillis ? ts.toMillis() : Number(ts);
  if (!ms || isNaN(ms)) return '';
  return new Date(ms).toLocaleString(undefined, {
    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
  });
}

function normalizeAdminStats(stats) {
  const src = stats && typeof stats === 'object' ? stats : {};
  const srcCounts = src.counts && typeof src.counts === 'object' ? src.counts : {};
  const counts = { ...EMPTY_ADMIN_STATS.counts };
  Object.keys(counts).forEach(key => {
    counts[key] = _nonNegativeNumber(srcCounts[key]);
  });

  return {
    counts,
    activity: Array.isArray(src.activity)
      ? src.activity
        .filter(row => row && typeof row.date === 'string')
        .map(row => ({
          date: row.date,
          reviews: _nonNegativeNumber(row.reviews),
          papers: _nonNegativeNumber(row.papers),
          feedback: _nonNegativeNumber(row.feedback),
        }))
      : [],
    topFaculty: Array.isArray(src.topFaculty)
      ? src.topFaculty.map(row => ({
        initials: _stringLabel(row?.initials),
        count: _nonNegativeNumber(row?.count),
      }))
      : [],
    topCourses: Array.isArray(src.topCourses)
      ? src.topCourses.map(row => ({
        code: _stringLabel(row?.code),
        count: _nonNegativeNumber(row?.count),
      }))
      : [],
    paperTypes: _normalizeBreakdown(src.paperTypes),
    feedbackTypes: _normalizeBreakdown(src.feedbackTypes),
  };
}

function _statsSkeletonHtml() {
  return ADMIN_STAT_DEFS.map(([label]) => _statCardSkeleton(label)).join('');
}

function buildAdminStatsHtml(stats) {
  const normalized = normalizeAdminStats(stats);
  return ADMIN_STAT_DEFS
    .map(([label, key]) => _statCard(label, normalized.counts[key]))
    .join('');
}

function _statCardSkeleton(label) {
  return `
    <div class="admin-stat-card">
      <div class="admin-stat-label">${escHtml(label)}</div>
      <div class="admin-stat-value"><span class="admin-skel admin-stat-value-skel"></span></div>
    </div>
  `;
}

function _statCard(label, value) {
  return `
    <div class="admin-stat-card">
      <div class="admin-stat-label">${escHtml(label)}</div>
      <div class="admin-stat-value">${escHtml(String(value))}</div>
    </div>
  `;
}

function _skeletonRows(n) {
  return Array.from({ length: n }, () => `
    <div class="admin-dash-row admin-dash-row--skeleton">
      <div class="admin-skel admin-skel-line admin-skel-line--lg"></div>
      <div class="admin-skel admin-skel-line admin-skel-line--md"></div>
      <div class="admin-skel admin-skel-line admin-skel-line--sm"></div>
    </div>
  `).join('');
}

function _chartCanvasWrap(canvasId) {
  return `
    <div class="admin-chart-canvas-wrap">
      <div class="admin-chart-skel admin-skel" data-skel-for="${escAttr(canvasId)}"></div>
      <canvas id="${escAttr(canvasId)}"></canvas>
    </div>
  `;
}

function _clearChartSkeleton(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const wrap = canvas.parentElement;
  if (!wrap) return;
  const skel = wrap.querySelector('.admin-chart-skel');
  if (skel) skel.remove();
}

function _restoreChartSkeleton(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const wrap = canvas.parentElement;
  if (!wrap || wrap.querySelector('.admin-chart-skel')) return;
  const msg = wrap.querySelector('.admin-chart-empty');
  if (msg) msg.remove();
  canvas.hidden = false;
  const skel = document.createElement('div');
  skel.className = 'admin-chart-skel admin-skel';
  skel.dataset.skelFor = canvasId;
  wrap.insertBefore(skel, canvas);
}

function _emptyHtml(msg) {
  return `<div class="admin-dash-empty">${escHtml(msg)}</div>`;
}

function _setChartEmpty(canvasId, msg) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  _clearChartSkeleton(canvasId);
  const wrap = canvas.parentElement;
  if (!wrap) return;
  canvas.hidden = true;
  let el = wrap.querySelector('.admin-chart-empty');

function _isLight() {
  return document.documentElement.getAttribute('data-theme') === 'light';
}

function _chartTextColor() {
  return _isLight() ? '#1a1c1e' : 'rgba(255,255,255,0.85)';
}

function _chartGridColor() {
  return _isLight() ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
}

function _ensureChartLib() {
  return typeof window.Chart === 'function' || typeof window.Chart === 'object';
}

function _destroyChart(key) {
  if (_charts[key]) {
    _charts[key].destroy();
    _charts[key] = null;
  }
}

function _renderActivityChart(activity) {
  const canvas = document.getElementById('adminActivityChart');
  if (!canvas || !_ensureChartLib()) return;
  _destroyChart('activity');
  if (!Array.isArray(activity) || !activity.some(d => d.reviews || d.papers || d.feedback)) {
    _setChartEmpty('adminActivityChart', 'No recent activity yet.');
    return;
  }
  _clearChartSkeleton('adminActivityChart');
  _clearChartEmpty('adminActivityChart');
  const labels = activity.map(d => d.date.slice(5)); // MM-DD
  _charts.activity = new window.Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Reviews',  data: activity.map(d => d.reviews),  borderColor: '#2ECC71', backgroundColor: 'rgba(46,204,113,0.18)', tension: 0.35, fill: true },
        { label: 'Papers',   data: activity.map(d => d.papers),   borderColor: '#52a0ff', backgroundColor: 'rgba(82,160,255,0.16)', tension: 0.35, fill: true },
        { label: 'Feedback', data: activity.map(d => d.feedback), borderColor: '#f5b942', backgroundColor: 'rgba(245,185,66,0.16)', tension: 0.35, fill: true },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'nearest', axis: 'xy', intersect: false },
      plugins: {
        legend: { labels: { color: _chartTextColor() } },
        tooltip: { mode: 'nearest', axis: 'xy', intersect: false },
      },
      scales: {
        x: { ticks: { color: _chartTextColor(), maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { color: _chartGridColor() } },
        y: { beginAtZero: true, ticks: { color: _chartTextColor(), precision: 0 }, grid: { color: _chartGridColor() } },
      },
    },
  });
}

function _renderBarChart(canvasId, key, labels, values, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !_ensureChartLib()) return;
  _destroyChart(key);
  if (!labels.length || !values.some(v => Number(v) > 0)) {
    _setChartEmpty(canvasId, 'No data yet.');
    return;
  }
  _clearChartSkeleton(canvasId);
  _clearChartEmpty(canvasId);
  _charts[key] = new window.Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: color, borderRadius: 6 }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { color: _chartTextColor(), precision: 0 }, grid: { color: _chartGridColor() } },
        y: { ticks: { color: _chartTextColor() }, grid: { display: false } },
      },
    },
  });
}

function _renderDoughnut(canvasId, key, labels, values, palette) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !_ensureChartLib()) return;
  _destroyChart(key);
  if (!labels.length || !values.some(v => Number(v) > 0)) {
    _setChartEmpty(canvasId, 'No data yet.');
    return;
  }
  _clearChartSkeleton(canvasId);
  _clearChartEmpty(canvasId);
  _charts[key] = new window.Chart(canvas, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: palette, borderColor: 'transparent', borderWidth: 0 }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { color: _chartTextColor(), padding: 12 } } },
    },
  });
}

async function _loadStatsAndCharts() {
  const grid = document.getElementById('adminStatsGrid');
  if (grid) {
    grid.innerHTML = _statsSkeletonHtml();
  }
  ['adminActivityChart','adminTopFacultyChart','adminTopCoursesChart',
   'adminPaperTypesChart','adminFeedbackTypesChart'].forEach(id => {
    const key = {
      adminActivityChart:'activity', adminTopFacultyChart:'topFaculty',
      adminTopCoursesChart:'topCourses', adminPaperTypesChart:'paperTypes',
      adminFeedbackTypesChart:'feedbackTypes',
    }[id];
    _destroyChart(key);
    _restoreChartSkeleton(id);
  });

  let stats;
  try {
    stats = await window._shohoj_fetchAdminStats?.();
  } catch (e) {
    console.warn('[Shohoj] admin stats failed:', e);
  }
  if (!stats) {
    if (grid) grid.innerHTML = _emptyHtml('Could not load dashboard stats.');
    _setAllChartsEmpty('Could not load chart data.');
    return;
  }
  stats = normalizeAdminStats(stats);

  if (grid) {
    grid.innerHTML = buildAdminStatsHtml(stats);
  }

  // Wait briefly for Chart.js if it's still loading.
  if (!_ensureChartLib()) {
    await new Promise(r => setTimeout(r, 600));
  }

  if (!_ensureChartLib()) {
    _setAllChartsEmpty('Charts could not load.');
    return;
  }

  _renderActivityChart(stats.activity);

  _renderBarChart(
    'adminTopFacultyChart', 'topFaculty',
    stats.topFaculty.map(f => f.initials),
    stats.topFaculty.map(f => f.count),
    '#2ECC71',
  );
  _renderBarChart(
    'adminTopCoursesChart', 'topCourses',
    stats.topCourses.map(c => c.code),
    stats.topCourses.map(c => c.count),
    '#52a0ff',
  );

  const ptKeys = Object.keys(stats.paperTypes);
  _renderDoughnut(
    'adminPaperTypesChart', 'paperTypes',
    ptKeys,
    ptKeys.map(k => stats.paperTypes[k]),
    ['#2ECC71', '#52a0ff', '#f5b942', '#ff7676', '#a78bfa'],
  );

  const ftKeys = Object.keys(stats.feedbackTypes);
  _renderDoughnut(
    'adminFeedbackTypesChart', 'feedbackTypes',
    ftKeys,
    ftKeys.map(k => stats.feedbackTypes[k]),
    ['#ff7676', '#52a0ff', '#a0a0a0'],
  );
}

async function _refreshAll() {
  const btn = document.getElementById('adminRefreshBtn');
  const label = btn ? btn.querySelector('[data-refresh-label]') : null;
  const prevLabel = label ? label.textContent : '';
  if (btn) {
    btn.disabled = true;
    btn.classList.add('admin-btn-ghost--loading');
  }
  if (label) label.textContent = 'Refreshing…';
  try {
    await Promise.all([
      _loadStatsAndCharts(),
      _loadPapers(),
      _loadPaperReports(),
      _loadReviewReports(),
      _loadStudyGroupReports(),
      _loadFeedback(),
      _loadLostFound(),
    ]);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.classList.remove('admin-btn-ghost--loading');
      if (label) label.textContent = prevLabel;
    }
  }
}

async function _onAction(e) {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  if (btn.disabled) return;
  btn.disabled = true;

  try {
    if (act === 'preview') {
      const paperId = btn.dataset.paperId;
      if (!paperId) return;
      btn.textContent = 'Loading…';
      const url = await getPaperDownloadUrl(paperId);
      btn.textContent = 'Preview';
      if (!url) {
        _adminToast('Could not load preview.');
        return;
      }
      openPreviewModal({ url, title: btn.dataset.title || 'Preview', mimeType: btn.dataset.mime });
      return;
    }
    if (act === 'approve') {
      const res = await window._shohoj_approvePaper?.(btn.dataset.id);
      if (!res?.ok) return _adminToast(res?.error || 'Approve failed');
      _adminToast('Approved.');
      _loadPapers();
      _loadStatsAndCharts();
      return;
    }
    if (act === 'delete-paper') {
      if (!confirmDestructive('Delete this paper and its R2 file?', btn.dataset.label || 'this paper')) return;
      const res = await window._shohoj_deletePaper?.(btn.dataset.id, btn.dataset.path);
      if (!res?.ok) return _adminToast(res?.error || 'Delete failed');
      _adminToast('Deleted.');
      _loadPapers();
      _loadStatsAndCharts();
      return;
    }
    if (act === 'delete-paper-by-report') {
      if (!confirmDestructive('Delete the reported paper, its R2 file, and this report?', btn.dataset.label)) return;
      const res = await window._shohoj_deletePaperByReport?.(btn.dataset.id, btn.dataset.paperId);
      if (!res?.ok) return _adminToast(res?.error || 'Delete failed');
      _adminToast(res.missingPaper ? 'Report dismissed; paper was already gone.' : 'Paper and report deleted.');
      _loadPapers();
      _loadPaperReports();
      _loadStatsAndCharts();
      return;
    }
    if (act === 'delete-review-by-report') {
      if (!confirmDestructive('Delete the reported review and this report?', btn.dataset.label)) return;
      const res = await window._shohoj_deleteReviewByReport?.(btn.dataset.id, btn.dataset.reviewId);
      if (!res?.ok) return _adminToast(res?.error || 'Delete failed');
      _adminToast(res.missingReview ? 'Report dismissed; review was already gone.' : 'Review and report deleted.');
      _loadReviewReports();
      _loadStatsAndCharts();
      return;
    }
    if (act === 'dismiss-paper-report') {
      const res = await window._shohoj_deletePaperReport?.(btn.dataset.id);
      if (!res?.ok) return _adminToast(res?.error || 'Dismiss failed');
      _loadPaperReports();
      _loadStatsAndCharts();
      return;
    }
    if (act === 'dismiss-review-report') {
      const res = await window._shohoj_deleteReviewReport?.(btn.dataset.id);
      if (!res?.ok) return _adminToast(res?.error || 'Dismiss failed');
      _loadReviewReports();
      _loadStatsAndCharts();
      return;
    }
    if (act === 'delete-group-by-report') {
      if (!confirmDestructive('Delete the reported study group and this report?', btn.dataset.label)) return;
      const res = await window._shohoj_deleteStudyGroupByReport?.(btn.dataset.id, btn.dataset.groupId);
      if (!res?.ok) return _adminToast(res?.error || 'Delete failed');
      _adminToast(res.missingGroup ? 'Report dismissed; group was already gone.' : 'Group and report deleted.');
      _loadStudyGroupReports();
      return;
    }
    if (act === 'dismiss-group-report') {
      const res = await window._shohoj_deleteStudyGroupReport?.(btn.dataset.id);
      if (!res?.ok) return _adminToast(res?.error || 'Dismiss failed');
      _loadStudyGroupReports();
      return;
    }
    if (act === 'delete-feedback') {
      if (!confirmDestructive('Delete this feedback entry?', btn.dataset.label || 'this feedback')) return;
      const res = await window._shohoj_adminDeleteFeedback?.(btn.dataset.id);
      if (!res?.ok) return _adminToast(res?.error || 'Delete failed');
      _adminToast('Deleted.');
      _loadFeedback();
      _loadStatsAndCharts();
      return;
    }
    if (act === 'delete-lostfound') {
      if (!confirmDestructive('Delete this lost & found post (and its contact record)?', btn.dataset.label || 'this post')) return;
      const res = await window._shohoj_adminDeleteLostFound?.(btn.dataset.id);
      if (!res?.ok) return _adminToast(res?.error || 'Delete failed');
      _adminToast('Deleted.');
      _loadLostFound();
      return;
    }
  } finally {
    btn.disabled = false;
  }
}

function openAdminDashboard(opts = {}) {
  if (_open) return;
  if (!_adminCheck()) {
    _adminToast('Admin only.');
    return;
  }
  _open = true;
  _dedicated = !!opts.dedicated;

  let mount;
  if (opts.host) {
    mount = document.getElementById(opts.host);
    if (!mount) return;
    mount.innerHTML = _shellHtml({ dedicated: _dedicated });
  } else {
    mount = document.createElement('div');
    mount.id = 'adminPageRoot';
    mount.innerHTML = _shellHtml({ dedicated: false });
    document.body.appendChild(mount);
    document.body.classList.add('admin-mode');
  }
  window.scrollTo(0, 0);

  const closeBtn   = document.getElementById('adminCloseBtn');
  const refreshBtn = document.getElementById('adminRefreshBtn');
  if (closeBtn)   closeBtn.addEventListener('click', closeAdminDashboard);
  if (refreshBtn) refreshBtn.addEventListener('click', _refreshAll);
  document.getElementById('adminPage').addEventListener('click', _onAction);

  _refreshAll();
}

function closeAdminDashboard() {
  _open = false;
  Object.keys(_charts).forEach(_destroyChart);
  if (_dedicated) {
    // On the dedicated /admin/ page, "close" returns to the main site.
    window.location.href = '../';
    return;
  }
  const root = document.getElementById('adminPageRoot');
  if (root) root.remove();
  document.body.classList.remove('admin-mode');
}

window._shohoj_openAdminDashboard = openAdminDashboard;
window._shohoj_closeAdminDashboard = closeAdminDashboard;

window.addEventListener('shohoj:auth-changed', () => {
  // If the admin signs out while open on the dedicated page, send them home.
  if (_open && _dedicated && !_adminCheck()) {
    closeAdminDashboard();
  }
});

// ── js/animations/cursor.js ─────────────────────────────────────
function initCursor() {
  const dot        = document.getElementById('cursor-dot');
  const ring       = document.getElementById('cursor-ring');
  const cursorGlow = document.getElementById('cursor-glow');
  const body       = document.body;

  let mX = window.innerWidth / 2,  mY = window.innerHeight / 2;
  let dX = mX, dY = mY;
  let rX = mX, rY = mY;
  let gX = mX, gY = mY;

  // Derive the cursor shape from the element currently under the pointer on
  // every mouse event, instead of paired add/remove listeners. Paired
  // listeners get stuck when the hovered element vanishes without a mouseout
  // (innerHTML repaints, a modal opening on top) — the stale cursor-text
  // I-beam then follows the pointer everywhere.
  const HOVER_TARGETS = 'a, button, .feature-card, .nav-logo';
  const TEXT_TARGETS  = 'input, textarea, select, .pf-select';
  function syncCursorState(target) {
    const el = target instanceof Element ? target : null;
    body.classList.toggle('cursor-hover', !!(el && el.closest(HOVER_TARGETS)));
    body.classList.toggle('cursor-text',  !!(el && el.closest(TEXT_TARGETS)));
  }

  document.addEventListener('mousemove', e => {
    mX = e.clientX; mY = e.clientY;
    syncCursorState(e.target);
  }, { passive: true });
  document.addEventListener('mouseover', e => syncCursorState(e.target));
  document.addEventListener('mousedown', () => body.classList.add('cursor-click'));
  document.addEventListener('mouseup',   () => body.classList.remove('cursor-click'));
  document.addEventListener('mouseleave', () => {
    dot.style.opacity = '0'; ring.style.opacity = '0'; cursorGlow.style.opacity = '0';
  });
  document.addEventListener('mouseenter', () => {
    dot.style.opacity = ''; ring.style.opacity = ''; cursorGlow.style.opacity = '';
  });

  function animateCursor() {
    dX += (mX - dX) * 0.85; dY += (mY - dY) * 0.85;
    rX += (mX - rX) * 0.14; rY += (mY - rY) * 0.14;
    gX += (mX - gX) * 0.07; gY += (mY - gY) * 0.07;
    dot.style.transform        = `translate(${dX}px, ${dY}px) translate(-50%, -50%)`;
    ring.style.transform       = `translate(${rX}px, ${rY}px) translate(-50%, -50%)`;
    cursorGlow.style.transform = `translate(${gX}px, ${gY}px) translate(-50%, -50%)`;
    requestAnimationFrame(animateCursor);
  }
  animateCursor();

  document.querySelectorAll('.magnetic').forEach(el => {
    el.addEventListener('mousemove', e => {
      if (document.body.classList.contains('modal-open')) return;
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width  / 2;
      const cy = rect.top  + rect.height / 2;
      el.style.transform = `translate(${(e.clientX - cx) * 0.35}px, ${(e.clientY - cy) * 0.35}px)`;
    });
    el.addEventListener('mouseleave', () => {
      if (document.body.classList.contains('modal-open')) return;
      el.style.transform = 'translate(0,0)';
    });
  });
}

// ── js/admin-entry.js ───────────────────────────────────────────
// ── js/admin-entry.js ─────────────────────────────────────────────────────────
// Entry point for the dedicated /admin/ page. Waits for Firebase auth to
// resolve, then either opens the dashboard (if admin) or shows a sign-in
// prompt / not-authorized message.
//
// This file is bundled into the same JS as the rest of the site, so it
// gates on `document.body.dataset.page === 'admin'` to avoid running on
// the main page. Helpers are prefixed `_aentry_` to avoid name collisions
// with similarly-named helpers in other UI modules (papersTab, feedback).

function _aentry_onAdminPage() {
  return document.body && document.body.dataset && document.body.dataset.page === 'admin';
}

function _aentry_isAdmin() {
  return typeof window._shohoj_isAdmin === 'function' && window._shohoj_isAdmin();
}

function _aentry_isAuthReady() {
  return typeof window._shohoj_isAuthReady === 'function' && window._shohoj_isAuthReady();
}

function _aentry_isSignedIn() {
  return typeof window._shohoj_currentUid === 'function' && !!window._shohoj_currentUid();
}

function _aentry_renderSignInPrompt() {
  const host = document.getElementById('adminPageHost');
  if (!host) return;
  host.innerHTML = `
    <div class="admin-gate">
      <div class="admin-gate-card">
        <div class="admin-gate-icon">🛡️</div>
        <h1>Admin Dashboard</h1>
        <p>Sign in with the admin Google account to continue.</p>
        <button class="btn-primary" id="adminGateSignIn">Continue with Google</button>
        <p class="admin-gate-note">
          This page is restricted to authorized moderators only.
          <a href="../">← Back to Shohoj</a>
        </p>
      </div>
    </div>
  `;
  document.getElementById('adminGateSignIn').addEventListener('click', () => {
    if (typeof window._shohoj_signIn === 'function') window._shohoj_signIn();
  });
}

function _aentry_renderForbidden() {
  const host = document.getElementById('adminPageHost');
  if (!host) return;
  host.innerHTML = `
    <div class="admin-gate">
      <div class="admin-gate-card">
        <div class="admin-gate-icon">🚫</div>
        <h1>Not authorized</h1>
        <p>You're signed in, but this account doesn't have admin access.</p>
        <a href="../" class="btn-primary admin-gate-back">← Back to Shohoj</a>
      </div>
    </div>
  `;
}

function _aentry_route() {
  if (!_aentry_onAdminPage()) return;
  if (!_aentry_isAuthReady()) return;
  if (!_aentry_isSignedIn()) {
    _aentry_renderSignInPrompt();
    return;
  }
  if (!_aentry_isAdmin()) {
    _aentry_renderForbidden();
    return;
  }
  openAdminDashboard({ host: 'adminPageHost', dedicated: true });
}

document.addEventListener('DOMContentLoaded', () => {
  initCursor();
  _aentry_route();
});
window.addEventListener('shohoj:auth-changed', _aentry_route);

</script>
