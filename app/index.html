<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shohoj</title>
    <style>
      /* Minimal structural styling for the Phase 3 skeleton. The full visual
         system is integrated when feature routes migrate (no CSS rewrite). */
      body { margin: 0; font-family: system-ui, sans-serif; }
      .shell-skip-link {
        position: absolute; left: -999px; top: 0;
        background: #fff; padding: 8px 12px; z-index: 10;
      }
      .shell-skip-link:focus { left: 8px; }
      .shell-header { border-bottom: 1px solid rgba(0,0,0,0.12); }
      .shell-nav { display: flex; gap: 4px; padding: 12px 16px; }
      .shell-nav-link { padding: 6px 12px; text-decoration: none; border-radius: 6px; color: #2d5a3d; }
      .shell-nav-link--active { background: rgba(46,204,113,0.12); font-weight: 600; }
      .shell-main:focus { outline: none; }
      .shell-page { padding: 24px 16px; max-width: 720px; }
      .shell-muted { color: #5a8a6a; }
      .shell-route-error { padding: 24px 16px; }
      .shell-btn {
        font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
        border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #0d2914;
      }
      .shell-btn--primary { background: #27ae60; border-color: #27ae60; color: #fff; }
      .shell-btn--danger { background: #e74c3c; border-color: #e74c3c; color: #fff; }
      .shell-btn:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }
      .shell-modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.4);
        display: flex; align-items: center; justify-content: center; padding: 16px;
      }
      .shell-modal {
        background: #fff; border-radius: 12px; padding: 20px; max-width: 420px;
        width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      }
      .shell-modal-title { margin: 0 0 8px; font-size: 18px; }
      .shell-modal-message { margin: 0 0 16px; color: #2d5a3d; }
      .shell-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
      .shell-toast-viewport {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 8px; z-index: 20;
        max-width: min(420px, calc(100vw - 32px));
      }
      .shell-toast {
        display: flex; align-items: center; gap: 12px; padding: 10px 14px;
        border-radius: 10px; border: 1px solid; background: #fff; font-size: 14px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      }
      .shell-toast--success { border-color: #27ae60; color: #0d2914; }
      .shell-toast--info { border-color: #2d5a8a; color: #0d1a29; }
      .shell-toast--warning { border-color: #b07d1a; color: #291f0d; }
      .shell-toast--error { border-color: #c0392b; color: #290d0d; }
      .shell-toast-dismiss {
        font: inherit; margin-left: auto; border: none; background: none;
        cursor: pointer; padding: 0 4px; color: inherit;
      }
      .shell-toast-dismiss:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./shell.tsx"></script>
  </body>
</html>
