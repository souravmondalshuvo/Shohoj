  <!-- Clickjacking defense. GitHub Pages can't send X-Frame-Options or a real
       frame-ancestors header (that CSP directive is ignored in a <meta> tag),
       so guard against framing in JS: keep the page hidden until we confirm
       we're the top window, then try to break out of any frame. A sandboxed
       frame that blocks top-navigation simply leaves the page hidden — there is
       nothing to click-jack. build3.py hashes this inline script into the CSP. -->
  <style id="antiClickjack">body{display:none !important;}</style>
  <script>
    if (self === top) {
      var n = document.getElementById('antiClickjack');
      n.parentNode.removeChild(n);
    } else {
      try { top.location = self.location; } catch (e) {}
    }
  </script>

/* ── TOKENS ─────────────────────────────────────────── */

  --green-dim: #1a7a44;
  --green-glow: rgba(46, 204, 113, 0.15);
  --gold: #f0a500;

  --radius: 16px;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme='dark'] {
  --bg: #060d09;
  --glass: rgba(255, 255, 255, 0.04);
  --glass2: rgba(255, 255, 255, 0.07);
  --glass3: rgba(46, 204, 113, 0.06);
  --glass-hover: rgba(255, 255, 255, 0.09);
  --border: rgba(46, 204, 113, 0.18);
  --border2: rgba(255, 255, 255, 0.08);
  --text: #e8f0ea;
  --text1: #e8f0ea;
  --text2: #8aab90;
  --text3: #4d6b52;
  --input-bg: rgba(0, 0, 0, 0.25);
  --chip-border: rgba(255, 255, 255, 0.1);
  --chip-hover: rgba(255, 255, 255, 0.05);
  --card-bg: rgba(255, 255, 255, 0.02);
  --card-bg-2: rgba(255, 255, 255, 0.03);
  --card-hover: rgba(255, 255, 255, 0.06);
  --card-border: rgba(255, 255, 255, 0.08);
  --hairline: rgba(255, 255, 255, 0.05);
  --badge-bg: rgba(255, 255, 255, 0.06);
  --skel-lo: rgba(255, 255, 255, 0.04);
  --skel-hi: rgba(255, 255, 255, 0.09);

  --ink-blue: #5b9dff;
  --ink-amber: #f1c40f;
  --shadow: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(46, 204, 113, 0.08);
  --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
[data-theme='light'] {
  --bg: #f2f8f4;
  --glass: rgba(255, 255, 255, 0.7);
  --glass2: rgba(255, 255, 255, 0.85);
  --glass3: rgba(46, 204, 113, 0.08);
  --glass-hover: rgba(255, 255, 255, 0.95);
  --border: rgba(26, 122, 68, 0.22);
  --border2: rgba(13, 41, 20, 0.12);
  --text: #10241a;
  --text1: #10241a;
  --text2: #3f6b4d;
  --text3: #7da28a;
  --input-bg: rgba(255, 255, 255, 0.85);
  --chip-border: rgba(13, 41, 20, 0.14);
  --chip-hover: rgba(13, 41, 20, 0.045);
  --card-bg: rgba(255, 255, 255, 0.72);
  --card-bg-2: rgba(255, 255, 255, 0.85);
  --card-hover: #ffffff;
  --card-border: rgba(13, 41, 20, 0.1);
  --hairline: rgba(13, 41, 20, 0.08);
  --badge-bg: rgba(13, 41, 20, 0.06);
  --skel-lo: rgba(0, 0, 0, 0.04);
  --skel-hi: rgba(0, 0, 0, 0.09);
  --ink-green: #187a43;
  --ink-blue: #2b5c8f;
  --ink-amber: #9a6c12;
  --shadow: 0 8px 32px rgba(13, 41, 20, 0.08), 0 0 0 1px rgba(13, 41, 20, 0.03);

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
  overflow-x: hidden;
  max-width: 100vw;
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition:
    background var(--transition),
    color var(--transition);
  overflow-x: hidden;
  max-width: 100vw;
  position: relative;
}

.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  animation: drift 18s ease-in-out infinite alternate;
}
.orb-1 {
  width: min(520px, 90vw);
  height: min(520px, 90vw);
  background: radial-gradient(circle, rgba(46, 204, 113, 0.22) 0%, transparent 70%);
  top: -120px;
  left: -100px;
  animation-duration: 20s;
}
.orb-2 {
  width: min(400px, 80vw);
  height: min(400px, 80vw);
  background: radial-gradient(circle, rgba(16, 120, 60, 0.18) 0%, transparent 70%);
  bottom: 10%;
  right: -80px;
  animation-duration: 25s;
  animation-delay: -8s;
}
.orb-3 {
  width: min(300px, 70vw);
  height: min(300px, 70vw);
  background: radial-gradient(circle, rgba(46, 204, 113, 0.1) 0%, transparent 70%);
  top: 45%;
  left: 40%;
  animation-duration: 30s;
  animation-delay: -14s;
}
[data-theme='light'] .orb-1 {
  background: radial-gradient(circle, rgba(46, 204, 113, 0.16) 0%, transparent 70%);
}
[data-theme='light'] .orb-2 {
  background: radial-gradient(circle, rgba(100, 200, 140, 0.13) 0%, transparent 70%);
}
[data-theme='light'] .orb-3 {
  background: radial-gradient(circle, rgba(46, 204, 113, 0.1) 0%, transparent 70%);
}
@keyframes drift {
  0% {
    transform: translate(0, 0) scale(1);
  }
  33% {
    transform: translate(40px, -30px) scale(1.05);
  }
  66% {
    transform: translate(-20px, 50px) scale(0.97);
  }
  100% {
    transform: translate(30px, 20px) scale(1.03);
  }
}

/* Maintenance notice — fixed bottom toast, sits above the nav (z-index 100). */
.maintenance-banner {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: min(560px, calc(100vw - 32px));
  padding: 12px 14px 12px 16px;
  /* Opaque surface (not translucent --glass): the banner floats over the
         animated green orbs, and a see-through background let those orbs bleed
         through, dropping text contrast below WCAG AA and flagging axe
         non-deterministically (the show-through colour shifts as the orbs move).
         An opaque --bg pairs with --text at a fixed, AA-passing ratio in both
         themes, so backdrop-filter — which would only blur hidden content — is
         dropped. */
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  line-height: 1.45;
}
.maintenance-banner[hidden] {
  display: none;
}
.maintenance-banner__icon {
  font-size: 18px;
  flex-shrink: 0;
}
.maintenance-banner__text {
  flex: 1;
}
/* Emphasis via weight only — inherit the theme-aware --text color. The accent
       green (#2ECC71) has near-zero contrast against the banner's green-tinted
       backdrop (axe flagged 1.02:1, below WCAG AA 4.5:1), whereas --text already
       passes for the surrounding banner body text. */
.maintenance-banner__text strong {
  color: var(--text);
  font-weight: 700;
}
.maintenance-banner__close {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  transition: background 0.2s;
}
.maintenance-banner__close:hover {
  background: var(--glass-hover);
}

/* CSP-safe hover/focus styling. The hardened production CSP drops
       'unsafe-inline' from script-src, which blocks inline on* handlers
       (onmouseenter/onmouseleave/onfocus/onblur), so these effects — previously
       done with inline handlers — are expressed as :hover/:focus rules instead.
       Base styles stay inline; leaving/blurring reverts to them automatically.
       !important is required because these elements set their base background/
       border inline, and inline styles otherwise outrank a class pseudo rule. */
.gauth-reauth-btn:hover {
  background: rgba(255, 255, 255, 0.13) !important;
  border-color: rgba(255, 255, 255, 0.25) !important;
}
.planner-search-input:focus {
  border-color: rgba(46, 204, 113, 0.55) !important;
}
.import-confirm-btn:hover {
  background: #17a348 !important;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(46, 204, 113, 0.35);
}
.import-cancel-btn:hover {
  background: var(--import-cancel-hover) !important;
}
.summary-confirm-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(46, 204, 113, 0.35);
}

nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  height: 64px;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border: none;
  transition:
    background var(--transition),
    backdrop-filter var(--transition);
  -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
  mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
}
nav.scrolled {
  background: rgba(6, 13, 9, 0.55);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  -webkit-mask-image: none;
  mask-image: none;
}
[data-theme='light'] nav.scrolled {
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px) saturate(200%);
  -webkit-backdrop-filter: blur(24px) saturate(200%);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.nav-logo-mark {
  width: 34px;
  height: 34px;
  background: var(--green);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 14px;
  color: #0b0f0d;
  letter-spacing: -0.5px;
}
.nav-logo-text {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--text);
}
.nav-logo-text span {
  color: var(--green);
}
.nav-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}
.nav-link {
  font-size: 14px;
  font-weight: 500;
  color: var(--text2);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-link:hover {
  color: var(--green);
}
/* Shell-beta pill (#453) — its own class, not .nav-link, so the mobile
       rule that hides plain nav links leaves it visible. */
.nav-beta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 13px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  background: rgba(46, 204, 113, 0.12);
  color: var(--ink-green);
  border: 1px solid rgba(46, 204, 113, 0.38);
  transition: background 0.2s;
  flex-shrink: 0;
}
.nav-beta:hover {
  background: rgba(46, 204, 113, 0.22);
}

.theme-toggle {
  width: 56px;
  height: 28px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 100px;
  cursor: pointer;
  position: relative;
  transition: background var(--transition);
  flex-shrink: 0;
}
.toggle-pill {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 2px 6px rgba(46, 204, 113, 0.4);
  transition: transform var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  line-height: 1;
  pointer-events: none;
  user-select: none;
}
[data-theme='dark'] .toggle-pill {
  transform: translateX(28px);
}
[data-theme='light'] .toggle-pill {
  transform: translateX(0px);
}

.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8rem 2rem 4rem;
  position: relative;
}
.hero-glow {
  position: absolute;
  width: min(600px, 100vw);
  height: min(600px, 100vw);
  background: radial-gradient(circle, rgba(46, 204, 113, 0.08) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -60%);
  pointer-events: none;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(46, 204, 113, 0.1);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  color: var(--green);
  margin-bottom: 2rem;
  animation: fadeUp 0.6s ease both;
}
.hero-badge-dot {
  width: 6px;
  height: 6px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.5;
    transform: scale(0.8);
  }
}
.hero h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(3rem, 8vw, 6.5rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -2px;
  margin-bottom: 0.4rem;
  animation: fadeUp 0.6s 0.1s ease both;
}
.hero h1 .bengali {
  display: block;
  color: var(--green);
  font-size: clamp(2rem, 5vw, 4rem);
  letter-spacing: 0;
  font-weight: 700;
}
.hero-sub {
  font-size: clamp(1rem, 2vw, 1.2rem);
  color: var(--text2);
  font-weight: 300;
  max-width: 480px;
  margin: 1.2rem auto 2.4rem;
  line-height: 1.6;
  animation: fadeUp 0.6s 0.2s ease both;
}
.hero-cta {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  animation: fadeUp 0.6s 0.3s ease both;
}
.btn-primary {
  background: var(--green);
  color: #0b0f0d;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 15px;
  padding: 13px 28px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  transition:
    transform 0.2s,
    box-shadow 0.2s;
  box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(46, 204, 113, 0.35);
}
.btn-secondary {
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  font-size: 15px;
  padding: 13px 28px;
  border-radius: 999px;
  border: 1px solid var(--border);
  cursor: pointer;
  text-decoration: none;
  transition:
    border-color 0.2s,
    color 0.2s,
    transform 0.2s,
    background 0.2s;
}
.btn-secondary:hover {
  border-color: var(--green);
  color: var(--green);
  background: var(--glass2);
  transform: translateY(-2px);
}
/* Compact modifier for in-tab toolbars (Routine / Seats / Free Rooms). The
       base buttons are hero-CTA scale; toolbars opt down via .btn-sm. The
       width/max-width reset keeps the ≤480px hero rule (width:100%) from
       stretching toolbar buttons full-width — .btn-sm wins on specificity. */
.btn-primary.btn-sm,
.btn-secondary.btn-sm {
  font-size: 12.5px;
  padding: 7px 16px;
  border-radius: 999px;
  width: auto;
  max-width: none;
}
.btn-primary.btn-sm:hover {
  box-shadow: 0 4px 16px rgba(46, 204, 113, 0.3);
}
.hero-stats {
  display: flex;
  gap: 3rem;
  justify-content: center;
  margin-top: 4rem;
  animation: fadeUp 0.6s 0.4s ease both;
}
.stat {
  text-align: center;
}
.stat-num {
  font-family: 'Syne', sans-serif;
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--green);
}
.stat-label {
  font-size: 12px;
  color: var(--text2);
  margin-top: 2px;
}
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

section {
  max-width: 900px;
  margin: 0 auto;
  padding: 5rem 2rem;
  position: relative;
  z-index: 1;
  width: 100%;
}
.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 0.8rem;
}
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 1rem;
}
.section-desc {
  color: var(--text2);
  font-size: 1rem;
  line-height: 1.7;
  max-width: 560px;
  margin-bottom: 2.5rem;
}

.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.feature-card {
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  padding: 1.8rem;
  transition: background var(--transition);
  cursor: default;
}
.feature-card:hover {
  background: var(--glass-hover);
}
.feature-icon {
  font-size: 1.6rem;
  margin-bottom: 0.8rem;
}
.feature-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 0.4rem;
}
.feature-desc {
  font-size: 0.875rem;
  color: var(--text2);
  line-height: 1.6;
}
.feature-phase {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--green);
  background: var(--green-glow);
  border-radius: 4px;
  padding: 2px 6px;
  margin-bottom: 0.6rem;
}
.feature-phase.soon {
  color: var(--text3);
  background: transparent;
}

.calc-wrapper {
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow-card);

/* ── SCROLL REVEAL SYSTEM ──────────────────────────────────
   Philosophy: weight, presence, grace.
   GPU-only: opacity + transform ONLY — zero blur, zero jank.
   Easing: cubic-bezier(0.16,1,0.3,1) — Expo Out
   Fast arrival, long deceleration tail = premium landing.     */

/* ── BASE HIDDEN STATE ───────────────────────────────────── */
.reveal {
  opacity: 0;
  will-change: transform, opacity;
  transition:
    opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
.reveal.from-bottom {
  transform: translateY(36px);
}
.reveal.from-left {
  transform: translateX(-40px);
}
.reveal.from-right {
  transform: translateX(40px);
}
.reveal.from-scale {
  transform: scale(0.95) translateY(22px);
}
.reveal.from-top {
  transform: translateY(-24px);
}

.reveal.visible {
  opacity: 1;
  transform: translate(0, 0) scale(1);
  will-change: auto;
}

/* ── SECTION LABELS — letterspace focus ─────────────────── */
.section-label[data-reveal-label] {
  opacity: 0;
  letter-spacing: 6px;
  transform: translateY(12px);
  will-change: transform, opacity;
  transition:
    opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
    letter-spacing 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
.section-label[data-reveal-label].visible {
  opacity: 1;
  letter-spacing: 1.5px;
  transform: translateY(0);
  will-change: auto;
}

/* ── SECTION TITLES ──────────────────────────────────────── */
.section-title[data-reveal-title] {
  opacity: 0;
  transform: translateY(28px);
  will-change: transform, opacity;
  transition:
    opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.09s,
    transform 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.09s;
}
.section-title[data-reveal-title].visible {
  opacity: 1;
  transform: translateY(0);
  will-change: auto;
}

/* ── SECTION DESC ────────────────────────────────────────── */
.section-desc[data-reveal-desc] {
  opacity: 0;
  transform: translateY(20px);
  will-change: transform, opacity;
  transition:
    opacity 0.68s cubic-bezier(0.16, 1, 0.3, 1) 0.18s,
    transform 0.68s cubic-bezier(0.16, 1, 0.3, 1) 0.18s;
}
.section-desc[data-reveal-desc].visible {
  opacity: 1;
  transform: translateY(0);
  will-change: auto;
}

/* ── STAGGER GRID — each card observed individually ─────── */
.feature-card[data-reveal-card] {
  opacity: 0;
  transform: translateY(38px) scale(0.95);
  will-change: transform, opacity;
  transition:
    opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
.feature-card[data-reveal-card].visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  will-change: auto;
}

/* Keep .stagger as fallback for non-card staggered lists */
.stagger > * {
  opacity: 0;
  transform: translateY(30px) scale(0.96);
  will-change: transform, opacity;
  transition:
    opacity 0.68s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.68s cubic-bezier(0.16, 1, 0.3, 1);
}
.stagger.visible > *:nth-child(1) {
  transition-delay: 0.04s;
}
.stagger.visible > *:nth-child(2) {
  transition-delay: 0.15s;
}
.stagger.visible > *:nth-child(3) {
  transition-delay: 0.26s;
}
.stagger.visible > *:nth-child(4) {
  transition-delay: 0.37s;
}
.stagger.visible > *:nth-child(5) {
  transition-delay: 0.48s;
}
.stagger.visible > *:nth-child(6) {
  transition-delay: 0.59s;
}
.stagger.visible > *:nth-child(7) {
  transition-delay: 0.7s;
}
.stagger.visible > *:nth-child(8) {
  transition-delay: 0.81s;
}
.stagger.visible > * {
  opacity: 1;
  transform: translateY(0) scale(1);
  will-change: auto;
}

/* ── HERO ELEMENTS ───────────────────────────────────────── */
.hero-badge[data-reveal-hero] {
  opacity: 0;
  transform: translateY(16px);
  will-change: transform, opacity;
  transition:
    opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
}
.hero-badge[data-reveal-hero].visible {
  opacity: 1;
  transform: translateY(0);
  will-change: auto;
}

h1[data-reveal-hero] {
  opacity: 0;
  transform: translateY(32px);
  will-change: transform, opacity;
  transition:
    opacity 0.78s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.78s cubic-bezier(0.16, 1, 0.3, 1);
}
h1[data-reveal-hero].visible {
  opacity: 1;
  transform: translateY(0);
  will-change: auto;
}

.hero-sub[data-reveal-hero] {
  opacity: 0;
  transform: translateY(22px);
  will-change: transform, opacity;
  transition:
    opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
.hero-sub[data-reveal-hero].visible {
  opacity: 1;
  transform: translateY(0);
  will-change: auto;
}

.hero-cta[data-reveal-hero] {
  opacity: 0;
  transform: translateY(18px);
  will-change: transform, opacity;
  transition:
    opacity 0.62s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.62s cubic-bezier(0.16, 1, 0.3, 1);
}
.hero-cta[data-reveal-hero].visible {
  opacity: 1;
  transform: translateY(0);
  will-change: auto;
}

/* ── HERO STATS ──────────────────────────────────────────── */
.stat[data-reveal-stat] {
  opacity: 0;
  transform: translateY(24px);
  will-change: transform, opacity;
  transition:
    opacity 0.62s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.62s cubic-bezier(0.16, 1, 0.3, 1);
}
.stat[data-reveal-stat].visible {
  opacity: 1;
  transform: translateY(0);
  will-change: auto;
}

/* ── CALC WRAPPER — hero feature, heaviest entrance ─────── */
.calc-wrapper[data-reveal-calc] {
  opacity: 0;
  transform: translateY(52px) scale(0.982);
  will-change: transform, opacity;
  transition:
    opacity 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.05s,
    transform 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.05s;
}
.calc-wrapper[data-reveal-calc].visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  will-change: auto;
}

  from {

  to {

}
.calc-header.lg-panel::before,
.calc-footer.lg-panel::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
  pointer-events: none;
  z-index: 0;
}
[data-theme='light'] .calc-header.lg-panel::before,
[data-theme='light'] .calc-footer.lg-panel::before {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.5) 100%);
}
.calc-header.lg-panel > *,
.calc-footer.lg-panel > * {
  position: relative;
  z-index: 1;
}
.semester-block.lg-surface::before {
  border-radius: var(--radius);
}
.semester-block.lg-surface::after {
  border-radius: var(--radius);
}

.credits-static {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 100%;
  height: 38px;
  min-width: 0;
  padding: 0 8px;
  text-align: center;
  user-select: none;
}
[data-theme='light'] .credits-static {
  background: rgba(13, 41, 20, 0.07);
  border-color: rgba(46, 204, 113, 0.25);
  color: #0d2914;
}
.grade-letter {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-align: center;
  min-width: 32px;
}

#dot-matrix {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: 1;
}

.course-input-wrap {
  position: relative;
  width: 100%;
}
.course-input-wrap input {
  width: 100%;
}
.course-suggestions {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: #0d1f12;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  z-index: 500;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  max-height: 220px;
  overflow-y: auto;
}
[data-theme='light'] .course-suggestions {
  background: rgba(255, 255, 255, 0.95);
}
.course-suggestions:empty {
  display: none;
}
.suggestion-item {
  padding: 9px 14px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
}
.suggestion-item:last-child {
  border-bottom: none;
}
.suggestion-item:hover,
.suggestion-item.active {
  background: rgba(46, 204, 113, 0.12);
  color: var(--green);
}
.suggestion-code {
  font-size: 11px;
  font-weight: 700;
  color: var(--green);
  background: rgba(46, 204, 113, 0.1);
  border-radius: 4px;
  padding: 1px 6px;
  flex-shrink: 0;
}
.suggestion-name {
  flex: 1;
}
.suggestion-credits {
  font-size: 11px;
  color: var(--text3);
  flex-shrink: 0;
}

#suggestions-portal {
  position: fixed;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  z-index: 9990;
  overflow: visible;
  pointer-events: none;
}
#suggestions-portal .course-suggestions {
  position: fixed;
  pointer-events: all;
  min-width: 280px;
}
/* ── RETAKE HANDLING ─────────────────────────────────── */
.course-row.retaken {
  opacity: 0.45;
  position: relative;
}
.course-row.retaken input,
.course-row.retaken .credits-static,
.course-row.retaken .grade-letter {
  text-decoration: line-through;
  text-decoration-color: rgba(231, 76, 60, 0.6);
}
.retaken-badge {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #e74c3c;
  background: rgba(231, 76, 60, 0.12);
  border: 1px solid rgba(231, 76, 60, 0.3);
  border-radius: 4px;
  padding: 2px 6px;
  pointer-events: none;
  white-space: nowrap;
}
/* ── PASS / FAIL DROPDOWN ───────────────────────────── */
.pf-select {
  background: var(--input-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 7px 4px;
  width: 100%;
  min-width: 0;
  outline: none;
  cursor: pointer;
  transition:
    border-color 0.2s,
    background 0.2s;
  text-align: center;
  text-align-last: center;
}
.pf-select:focus {
  border-color: rgba(46, 204, 113, 0.55);
  background: rgba(46, 204, 113, 0.05);
}
.pf-select option {
  background: #0d1a10;
}
[data-theme='light'] .pf-select option {
  background: #fff;
}

/* ── DEGREE PROGRESS TRACKER ───────────────────────── */
.degree-tracker {
  margin: 0 2rem 1.5rem;
  background: var(--glass2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem 1.5rem;
  position: relative;
}
.tracker-header {
  margin-bottom: 1rem;
}
.tracker-header h4 {
  font-family: 'Syne', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  margin: 0;
}
.tracker-subtitle {
  font-size: 11px;
  color: var(--text3);
  margin-top: 4px;
}

/* Stats strip */
.tracker-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.tracker-stat {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  text-align: center;
}
[data-theme='light'] .tracker-stat {
  background: rgba(0, 0, 0, 0.02);
}
.tracker-stat-val {
  font-family: 'Syne', sans-serif;
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.2;
}
.tracker-stat-dim {
  font-size: 12px;
  font-weight: 600;
  color: var(--text3);
}
.tracker-stat-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text3);
  font-weight: 600;
  margin-top: 4px;
}
/* How soft the graduation date is — range or assumption (#503) */
.tracker-stat-note {
  font-size: 9px;
  line-height: 1.35;
  color: var(--text3);
  opacity: 0.85;
  margin-top: 3px;
}

/* Progress bar */
.tracker-bar-wrap {
  margin-bottom: 16px;
}
.tracker-bar-bg {
  height: 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 100px;
  overflow: hidden;
}
[data-theme='light'] .tracker-bar-bg {
  background: rgba(0, 0, 0, 0.07);
}
.tracker-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #1a7a44, #2ecc71, #a8ffcb);
  border-radius: 100px;
  width: 0%;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
}
.tracker-bar-labels {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text3);
  margin-top: 5px;
}
.tracker-bar-labels span:first-child {
  color: var(--green);
  font-weight: 600;
}

/* Timeline */
.tracker-timeline-wrap {
  overflow-x: auto;
  overflow-y: visible;
  padding-bottom: 8px;
  margin: 0 -4px;
  -webkit-overflow-scrolling: touch;
}
.tracker-timeline-wrap::-webkit-scrollbar {
  height: 4px;
}
.tracker-timeline-wrap::-webkit-scrollbar-track {
  background: transparent;
}
.tracker-timeline-wrap::-webkit-scrollbar-thumb {
  background: rgba(46, 204, 113, 0.2);
  border-radius: 100px;
}
.tracker-timeline {
  display: flex;
  align-items: flex-start;
  gap: 0;
  position: relative;
  padding: 8px 4px 4px;
  min-width: min-content;
}
.tracker-timeline-line {
  position: absolute;
  top: 22px;
  left: 16px;
  right: 16px;
  height: 2px;
  background: var(--border);
  z-index: 0;
}

/* Node */
.tracker-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 90px;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
}
.tracker-node-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
  transition: all 0.3s;
  flex-shrink: 0;
}
.tracker-node-dot-inner {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  transition: all 0.3s;
}

/* Completed node */
.tracker-node.completed .tracker-node-dot {
  background: rgba(46, 204, 113, 0.15);
  border: 2px solid rgba(46, 204, 113, 0.4);
}
.tracker-node.completed .tracker-node-dot-inner {
  background: #2ecc71;
  box-shadow: 0 0 8px rgba(46, 204, 113, 0.5);
}
.tracker-node.completed.gpa-warning .tracker-node-dot {
  background: rgba(240, 165, 0, 0.12);
  border-color: rgba(240, 165, 0, 0.35);
}
.tracker-node.completed.gpa-warning .tracker-node-dot-inner {
  background: #f0a500;
  box-shadow: 0 0 8px rgba(240, 165, 0, 0.4);
}
.tracker-node.completed.gpa-danger .tracker-node-dot {
  background: rgba(231, 76, 60, 0.12);
  border-color: rgba(231, 76, 60, 0.35);
}
.tracker-node.completed.gpa-danger .tracker-node-dot-inner {
  background: #e74c3c;
  box-shadow: 0 0 8px rgba(231, 76, 60, 0.4);
}

/* Running node */
.tracker-node.running .tracker-node-dot {
  background: rgba(240, 165, 0, 0.15);
  border: 2px solid rgba(240, 165, 0, 0.45);
  animation: tracker-pulse 2s ease-in-out infinite;
}
.tracker-node.running .tracker-node-dot-inner {
  background: #f0a500;
  box-shadow: 0 0 8px rgba(240, 165, 0, 0.5);
}
@keyframes tracker-pulse {
  0%,
  100% {
    box-shadow: 0 0 0 0 rgba(240, 165, 0, 0.2);
  }
  50% {
    box-shadow: 0 0 0 6px rgba(240, 165, 0, 0);
  }
}

/* Projected node */
.tracker-node.projected .tracker-node-dot {
  background: transparent;
  border: 2px dashed var(--border);
}
.tracker-node.projected .tracker-node-dot-inner {
  background: var(--border);
  opacity: 0.4;
}
.tracker-node.projected .tracker-node-card {
  opacity: 0.45;
}
.tracker-node.projected.more .tracker-node-dot {
  border-style: dotted;
}

/* Graduation node */
.tracker-node.graduation .tracker-node-dot {
  background: rgba(46, 204, 113, 0.1);
  border: 2px solid rgba(46, 204, 113, 0.3);
  width: 32px;
  height: 32px;
}
.tracker-node.graduation .tracker-node-dot-inner {
  background: transparent;
  width: auto;
  height: auto;
  font-size: 14px;
}
.tracker-node.graduation .tracker-node-card {
  opacity: 0.7;
}
.tracker-node.graduation.completed .tracker-node-dot {
  background: rgba(46, 204, 113, 0.2);
  border-color: #2ecc71;
  box-shadow: 0 0 12px rgba(46, 204, 113, 0.3);
}
.tracker-node.graduation.completed .tracker-node-card {
  opacity: 1;
}

/* Node card */
.tracker-node-card {
  text-align: center;
  max-width: 88px;
}
.tracker-node-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 88px;
}
.tracker-node-gpa {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 800;
  margin-top: 2px;
}
.tracker-node-meta {
  font-size: 9px;
  color: var(--text3);
  margin-top: 1px;
}

/* Responsive */
@media (max-width: 480px) {
  .degree-tracker {
    margin: 0 0.8rem 0.8rem;
    padding: 1rem;
  }
  .tracker-stats {
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .tracker-stat {
    padding: 8px 10px;
  }
  .tracker-stat-val {
    font-size: 15px;
  }
  .tracker-node {
    min-width: 76px;
  }
  .tracker-node-card {
    max-width: 74px;
  }
  .tracker-node-label {
    font-size: 9px;
    max-width: 74px;
  }
}
@media (min-width: 768px) {
  .degree-tracker {
    margin: 0 1.5rem 1.2rem;
  }
}
@media (min-width: 1024px) {
  .degree-tracker {
    margin: 0 2rem 1.5rem;
  }
}
@media (min-width: 1440px) {
  .degree-tracker {
    margin: 0 2.5rem 1.8rem;
  }
}

/* ── ACADEMIC STANDING ──────────────────────────────── */
.standing-box {
  margin: 0 2rem 1.5rem;
  background: var(--glass2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem 1.5rem;
  position: relative;
  transition: border-color 0.3s;
}
.standing-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.standing-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 0.3rem;
}
.standing-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  transition: color 0.3s;
}
.standing-desc {
  font-size: 12px;
  color: var(--text2);
  margin-top: 0.3rem;
  line-height: 1.5;
  max-width: 420px;
}
.standing-badge {
  font-size: 2rem;
  flex-shrink: 0;
}
/* Standing color variants */
.standing-box.standing-excellent {
  border-color: rgba(46, 204, 113, 0.5);
}
.standing-box.standing-good {
  border-color: rgba(46, 204, 113, 0.28);
}
.standing-box.standing-warning {
  border-color: rgba(240, 165, 0, 0.45);
}
.standing-box.standing-danger {
  border-color: rgba(231, 76, 60, 0.5);
}
.standing-excellent .standing-title {
  color: #2ecc71;
}
.standing-good .standing-title {
  color: #27ae60;
}
.standing-warning .standing-title {
  color: #f0a500;
}
.standing-danger .standing-title {
  color: #e74c3c;
}
@media (max-width: 480px) {
  .standing-box {
    margin: 0 0.8rem 0.8rem;
    padding: 1rem;
  }
  .standing-title {
    font-size: 1rem;
  }
  .standing-badge {
    font-size: 1.5rem;
  }
}
@media (min-width: 1440px) {
  .standing-box {
    margin: 0 2.5rem 1.8rem;
  }
}
/* ── GPA TREND CHART ────────────────────────────────── */
.trend-chart-box {
  margin: 0 2rem 1.5rem;
  background: var(--glass2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem 1.5rem;
  position: relative;
}
.trend-canvas-wrap {
  position: relative;
  width: 100%;
  height: 160px;
  margin-top: 0.8rem;
}
#trendCanvas {
  width: 100%;
  height: 100%;
  display: block;
}
@media (max-width: 480px) {
  .trend-chart-box {
    margin: 0 0.8rem 0.8rem;
    padding: 1rem;
  }
  .trend-canvas-wrap {
    height: 130px;
  }
}
@media (min-width: 1440px) {
  .trend-chart-box {
    margin: 0 2.5rem 1.8rem;
  }
  .trend-canvas-wrap {
    height: 180px;
  }
}

/* ── RUNNING SEMESTER ───────────────────────────────── */
.semester-block.semester-running {
  border-color: rgba(240, 165, 0, 0.4);
  box-shadow: 0 0 0 1px rgba(240, 165, 0, 0.12);
}
.semester-block.semester-running .semester-head {
  background: rgba(240, 165, 0, 0.06);
  border-bottom-color: rgba(240, 165, 0, 0.25);
}
.semester-running-badge {
  font-size: 11px;
  font-weight: 600;
  background: rgba(240, 165, 0, 0.12);
  color: #f0a500;
  border: 1px solid rgba(240, 165, 0, 0.3);
  border-radius: 6px;
  padding: 2px 8px;
}
.btn-running-sem {
  background: transparent;
  color: #f0a500;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 13px;
  padding: 9px 18px;
  border-radius: 999px;
  border: 1px solid rgba(240, 165, 0, 0.4);
  cursor: pointer;
  transition:
    background 0.2s,
    transform 0.2s,
    box-shadow 0.2s;
}
.btn-running-sem:hover {
  background: rgba(240, 165, 0, 0.08);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(240, 165, 0, 0.2);
}
.btn-running-sem:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.footer-btn-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.btn-clear-data {
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(231, 76, 60, 0.35);
  background: rgba(231, 76, 60, 0.08);
  color: #e74c3c;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition:
    background 0.2s,
    border-color 0.2s;
}
.btn-clear-data:hover {
  background: rgba(231, 76, 60, 0.18);
  border-color: rgba(231, 76, 60, 0.6);
}
.btn-export-pdf {
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(29, 185, 84, 0.35);
  background: rgba(29, 185, 84, 0.08);
  color: #1db954;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition:
    background 0.2s,
    border-color 0.2s;
}
.btn-export-pdf:hover {
  background: rgba(29, 185, 84, 0.18);
  border-color: rgba(29, 185, 84, 0.6);
}
.btn-import-pdf {
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(86, 180, 233, 0.35);
  background: rgba(86, 180, 233, 0.08);
  color: #56b4e9;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition:
    background 0.2s,
    border-color 0.2s;
}
.btn-import-pdf:hover {
  background: rgba(86, 180, 233, 0.18);
  border-color: rgba(86, 180, 233, 0.6);
}
[data-theme='light'] .semester-block.semester-running {
  border-color: rgba(240, 165, 0, 0.5);
}
/* ── INCOMPLETE SEMESTER WARNING ───────────────────── */
.semester-incomplete-badge {
  font-size: 11px;
  font-weight: 600;
  background: rgba(231, 76, 60, 0.1);
  color: #e74c3c;
  border: 1px solid rgba(231, 76, 60, 0.28);
  border-radius: 6px;
  padding: 2px 8px;
}
.semester-credit-error-badge {
  font-size: 11px;
  font-weight: 600;
  background: rgba(231, 76, 60, 0.1);
  color: #e74c3c;
  border: 1px solid rgba(231, 76, 60, 0.28);
  border-radius: 5px;
  padding: 2px 8px;
  white-space: nowrap;
}
.semester-credit-warn-badge {
  font-size: 11px;
  font-weight: 600;
  background: rgba(240, 165, 0, 0.1);
  color: #f0a500;
  border: 1px solid rgba(240, 165, 0, 0.28);
  border-radius: 5px;
  padding: 2px 8px;
  white-space: nowrap;
}
.incomplete-warning {
  margin: 10px auto 0;
  max-width: 480px;
  background: rgba(231, 76, 60, 0.08);
  border: 1px solid rgba(231, 76, 60, 0.28);
  border-radius: 10px;
  color: #e74c3c;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  padding: 8px 16px;
}
[data-theme='light'] .incomplete-warning {
  background: rgba(231, 76, 60, 0.06);
}

/* ── THEME CROSSFADE ──────────────────────────────────── */
*,
*::before,
*::after {
  transition:
    background-color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
    border-color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
    color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
    box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1),
    opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
/* Exclude elements where transition would break existing animations */
.cursor-dot,
.cursor-ring,
.course-suggestions,
#suggestions-portal *,
input,
select,
textarea,
.reveal,
.stagger > *,
.magnetic,
.btn-primary svg,
.btn-secondary svg,
#authBtn svg,
.auth-btn-signed-out svg {
  transition: revert;
}
/* Re-apply original transitions for these */
input,
select,
textarea {
  transition:
    border-color 0.2s,
    box-shadow 0.2s,
    background 0.2s;
}
#cursor-dot {
  transition:
    width 0.35s cubic-bezier(0.22, 0.68, 0, 1.2),
    height 0.35s cubic-bezier(0.22, 0.68, 0, 1.2),
    border-radius 0.35s cubic-bezier(0.22, 0.68, 0, 1.2),
    background 0.3s ease,
    opacity 0.2s ease;
}
#cursor-ring {
  transition:
    width 0.35s cubic-bezier(0.22, 0.68, 0, 1.2),
    height 0.35s cubic-bezier(0.22, 0.68, 0, 1.2),
    border-radius 0.35s cubic-bezier(0.22, 0.68, 0, 1.2),
    border-color 0.3s ease,
    opacity 0.3s ease,
    background 0.3s ease;
}

/* ── EMPTY STATE ──────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 56px 24px 48px;
  text-align: center;
  gap: 0;
}
.empty-state-icon {
  font-size: 52px;
  margin-bottom: 16px;
  opacity: 0.85;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}
.empty-state-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 8px;
}
.empty-state-sub {
  font-size: 13px;
  color: var(--text3);
  line-height: 1.6;
  max-width: 320px;
  margin-bottom: 28px;
}
.empty-state-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
.btn-sample {
  padding: 10px 20px;
  border-radius: 10px;
  background: var(--green);
  color: #000;
  font-weight: 700;
  font-size: 13px;
  border: none;
  cursor: pointer;
  transition:
    background 0.15s,
    transform 0.1s,
    box-shadow 0.15s !important;
}
.btn-sample:hover {
  background: #27b560;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(46, 204, 113, 0.35);
}
.btn-sample:active {
  transform: translateY(1px);
}
.btn-sample-ghost {
  padding: 10px 20px;
  border-radius: 10px;
  background: transparent;
  color: var(--text2);
  font-weight: 600;
  font-size: 13px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition:
    background 0.15s,
    border-color 0.15s,
    color 0.15s !important;
}
.btn-sample-ghost:hover {
  background: var(--glass2);
  border-color: var(--green);
  color: var(--text);
}
.empty-arrow {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--green);
  margin-top: 20px;
  opacity: 0.8;
  animation: nudge 1.6s ease-in-out infinite;
}
@keyframes nudge {
  0%,
  100% {
    transform: translateX(0);
  }
  50% {
    transform: translateX(6px);
  }
}

/* ── DRAG TO REORDER ──────────────────────────────────── */
.semester-block[draggable='true'] {
  cursor: grab;
}
.semester-block[draggable='true']:active {
  cursor: grabbing;
}
.semester-block.drag-over {
  outline: 2px dashed var(--green);
  outline-offset: 3px;
  background: var(--glass3);
}
.semester-block.dragging {
  opacity: 0.4;
  transform: scale(0.98);
}
.drag-handle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  cursor: grab;
  color: var(--text3);
  font-size: 14px;
  margin-right: 6px;
  border-radius: 4px;
  transition: color 0.15s !important;
  flex-shrink: 0;
}
.drag-handle:hover {
  color: var(--green);
}
.semester-block.semester-running .drag-handle {
  display: none;
}

/* ── CREDIT VALIDATION ─────────────────────────────────── */
.credit-warn-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #f0a500;
  margin-left: 4px;

  cursor: help;
  flex-shrink: 0;
}
.credit-error-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #e74c3c;
  margin-left: 4px;
  vertical-align: middle;
  cursor: help;
  flex-shrink: 0;
}
.credits-static-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
/* ══════════════════════════════════════════════════════════
   #1  ONBOARDING STEP WIZARD
   ══════════════════════════════════════════════════════════ */
.setup-wizard {

}

}
.setup-step-indicator {

  align-items: center;

}

/* ══════════════════════════════════════════════════════════
   #8  MOBILE COURSE ROW FIX
   ══════════════════════════════════════════════════════════ */
@media (max-width: 580px) {
  .course-header {
    display: none !important;
  }
  .course-row:not(.course-header) {
    grid-template-columns: 44px minmax(72px, 1fr) 28px 84px !important;
    gap: 6px 4px !important;
    padding: 9px 10px !important;
  }
  .course-row:not(.course-header) > .course-input-wrap {
    grid-column: 1 / -1;
  }
  /* Credits pill full width on mobile */
  .credits-static {
    min-width: 44px;
    font-size: 11px;
  }
  /* Semester head wraps gracefully */
  .semester-head {
    flex-wrap: wrap;
    gap: 6px;
  }
  .semester-head-left {
    flex-wrap: wrap;
    gap: 4px;
  }
  /* Footer buttons scroll horizontally */
  .footer-btn-group {
    overflow-x: auto;
    flex-wrap: nowrap !important;
    padding-bottom: 4px;
  }
  .footer-btn-group button {
    flex-shrink: 0;
  }
  /* Smart Retake table: hide Semester (3rd) and CGPA(A) (8th) columns.
     Columns are 1 checkbox · 2 Course · 3 Semester · 4 Grade → Target ·
     5 Type · 6 Credits · 7 CGPA(B) · 8 CGPA(A). Credits stays on mobile: it is
     the cost half of the default per-credit ranking, and it is the narrowest
     column in the table. (The old rule hid nth-child(6), which was CGPA(B) —
     the primary column — rather than the CGPA(A) its comment named.) */
  .sim-retake-table th:nth-child(3),
  .sim-retake-table td:nth-child(3) {
    display: none;
  }
  .sim-retake-table th:nth-child(8),
  .sim-retake-table td:nth-child(8) {
    display: none;
  }
  .sim-retake-table td:nth-child(2) {
    max-width: 140px;
  }
  /* ── Playground solver stack on small tablets ── */
  .pg-solver-inputs {
    flex-direction: column !important;
  }
  .pg-solver-input-group {
    min-width: 0 !important;
    width: 100% !important;
    flex: none !important;
  }
  /* ── Simulator inputs wider on small screens ── */
  .simulator-row input {
    width: 100% !important;
  }
}

/* Tabs */

  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.pg-tab {
  flex: 1;
  min-width: 120px;
  padding: 10px 12px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition:

}

}

}

}

}

/* ══════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════ */

/* ── FIX 1: Total credits badge centered under dept select ── */
@media (max-width: 767px) {

    text-align: center !important;
    width: 100% !important;

}

/* ── FIX 2: Course rows remain readable on phones ─────────
   Keep the course title full-width, then place credits,
   grade point, grade, and actions on a compact second line. */
@media (max-width: 580px) {
  .course-row:not(.course-header) {
    grid-template-columns: 44px minmax(72px, 1fr) 28px 84px !important;
    gap: 6px 4px !important;
    padding: 9px 10px !important;
  }

  }
  .grade-letter {
    font-size: 10px !important;
    min-width: 24px !important;
    letter-spacing: 0 !important;
  }
  .credits-static {
    font-size: 11px !important;
    padding: 0 3px !important;
    height: 32px !important;

/* ── FIX 3: Retaken badge — no collision with course name ──
   Badge lives inside .course-input-wrap (position:relative).
   On mobile, drop it below the input instead of floating over it. */
@media (max-width: 767px) {

  .course-input-wrap {

    gap: 2px !important;

    align-items: center !important;
    text-align: center !important;

/* ══════════════════════════════════════════════════════════

.account-menu {

}
@keyframes accountMenuIn {

.account-menu-email {

.account-menu-item {

.account-menu-item:focus {

}

.account-menu-icon {

/* ══════════════════════════════════════════════════════════
   CALCULATOR TABS — three-pane navigation
   Calculator | Planner | Playground
   ══════════════════════════════════════════════════════════ */

/* ── Tab bar ─────────────────────────────────────────────── */
.calc-tabs {
  display: flex;
  gap: 3px;
  margin: 12px 2rem 12px;
  padding: 4px;
  border-bottom: none;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-radius: 50px;
  position: relative;
  z-index: 2;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.14);
  /* Grouping collapsed the bar to five top-level items, so it fits without
     scrolling. overflow must stay visible (NOT auto) — the dropdown menus are
     absolutely positioned below the bar and any overflow clip would hide them.
     On narrow widths the items wrap to a second row instead of scrolling. */
  overflow: visible;
  flex-wrap: wrap;
}
[data-theme='light'] .calc-tabs {
  background: rgba(255, 255, 255, 0.45);
  border-color: rgba(255, 255, 255, 0.7);
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

/* Sliding active pill */
.calc-tab-slider {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 4px;
  width: 0;
  background: rgba(46, 204, 113, 0.18);
  border: 1px solid rgba(46, 204, 113, 0.3);
  border-radius: 50px;
  box-shadow:
    0 2px 12px rgba(46, 204, 113, 0.18),
    inset 0 1px 0 rgba(255, 255, 255, 0.14);
  pointer-events: none;
  transition:
    left 0.28s cubic-bezier(0.4, 0, 0.2, 1),
    width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 0;
}

.calc-tab {
  /* Grow to fill a wide bar, but never shrink below the label — shrinking is
     what made nowrap text clip; at narrow widths the bar scrolls instead. */
  flex: 1 0 auto;
  scroll-snap-align: start;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  /* Sized so all nine tabs fit the ~868px wrapper without scrolling (needs
     ~841px at these values); the bar's overflow-x is the fallback, not the
     default experience. */
  padding: 9px 10px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.2px;
  cursor: pointer;
  border-radius: 50px;
  transition: color 0.22s;
  position: relative;
  z-index: 1;
  white-space: nowrap;
}

.calc-tab:hover {
  color: var(--text);
}

.calc-tab.active {
  color: var(--green);
}

.calc-tab.active::after {
  display: none;
}

.calc-tab-icon {
  font-size: 14px;
  line-height: 1;
}

/* Badge for tab (e.g. course count in planner) */
.calc-tab-badge {
  font-size: 10px;
  font-weight: 700;
  background: rgba(46, 204, 113, 0.12);
  color: var(--green);
  border-radius: 10px;
  padding: 1px 6px;
  line-height: 1.4;
  display: none;
}
.calc-tab-badge.visible {
  display: inline-block;
}

/* Small status tag on a menu item (e.g. Campus Map WIP, #385) — amber so it
   reads as "in progress", distinct from the green count badges. */
.calc-tab-menu-tag {
  margin-left: auto;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: rgba(240, 165, 0, 0.14);
  color: #b07d1a;
  border-radius: 8px;
  padding: 2px 6px;
  line-height: 1.3;
}

/* ── Tab dropdown groups ─────────────────────────────────── */
/* A group is a flex item in the bar; its trigger pill fills it and the menu
   drops out of flow directly beneath. */
.calc-tab-group {
  position: relative;
  display: flex;
  flex: 1 0 auto;
}
.calc-tab-group .calc-tab-trigger {
  width: 100%;
}

.calc-tab-caret {
  font-size: 9px;
  line-height: 1;
  opacity: 0.7;
  transition:
    transform 0.22s ease,
    opacity 0.22s;
}
.calc-tab-group.open .calc-tab-caret {
  transform: rotate(180deg);
  opacity: 1;
}

/* The menu sits flush under the trigger (top:100%, no margin gap) so the pointer
   can travel from pill to item without crossing dead space — any gap there fires
   the group's mouseleave and snaps the menu shut mid-reach. The 8px top padding
   gives the first item visual breathing room instead. mouseleave only fires when
   leaving the whole group subtree, which the menu (a descendant) is part of. */
.calc-tab-menu {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 100%;
  width: max-content;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px;
  padding-top: 8px;
  background: rgba(20, 28, 24, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-radius: 18px;
  box-shadow:
    0 12px 36px rgba(0, 0, 0, 0.36),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
  z-index: 30;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  transition:
    opacity 0.18s ease,
    transform 0.18s ease,
    visibility 0.18s;
}
.calc-tab-group.open .calc-tab-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}
[data-theme='light'] .calc-tab-menu {
  background: rgba(255, 255, 255, 0.86);
  border-color: rgba(0, 0, 0, 0.08);
  box-shadow:
    0 12px 36px rgba(0, 0, 0, 0.16),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

.calc-tab-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 14px 9px 12px;
  border: none;
  background: transparent;
  color: var(--text2);
  text-decoration: none; /* menu items may be links (Campus Map, #383) */
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.2px;
  white-space: nowrap;
  text-align: left;
  border-radius: 12px;
  cursor: pointer;
  transition:
    color 0.18s,
    background 0.18s;
}
.calc-tab-menu-item:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.08);
}
[data-theme='light'] .calc-tab-menu-item:hover {
  background: rgba(0, 0, 0, 0.05);
}
.calc-tab-menu-item.active {
  color: var(--green);
  background: rgba(46, 204, 113, 0.14);
}
.calc-tab-menu-item .calc-tab-icon {
  font-size: 15px;
}

/* ── Tab panels ──────────────────────────────────────────── */
.calc-tab-panel {
  display: none;
}
.calc-tab-panel.active {
  display: block;
}

/* ── Reviews tab ─────────────────────────────────────────── */
.rv-tab {
  display: flex;

  gap: 16px;
  padding: 8px 4px 4px;
}
.rv-tab-header {

.rv-tab-title {

.rv-tab-searchrow {

.rv-tab-btn-primary {

/* Faculty grid (directory view) */

}
.rv-tab-facultycard-top {

}

}
.rv-tab-facultycard-count {

}
.rv-tab-facultycard-stars {

}
.rv-tab-limited-note {

/* Breadcrumb (faculty page header) */

}

  text-decoration: none;
  font-weight: 600;
}
.rv-tab-crumb:hover {
  text-decoration: underline;
}
.rv-tab-crumb-sep {
  color: var(--text3);
}
.rv-tab-crumb-active {
  color: var(--text);

}

/* Goal ladder — which standings are still reachable (#502) */
.sim-ladder {
  margin-top: 14px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.sim-ladder-heading {
  font-size: 11px;

  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 4px;
}
.sim-ladder-sub {
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 8px;
}
.sim-ladder-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sim-ladder-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  border: 1px solid var(--chip-border);
  background: var(--chip-hover);
}
.sim-ladder-goal {
  color: var(--text);
  font-weight: 600;
}
.sim-ladder-thresh {
  color: var(--text3);
  font-weight: 500;
  font-size: 11px;
}
.sim-ladder-state {
  color: var(--text2);

}
.sim-ladder-letters {

}

}

}

}
.sim-ladder-row--out-of-reach .sim-ladder-state {
  color: var(--text3);
}

/* Smart Retake ranking toggle — "Best value" / "Biggest jump" */
.sim-retake-ranking {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.sim-rank-chip {
  padding: 5px 11px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--chip-border);
  color: var(--text2);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.4px;
  cursor: pointer;
  transition:
    border-color 0.15s,
    color 0.15s,
    background 0.15s;
}

  background: rgba(0, 0, 0, 0.03);
}
.sim-rank-chip:hover {
  border-color: rgba(46, 204, 113, 0.55);
  color: var(--text);
}
.sim-rank-chip.active {
  background: rgba(46, 204, 113, 0.12);
  border-color: rgba(46, 204, 113, 0.55);
  color: #2ecc71;
}

  border: 1px solid rgba(46, 204, 113, 0.18);

  font-weight: 600;

}

  background: rgba(0, 0, 0, 0.03);
}
.rv-tab-chip:hover {
  border-color: rgba(46, 204, 113, 0.55);

}
.rv-tab-chip.active {
  background: rgba(46, 204, 113, 0.12);
  border-color: rgba(46, 204, 113, 0.55);

}

.rv-tab-aggcard-grid {

.rv-tab-dimgroup {

.rv-tab-overview {

.rv-tab-reviewitem-course {

/* ── Reviews: rating distribution ───────────────────────── */

}
.rv-tab-dist-title {

.rv-tab-dist-pct {

/* ── Reviews: search autocomplete ───────────────────────── */
.rv-tab-searchwrap {

}
.rv-tab-suggestions-dropdown {

[data-theme='light'] .rv-tab-suggestions-dropdown {

.rv-sug-label {

[data-theme='light'] .rv-sug-item:hover,

}
.rv-sug-code {
  display: inline-flex;

}
.rv-sug-code--faculty {

  background: rgba(46, 204, 113, 0.12);
  border-color: rgba(46, 204, 113, 0.24);
}
.rv-sug-code--course {

  background: rgba(255, 255, 255, 0.06);

}
[data-theme='light'] .rv-sug-code--course {

}

/* ── Reviews: dept & course grids ───────────────────────── */
.rv-tab-deptgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  margin-top: 16px;
}
.rv-tab-deptcard {
  position: relative;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 14px 12px;
  cursor: pointer;
  will-change: transform;
  transition:
    background 0.22s ease,
    border-color 0.22s ease,
    box-shadow 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
    transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
  animation: rv-card-mount 0.42s cubic-bezier(0.34, 1.32, 0.64, 1) backwards;
  animation-delay: calc(var(--i, 0) * 22ms);
}
.rv-tab-deptcard::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(46, 204, 113, 0.16), transparent 48%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
}
[data-theme='light'] .rv-tab-deptcard {
  background: rgba(0, 0, 0, 0.03);
  border-color: rgba(0, 0, 0, 0.1);
}
.rv-tab-deptcard:hover {
  background: rgba(46, 204, 113, 0.08);
  border-color: rgba(46, 204, 113, 0.38);
  box-shadow:
    0 6px 12px -2px rgba(0, 0, 0, 0.32),
    0 20px 36px -10px rgba(46, 204, 113, 0.36),
    0 36px 60px -18px rgba(46, 204, 113, 0.22);
  transform: translateY(-3px) scale(1.012);
}
.rv-tab-deptcard:active {
  transform: translateY(-1px) scale(0.985);
  box-shadow:
    0 4px 10px -2px rgba(0, 0, 0, 0.26),
    0 12px 22px -8px rgba(46, 204, 113, 0.24);
  transition:
    background 0.12s ease,
    border-color 0.12s ease,
    box-shadow 0.12s ease,
    transform 0.12s cubic-bezier(0.4, 0, 0.2, 1);
}
.rv-tab-deptcard:hover::before {
  opacity: 1;
}
[data-theme='light'] .rv-tab-deptcard:hover {
  background: rgba(46, 204, 113, 0.1);
  box-shadow:
    0 4px 10px -2px rgba(0, 0, 0, 0.1),
    0 18px 32px -10px rgba(46, 204, 113, 0.2),
    0 32px 52px -18px rgba(46, 204, 113, 0.12);
}
.rv-tab-deptcard:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.rv-tab-deptcard > * {
  position: relative;
}
.rv-tab-deptcard-code {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 5px;
  font-family: 'Syne', sans-serif;
}
.rv-tab-deptcard-label {
  font-size: 11px;
  color: var(--text-muted, #aaa);
  line-height: 1.35;
}

.rv-tab-section-header {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted, #aaa);
  margin: 20px 0 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}
[data-theme='light'] .rv-tab-section-header {
  border-bottom-color: rgba(0, 0, 0, 0.08);
}
.rv-tab-coursegrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  margin-top: 4px;
}
.rv-tab-coursegrid--skeleton {
  margin-top: 4px;
}
.rv-tab-coursecard {
  position: relative;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 13px 14px;
  cursor: pointer;
  will-change: transform;
  transition:
    background 0.22s ease,
    border-color 0.22s ease,
    box-shadow 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
    transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  animation: rv-card-mount 0.42s cubic-bezier(0.34, 1.32, 0.64, 1) backwards;
  animation-delay: calc(var(--i, 0) * 18ms);
}
.rv-tab-coursecard::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 18% 12%, rgba(46, 204, 113, 0.2), transparent 34%),
    linear-gradient(135deg, rgba(46, 204, 113, 0.1), transparent 52%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
}
[data-theme='light'] .rv-tab-coursecard {
  background: rgba(0, 0, 0, 0.03);
  border-color: rgba(0, 0, 0, 0.1);
}
.rv-tab-coursecard:hover {
  background: rgba(46, 204, 113, 0.08);
  border-color: rgba(46, 204, 113, 0.38);
  box-shadow:
    0 6px 12px -2px rgba(0, 0, 0, 0.32),
    0 20px 36px -10px rgba(46, 204, 113, 0.4),
    0 36px 60px -18px rgba(46, 204, 113, 0.24);
  transform: translateY(-3px) scale(1.012);
}
.rv-tab-coursecard:active {
  transform: translateY(-1px) scale(0.985);
  box-shadow:
    0 4px 10px -2px rgba(0, 0, 0, 0.26),
    0 12px 22px -8px rgba(46, 204, 113, 0.26);
  transition:
    background 0.12s ease,
    border-color 0.12s ease,
    box-shadow 0.12s ease,
    transform 0.12s cubic-bezier(0.4, 0, 0.2, 1);
}
.rv-tab-coursecard:hover::before {
  opacity: 1;
}
[data-theme='light'] .rv-tab-coursecard:hover {
  background: rgba(46, 204, 113, 0.1);
  box-shadow:
    0 4px 10px -2px rgba(0, 0, 0, 0.1),
    0 18px 32px -10px rgba(46, 204, 113, 0.22),
    0 32px 52px -18px rgba(46, 204, 113, 0.14);
}
.rv-tab-coursecard:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.rv-tab-coursecard > * {
  position: relative;
}
.rv-tab-coursecard--skeleton {
  min-height: 104px;
  cursor: default;
  pointer-events: none;
}
.rv-tab-skel-course-code {
  width: 64px;
  height: 18px;
  margin-bottom: 9px;
}
.rv-tab-skel-course-name {
  width: 88%;
  height: 14px;
  margin-bottom: 7px;
}
.rv-tab-skel-course-name--short {
  width: 62%;
}
.rv-tab-skel-course-count {
  width: 76%;
  height: 13px;
  margin-top: 12px;
}
.rv-tab-coursecard:hover .rv-tab-coursecard-code,
.rv-tab-deptcard:hover .rv-tab-deptcard-code {
  color: #3ef08a;
}
@keyframes rv-card-mount {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .rv-tab-coursecard,
  .rv-tab-deptcard {
    transition:
      background 0.18s ease,
      border-color 0.18s ease,
      box-shadow 0.18s ease;
    animation: none;
  }
  .rv-tab-coursecard:hover,
  .rv-tab-deptcard:hover,
  .rv-tab-coursecard:active,
  .rv-tab-deptcard:active {
    transform: none;
  }
}
.rv-tab-coursecard-code {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
  font-family: 'Syne', sans-serif;
}
.rv-tab-coursecard-name {
  font-size: 12px;
  color: var(--text);
  line-height: 1.35;
  margin-bottom: 6px;
}
.rv-tab-coursecard-count {
  font-size: 11px;
  color: var(--text3);
}
.rv-tab-coursecard-count--reviews {
  color: #2ecc71;
  font-weight: 700;
}

/* Faculty name below initials */
.rv-tab-facultycard-name {
  font-size: 11px;
  color: var(--text-muted, #aaa);
  margin: 2px 0 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rv-tab-course-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.rv-tab-course-stat {
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  text-align: center;
}
[data-theme='light'] .rv-tab-course-stat {
  background: rgba(0, 0, 0, 0.03);
  border-color: rgba(0, 0, 0, 0.09);
}
.rv-tab-course-stat-value {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
}
.rv-tab-course-stat-label {
  margin-top: 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text3);
  line-height: 1.35;
}
.rv-tab-directory-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 10px;
}
@media (max-width: 560px) {
  .rv-tab-directory-list {
    grid-template-columns: 1fr;
  }
}
.rv-tab-directory-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background:
    linear-gradient(135deg, rgba(46, 204, 113, 0.08), rgba(46, 204, 113, 0.02)),
    rgba(255, 255, 255, 0.03);
  cursor: pointer;
  transition:
    transform 0.15s,
    border-color 0.15s,
    background 0.15s;
}
[data-theme='light'] .rv-tab-directory-row {
  background:
    linear-gradient(135deg, rgba(46, 204, 113, 0.08), rgba(46, 204, 113, 0.02)), rgba(0, 0, 0, 0.02);
  border-color: rgba(0, 0, 0, 0.09);
}
.rv-tab-directory-row:hover {
  transform: translateY(-2px);
  border-color: rgba(46, 204, 113, 0.38);
}
.rv-tab-directory-row:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.rv-tab-directory-main {
  min-width: 0;
  flex: 1;
}
.rv-tab-directory-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rv-tab-directory-sub {
  margin-top: 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}
.rv-tab-directory-meta {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-muted, #aaa);
  line-height: 1.45;
}
.rv-tab-directory-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
}
.rv-tab-directory-badge {
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.07);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text);
  font-family: 'Syne', sans-serif;
}
[data-theme='light'] .rv-tab-directory-badge {
  background: rgba(0, 0, 0, 0.05);
  border-color: rgba(0, 0, 0, 0.1);
}
.rv-tab-directory-badge--green {
  color: #2ecc71;
  background: rgba(46, 204, 113, 0.12);
  border-color: rgba(46, 204, 113, 0.28);
}
.rv-tab-directory-badge--gold {
  color: #f0a500;
  background: rgba(240, 165, 0, 0.1);
  border-color: rgba(240, 165, 0, 0.25);
}
.rv-tab-directory-score {
  font-size: 12px;
}
.rv-tab-directory-status {
  font-size: 11px;
  font-weight: 700;
  color: #f0a500;
}
.rv-tab-directory-status-muted {
  color: var(--text-muted, #aaa);
}
@media (max-width: 700px) {
  .rv-tab-directory-row {
    align-items: flex-start;
    flex-direction: column;
  }
  .rv-tab-directory-side {
    width: 100%;
    align-items: flex-start;
  }
}

/* Faculty name on aggcard */
.rv-tab-aggcard-facultyname {
  font-size: 13px;
  color: var(--text-muted, #aaa);
  margin-top: 2px;
}

/* ── Planner empty state ─────────────────────────────────── */
.planner-coming-soon {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  text-align: center;
  gap: 0;
}
.planner-coming-soon-icon {
  font-size: 42px;
  margin-bottom: 14px;
  opacity: 0.85;
}
.planner-coming-soon-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 8px;
}
.planner-coming-soon-desc {
  font-size: 13px;
  color: var(--text3);
  line-height: 1.6;
  max-width: 340px;
}
/* Planner search input focus accent (CSP-safe replacement for inline onfocus/onblur) */
#plannerSearchInput:focus {
  border-color: rgba(46, 204, 113, 0.55);
}

/* ── Responsive ──────────────────────────────────────────── */
@media (max-width: 480px) {
  .calc-tabs {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    margin: 8px 0.8rem;
    gap: 4px;
    border-radius: 16px;
  }
  .calc-tab-slider {
    display: none;
  }
  /* Groups are grid cells too; the trigger fills its cell. */
  .calc-tab-group {
    display: flex;
  }
  .calc-tab {
    min-width: 0;
    padding: 8px 6px;
    font-size: 11px;
    gap: 3px;
    border-radius: 12px;
  }
  .calc-tab.active,
  .calc-tab-trigger.active {
    background: rgba(46, 204, 113, 0.15);
  }
  /* Menus drop full-width-ish and left-aligned under their cell. */
  .calc-tab-menu {
    left: 0;
    min-width: 150px;
  }
  .calc-tab-icon {
    font-size: 13px;
  }
  .calc-tab-badge {
    font-size: 9px;
    padding: 0px 5px;
  }
}

@media (min-width: 481px) and (max-width: 767px) {
  .calc-tabs {
    margin: 10px 1.2rem 10px;
  }
  .calc-tab {
    font-size: 12px;
    padding: 8px 10px;
  }
}

.dm-header {

}

.dm-subtitle {

.dm-pill:hover {

  border-color: rgba(255, 255, 255, 0.2);
  color: var(--text);
}
[data-theme='light'] .dm-pill:hover {
  background: rgba(0, 0, 0, 0.08);
}
.dm-pill--active {
  background: var(--accent, #6c63ff);
  border-color: var(--accent, #6c63ff);
  color: #fff;
}
.dm-pill--active:hover {
  background: var(--accent, #6c63ff);
  border-color: var(--accent, #6c63ff);
}

/* Sort controls */
.dm-sort {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}
.dm-sort-label {
  font-size: 12px;
  color: var(--text3);
}
.dm-sort-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  color: var(--text2);
  font-size: 12px;
  padding: 5px 12px;
  cursor: pointer;
  transition:
    background 0.15s,
    border-color 0.15s,
    color 0.15s;
}
[data-theme='light'] .dm-sort-btn {
  background: rgba(0, 0, 0, 0.04);
  border-color: rgba(0, 0, 0, 0.12);
}
.dm-sort-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text);
}
[data-theme='light'] .dm-sort-btn:hover {
  background: rgba(0, 0, 0, 0.08);
}
.dm-sort-btn--active {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.25);
  color: var(--green);
  font-weight: 600;
}
[data-theme='light'] .dm-sort-btn--active {
  background: rgba(0, 0, 0, 0.1);
  border-color: rgba(0, 0, 0, 0.2);
}

/* Cards grid */
.dm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

/* Card */
.dm-card {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  will-change: transform;
  transition:
    background 0.22s ease,
    border-color 0.22s ease,
    box-shadow 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
    transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
[data-theme='light'] .dm-card {
  background: rgba(0, 0, 0, 0.03);
  border-color: rgba(0, 0, 0, 0.1);
}
.dm-card:hover {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(46, 204, 113, 0.32);
  transform: translateY(-3px) scale(1.008);
  box-shadow:
    0 6px 12px -2px rgba(0, 0, 0, 0.32),
    0 20px 36px -10px rgba(46, 204, 113, 0.32),
    0 36px 60px -18px rgba(46, 204, 113, 0.2);
}
.dm-card:active {
  transform: translateY(-1px) scale(0.99);
  box-shadow:
    0 4px 10px -2px rgba(0, 0, 0, 0.26),
    0 12px 22px -8px rgba(46, 204, 113, 0.2);
  transition:
    background 0.12s ease,
    border-color 0.12s ease,
    box-shadow 0.12s ease,
    transform 0.12s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme='light'] .dm-card:hover {
  background: rgba(46, 204, 113, 0.06);
  border-color: rgba(46, 204, 113, 0.3);
  box-shadow:
    0 4px 10px -2px rgba(0, 0, 0, 0.1),
    0 18px 32px -10px rgba(46, 204, 113, 0.18),
    0 32px 52px -18px rgba(46, 204, 113, 0.1);
}
.dm-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  .dm-card {
    transition:
      background 0.18s ease,
      border-color 0.18s ease,
      box-shadow 0.18s ease;
  }
  .dm-card:hover,
  .dm-card:active {
    transform: none;
  }
}

.dm-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.dm-card-code {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  font-family: 'Syne', sans-serif;
}
.dm-card-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.dm-card-tag--great {
  background: rgba(46, 204, 113, 0.15);
  color: #2ecc71;
}
.dm-card-tag--good {
  background: rgba(168, 216, 32, 0.15);
  color: #a8d820;
}
.dm-card-tag--mid {
  background: rgba(240, 165, 0, 0.15);
  color: #f0a500;
}
.dm-card-tag--warn {
  background: rgba(230, 126, 34, 0.15);
  color: #e67e22;
}
.dm-card-tag--bad {
  background: rgba(231, 76, 60, 0.15);
  color: #e74c3c;
}

.dm-card-name {
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 10px;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Bar rows */
.dm-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.dm-bar-label {
  font-size: 11px;
  color: var(--text3);
  width: 62px;
  flex-shrink: 0;
}
.dm-bar-track {
  flex: 1;
  height: 5px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 4px;
  overflow: hidden;
}
[data-theme='light'] .dm-bar-track {
  background: rgba(0, 0, 0, 0.1);
}
.dm-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.3s ease;
}
.dm-bar-value {
  font-size: 11px;
  font-weight: 700;
  width: 26px;
  text-align: right;
  flex-shrink: 0;
}
.dm-bar-value--great {
  color: #2ecc71;
}
.dm-bar-value--good {
  color: #a8d820;
}
.dm-bar-value--mid {
  color: #f0a500;
}
.dm-bar-value--warn {
  color: #e67e22;
}
.dm-bar-value--bad {
  color: #e74c3c;
}

.dm-card-foot {
  font-size: 11px;
  color: var(--text3);
  margin-top: 8px;
}

/* States */
.dm-empty {
  font-size: 13px;
  color: var(--text3);
  padding: 32px 0;
  text-align: center;
  grid-column: 1 / -1;
}

/* Skeleton */
.dm-skel-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
[data-theme='light'] .dm-skel-card {
  background: rgba(0, 0, 0, 0.025);
  border-color: rgba(0, 0, 0, 0.05);
}
.dm-skel {
  background: linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.04) 0%,
    rgba(255, 255, 255, 0.1) 50%,
    rgba(255, 255, 255, 0.04) 100%
  );
  background-size: 200% 100%;
  animation: rvSkelShimmer 1.4s ease-in-out infinite;
  border-radius: 6px;
}
[data-theme='light'] .dm-skel {
  background: linear-gradient(
    90deg,
    rgba(0, 0, 0, 0.04) 0%,
    rgba(0, 0, 0, 0.09) 50%,
    rgba(0, 0, 0, 0.04) 100%
  );
  background-size: 200% 100%;
}
.dm-skel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dm-skel-code {
  height: 16px;
  width: 68px;
}
.dm-skel-tag {
  height: 16px;
  width: 54px;
  border-radius: 999px;
}
.dm-skel-name {
  height: 12px;
  width: 78%;
}
.dm-skel-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dm-skel-bar-label {
  height: 10px;
  width: 62px;
  flex-shrink: 0;
}
.dm-skel-bar-track {
  flex: 1;
  height: 5px;
  border-radius: 4px;
}
.dm-skel-bar-val {
  height: 10px;
  width: 22px;
  flex-shrink: 0;
}
.dm-skel-foot {

}

/* ── Past Papers & Notes tab (Phase 2) ───────────────────────────────────── */
.papers-tab-shell {
  padding: 4px 0 24px;
}
.papers-tab-head {
  display: flex;

  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.papers-tab-head h3 {
  margin: 0 0 4px;
  font-size: 1.4rem;
}
.papers-tab-sub {
  margin: 0;
  opacity: 0.78;
  font-size: 0.92rem;
}
.papers-upload-btn {
  white-space: nowrap;
}

.papers-tab-controls {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.papers-search {
  flex: 1;
  min-width: 220px;
  padding: 10px 14px;
  border-radius: 10px;

}
[data-theme='light'] .papers-search {
  border-color: rgba(0, 0, 0, 0.12);

}
.papers-type-filter {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.04);

  font-size: 0.95rem;
}
[data-theme='light'] .papers-type-filter {
  border-color: rgba(0, 0, 0, 0.12);
  background: rgba(0, 0, 0, 0.03);
}

.papers-list {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}
.papers-empty,
.papers-empty-list {
  padding: 40px 20px;
  text-align: center;
  opacity: 0.78;
  border: 1px dashed rgba(255, 255, 255, 0.14);
