# gitleaks configuration — used by .github/workflows/secret-scan.yml.
#
# Keeps every default rule and allowlists only EXACT values that are public by
# design or are not credentials at all — never a pattern, never a path. A
# different value of the same shape still fails.
#
# On a pull request the scan loads this file from the BASE branch, so a PR
# cannot allowlist its own finding: an addition here takes effect only once it
# has been merged on its own.
#
# Run locally:  gitleaks git --config .gitleaks.toml --log-opts=HEAD --redact

title = "Shohoj"

[extend]
useDefault = true

[[allowlists]]
description = "Public Firebase web client config — ships to every browser in runtime-config.js"
regexTarget = "secret"
regexes = [
  # Firebase web API key: identifies the project, not a credential. Access is
  # enforced by firestore.rules, storage.rules and App Check.
  '''^AIzaSyA4cz0TPyvqgeZicrsX5bEgxIJuGlour54$''',
  # reCAPTCHA v3 SITE key (the public half; the secret half is never in the repo).
  '''^6LfVKuAsAAAAADEF3ffdvibgVvmY5OQfi-HTHDyW$''',
]

[[allowlists]]
description = "localStorage key names assigned to *_KEY constants"
regexTarget = "secret"
regexes = [
  '''^shohoj_campus_floor_v1$''',
  '''^shohoj_maint_dismissed_2026_06$''',
  '''^shohoj_routine_picks_v1$''',
  '''^shohoj_routine_ratings_v1$''',
  '''^shohoj_routine_v1$''',
]

[[allowlists]]
description = "Admin Firebase UID once compared in firestore.rules / storage.rules — an identifier, not a secret"
regexTarget = "secret"
regexes = ['''^LuMu2ZLdaSVeQjs0IQ1qJTwZwfe2$''']

[[allowlists]]
description = "Fake token in the Firestore rules tests"
regexTarget = "secret"
regexes = ['''^cft_0123456789abcdef0123456789abcdef$''']
