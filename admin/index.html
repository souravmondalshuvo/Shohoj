/* ── Responsive ──────────────────────────────────────────── */
@media (max-width: 480px) {
  .calc-tabs {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    margin: 8px 0.8rem;
    gap: 4px;
    border-radius: 16px;
  }
  .calc-tab-slider { display: none; }
  /* Groups are grid cells too; the trigger fills its cell. */
  .calc-tab-group { display: flex; }
  .calc-tab {
    min-width: 0;
    padding: 8px 6px;
    font-size: 11px;
    gap: 3px;
    border-radius: 12px;
  }
  .calc-tab.active,
  .calc-tab-trigger.active {
    background: rgba(46,204,113,0.15);
  }
  /* Menus drop full-width-ish and left-aligned under their cell. */
  .calc-tab-menu { left: 0; min-width: 150px; }
  .calc-tab-icon {
    font-size: 13px;
  }
  .calc-tab-badge {
    font-size: 9px;
    padding: 0px 5px;
  }
}

@media (min-width: 481px) and (max-width: 767px) {
  .calc-tabs {
    margin: 10px 1.2rem 10px;
  }
  .calc-tab {
    font-size: 12px;
    padding: 8px 10px;
  }
}

/* ── Difficulty Map tab ────────────────────────────────────────────────────── */

.dm-root {
  padding: 16px 0 32px;
}

.dm-header {
  margin-bottom: 14px;
}
.dm-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  font-family: 'Syne', sans-serif;
  margin-bottom: 4px;
}
.dm-subtitle {
  font-size: 12px;
  color: var(--text3);
}

/* Controls row */
.dm-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

/* Dept pills */
.dm-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.dm-pill {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  color: var(--text2);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 14px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
[data-theme="light"] .dm-pill {
  background: rgba(0,0,0,0.04);
  border-color: rgba(0,0,0,0.12);
}
.dm-pill:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.2);
  color: var(--text);
}
[data-theme="light"] .dm-pill:hover {
  background: rgba(0,0,0,0.08);
}
.dm-pill--active {
  background: var(--accent, #6C63FF);
  border-color: var(--accent, #6C63FF);
  color: #fff;
}
.dm-pill--active:hover {
  background: var(--accent, #6C63FF);
  border-color: var(--accent, #6C63FF);
}

/* Sort controls */
.dm-sort {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}
.dm-sort-label {
  font-size: 12px;
  color: var(--text3);
}
.dm-sort-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  color: var(--text2);
  font-size: 12px;
  padding: 5px 12px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
[data-theme="light"] .dm-sort-btn {
  background: rgba(0,0,0,0.04);
  border-color: rgba(0,0,0,0.12);
}
.dm-sort-btn:hover {
  background: rgba(255,255,255,0.12);
  color: var(--text);
}
[data-theme="light"] .dm-sort-btn:hover {
  background: rgba(0,0,0,0.08);
}
.dm-sort-btn--active {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.25);
  color: var(--green);
  font-weight: 600;
}
[data-theme="light"] .dm-sort-btn--active {
  background: rgba(0,0,0,0.1);
  border-color: rgba(0,0,0,0.2);
}

/* Cards grid */
.dm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

/* Card */
.dm-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  will-change: transform;
  transition:
    background 0.22s ease,
    border-color 0.22s ease,
    box-shadow 0.28s cubic-bezier(.34, 1.56, .64, 1),
    transform 0.28s cubic-bezier(.34, 1.56, .64, 1);
}
[data-theme="light"] .dm-card {
  background: rgba(0,0,0,0.03);
  border-color: rgba(0,0,0,0.1);
}
.dm-card:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(46,204,113,0.32);
  transform: translateY(-3px) scale(1.008);
  box-shadow:
    0 6px 12px -2px rgba(0,0,0,0.32),
    0 20px 36px -10px rgba(46,204,113,0.32),
    0 36px 60px -18px rgba(46,204,113,0.20);
}
.dm-card:active {
  transform: translateY(-1px) scale(0.99);
  box-shadow:
    0 4px 10px -2px rgba(0,0,0,0.26),
    0 12px 22px -8px rgba(46,204,113,0.20);
  transition:
    background 0.12s ease,
    border-color 0.12s ease,
    box-shadow 0.12s ease,
    transform 0.12s cubic-bezier(.4, 0, .2, 1);
}
[data-theme="light"] .dm-card:hover {
  background: rgba(46,204,113,0.06);
  border-color: rgba(46,204,113,0.30);
  box-shadow:
    0 4px 10px -2px rgba(0,0,0,0.10),
    0 18px 32px -10px rgba(46,204,113,0.18),
    0 32px 52px -18px rgba(46,204,113,0.10);
}
.dm-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  .dm-card {
    transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .dm-card:hover,
  .dm-card:active {
    transform: none;
  }
}

.dm-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.dm-card-code {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  font-family: 'Syne', sans-serif;
}
.dm-card-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.dm-card-tag--great { background: rgba(46,204,113,0.15); color: #2ECC71; }
.dm-card-tag--good  { background: rgba(168,216,32,0.15); color: #A8D820; }
.dm-card-tag--mid   { background: rgba(240,165,0,0.15);  color: #F0A500; }
.dm-card-tag--warn  { background: rgba(230,126,34,0.15); color: #E67E22; }
.dm-card-tag--bad   { background: rgba(231,76,60,0.15);  color: #E74C3C; }

.dm-card-name {
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 10px;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Bar rows */
.dm-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.dm-bar-label {
  font-size: 11px;
  color: var(--text3);
  width: 62px;
  flex-shrink: 0;
}
.dm-bar-track {
  flex: 1;
  height: 5px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  overflow: hidden;
}
[data-theme="light"] .dm-bar-track {
  background: rgba(0,0,0,0.1);
}
.dm-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.3s ease;
}
.dm-bar-value {
  font-size: 11px;
  font-weight: 700;
  width: 26px;
  text-align: right;
  flex-shrink: 0;
}
.dm-bar-value--great { color: #2ECC71; }
.dm-bar-value--good  { color: #A8D820; }
.dm-bar-value--mid   { color: #F0A500; }
.dm-bar-value--warn  { color: #E67E22; }
.dm-bar-value--bad   { color: #E74C3C; }

.dm-card-foot {
  font-size: 11px;
  color: var(--text3);
  margin-top: 8px;
}

/* States */
.dm-empty {
  font-size: 13px;
  color: var(--text3);
  padding: 32px 0;
  text-align: center;
  grid-column: 1 / -1;
}

/* Skeleton */
.dm-skel-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
[data-theme="light"] .dm-skel-card {
  background: rgba(0,0,0,0.025);
  border-color: rgba(0,0,0,0.05);
}
.dm-skel {
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0.04) 0%,
    rgba(255,255,255,0.10) 50%,
    rgba(255,255,255,0.04) 100%
  );
  background-size: 200% 100%;
  animation: rvSkelShimmer 1.4s ease-in-out infinite;
  border-radius: 6px;
}

  background: linear-gradient(
    90deg,
    rgba(0,0,0,0.04) 0%,
    rgba(0,0,0,0.09) 50%,
    rgba(0,0,0,0.04) 100%

}
.dm-skel-head { display: flex; align-items: center; justify-content: space-between; }
.dm-skel-code { height: 16px; width: 68px; }
.dm-skel-tag  { height: 16px; width: 54px; border-radius: 999px; }
.dm-skel-name { height: 12px; width: 78%; }
.dm-skel-bar-row { display: flex; align-items: center; gap: 8px; }
.dm-skel-bar-label { height: 10px; width: 62px; flex-shrink: 0; }
.dm-skel-bar-track { flex: 1; height: 5px; border-radius: 4px; }

.dm-skel-foot { height: 10px; width: 45%; }

[data-theme="light"] .paper-card--skeleton:hover { border-color: rgba(0,0,0,0.10); }
.paper-skel {

    rgba(255,255,255,0.04) 0%,
    rgba(255,255,255,0.10) 50%,

/* Upload + report modal */
.paper-modal-backdrop {
  position: fixed; inset: 0; z-index: 9999;

}

.paper-modal-close {

}
.paper-modal-close:hover { opacity: 1; }
.paper-modal-form { display: flex; flex-direction: column; gap: 10px; }
.paper-modal-form label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
.paper-modal-form input,
.paper-modal-form select,
.paper-modal-form textarea {
  padding: 9px 12px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04); color: inherit;

}
[data-theme="light"] .paper-modal-form input,
[data-theme="light"] .paper-modal-form select,
[data-theme="light"] .paper-modal-form textarea {

}
.paper-modal-note { font-size: 0.78rem; opacity: 0.7; margin: 4px 0 0; }
.paper-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.paper-modal-error { color: #ff7676; font-size: 0.85rem; min-height: 1em; }
.paper-modal-file-info { display: block; font-size: 0.78rem; opacity: 0.75; margin-top: 4px; }
.paper-modal-file-info--error { color: #ff7676; opacity: 1; }
.paper-modal-clear-draft {
  background: transparent; border: 1px solid rgba(255,118,118,0.35);

/* ── Mobile product polish: avoid page-level horizontal scroll ───────────── */
@media (max-width: 640px) {
  body {
    min-width: 0;
  }

  nav {
    gap: 8px;
  }

  .nav-right {
    min-width: 0;
    gap: 6px;
  }

  #authBtn {
    max-width: 128px;
    overflow: hidden;
  }

  #authLabel,
  .auth-name,
  .auth-email {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .footer-btn-group {
    flex-wrap: wrap !important;
    overflow-x: visible !important;
  }

  .footer-btn-group button {
    flex: 1 1 calc(50% - 6px);
    min-width: 132px;
  }

  .course-suggestions {
    left: 12px !important;
    width: calc(100vw - 24px) !important;
    max-height: 52vh;
    overflow-y: auto;
  }

  .shohoj-modal-card,
  .paper-modal,
  .admin-preview-modal {
    max-height: calc(100svh - 24px);
    overflow-y: auto;
  }

  .papers-tab-head,
  .papers-tab-controls,
  .paper-card-actions,
  .paper-modal-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .papers-upload-btn,
  .papers-search,
  .papers-type-filter,
  .paper-card-preview,
  .paper-card-download,
  .paper-card-report {
    width: 100%;
  }
}

/* Between the ≤480px grid and the desktop layout: the five top-level items wrap
   to a second row when they don't fit, instead of scrolling — so the dropdown
   menus stay fully visible (a scroll container would clip them). */
@media (min-width: 481px) and (max-width: 640px) {
  .calc-tabs {
    justify-content: flex-start;
    margin: 10px 0.8rem 12px;
    border-radius: 16px;
  }

  .calc-tab-slider {
    display: none;
  }
}

     the JS cursor freezes. Override with a static SVG cursor (dot + ring,

  cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMkVDQzcxIiBzdHJva2Utd2lkdGg9IjEuNSIgb3BhY2l0eT0iMC43Ii8+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMyIgZmlsbD0iIzJFQ0M3MSIvPjwvc3ZnPg==') 16 16, auto !important;
}

/* Admin sign-in / forbidden gate */
.admin-gate {
  min-height: 80vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
}
.admin-gate-card {
  max-width: 420px; width: 100%;
  text-align: center;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 36px 28px;
  display: flex; flex-direction: column; gap: 14px; align-items: center;
}
[data-theme="light"] .admin-gate-card {
  background: #ffffff;
  border-color: rgba(0,0,0,0.08);
  box-shadow: 0 12px 40px rgba(0,0,0,0.06);
}
.admin-gate-icon { font-size: 2.4rem; line-height: 1; }
.admin-gate-card h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
.admin-gate-card p { margin: 0; opacity: 0.78; font-size: 0.95rem; line-height: 1.5; }
.admin-gate-card .btn-primary { margin-top: 6px; }
.admin-gate-note { font-size: 0.82rem !important; opacity: 0.6 !important; margin-top: 6px !important; }
.admin-gate-note a { color: inherit; text-decoration: underline; }
.admin-gate-back { display: inline-block; margin-top: 6px; }

#fbSubmitBtn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(46,204,113,0.35);
}
#fbSubmitBtn:active:not(:disabled) {
  transform: translateY(0);
}

.papers-tab-head-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.papers-mod-btn,
.papers-tab-head-actions .papers-upload-btn {
  min-width: 108px;
  padding: 10px 20px;
  border: none;
  border-radius: 999px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 13.5px;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.papers-mod-btn {
  background: #f5b942;
  color: #2a1c00;
  box-shadow: 0 0 0 0 rgba(245,185,66,0.4);
}
.papers-mod-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(245,185,66,0.35);
}
.papers-tab-head-actions .papers-upload-btn {
  background: var(--green);
  color: #0b0f0d;
  box-shadow: 0 0 0 0 rgba(46,204,113,0.4);
}
.papers-tab-head-actions .papers-upload-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(46,204,113,0.35);
}

.paper-modal--wide { max-width: 720px; }
.paper-mod-tabs {
  display: flex; gap: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.10); margin: 6px 0 12px;
}
[data-theme="light"] .paper-mod-tabs { border-color: rgba(0,0,0,0.10); }
.paper-mod-tab {
  background: transparent; border: 0; color: inherit; cursor: pointer;
  padding: 8px 12px; font-size: 0.9rem; opacity: 0.65;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.paper-mod-tab.active { opacity: 1; border-bottom-color: #6cb0ff; font-weight: 600; }

.paper-mod-body { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.paper-mod-row {
  display: flex; gap: 12px; padding: 10px;
  border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
  background: rgba(255,255,255,0.02);
}
[data-theme="light"] .paper-mod-row { border-color: rgba(0,0,0,0.08); background: rgba(0,0,0,0.015); }
.paper-mod-row-main { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.paper-mod-row-head { display: flex; gap: 8px; align-items: center; }
.paper-mod-row-title { font-size: 0.95rem; font-weight: 500; word-break: break-word; }
.paper-mod-row-meta  { font-size: 0.78rem; opacity: 0.65; }
.paper-mod-row-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.paper-mod-row-actions button {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  color: inherit; padding: 6px 10px; border-radius: 6px;
  font-size: 0.82rem; cursor: pointer; min-width: 86px;
}
[data-theme="light"] .paper-mod-row-actions button { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.12); }
.paper-mod-row-actions button:hover { border-color: rgba(255,255,255,0.32); }
.paper-mod-approve { background: rgba(60,200,120,0.14) !important; border-color: rgba(60,200,120,0.45) !important; color: #6cd992 !important; }
.paper-mod-delete  { background: rgba(255,90,90,0.14)  !important; border-color: rgba(255,90,90,0.45)  !important; color: #ff7676 !important; }
.paper-mod-row-actions button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ─── Shohoj inline-style replacements (was inline style='' on shell elements) ── */
.shohoj-modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
  align-items: center;
  justify-content: center;
}
.shohoj-modal-backdrop--strong { background: rgba(0, 0, 0, 0.72); }
.shohoj-modal-backdrop--fade   { opacity: 0; transition: opacity 0.18s; }

.shohoj-modal-card {
  background: #0f1f14;
  border: 1px solid rgba(46, 204, 113, 0.25);
  border-radius: 16px;
  padding: 28px 32px;
  width: 90%;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
  max-height: 85vh;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  z-index: 10000;
}
.shohoj-modal-card--md { max-width: 480px; }
.shohoj-modal-card--sm { max-width: 320px; padding: 28px 28px 24px; border-radius: 20px; text-align: center; }
.shohoj-modal-card--feedback {
  background: transparent;
  border-radius: 20px;
  padding: 28px 28px 24px;
  max-width: 440px;
  z-index: auto;
}

.shohoj-modal-close-x {
  position: absolute;
  top: 14px;
  right: 16px;
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.4);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
}

.start-form-select {
  background: var(--input-bg);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 10px;
  -webkit-appearance: none;
  appearance: none;
  background-image: url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 12 12%27%3E%3Cpath d=%27M3 4.5L6 7.5L9 4.5%27 stroke=%27%238aab90%27 stroke-width=%271.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 fill=%27none%27/%3E%3C/svg%3E');
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 28px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 10px 6px 10px;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s;
  height: 36px;
  box-sizing: border-box;
}
.start-form-select--dept { max-width: 420px; }

.start-form-confirm {
  background: var(--green);
  color: #0b0f0d;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: opacity 0.2s;
  height: 36px;
  box-sizing: border-box;
}

.dept-credits-badge {
  display: none;
  align-items: center;
  gap: 5px;
  background: rgba(46, 204, 113, 0.10);
  border: 1px solid rgba(46, 204, 113, 0.28);
  border-radius: 10px;
  padding: 5px 11px;
  height: 36px;
  box-sizing: border-box;
}
.dept-credits-badge.is-visible { display: inline-flex; }
.dept-credits-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--green);
  letter-spacing: 0.3px;
  white-space: nowrap;
}

/* ─────────────────────────────────────────────────────────────────────────────
 * Routine Builder tab
 * ─────────────────────────────────────────────────────────────────────────── */
.routine-tab { display: flex; flex-direction: column; gap: 14px; padding: 4px 0; }

.routine-header {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
}
.routine-header h3 { margin: 0 8px 0 0; display: inline-block; font-size: 18px; }
.routine-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.routine-header-right { display: flex; align-items: center; gap: 6px; position: relative; }
/* Overlaid (not in the flex flow) so the transient confirmation can't widen
   the row and wrap the whole toolbar onto a second line — see #204. The
   opaque backdrop keeps it legible over the search input it floats above. */
.routine-share-note {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 5;
  pointer-events: none; /* floats over the row below — never block its clicks */
  font-size: 11px; font-weight: 600; color: #2ecc71;
  background: rgba(16, 34, 24, 0.95);
  border: 1px solid rgba(46,204,113,0.35);
  padding: 3px 9px; border-radius: 999px;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,0.35);
}

/* QR-of-share-link panel. The code sits on a solid white card so dark modules
   stay scannable in both themes (a transparent QR on the dark UI would not). */
.routine-qr-panel {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 16px; margin: 6px 0 4px;
  border: 1px solid var(--card-border); border-radius: 12px;
  background: var(--card-bg);
}
.routine-qr-code {
  background: #fff; padding: 12px; border-radius: 10px;
  width: 220px; max-width: 72vw; line-height: 0;
}
.routine-qr-code svg { display: block; width: 100%; height: auto; }
.routine-qr-cap { font-size: 12px; color: var(--text2); text-align: center; }

.routine-source-badge {
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: var(--badge-bg); color: var(--text2);
  border: 1px solid var(--chip-border);
}
.routine-source--live     { background: rgba(46,204,113,0.12); color: #2ecc71; border-color: rgba(46,204,113,0.28); }
.routine-source--cache    { background: rgba(241,196,15,0.10); color: #f1c40f; border-color: rgba(241,196,15,0.24); }
.routine-source--fallback { background: rgba(231,76,60,0.10);  color: #e74c3c; border-color: rgba(231,76,60,0.24); }

/* Which semester the timetable on screen belongs to (#633). Sits beside the
   freshness badge because the two answer different questions: that one says how
   recent the data is, this one says whether it is the semester you are in.
   Amber for a semester that has not started — the common case during advising,
   when CONNECT has already swapped the running semester out. */
.routine-semester-badge {
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: var(--badge-bg); color: var(--text2);
  border: 1px solid var(--chip-border);
  white-space: nowrap;
}
.routine-semester--running  { background: rgba(46,204,113,0.12); color: var(--ink-green); border-color: rgba(46,204,113,0.28); }
.routine-semester--upcoming { background: rgba(241,196,15,0.12); color: var(--ink-amber); border-color: rgba(241,196,15,0.28); }
.routine-semester--ended    { background: rgba(231,76,60,0.10);  color: #e74c3c;          border-color: rgba(231,76,60,0.24); }

/* Switcher between the live feed and the semesters the Worker kept (#633).
   Sits beside the badge that names the current one, so "which semester is this"
   and "show me a different one" read as one control. */
.routine-semester-picker {
  font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
  background: var(--badge-bg); color: var(--text2);
  border: 1px solid var(--chip-border);
  cursor: pointer;
}
.routine-semester-picker:hover { background: var(--chip-hover); color: var(--text1); }

/* What an imported capture cannot tell you. Amber, like the out-of-term notice:
   the data is real, it is just not live, and the failure that matters is the
   one that looks fine — a seat count frozen months ago reads like a live one. */
.routine-archive-note {
  margin: 0;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text2);
  background: rgba(241,196,15,0.10);
  border: 1px solid rgba(241,196,15,0.28);
}

.routine-clash-warn {
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: rgba(231,76,60,0.10); color: #e74c3c; border: 1px solid rgba(231,76,60,0.24);
}

.routine-loading, .routine-error, .routine-empty {
  text-align: center; padding: 36px 18px; color: var(--text2);
}
.routine-spinner {
  width: 28px; height: 28px; margin: 0 auto 12px;
  border: 3px solid var(--chip-border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.routine-error h3 { color: #e74c3c; margin: 0 0 6px; }

/* Skeleton loading state — shimmer placeholders shaped like the real layout. */
.routine-skeleton { display: flex; flex-direction: column; gap: 12px; padding: 4px 0; }
.rsk {
  border-radius: 8px;
  background: linear-gradient(90deg,
    var(--skel-lo) 25%,
    var(--skel-hi) 37%,
    var(--skel-lo) 63%);
  background-size: 400% 100%;
  animation: rsk-shimmer 1.4s ease infinite;
}
.rsk-header { height: 26px; width: 220px; }
.rsk-picker { height: 40px; width: 100%; }
.rsk-block  { height: 84px; width: 100%; }
@keyframes rsk-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.routine-loading-note { text-align: center; color: var(--text3); font-size: 12px; margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { .rsk { animation: none; } }

.routine-picker { display: flex; gap: 8px; align-items: center; }
.routine-input {
  flex: 1; min-width: 200px;
  background: var(--glass);
  border: 1px solid var(--chip-border);
  color: var(--text1);
  border-radius: 10px;
  padding: 10px 14px;
  font: 13px 'DM Sans', sans-serif;
  letter-spacing: 0.5px;
  transition: border-color 0.2s, background 0.2s;
}
.routine-input:focus { outline: none; border-color: var(--green); background: var(--glass2); }
.routine-input--err { border-color: #e74c3c; animation: routine-shake 0.3s; }
@keyframes routine-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.routine-suggestions { display: flex; flex-direction: column; gap: 4px; }
.routine-suggest-item {
  display: grid; grid-template-columns: 80px 1fr auto; gap: 12px; align-items: center;
  text-align: left; padding: 8px 12px;
  background: var(--card-bg-2); border: 1px solid var(--hairline);
  color: var(--text1); border-radius: 8px; cursor: pointer;
  font: 12px 'DM Sans', sans-serif;
}
.routine-suggest-item:hover { background: var(--card-hover); }
.routine-suggest-item.is-active {
  background: rgba(46,204,113,0.12);
  border-color: rgba(46,204,113,0.40);
}
.routine-suggest-code { font-weight: 700; letter-spacing: 0.4px; color: var(--green); }
.routine-suggest-name { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.routine-suggest-count { color: var(--text3); font-size: 11px; }
.routine-suggest-empty { padding: 8px 12px; color: var(--text3); font-size: 12px; }

.routine-picked-list { display: flex; flex-direction: column; gap: 12px; }

.routine-course-block {
  border: 1px solid var(--card-border); border-radius: 12px;
  background: var(--card-bg); overflow: hidden;
}
.routine-course-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; background: var(--card-bg-2);
  border-bottom: 1px solid var(--hairline);
}
.routine-course-code  { font-weight: 700; color: var(--green); letter-spacing: 0.4px; margin-right: 10px; }
.routine-course-name  { color: var(--text2); font-size: 13px; }
.routine-remove-x {
  background: none; border: none; color: var(--text3); font-size: 18px;
  cursor: pointer; padding: 0 6px; line-height: 1;
}
.routine-remove-x:hover { color: #e74c3c; }

.routine-section-list { display: flex; flex-direction: column; }
.routine-section-row {
  display: grid;
  grid-template-columns: 44px 56px 1fr 100px 80px 1fr auto auto;
  gap: 10px; align-items: center;
  text-align: left; padding: 10px 14px;
  background: transparent; border: none; border-top: 1px solid var(--hairline);
  color: var(--text1); cursor: pointer;
  font: 12px 'DM Sans', sans-serif;
  transition: background 0.15s;
}
.routine-section-row:hover { background: var(--chip-hover); }
.routine-section--picked { background: rgba(46,204,113,0.06); }
.routine-section--picked:hover { background: rgba(46,204,113,0.10); }
.routine-section--clash { background: rgba(231,76,60,0.10) !important; }

.routine-section-name { font-weight: 700; }
.routine-section-faculty { color: var(--text2); letter-spacing: 0.4px; font-weight: 600; }
.routine-section-schedule { color: var(--text1); }
.routine-section-room { color: var(--text3); font-size: 11px; }
.routine-section-seats { font-weight: 700; padding: 2px 8px; border-radius: 999px; font-size: 11px; text-align: center; }
.routine-seats--open  { background: rgba(46,204,113,0.10); color: #2ecc71; }
.routine-seats--tight { background: rgba(241,196,15,0.10); color: #f1c40f; }
.routine-seats--full  { background: rgba(231,76,60,0.10);  color: #e74c3c; }
.routine-section-exam { color: var(--text3); font-size: 11px; }

.routine-clash-pill {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
  background: rgba(231,76,60,0.18); color: #e74c3c; letter-spacing: 0.5px;
}
.routine-clash-pill--exam { background: rgba(155,89,182,0.18); color: #9b59b6; }
.routine-clash-pill--cand {
  background: rgba(231,76,60,0.12); color: #e74c3c; font-weight: 600;
  text-transform: lowercase; letter-spacing: 0.2px;
}
.routine-clash-pill--candexam { background: rgba(155,89,182,0.12); color: #9b59b6; }

/* Controls: status bar + sort + clash filter */
.routine-controls {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px; margin: 14px 0 10px;
}
.routine-stats { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.routine-stat {
  font-size: 12px; font-weight: 600; color: var(--text2);
  padding: 3px 10px; border-radius: 999px; background: var(--badge-bg);
}
.routine-stat--ok    { color: #2ecc71; background: rgba(46,204,113,0.10); }
.routine-stat--clash { color: #e74c3c; background: rgba(231,76,60,0.12); }
.routine-controls-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.routine-sort { display: inline-flex; align-items: center; gap: 4px; }
.routine-sort-label { font-size: 11px; color: var(--text3); margin-right: 2px; text-transform: uppercase; letter-spacing: 0.6px; }
.routine-sort-btn {
  font: 12px 'DM Sans', sans-serif; cursor: pointer;
  padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--chip-border); background: transparent; color: var(--text2);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.routine-sort-btn:hover { background: var(--chip-hover); color: var(--text1); }
.routine-sort-btn.is-active {
  background: rgba(46,204,113,0.14); color: var(--ink-green); border-color: rgba(46,204,113,0.35);
}
.routine-chip-toggle {
  font: 12px 'DM Sans', sans-serif; cursor: pointer;
  padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--chip-border); background: transparent; color: var(--text2);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.routine-chip-toggle:hover { background: var(--chip-hover); color: var(--text1); }
.routine-chip-toggle.is-active {
  background: rgba(241,196,15,0.12); color: var(--ink-amber); border-color: rgba(241,196,15,0.35);
}

/* ── Section time filters ──────────────────────────────────────────────── */
.routine-filters {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 2px 0;
}
.routine-filter-label {
  font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px;
}
.routine-filter-sep {
  width: 1px; align-self: stretch; min-height: 16px;
  background: var(--chip-border); margin: 0 2px;
}
.routine-filter-days { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.routine-filter-toggle, .routine-filter-day {
  font: 12px 'DM Sans', sans-serif; cursor: pointer;
  padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--chip-border); background: transparent; color: var(--text2);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.routine-filter-day { padding: 5px 10px; }
.routine-filter-toggle:hover, .routine-filter-day:hover {
  background: var(--chip-hover); color: var(--text1);
}
.routine-filter-toggle.is-active, .routine-filter-day.is-active {
  background: rgba(91,157,255,0.14); color: var(--ink-blue); border-color: rgba(91,157,255,0.38);
}

/* Per-course actions + section legend */
.routine-course-actions { display: flex; align-items: center; gap: 6px; }
.routine-change-btn {
  font: 12px 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap;
  padding: 4px 11px; border-radius: 999px;
  border: 1px solid var(--chip-border); background: transparent; color: var(--text2);
  transition: background 0.15s, color 0.15s;
}
.routine-change-btn:hover { background: var(--chip-hover); color: var(--text1); }
.routine-section-head {
  display: grid; grid-template-columns: 44px 56px 1fr 100px 80px 1fr;
  gap: 10px; padding: 6px 14px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--text3); border-bottom: 1px solid var(--hairline);
}
.routine-section-empty, .routine-section-hidden {
  padding: 10px 14px; font-size: 12px; color: var(--text3);
}
.routine-section-hidden { border-top: 1px solid var(--hairline); font-style: italic; }

/* A section that clashes with the current picks: still pickable, just muted */
.routine-section--candclash { opacity: 0.5; }
.routine-section--candclash:hover { opacity: 0.85; background: rgba(231,76,60,0.05); }

/* Collapsed course summary */
.routine-course-block--collapsed .routine-course-head { border-bottom: none; }
.routine-course-block--clash { border-color: rgba(231,76,60,0.35); }
.routine-collapsed-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.routine-collapsed-pick {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 12px; color: var(--text2);
}
.routine-collapsed-sec   { font-weight: 700; color: var(--text1); }
.routine-collapsed-fac   { font-weight: 600; letter-spacing: 0.3px; }
.routine-collapsed-sched { color: var(--text2); }
/* Room of the picked section — a quiet pill so it reads apart from the
   schedule text it follows. */
.routine-collapsed-room {
  color: var(--text2);
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--badge-bg);
  border: 1px solid var(--chip-border);
}

@media (max-width: 720px) {
  .routine-section-row { grid-template-columns: 1fr; gap: 4px; }
  .routine-section-room, .routine-section-exam { font-size: 10px; }
  .routine-section-head { display: none; }
  .routine-controls { flex-direction: column; align-items: stretch; }
  .routine-controls-right { justify-content: space-between; }
}

/* ─────────────────────────────────────────────────────────────────────────────
 * Routine Builder — weekly grid (PR 4)
 * ─────────────────────────────────────────────────────────────────────────── */
.routine-grid-wrap {
  margin-top: 8px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--card-bg);
  padding: 14px;
  overflow-x: auto;
}
.routine-grid-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 10px;
  letter-spacing: 0.4px;
}
.routine-grid {
  display: grid;
  position: relative;
  min-width: 540px;
  font-family: 'DM Sans', sans-serif;
}
.routine-grid-day-header {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text2);
  text-align: center;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--card-border);
  align-self: end;
}
.routine-grid-time {
  font-size: 10px;
  color: var(--text3);
  text-align: right;
  padding-right: 8px;
  font-variant-numeric: tabular-nums;
  align-self: start;
}
.routine-grid-row {
  border-top: 1px dashed var(--hairline);
}
.routine-grid-row--hour {
  border-top: 1px solid var(--card-border);
}
/* Current-time line across the day columns. Blue, not red — red means clash. */
.routine-grid-now {
  position: relative;
  align-self: start;
  height: 0;
  border-top: 2px solid #5b9dff;
  pointer-events: none;
  z-index: 3;
}
.routine-grid-now::before {
  content: '';
  position: absolute;
  left: -3px;
  top: -4px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #5b9dff;
}
.routine-grid-day-header--today {
  color: #cfe0ff;
  font-weight: 600;
  align-self: stretch;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 3px;
  padding: 0 4px;
  border-bottom: 2px solid rgba(91,157,255,0.65);
  border-radius: 3px;
}
[data-theme="light"] .routine-grid-day-header--today { color: var(--ink-blue); }
/* Every day except today gets a soft dark wash, so the current day reads as the
   bright one with no accent bar of its own; on an off-day with no classes every
   column is washed, so a fully lit grid never fakes a class day. Sits above the blocks (z-index 1)
   to gently shade them, but below the now-line (3); hovering a block lifts it to
   z-index 2, restoring full colour. Pointer-events off so clicks pass through. */
.routine-grid-dim-col {
  background: rgba(6,12,9,0.42);
  pointer-events: none;
  z-index: 1;
}
/* Light theme fades the other days toward the page instead of shading them. */
[data-theme="light"] .routine-grid-dim-col { background: rgba(255,255,255,0.50); }
.routine-grid-block {
  /* Query container for the narrow-block rules at the end of this section
     (#585): what varies is the block's own width — a day column divided by
     however many classes overlap in it — not the viewport. */
  container-type: inline-size;
  margin: 1px 2px;
  border-radius: 6px;
  /* 5px sides, not 6: at a 1280 window the code+room line lands within a few
     px of the block width, and the extra 2px is what keeps a 7-character room
     off the ellipsis. */
  padding: 4px 5px;
  background: hsl(var(--routine-hue, 200), 65%, 22%);
  border-left: 3px solid hsl(var(--routine-hue, 200), 75%, 55%);
  color: hsl(var(--routine-hue, 200), 90%, 92%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  /* `safe` keeps a block whose text outgrows its slot (a narrow split block, a
     short 1h20m class) aligned to the top instead of centering it and clipping
     the course code off both ends. */
  justify-content: safe center;
  min-height: 28px;
  font-size: 10px;
  line-height: 1.2;
  cursor: default;
  transition: transform 0.12s;
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
  /* --sub-x is 0 unless the block is tiled side-by-side (see --split). */
  transform: translateX(var(--sub-x, 0));
}
.routine-grid-block:hover {
  transform: translateX(var(--sub-x, 0)) translateY(-1px);
  z-index: 2;
}
.routine-grid-block:focus-visible {
  outline: 2px solid #5b9dff;
  outline-offset: 1px;
  z-index: 4;
}
.routine-grid-block-clashmark { margin-right: 3px; }
/* Overlapping blocks tiled into N side-by-side sub-columns within one day.
   Width is set inline to 100%/N; border-box + zeroed h-margins make the
   tiles add up exactly, and the colored left accent keeps them readable. */
.routine-grid-block--split {
  box-sizing: border-box;
  justify-self: start;
  margin-left: 0;
  margin-right: 0;
}
.routine-grid-block--clash {
  background: rgba(231, 76, 60, 0.30);
  border-left-color: #e74c3c;
  color: #ffd1cc;
  box-shadow: 0 0 0 1px rgba(231,76,60,0.4);
}
.routine-grid-block-code {
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.4px;
  /* Code then room, read as one phrase: "CSE260 • 10B-13C". This line has the
     width to spare (the code is ~43px of a 98-126px block), which is what lets
     the time keep a line of its own instead of sharing one and truncating. */
  display: flex;
  align-items: baseline;
  min-width: 0;
}
/* The code never shrinks; the room ellipsizes first if a window is narrow
   enough that even this packing overflows. */
.routine-grid-block-codetext {
  flex: 0 0 auto;
  white-space: nowrap;
}
.routine-grid-block-meta {
  font-size: 9px;
  opacity: 0.85;
  letter-spacing: 0.3px;
  /* One line, ellipsized. Wrapping this to two lines is what pushed the time
     off the bottom of a 40px slot; "Section" is shortened to "Sec" for the
     same reason. The folded row below still spells both out in full. */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.routine-grid-block-time {
  font-size: 9px;
  opacity: 0.7;
  font-variant-numeric: tabular-nums;
  /* One line: a wrap here overflows the 40px slot of an ordinary 1h20m class.
     The room leads this line, so a column too narrow for both cuts the time. */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Room, sitting next to the code (see _gridBlockHTML). Smaller and lighter
   than the code so the two read as separate facts, not one string. */
.routine-grid-block-room {
  font-size: 9px;
  font-weight: 600;
  opacity: 0.9;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Separator as a pseudo-element, so the room's own text stays exactly the room
   name for tests, copy/paste and assistive tech. */
.routine-grid-block-room::before {
  content: '\2022';
  margin: 0 4px;
  font-weight: 400;
  opacity: 0.55;
}

/* ── Narrow blocks: degrade the content by width (#585) ────────────────────
   Overlapping classes tile a day column at 1/N. Three of them on a 97px column
   leaves 34px a block — under the 37px a room label needs, and under the course
   code itself, so every line ellipsed and the block truncated to "⚠ C…": it no
   longer said which course it was, which is the one thing it has to say.

   Below the threshold everything but the code and the clash mark is dropped,
   and the code scales with the block instead of ellipsing. The code line pulls
   itself out into the block's own padding (negative margin) to buy back the
   10px that padding costs at this width; `overflow: hidden` clips at the
   padding box, so the text may use it. */
@container (max-width: 74px) {
  .routine-grid-block-room,
  .routine-grid-block-meta,
  .routine-grid-block-timetext { display: none; }
  /* The clash mark keeps its line. It is the block's only non-colour clash
     cue, and a block this narrow is by definition inside a clash. */
  .routine-grid-block-clashmark { margin-right: 0; }
  .routine-grid-block-code {
    /* cqw is 1% of the block's content box, which is 10px narrower than the
       line itself once the negative margins above claim the padding back — so
       0.42 of it is a deliberately conservative fit for a six-character code.
       Capped at the normal 11px, and floored: 6px is small, but a code you
       have to lean in for still tells you which class this is, and an ellipsis
       does not. */
    font-size: clamp(6px, 42cqw, 11px);
    letter-spacing: 0;
    margin-left: -5px;
    margin-right: -5px;
    justify-content: center;
  }
}

@media (max-width: 720px) {
  .routine-grid { min-width: 480px; }
  .routine-grid-block-meta, .routine-grid-block-time { display: none; }
}

/* ── Agenda (mobile) view ──────────────────────────────────────────────────
   A day-by-day list shown instead of the grid on narrow screens. */
.routine-agenda { display: none; }
.routine-agenda-day { margin-top: 14px; }
.routine-agenda-dayname {
  font-size: 12px; font-weight: 700; letter-spacing: 0.6px;
  color: var(--text2); text-transform: uppercase;
  padding-bottom: 6px; margin-bottom: 8px;
  border-bottom: 1px solid var(--card-border);
}
.routine-agenda-dayname--today { color: #5b9dff; }
.routine-agenda-items { display: flex; flex-direction: column; gap: 8px; }
.routine-agenda-item {
  display: flex; gap: 12px; align-items: stretch;
  padding: 8px 10px; border-radius: 8px;
  background: hsl(var(--routine-hue, 200), 45%, 14%);
  border-left: 3px solid hsl(var(--routine-hue, 200), 75%, 55%);
}
.routine-agenda-item--clash {
  background: rgba(231,76,60,0.16);
  border-left-color: #e74c3c;
}
.routine-agenda-time {
  display: flex; flex-direction: column; justify-content: center;
  min-width: 64px; font-size: 11px; font-weight: 700;
  font-variant-numeric: tabular-nums; color: var(--text1);
}
.routine-agenda-time span { font-weight: 400; color: var(--text3); }
.routine-agenda-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.routine-agenda-code { font-size: 13px; font-weight: 700; color: var(--text1); }
.routine-agenda-sec { font-weight: 600; color: var(--text2); }
.routine-agenda-meta { font-size: 11px; color: var(--text2); letter-spacing: 0.2px; }

@media (max-width: 720px) {
  .routine-grid-wrap { display: none; }
  .routine-agenda { display: block; }
}

/* ─────────────────────────────────────────────────────────────────────────────
 * Routine Builder — faculty rating badges (PR 5)
 * ─────────────────────────────────────────────────────────────────────────── */
.routine-faculty-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 999px;
  letter-spacing: 0.3px;
  vertical-align: 1px;
  margin-left: 5px;
}
.routine-faculty-badge--excellent  { background: rgba(46,204,113,0.16); color: #2ecc71; }
.routine-faculty-badge--good       { background: rgba(46,204,113,0.10); color: #82e0aa; }
.routine-faculty-badge--mid        { background: rgba(241,196,15,0.12); color: #f1c40f; }
.routine-faculty-badge--warn       { background: rgba(230,126,34,0.14); color: #e67e22; }
.routine-faculty-badge--bad        { background: rgba(231,76,60,0.14);  color: #e74c3c; }
.routine-faculty-badge--low-sample { background: var(--badge-bg); color: var(--text3); font-style: italic; }

/* In-grid rating badge keeps the same colors but compresses padding */
.routine-grid-block-rating {
  display: inline-flex;
  align-items: center;
  font-size: 9px;
  font-weight: 700;
  padding: 0 4px;
  border-radius: 4px;
  margin-left: 3px;
  letter-spacing: 0.2px;
}

/* ─────────────────────────────────────────────────────────────────────────────
 * Routine Builder — auto-suggest panel (PR 6)
 * ─────────────────────────────────────────────────────────────────────────── */
.routine-suggest-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 6px;
  padding: 8px 12px;
  background: var(--card-bg);
  border: 1px dashed var(--chip-border);
  border-radius: 10px;
}
.routine-suggest-hint {
  font-size: 11px; color: var(--text3); letter-spacing: 0.3px;
}

.routine-suggest-panel {
  border: 1px solid rgba(46,204,113,0.20);
  background: rgba(46,204,113,0.03);
  border-radius: 12px;
  padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.routine-suggest-panel-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.routine-suggest-panel-head h4 {
  margin: 0; flex: 1; font-size: 14px;
}
.routine-suggest-meta {
  font-size: 11px; color: var(--text3); letter-spacing: 0.2px;
}
.routine-suggest-warn {
  font-size: 11px; color: #f1c40f;
}
.routine-suggest-empty {
  font-size: 12px; color: var(--text2);
  padding: 14px 0;
}

.routine-suggest-cards {
  display: grid; gap: 10px;
  grid-template-columns: 1fr;
}
@media (min-width: 900px) {
  .routine-suggest-cards { grid-template-columns: 1fr 1fr; }
}

.routine-suggest-card {
  border: 1px solid var(--card-border);
  background: var(--card-bg-2);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.routine-suggest-card-head {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  font-size: 11px;
}
.routine-suggest-card-rank {
  font-weight: 700; color: var(--green); letter-spacing: 0.4px;
}
.routine-suggest-card-score {
  color: var(--text3); font-variant-numeric: tabular-nums;
}
.routine-suggest-card-seats {
  font-size: 10px; color: var(--text3);
}
.routine-suggest-card-warn {
  font-size: 10px; font-weight: 600; color: #e74c3c;
  background: rgba(231,76,60,0.10);
  padding: 1px 6px; border-radius: 4px;
}
.routine-suggest-card-gap {
  font-size: 10px; font-weight: 600; color: #f1c40f;
  background: rgba(241,196,15,0.10);
  padding: 1px 6px; border-radius: 4px;
}
.routine-suggest-card-gap.is-compact {
  color: #2ecc71; background: rgba(46,204,113,0.10);
}
.routine-suggest-card-list {
  display: flex; flex-direction: column; gap: 3px;
  padding: 4px 0;
}
.routine-suggest-line {
  display: grid;
  grid-template-columns: 70px 36px 50px 1fr;
  gap: 8px; align-items: center;
  font-size: 11px;
  padding: 4px 6px;
  background: var(--card-bg);
  border-radius: 5px;
}
.routine-suggest-line-code { font-weight: 700; color: var(--green); letter-spacing: 0.3px; }
.routine-suggest-line-sec  { color: var(--text2); }
.routine-suggest-line-fac  { color: var(--text2); font-weight: 600; letter-spacing: 0.3px; }
.routine-suggest-line-sched{ color: var(--text1); font-size: 10px; }
.routine-suggest-card-actions { display: flex; justify-content: flex-end; }

/* Routine Builder — Import-from-Planner note (PR: planner cross-reference) */
.routine-plan-note {
  font-size: 11px;
  color: var(--text2);
  background: rgba(46,204,113,0.06);
  border: 1px solid rgba(46,204,113,0.16);
  border-radius: 8px;
  padding: 6px 10px;
  margin-top: 6px;
}

/* Routine Builder — grid header row with export button (PR: PNG export) */
.routine-grid-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.routine-grid-head .routine-grid-title { margin-bottom: 0; }

/* ═════════════════════════════════════════════════════════════════════════
 * Free Rooms tab
 * ═══════════════════════════════════════════════════════════════════════ */
.freerooms-tab { display: flex; flex-direction: column; gap: 14px; padding: 4px 0; }
.freerooms-controls {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.freerooms-days { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.freerooms-day {
  font: 12px 'DM Sans', sans-serif; cursor: pointer;
  padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--chip-border); background: transparent; color: var(--text2);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.freerooms-day:hover { background: var(--chip-hover); color: var(--text1); }
.freerooms-day.is-active {
  background: rgba(91,157,255,0.14); color: var(--ink-blue); border-color: rgba(91,157,255,0.38);
}
.freerooms-time-wrap { display: inline-flex; align-items: center; gap: 8px; }
.freerooms-time-label { font-size: 12px; color: var(--text3); }

.freerooms-controls--view { gap: 14px; }
.freerooms-view { display: inline-flex; border-radius: 999px; border: 1px solid var(--chip-border); overflow: hidden; }
.freerooms-view-btn {
  font: 12px 'DM Sans', sans-serif; cursor: pointer; padding: 5px 14px;
  border: none; background: transparent; color: var(--text2);
  transition: background 0.15s, color 0.15s;
}
.freerooms-view-btn:hover { background: var(--chip-hover); color: var(--text1); }
.freerooms-view-btn.is-active { background: rgba(91,157,255,0.16); color: var(--ink-blue); }
.freerooms-types { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.freerooms-type {
  font: 12px 'DM Sans', sans-serif; cursor: pointer; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--chip-border); background: transparent; color: var(--text3);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.freerooms-type:hover { background: var(--chip-hover); color: var(--text1); }
.freerooms-type.is-active { background: var(--glass2); color: var(--text1); border-color: var(--chip-border); }
.freerooms-time {
  background: var(--glass);
  border: 1px solid var(--chip-border);
  color: var(--text1); border-radius: 8px; padding: 6px 10px;
  font: 13px 'DM Sans', sans-serif;
}
.freerooms-time:focus { outline: none; border-color: var(--green); }

.freerooms-summary { font-size: 13px; font-weight: 600; color: var(--text2); letter-spacing: 0.3px; }
.freerooms-empty { padding: 18px 0; color: var(--text3); font-size: 13px; }

/* Shown when the loaded timetable is not the semester in effect (#633). Free
   Rooms is the one place that answers a question about *now* — "is this room
   free at 2:30" — so an out-of-term timetable makes it confidently wrong rather
   than merely empty. Amber, not red: the data is fine, it is about a different
   semester. */
.freerooms-outofterm {
  margin: 0;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text2);
  background: rgba(241,196,15,0.10);
  border: 1px solid rgba(241,196,15,0.28);
}
.freerooms-grid {
  display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.freerooms-card {
  display: flex; flex-direction: column; gap: 2px; text-align: left;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  background: var(--card-bg-2); border: 1px solid var(--card-border);
  color: var(--text1); transition: background 0.15s, border-color 0.15s;
}
.freerooms-card:hover { background: var(--card-hover); }
/* Status accents: a left edge keeps the grid calm while signalling state. */
.freerooms-card.is-free  { border-left: 3px solid rgba(63,185,80,0.7); }
.freerooms-card.is-class { border-left: 3px solid rgba(210,153,34,0.8); }
.freerooms-card.is-lab   { border-left: 3px solid rgba(163,113,247,0.8); }
.freerooms-card-room {
  font-weight: 700; letter-spacing: 0.3px; font-size: 13px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
}
.freerooms-card-type {
  font-size: 9px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase;
  color: var(--text3); padding: 1px 5px; border-radius: 4px; background: var(--badge-bg);
}
.freerooms-card-until { font-size: 11px; }
.freerooms-card.is-free  .freerooms-card-until { color: #3fb950; }
.freerooms-card.is-class .freerooms-card-until { color: #d29922; }
.freerooms-card.is-lab   .freerooms-card-until { color: #a371f7; }

.freerooms-week { display: flex; flex-direction: column; gap: 4px; }
.freerooms-day-row {
  display: grid; grid-template-columns: 38px 1fr; gap: 10px;
  padding: 6px 8px; border-radius: 8px;
}
.freerooms-day-row.is-active { background: rgba(91,157,255,0.10); }
.freerooms-day-name { font-size: 12px; font-weight: 700; color: var(--text2); padding-top: 1px; }
.freerooms-day-segs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.freerooms-seg {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  font-size: 12px; font-variant-numeric: tabular-nums;
}
.freerooms-seg-label { font-size: 11px; font-weight: 600; }
.freerooms-seg--free .freerooms-seg-time { color: var(--text1); }
.freerooms-seg--free .freerooms-seg-label { color: #5b9dff; }
.freerooms-seg--busy, .freerooms-seg--lab { opacity: 0.7; }
.freerooms-seg--busy .freerooms-seg-time, .freerooms-seg--lab .freerooms-seg-time { color: var(--text2); }
.freerooms-seg--busy .freerooms-seg-label { color: var(--text3); font-weight: 500; }
.freerooms-seg--lab .freerooms-seg-label { color: #a371f7; font-weight: 500; }
.freerooms-seg--none { color: var(--text3); }

/* ── Generic content modal (js/ui/modal.js) ─────────────────────────────── */
.app-modal-backdrop {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.72);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.app-modal {
  background: var(--bg-elev, #1a1c20); color: inherit;
  border-radius: 14px; border: 1px solid var(--card-border);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  width: min(540px, 100%); max-height: min(82vh, 100%);
  display: flex; flex-direction: column; overflow: hidden;
}
.app-modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
}
.app-modal-title { font-size: 13px; font-weight: 700; color: var(--text1); letter-spacing: 0.3px; }
.app-modal-close {
  background: transparent; border: 0; color: inherit; cursor: pointer;
  font-size: 1.6rem; line-height: 1; padding: 0 6px; opacity: 0.7;
}
.app-modal-close:hover { opacity: 1; }
.app-modal-body { padding: 14px 16px; overflow-y: auto; }
[data-theme="light"] .app-modal { background: #fff; }
[data-theme="light"] .app-modal-head { border-bottom-color: rgba(0,0,0,0.08); }

@media (max-width: 720px) {
  .freerooms-controls { flex-direction: column; align-items: stretch; gap: 10px; }
}

/* ── Seat Status tab ─────────────────────────────────────────────────────── */
.seats-tab { display: flex; flex-direction: column; gap: 14px; padding: 4px 0; }

.seats-header {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
}
.seats-header h3 { margin: 0 8px 0 0; display: inline-block; font-size: 18px; }
.seats-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seats-header-right { display: flex; align-items: center; gap: 6px; }

.seats-source-badge {
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: var(--badge-bg); color: var(--text2);
  border: 1px solid var(--chip-border);
}
.seats-source--live     { background: rgba(46,204,113,0.12); color: #2ecc71; border-color: rgba(46,204,113,0.28); }
.seats-source--cache    { background: rgba(241,196,15,0.10); color: #f1c40f; border-color: rgba(241,196,15,0.24); }
.seats-source--fallback { background: rgba(231,76,60,0.10);  color: #e74c3c; border-color: rgba(231,76,60,0.24); }

.seats-error { text-align: center; padding: 36px 18px; color: var(--text2); }
.seats-error h3 { color: #e74c3c; margin: 0 0 6px; }

/* Skeleton loading state — shimmer placeholders shaped like the real layout. */
.seats-skeleton { display: flex; flex-direction: column; gap: 12px; padding: 4px 0; }
.ssk {
  border-radius: 8px;
  background: linear-gradient(90deg,
    var(--skel-lo) 25%,
    var(--skel-hi) 37%,
    var(--skel-lo) 63%);
  background-size: 400% 100%;
  animation: rsk-shimmer 1.4s ease infinite;
}
.ssk-header { height: 26px; width: 200px; }
.ssk-search { height: 42px; width: 100%; }
.ssk-row    { height: 64px; width: 100%; }
.seats-loading-note { text-align: center; color: var(--text3); font-size: 12px; margin-top: 10px; }

.seats-searchbar { position: relative; display: flex; align-items: center; }
.seats-search-icon {
  position: absolute; left: 14px; font-size: 13px;
  opacity: 0.5; pointer-events: none;
}
.seats-search-input {
  flex: 1; min-width: 200px;
  background: var(--glass);
  border: 1px solid var(--chip-border);
  color: var(--text1);
  border-radius: 10px;
  padding: 11px 14px 11px 38px;
  font: 13px 'DM Sans', sans-serif;
  letter-spacing: 0.5px;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.seats-search-input::placeholder { color: var(--text3); }
.seats-search-input:focus {
  outline: none; border-color: var(--green); background: var(--glass2);
  box-shadow: 0 0 0 3px var(--green-glow);
}

.seats-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.seats-sort { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.seats-sort-label { font-size: 12px; color: var(--text3); }
.seats-chip {
  font: 12px 'DM Sans', sans-serif; cursor: pointer;
  padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--chip-border); background: transparent; color: var(--text2);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.seats-chip:hover { background: var(--chip-hover); color: var(--text1); }
.seats-chip.is-active { background: rgba(46,204,113,0.12); color: var(--ink-green); border-color: rgba(46,204,113,0.38); }
.seats-chip--filter.is-active { background: rgba(46,204,113,0.12); color: var(--ink-green); border-color: rgba(46,204,113,0.38); }

.seats-results { display: flex; flex-direction: column; gap: 12px; }

/* Friendly empty state — centered, with data-driven quick-pick chips. */
.seats-empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 6px; padding: 40px 18px 34px; color: var(--text3);
}
.seats-empty-icon { font-size: 34px; line-height: 1; opacity: 0.85; margin-bottom: 4px; }
.seats-empty-title { font-size: 16px; font-weight: 700; color: var(--text1); }
.seats-empty-sub { font-size: 13px; color: var(--text2); max-width: 360px; line-height: 1.5; }
.seats-quickpicks { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
.seats-quickpick { font-weight: 700; letter-spacing: 0.4px; color: var(--text2); }
.seats-quickpick:hover { border-color: rgba(46,204,113,0.38); color: var(--green); }

.seats-trimmed-note { color: var(--text3); font-size: 12px; padding: 2px 2px 6px; }

.seats-course {
  border: 1px solid var(--card-border); border-radius: 12px;
  background: var(--card-bg); overflow: hidden;
}
.seats-course-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--card-bg-2);
  border-bottom: 1px solid var(--hairline);
}
.seats-course-code { font-weight: 700; color: var(--green); letter-spacing: 0.4px; }
.seats-course-name { color: var(--text2); font-size: 13px; }
.seats-course-summary { margin-left: auto; color: var(--text3); font-size: 11px; font-weight: 600; }

.seats-section-list { display: flex; flex-direction: column; }
.seats-section-row {
  display: grid;
  grid-template-columns: 30px 44px 56px 1fr 100px 80px;
  gap: 10px; align-items: center;
  text-align: left; padding: 10px 14px;
  border-top: 1px solid var(--hairline);
  color: var(--text1);
  font: 12px 'DM Sans', sans-serif;
  transition: background 0.15s ease;
}
.seats-section-row:hover { background: var(--chip-hover); }
.seats-section-name { font-weight: 700; }
.seats-section-faculty { color: var(--text2); letter-spacing: 0.4px; font-weight: 600; }
.seats-section-schedule { color: var(--text1); }
.seats-section-room { color: var(--text3); font-size: 11px; }
.seats-section-seats { font-weight: 700; padding: 2px 8px; border-radius: 999px; font-size: 11px; text-align: center; }
.seats-seats--open  { background: rgba(46,204,113,0.10); color: #2ecc71; }
.seats-seats--tight { background: rgba(241,196,15,0.10); color: #f1c40f; }
.seats-seats--full  { background: rgba(231,76,60,0.10);  color: #e74c3c; }

/* Per-row watch toggle (bell). Dim until armed, blue-tinted once watching. */
.seats-watch-btn {
  background: none; border: none; cursor: pointer;
  padding: 2px; line-height: 1; font-size: 15px;
  opacity: 0.4; filter: grayscale(0.6);
  transition: opacity 0.15s ease, transform 0.1s ease;
}
.seats-watch-btn:hover { opacity: 0.85; transform: scale(1.1); }
.seats-watch-btn.is-watched {
  opacity: 1; filter: none;
  animation: seats-bell-pop 0.3s ease;
}
@keyframes seats-bell-pop {
  0% { transform: scale(0.7); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) { .seats-watch-btn.is-watched { animation: none; } }

/* "Watching (N)" panel above the search box. Amber tint reads as an alert/bell
   channel and keeps the tab inside Shohoj's green-and-gold palette. */
.seats-watch-panel {
  margin: 12px 0 4px;
  padding: 12px 14px;
  border: 1px solid rgba(241,196,15,0.30);
  background: rgba(241,196,15,0.06);
  border-radius: 12px;
}
.seats-watch-head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin-bottom: 8px;
}
.seats-watch-head h4 { margin: 0; font-size: 13px; color: var(--text1); }
.seats-watch-note { color: var(--text3); font-size: 11px; }
/* The email-channel line sits on its own row under the notification note. */
.seats-watch-note--email { flex-basis: 100%; color: var(--text2); }
.seats-watch-list { display: flex; flex-direction: column; gap: 6px; }
.seats-watch-row {
  display: grid; grid-template-columns: 1fr 64px 24px;
  gap: 10px; align-items: center;
  font: 12px 'DM Sans', sans-serif; color: var(--text1);
}
.seats-watch-label { font-weight: 600; }
.seats-watch-status {
  font-weight: 700; font-size: 11px; text-align: center;
  padding: 2px 8px; border-radius: 999px;
}
.seats-watch-status--unknown { background: var(--chip-hover); color: var(--text3); }
.seats-watch-remove {
  background: none; border: none; cursor: pointer;
  color: var(--text3); font-size: 13px; line-height: 1; padding: 2px;
  transition: color 0.15s ease;
}
.seats-watch-remove:hover { color: #e74c3c; }

@media (max-width: 720px) {
  .seats-section-row { grid-template-columns: auto 1fr auto; gap: 4px 10px; }
  .seats-watch-btn { grid-row: 1; grid-column: 1; }
  .seats-section-name { grid-column: 2; }
  .seats-section-seats { grid-column: 3; }
  .seats-section-faculty { grid-column: 2 / -1; }
  .seats-section-schedule, .seats-section-room { grid-column: 1 / -1; }
}

/* ═══ Profile tab (#196) ═══ */
.pf-empty {
  padding: 40px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.pf-empty-icon { font-size: 32px; opacity: 0.8; margin-bottom: 4px; }
.pf-empty-title { font-size: 14px; font-weight: 700; color: var(--text); }
.pf-empty-sub {
  font-size: 12px;
  color: var(--text2);
  max-width: 320px;
  line-height: 1.5;
  margin-bottom: 8px;
}
.pf-signin-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  border-radius: 8px;
  background: var(--accent);
  border: 1px solid var(--accent);
  color: #06140b;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: filter 0.2s;
}
.pf-signin-btn:hover { filter: brightness(1.08); }
.pf-signin-icon { font-size: 15px; }

.pf-hub { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.pf-header {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  background:
    radial-gradient(120% 150% at 0% 0%, rgba(46,204,113,0.16), transparent 58%),
    linear-gradient(180deg, rgba(46,204,113,0.06), rgba(255,255,255,0.015));
}
.pf-avatar { position: relative; flex-shrink: 0; }
.pf-avatar-img,
.pf-avatar-fallback {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: block;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgba(46,204,113,0.45), 0 6px 18px rgba(0,0,0,0.35);
}
.pf-avatar-img { object-fit: cover; }
.pf-avatar-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(150deg, var(--accent), #1f8f4e);
  color: #06140b;
  font-size: 24px;
  font-weight: 800;
}
.pf-identity { flex: 1; min-width: 0; }
.pf-name {
  font-family: 'Syne', sans-serif;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pf-email {
  font-size: 12px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pf-signout-btn {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.pf-signout-btn:hover { border-color: var(--border); color: var(--text); }

.pf-sections { display: flex; flex-direction: column; gap: 12px; }

/* Profile cards (academic, seat alerts, routine, reviews) */
.pf-card {
  position: relative;
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.022), rgba(255,255,255,0));
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
}
.pf-card:hover {
  border-color: var(--border);
  transform: translateY(-1px);
  box-shadow: 0 10px 28px rgba(0,0,0,0.28);
}
.pf-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pf-card-title {
  margin: 0;
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}
.pf-card-count {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(46,204,113,0.12);
  border: 1px solid var(--border);
}

/* Email-alert switch */
.pf-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
}
.pf-toggle-track {
  flex-shrink: 0;
  width: 38px;
  height: 22px;
  border-radius: 999px;
  background: var(--border2);
  position: relative;
  transition: background 0.2s;
}
.pf-toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}
.pf-toggle.is-on .pf-toggle-track { background: var(--accent); }
.pf-toggle.is-on .pf-toggle-thumb { transform: translateX(16px); }
.pf-toggle-text { font-size: 12px; color: var(--text); line-height: 1.4; }
.pf-toggle-off { color: var(--text2); font-style: italic; }

/* Watchlist */
.pf-watch-empty {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
  padding: 4px 0;
}
.pf-watch-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pf-watch-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--border);
}
.pf-watch-code { font-size: 13px; font-weight: 700; color: var(--text); }
.pf-watch-sec { font-size: 12px; color: var(--text2); }

/* Routine / planner course chips */
.pf-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pf-chip {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--border);
}
.pf-chip-plan { background: transparent; border: 1px solid var(--border2); color: var(--text2); }
.pf-subhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  padding-top: 2px;
}
.pf-note { font-size: 11px; color: var(--text2); line-height: 1.5; }

/* Academic-profile card: CGPA gauge + mini stats, identity list, term timeline */
.pf-acard-top {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.pf-gauge {
  --pf-pct: 0;
  --pf-color: var(--accent);
  position: relative;
  width: 100px;
  height: 100px;
  flex-shrink: 0;
  border-radius: 50%;
  background: conic-gradient(var(--pf-color) calc(var(--pf-pct) * 1%), var(--border2) 0);
}
.pf-gauge::after {
  content: '';
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  background: var(--bg);
}
.pf-gauge-core {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.pf-gauge-num {
  font-family: 'Syne', sans-serif;
  font-size: 25px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}
.pf-gauge-cap { font-size: 10px; color: var(--text3); margin-top: 3px; letter-spacing: 0.5px; }
.pf-gauge--high { --pf-color: #2ECC71; }
.pf-gauge--good { --pf-color: #6dd36d; }
.pf-gauge--mid  { --pf-color: #e6b800; }
.pf-gauge--low  { --pf-color: #e67e22; }
.pf-gauge--na   { --pf-color: var(--border2); }

.pf-minis { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 140px; }
.pf-mini {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(46,204,113,0.045);
}
.pf-mini-num { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--text); }
.pf-mini-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); }

.pf-details {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border2);
  border-radius: 10px;
  overflow: hidden;
}
.pf-detail-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  font-size: 13px;
  border-bottom: 1px solid var(--border2);
}
.pf-detail-row:last-child { border-bottom: none; }
.pf-detail-key { color: var(--text3); flex: 0 0 auto; }
.pf-detail-val { color: var(--text); font-weight: 600; text-align: right; word-break: break-word; }

/* Semester history timeline — relative course-load bars per term */
.pf-timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pf-tl-item {
  display: grid;
  grid-template-columns: 10px 96px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
}
.pf-tl-item + .pf-tl-item { border-top: 1px solid var(--border2); }
.pf-tl-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(46,204,113,0.16);
}
.pf-tl-name { font-size: 13px; font-weight: 700; color: var(--text); }
.pf-tl-bar { height: 6px; border-radius: 999px; background: var(--border2); overflow: hidden; }
.pf-tl-fill {
  display: block;
  height: 100%;
  width: calc(var(--pf-w) * 1%);
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), #6dd36d);
}
/* Semester GPA bands — the same scale the CGPA gauge is coloured by, so a
   3.6 term and a 3.6 CGPA read as the same green. */
.pf-tl-dot--high, .pf-tl-fill--high { --pf-tone: #2ecc71; }
.pf-tl-dot--good, .pf-tl-fill--good { --pf-tone: #6dd36d; }
.pf-tl-dot--mid,  .pf-tl-fill--mid  { --pf-tone: #e6b800; }
.pf-tl-dot--low,  .pf-tl-fill--low  { --pf-tone: #e67e22; }
.pf-tl-dot--na,   .pf-tl-fill--na   { --pf-tone: var(--border2); }
.pf-tl-dot[class*='pf-tl-dot--'] { background: var(--pf-tone); box-shadow: none; }
.pf-tl-fill[class*='pf-tl-fill--'] { background: var(--pf-tone); }
/* Tabular figures so the GPA column stacks into a readable line. */
.pf-tl-count {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  min-width: 34px;
  text-align: right;
}
/* A semester with nothing graded is a state, not a zero — say so in words. */
.pf-tl-na { font-weight: 600; color: var(--text3); }

/* Trend chip: direction of the last graded term, in place of the CGPA the
   gauge below already states. */
.pf-trend { font-variant-numeric: tabular-nums; }
.pf-trend--up { color: var(--ink-green); }
.pf-trend--down { color: var(--ink-amber); background: rgba(241,196,15,0.12); border-color: rgba(241,196,15,0.32); }
.pf-trend--flat { color: var(--text2); }

/* Last-synced line in the account header */
.pf-synced { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* Dedicated /profile/ page shell (mirrors the standalone admin page layout) */
.pf-page {
  position: relative;
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 64px;
}
.pf-page::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(80% 50% at 50% 0%, rgba(46,204,113,0.10), transparent 70%);
}
.pf-page-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
}
.pf-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  text-decoration: none;
  padding: 7px 12px;
  border: 1px solid var(--border2);
  border-radius: 999px;
  transition: border-color 0.2s, color 0.2s;
}
.pf-back:hover { color: var(--green); border-color: var(--border); }
.pf-page-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text);
}

/* Danger zone */
.pf-danger { border-color: rgba(231,76,60,0.4); }
.pf-danger .pf-card-title { color: #e74c3c; }
.pf-danger-body { font-size: 12px; color: var(--text2); line-height: 1.5; }
.pf-danger-btn {
  align-self: flex-start;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: #e74c3c;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid rgba(231,76,60,0.5);
  background: rgba(231,76,60,0.06);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.pf-danger-btn:hover { background: rgba(231,76,60,0.12); border-color: rgba(231,76,60,0.8); }

/* ═══ Profile — "This semester" briefing (#476) ═══ */
.pf-briefing { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

.pfb-zone { display: flex; align-items: center; gap: 12px; margin: 4px 2px 2px; }
.pfb-zone h2 {
  margin: 0;
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text3);
  white-space: nowrap;
}
.pfb-zone::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }
.pfb-zone-sub { font-size: 12px; color: var(--text3); white-space: nowrap; }

.pfb-card {
  position: relative;
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.022), rgba(255,255,255,0));
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
}
.pfb-card:hover {
  border-color: var(--border);
  transform: translateY(-1px);
  box-shadow: 0 10px 28px rgba(0,0,0,0.28);
}
.pfb-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pfb-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0;
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}
.pfb-ico {
  width: 26px;
  height: 26px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 13px;
  background: rgba(46,204,113,0.12);
  border: 1px solid var(--border);
}

/* The verdict line — the reason the card exists. */
.pfb-verdict {
  margin: 0;
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: -0.01em;
  color: var(--text);
}
.pfb-verdict em { font-style: normal; color: var(--ink-amber); }
.pfb-verdict b { color: var(--ink-green); font-weight: 700; }
.pfb-verdict .hot { color: #e74c3c; }

.pfb-chip {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 11px;
  border-radius: 999px;
  color: var(--ink-green);
  background: rgba(46,204,113,0.12);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.pfb-chip.warn { color: var(--ink-amber); background: rgba(241,196,15,0.12); border-color: rgba(241,196,15,0.32); }
.pfb-chip.hot  { color: #e74c3c; background: rgba(231,76,60,0.12); border-color: rgba(231,76,60,0.35); }
.pfb-chip.cool { color: var(--ink-blue); background: rgba(91,157,255,0.12); border-color: rgba(91,157,255,0.3); }
/* An exam already sat: neutral on purpose — it is a record, not a warning. */
.pfb-chip.done { color: var(--text3); background: transparent; border-color: var(--hairline); font-weight: 600; }

.pfb-note { font-size: 11px; color: var(--text3); line-height: 1.55; }
.pfb-empty { font-size: 12px; color: var(--text2); line-height: 1.55; padding: 4px 0; }
.pfb-subhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--hairline);
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
}
.pfb-cta {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 17px;
  border-radius: 999px;
  background: var(--accent);
  border: 1px solid var(--accent);
  color: #06140b;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  transition: filter 0.2s;
}
.pfb-cta:hover { filter: brightness(1.08); }

/* Midterms ⇄ Finals segmented switch */
.pfb-toggle { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid var(--border2); border-radius: 999px; }
.pfb-seg {
  padding: 5px 13px;
  border-radius: 999px;
  border: none;
  background: transparent;
  color: var(--text3);
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.pfb-seg:hover { color: var(--text); }
.pfb-seg.is-on { background: rgba(46,204,113,0.14); color: var(--ink-green); }

/* ── Next registration / unlock map (#478) ──────────────────────────────── */
.umc-list {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
}
.umc-row {
  display: flex;
