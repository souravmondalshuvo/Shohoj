<!doctype html>
<!-- GitHub Pages custom 404 (#460 cutover).

     The React shell is the site now, served at the base /Shohoj/. GitHub Pages
     has no SPA fallback, so any /Shohoj/<route> with no matching file 404s here;
     we redirect it to /Shohoj/?/<route> ('&' escaped as ~and~ so the original
     query survives), and the shell's index.html decodes that back into the
     pathname before the router boots (spa-github-pages pattern).

     Two path trees are STATIC and must never be hijacked into the shell — a
     genuine 404 under them falls through to the not-found body below:
       - /Shohoj/admin/   the standalone moderation dashboard (admin.html)
       - /Shohoj/legacy/  the recoverable vanilla site + its public pages
     The retired /Shohoj/app/<route> beta links are rewritten to /Shohoj/<route>
     so old bookmarks land on the equivalent shell route.

     Served from the site root, so the deploy job copies this file to
     _deploy/404.html verbatim. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Shohoj — page not found</title>
    <script>
      (function (l) {
        var base = '/Shohoj/';
        var p = l.pathname;
        // Outside the app entirely — leave it as a plain not-found.
        if (p.indexOf(base) !== 0) return;
        var rest = p.slice(base.length);
        // Static trees own their own files; a miss here is a real 404.
        if (rest.indexOf('admin/') === 0 || rest.indexOf('legacy/') === 0) return;
        // Retired beta: drop the /app/ prefix so bookmarks map to a shell route.
        if (rest.indexOf('app/') === 0) rest = rest.slice('app/'.length);
        var route = rest.replace(/&/g, '~and~');
        l.replace(
          base + '?/' + route
            + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '')
            + l.hash
        );
      })(window.location);
    </script>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #071a0f;
        color: #d8eee0;
        font-family: 'DM Sans', system-ui, sans-serif;
        text-align: center;
      }
      main { padding: 2rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.25rem; color: #9dbfa9; }
      a {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border-radius: 999px;
        background: #2ecc71;
        color: #071a0f;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The page you were looking for doesn't exist.</p>
      <a href="/Shohoj/">Back to Shohoj</a>
    </main>
  </body>
</html>
