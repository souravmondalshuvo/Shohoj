<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bus Routes &amp; Timings — Shohoj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Standalone bus-timetable page (#372): the shell's BusRoute published
         at /bus/ ahead of the full cutover. Styles are the bus slice of
         app/index.html plus the shell primitives the route renders — keep the
         two in sync until the cutover retires this page. */
      /* Shohoj brand layer (light theme) — matches the shell's app/index.html so
         this standalone page reads as the real app. Keep in sync with it. */
      :root {
        --green: #2ECC71; --gold: #F0A500; --bg: #d4edde;
        --glass2: rgba(255,255,255,0.75); --border: rgba(46,204,113,0.25);
        --text: #0d2914; --text2: #3a6b47;
        --shadow-card: 0 20px 60px rgba(46,204,113,0.10), inset 0 1px 0 rgba(255,255,255,0.9);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: 'DM Sans', system-ui, sans-serif; color: var(--text);
        background: var(--bg); min-height: 100vh; position: relative; overflow-x: hidden;
      }
      body::before, body::after {
        content: ''; position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
      }
      body::before {
        width: min(520px,90vw); height: min(520px,90vw); top: -140px; left: -120px;
        background: radial-gradient(circle, rgba(46,204,113,0.30) 0%, transparent 70%);
      }
      body::after {
        width: min(400px,80vw); height: min(400px,80vw); bottom: 5%; right: -100px;
        background: radial-gradient(circle, rgba(100,200,140,0.25) 0%, transparent 70%);
      }
      h1, h2, h3 { font-family: 'Syne','DM Sans',sans-serif; letter-spacing: -0.02em; }
      .campus-topbar {
        position: sticky; top: 0; z-index: 20; padding: 12px 16px; border-bottom: 1px solid var(--border);
        background: rgba(212,237,222,0.75); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      }
      .pg-brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; }
      .pg-brand-mark {
        width: 32px; height: 32px; flex-shrink: 0; background: var(--green); border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Syne',sans-serif; font-weight: 800; font-size: 15px; color: #0b0f0d; letter-spacing: -0.5px;
      }
      .pg-brand:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 8px; }
      .pg-brand-text { font-family: 'Syne',sans-serif; font-weight: 700; font-size: 17px; color: var(--text); }
      .pg-brand-text span { color: var(--green); }
      .shell-page {
        margin: 20px auto; padding: 24px; max-width: 720px; background: var(--glass2);
        border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-card);
      }
      .shell-muted { color: var(--text2); }
      .bus-page { max-width: 860px; }
      .bus-effective { margin: 0 0 10px; padding: 10px 14px; border: 1px solid rgba(86,180,233,0.35); border-radius: 10px; background: rgba(86,180,233,0.08); color: #23445c; font-size: 12px; line-height: 1.6; }
      .bus-today { font-size: 13px; font-weight: 600; color: #1c7c45; margin: 0 0 12px; }
      .bus-routes { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
      .bus-route-btn {
        font: inherit; font-size: 12px; font-weight: 600; padding: 8px 12px; min-height: 44px;
        border-radius: 6px; cursor: pointer; border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #2d5a3d;
        display: inline-flex; align-items: center; gap: 6px;
      }
      .bus-route-btn--active { border-color: rgba(46,204,113,0.45); background: rgba(46,204,113,0.12); color: #1c7c45; }
      .bus-route-btn:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }
      .bus-route-no { font-size: 9px; font-weight: 700; background: rgba(0,0,0,0.06); border-radius: 4px; padding: 2px 5px; }
      .bus-detail { border: 1px solid rgba(46,204,113,0.25); background: rgba(46,204,113,0.04); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
      .bus-detail-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; justify-content: space-between; }
      .bus-detail-head h2 { font-size: 15px; margin: 0 0 10px; }
      .bus-fare { font-size: 12px; font-weight: 700; color: #1c7c45; white-space: nowrap; }
      .bus-table-scroll { overflow-x: auto; }
      .bus-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .bus-table th, .bus-table td { padding: 7px 10px; border-bottom: 1px solid rgba(0,0,0,0.08); text-align: left; }
      .bus-table thead th { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(0,0,0,0.45); }
      .bus-table tbody th { font-weight: 500; color: #0d2914; }
      .bus-table td { white-space: nowrap; color: #2d5a3d; font-weight: 600; }
      .bus-table tr:last-child th, .bus-table tr:last-child td { border-bottom: none; font-weight: 700; color: #1c7c45; }
      .bus-stop--next th, .bus-stop--next td { background: rgba(46,204,113,0.10); }
      .bus-outbound h3 { font-size: 11px; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 1px; color: rgba(0,0,0,0.45); }
      .bus-outbound p { margin: 0; font-size: 13px; color: #0d2914; }
      .bus-attendant { margin: 10px 0 0; font-size: 13px; color: #2d5a3d; }
      .bus-attendant a { color: #1c7c45; font-weight: 600; }
      .bus-fare-note { font-size: 12px; color: #2d5a3d; }
      .bus-extra { margin-top: 10px; font-size: 13px; color: #2d5a3d; }
      .bus-extra summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
      .bus-extra ul { margin: 6px 0 0; padding-left: 20px; line-height: 1.7; }
      .bus-extra a { color: #1c7c45; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
    <script type="module" crossorigin src="../assets/bus-Da4x_5hS.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/preload-helper-HclGiUj8.js">
    <link rel="modulepreload" crossorigin href="../assets/jsx-runtime-CrLzfYuc.js">
  </head>
  <body>
    <header class="campus-topbar">
      <a class="pg-brand" href="../" aria-label="Back to Shohoj">
        <span class="pg-brand-mark" aria-hidden="true">স</span>
        <span class="pg-brand-text">Shohoj <span>সহজ</span></span>
      </a>
    </header>
    <div id="root"></div>
  </body>
</html>
