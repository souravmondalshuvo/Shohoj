name: CD

on:
  push:
    branches: [main, master]

# Serialize gh-pages publishes — concurrent runs from a burst of commits race
# each other on `git push origin gh-pages` and the losers fail. Cancelling
# in-progress runs is correct here: we only ever want the latest commit's
# bundle on Pages.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Java (firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate runtime config
        env:
          FIREBASE_API_KEY:            ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:        ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:         ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:     ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:             ${{ secrets.FIREBASE_APP_ID }}
          GA_MEASUREMENT_ID:           ${{ secrets.GA_MEASUREMENT_ID }}
          PAPERS_WORKER_URL:           ${{ secrets.PAPERS_WORKER_URL }}
          RECAPTCHA_V3_SITE_KEY:       ${{ secrets.RECAPTCHA_V3_SITE_KEY }}
        run: |
          cp js/config/runtime-config.template.js js/config/runtime-config.js
          for key in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID \
                     FIREBASE_STORAGE_BUCKET FIREBASE_MESSAGING_SENDER_ID \
                     FIREBASE_APP_ID GA_MEASUREMENT_ID PAPERS_WORKER_URL \
                     RECAPTCHA_V3_SITE_KEY; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "::error::Missing secret $key"
              exit 1
            fi
            # Use a delimiter unlikely to appear in any value.
            sed -i "s|__${key}__|${value}|g" js/config/runtime-config.js
          done

      - name: Build
        run: python3 build3.py

      - name: Prepare deploy folder
        run: |
          mkdir -p _deploy/admin
          cp shohoj.html _deploy/index.html
          cp admin.html  _deploy/admin/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: gh-pages
