name: CI / CD

# Single authoritative pipeline. Validation jobs run for every pull request and
# every push. Deployment jobs (frontend, Worker, Firestore) live in the SAME
# workflow and declare `needs:` on every validation job, so a deploy can only
# start after the complete required suite has passed ON THE SAME COMMIT. Because
# every job checks out ${{ github.sha }}, the exact commit that passed CI is the
# commit that deploys — there is no second, independently-triggered CD run that
# could ship an untested SHA.
#
# Why one workflow with `needs:` instead of a separate workflow_run CD:
#   * The deploy jobs share this run's commit context, so exact-SHA deployment
#     is guaranteed without re-deriving a head_sha.
#   * A failed validation job blocks the deploy jobs automatically.
#   * workflow_dispatch cannot bypass validation — manual runs still evaluate the
#     same `needs:` graph.
#   * No secrets are used by validation jobs, so fork PRs stay green and never
#     receive deployment secrets (deploy jobs are gated to push + main).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded PR runs (safe — PRs never deploy). Pushes to main are NOT
# cancelled at the workflow level so a run is never interrupted mid-publish; the
# deploy jobs carry their own concurrency groups below so only the newest release
# actually publishes.
concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: jobs may only read the repo. The frontend deploy
# job opts into contents:write locally (it pushes the gh-pages branch). The
# Worker and Firestore deploys authenticate to their own clouds and stay
# read-only against GitHub.
permissions:
  contents: read

jobs:
  # ===================== Validation (gates every deploy) =====================

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # ESLint is correctness-only (see eslint.config.js): errors fail the job,
      # warnings are printed but don't block.
      - run: npm run lint
      # Prettier enforces formatting on the maintained typed surface only (see
      # .prettierignore); generated bundles, vendored files and the retiring
      # legacy js/ app are out of scope.
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  validate-data:
    name: Validate data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run validate:data

  unit-tests:
    name: Unit + Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # `npm test` runs the unit suite AND the Firestore rules tests, which spin
      # up the Firebase emulator (needs Java). Keep this here so rules changes
      # are exercised before they can be deployed.
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # The combined runner (scripts/run-tests.mjs) also executes
      # worker/test/*.test.js, and the worker is its own npm package — its
      # deps (@anthropic-ai/sdk for /api/assistant) must be installed here too.
      - run: npm ci
        working-directory: worker
      - run: npm test

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      # Drift guard: the Worker validates course codes against a generated copy
      # of js/core/catalog.js. If the catalogue gains a course and this is not
      # regenerated, the Worker rejects a real course as nonexistent.
      - name: Check worker catalogue is in sync
        run: npm run check:worker-catalog
      # Same guard for the seeded review corpus: if data/input_reviews.jsonl
      # gains rows and this is not regenerated, the Assistant quotes a stale
      # rating while the Routine Builder's ★ shows the current one.
      - name: Check worker review corpus is in sync
        run: npm run check:worker-reviews
      # And for the campus map: the Worker's domain table and the two functions
      # generated into firestore.rules both come from src/core/university.ts.
      # Drift there is a security boundary drifting — a campus the registry
      # admits that the rules deny, or a hand edit inside a generated region.
      - name: Check campus map is in sync
        run: npm run check:campus-map
      - name: Run worker tests
        run: npm run test:worker

  build-e2e:
    name: Build + E2E + bundle guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # build3.py flattens every module into one script scope, so two modules
      # declaring the same top-level name silently keep only the last one. Guard
      # against that before building.
      - name: Check bundle identifier collisions
        run: npm run check:collisions

      # Build the production bundle before E2E so tests exercise the CSP-hardened
      # shohoj.html (e.g. the summary-form Enter-key test).
      - name: Build bundle
        run: python3 build3.py

      - name: Run E2E tests
        run: npm run test:e2e

      # Standalone pages (#383) ARE deployed (CD ships dist-pages/), so a broken
      # standalone mount must not merge.
      - name: Run standalone pages E2E tests
        run: npm run test:e2e:pages

      - name: Run production bundle smoke test
        run: npm run test:bundle

      - name: Run CSP inline-handler guard
        run: npm run test:csp

      - name: Verify built bundle
        run: |
          test -s shohoj.html
          test -s admin.html
          test -s profile.html
          # Fail if bare ES module syntax leaked into the non-module bundle, if
          # 'unsafe-inline' survived in script-src (build3.py should replace it
          # with sha256 hashes), or if frame-ancestors is missing (clickjacking).
          python3 - <<'PY'
          import re, sys
          ok = True
          for path in ('shohoj.html', 'admin.html', 'profile.html'):
              html = open(path, encoding='utf-8').read()
              stripped = re.sub(
                  r'<script\s+type=["\']module["\'][\s\S]*?</script>',
                  '', html, flags=re.IGNORECASE,
              )
              if re.search(r'\b(export|import)\s+(function|const|let|var|class|default|\{)', stripped):
                  print(f'ERROR: bare ES module syntax leaked into {path}', file=sys.stderr)
                  ok = False
              csp_m = re.search(
                  r'<meta\s+http-equiv=["\']Content-Security-Policy["\']\s+content="([^"]*)"',
                  html, flags=re.IGNORECASE,
              )
              if not csp_m:
                  print(f'ERROR: no CSP meta tag in {path}', file=sys.stderr)
                  ok = False
                  continue
              csp = csp_m.group(1)
              script_src_m = re.search(r'(?:^|;)\s*script-src\s+([^;]+)', csp, flags=re.IGNORECASE)
              if not script_src_m:
                  print(f'ERROR: no script-src directive in {path} CSP', file=sys.stderr)
                  ok = False
              elif "'unsafe-inline'" in script_src_m.group(1):
                  print(f'ERROR: script-src in {path} still contains \'unsafe-inline\'',
                        file=sys.stderr)
                  ok = False
              if not re.search(r'frame-ancestors\b', csp, flags=re.IGNORECASE):
                  print(f'ERROR: CSP in {path} is missing frame-ancestors', file=sys.stderr)
                  ok = False
          if not ok:
              sys.exit(1)
          print('bundles OK')
          PY

      - name: Vite build (non-deploying smoke check)
        run: |
          # Verify the Vite build path compiles. This output is NOT deployed.
          # The template's __PLACEHOLDER__ tokens are fine for a compile check
          # (never served, no secrets — keeps fork PRs green).
          cp js/config/runtime-config.template.js js/config/runtime-config.js
          npm run build:vite
          test -s dist/index.html
          test -s dist/admin/index.html

      - name: Shell build + E2E
        run: |
          # Build and E2E the React Router shell (Phase 13 cutover target). The
          # shell output is NOT deployed but must pass a11y (serious/critical
          # fail), mobile/responsive parity, and every migrated feature slice.
          # Remove the template copied above so build:shell ships the runtime
          # stub the cloud specs expect (they inject globals via addInitScript).
          rm -f js/config/runtime-config.js
          npm run build:shell
          test -s dist-shell/index.html || test -s dist-shell/app/index.html
          npx playwright test --config=playwright.shell.config.js

  visual-parity:
    name: Visual parity (shell vs legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build shell
        run: npm run build:shell

      # The baselines are AUTHORED HERE rather than compared against the
      # checked-in PNGs, and that is deliberate.
      #
      # Screenshots are not portable: the committed baselines were authored on
      # macOS, and the same page on a Linux runner differs in text antialiasing
      # alone by far more than maxDiffPixelRatio allows. Comparing them here
      # would fail on the operating system rather than on the shell.
      #
      # Re-authoring from the legacy page in THIS environment makes both sides
      # of the comparison share a renderer, so what is left is the only
      # question this gate exists to ask: does the shell match legacy, as both
      # stand at this commit. It is a stronger check than a frozen snapshot,
      # not a weaker one — a legacy change that the shell has not tracked fails
      # here, where against a stale baseline both sides would drift together.
      #
      # The checked-in PNGs remain the local-development reference (they are
      # what `npm run test:visual` compares against on a developer machine).
      - name: Author legacy baselines in this environment
        run: npm run test:visual:baseline

      - name: Gate the shell against them
        run: npx playwright test --config=playwright.visual.config.js --project=shell

      # The diffs are the punch list; without them a red run says only "some
      # pixels moved" and the next step is to reproduce it locally by hand.
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity-diffs
          path: test-results/
          retention-days: 14

  # ============== Change detection for path-sensitive deploys ================

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
      firestore: ${{ steps.filter.outputs.firestore }}
    steps:
      - uses: actions/checkout@v7
      # dorny/paths-filter reliably diffs against the push base (or PR base) and
      # falls back to "changed" on ambiguous history, so an unrelated frontend
      # change never redeploys the Worker or Firestore rules.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            worker:
              - 'worker/**'
              - '.github/workflows/ci.yml'
            firestore:
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'firebase.json'
              - '.github/workflows/ci.yml'

  # ========================= Deploy (main pushes only) =======================
  # Every deploy job:
  #   * needs ALL validation jobs (a red suite blocks the deploy),
  #   * only runs on push to main (never on PRs, never from forks),
  #   * checks out ${{ github.sha }} — the exact validated commit,
  #   * uses the `production` GitHub environment (protection rules apply),
  #   * carries its own concurrency group so only the newest release wins.

  deploy-frontend:
    name: Deploy frontend (GitHub Pages)
    needs: [lint, typecheck, validate-data, unit-tests, worker-tests, build-e2e, visual-parity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://souravmondalshuvo.github.io/Shohoj/
    # peaceiris/actions-gh-pages pushes the gh-pages branch with GITHUB_TOKEN.
    permissions:
      contents: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: npm ci

      - name: Generate runtime config
        env:
          FIREBASE_API_KEY:            ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:        ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:         ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:     ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:             ${{ secrets.FIREBASE_APP_ID }}
          GA_MEASUREMENT_ID:           ${{ secrets.GA_MEASUREMENT_ID }}
          PAPERS_WORKER_URL:           ${{ secrets.PAPERS_WORKER_URL }}
          RECAPTCHA_V3_SITE_KEY:       ${{ secrets.RECAPTCHA_V3_SITE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:      ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          cp js/config/runtime-config.template.js js/config/runtime-config.js
          # Required secrets: fail loudly if any are missing so we never ship a
          # broken runtime config.
          for key in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID \
                     FIREBASE_STORAGE_BUCKET FIREBASE_MESSAGING_SENDER_ID \
                     FIREBASE_APP_ID GA_MEASUREMENT_ID PAPERS_WORKER_URL \
                     RECAPTCHA_V3_SITE_KEY; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret $key"
              exit 1
            fi
            sed -i "s|__${key}__|${value}|g" js/config/runtime-config.js
          done
          # Optional secrets: substitute when set, otherwise blank the
          # placeholder so the app feature-detects and disables the feature.
          for key in GOOGLE_OAUTH_CLIENT_ID; do
            sed -i "s|__${key}__|${!key}|g" js/config/runtime-config.js
          done

      - name: Build production bundle
        run: python3 build3.py

      - name: Build standalone pages
        run: npm run build:pages

      # Shell (#460 cutover rolled back): the vanilla build3.py site is the deploy
      # root again; the React shell is published under /Shohoj/app/. It builds
      # AFTER the runtime config is generated, so the real config gets bundled (the
      # plugin emits /runtime-config.js, base-rewritten to /Shohoj/app/runtime-config.js).
      - name: Build the shell (served under /app/)
        run: SHELL_BASE=/Shohoj/app/ npm run build:shell

      # test:bundle launches headless Chromium to load the built bundle, so the
      # browser must be present here (the validation job installs it separately).
      - name: Install Playwright browser (for the bundle smoke test)
        run: npx playwright install --with-deps chromium

      # Production-only smoke + CSP checks AFTER runtime config is injected, so
      # they validate the exact artifact being shipped.
      - name: Run production bundle smoke test
        run: npm run test:bundle
      - name: Run CSP inline-handler guard
        run: npm run test:csp

      - name: Prepare deploy folder
        run: |
          mkdir -p _deploy/admin _deploy/profile _deploy/app
          # Vanilla build3.py site is the deploy root again (#460 rolled back);
          # the React shell moves back under /app/ (opt-in). Legacy is the default.
          cp shohoj.html  _deploy/index.html
          cp admin.html   _deploy/admin/index.html
          cp profile.html _deploy/profile/index.html
          # Custom 404: SPA fallback for /app/ deep links + plain not-found
          # for everything else (#449).
          cp 404.html     _deploy/404.html
          # Standalone pages keep their directory layout and share assets/.
          cp -R dist-pages/. _deploy/
          # React shell — opt-in at /app/ (built with SHELL_BASE=/Shohoj/app/).
          cp -R dist-shell/. _deploy/app/

      - name: Generate version.json (build metadata)
        env:
          DEPLOY_TARGET: github-pages-production
        run: node scripts/generate-version-json.mjs _deploy/version.json

      # Keep the exact published package as an artifact so a known-good release
      # can be re-deployed for rollback (see docs/ROLLBACK.md).
      - name: Upload deploy package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-deploy-${{ github.sha }}
          path: _deploy
          retention-days: 30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: gh-pages

      # Post-deployment verification. Polls the live site until version.json
      # reports this commit, then checks every critical route/asset/marker.
      # A failure fails the job so a broken release is caught automatically.
      - name: Post-deploy production smoke test
        env:
          BASE_URL: https://souravmondalshuvo.github.io/Shohoj/
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/smoke-production.mjs

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: [lint, typecheck, validate-data, unit-tests, worker-tests, build-e2e, visual-parity, changes]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: worker-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # Post-deployment verification for the Worker, mirroring the frontend's
      # smoke step. Unauthenticated GETs only — no user data is read and no
      # Anthropic tokens are spent.
      #
      # REQUIRE_ASSISTANT is intentionally NOT set yet: ANTHROPIC_API_KEY is
      # still pending on the deployed Worker (#455), so a hard assertion would
      # block every Worker deploy. The step warns loudly instead. Flip it to
      # '1' once the secret is set, so the Assistant can never silently
      # regress to unconfigured again.
      - name: Post-deploy Worker smoke test
        if: ${{ vars.WORKER_URL != '' }}
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: node scripts/smoke-worker.mjs

  deploy-firestore:
    name: Deploy Firestore rules & indexes
    needs: [lint, typecheck, validate-data, unit-tests, worker-tests, build-e2e, visual-parity, changes]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.firestore == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: firestore-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # firebase-tools is a pinned devDependency, so `npx firebase` uses that
      # exact version rather than an unpinned network fetch.
      - run: npm ci
      - name: Deploy rules & indexes
        env:
          # Short-lived service-account JSON, stored as a GitHub secret. See
          # docs/GITHUB_SECURITY_SETTINGS.md for how to create and scope it.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          # FAIL CLOSED. This job only runs when firestore.rules or
          # firestore.indexes.json actually changed on main (see the `if:`
          # above). So reaching this step with no credentials means the
          # security rules protecting production user data were modified and
          # NOT deployed. Previously that exited 0 with a warning, leaving a
          # green pipeline and stale rules in production — the pipeline
          # reported success for a deploy that never happened.
          #
          # Never deploy Firestore DATA — only rules and indexes.
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Firestore rules/indexes changed on main but FIREBASE_SERVICE_ACCOUNT is not configured, so they were NOT deployed. Production is running the previous rules. Add the secret (see docs/GITHUB_SECURITY_SETTINGS.md) and re-run this job."
            exit 1
          fi
          # Write the key to a temp file the CLI reads via ADC; never printed.
          # The trap removes it even if the deploy fails or the job is cancelled.
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$SA_FILE"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          PROJECT="${FIREBASE_PROJECT_ID:-shohoj}"
          npx firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project "$PROJECT" \
            --non-interactive

  # A red X on `main` that nothing announces is only marginally better than the
  # green check it replaced. The fail-closed guard above worked exactly as
  # designed and still cost six days of undeployed SECURITY RULES, because the
  # failure sat in the Actions tab where nobody was looking (#574).
  #
  # So a failed rules deploy files an issue — the one channel this repo already
  # reads, and the only one that needs no secret to reach. Repeats comment on
  # the open issue rather than filing another, so a run of failures is one
  # thread rather than a pile.
  announce-firestore-deploy-failure:
    name: Announce a failed Firestore deploy
    needs: [deploy-firestore]
    if: >-
      always() &&
      needs.deploy-firestore.result == 'failure' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = 'Firestore rules did not deploy on main';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The \`Deploy Firestore rules & indexes\` job failed on \`main\` (${context.sha.slice(0, 8)}).`,
              '',
              '**Production is running the previous rules.** `firestore.rules` on `main` and the',
              'rules Firestore is enforcing have diverged until this is resolved.',
              '',
              `Failing run: ${run}`,
              '',
              'Usual causes: `FIREBASE_SERVICE_ACCOUNT` missing or expired, or the rules failing',
              'to compile. See `docs/GITHUB_SECURITY_SETTINGS.md`.',
            ].join('\n');

            // One thread per outage: reuse the open issue if there is one.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Commented on #${existing.number}`);
              return;
            }
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.notice(`Filed #${created.data.number}`);
