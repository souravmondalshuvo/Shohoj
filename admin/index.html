  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 8px;
  border-radius: 10px;
  transition: background 0.18s;
}
.umc-row:hover {
  background: rgba(46, 204, 113, 0.05);
}
.umc-row + .umc-row {
  border-top: 1px solid var(--hairline);
}
.umc-row-main {
  min-width: 0;
  font-size: 13px;
  color: var(--text);
}
.umc-row-side {
  flex: none;
  font-size: 11.5px;
  color: var(--text3);
  white-space: nowrap;
}
.umc-row-side strong {
  color: var(--green);
  font-weight: 700;
}
.umc-dim {
  color: var(--text3);
  font-size: 12px;
}
.umc-more {
  font-size: 11px;
  color: var(--text3);
  padding: 6px 8px 0;
}
.umc-count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  background: var(--chip-hover);
  border: 1px solid var(--chip-border);
  border-radius: 999px;
  padding: 2px 9px;
}
.umc-sub {
  font-size: 11.5px;
  color: var(--text3);
  line-height: 1.55;
  margin-top: 4px;
}
/* Scope line: which degree the map is filtered to, and the way out of it. */
.umc-scope { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.umc-scope-btn {
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-green);
  background: rgba(46,204,113,0.12);
  border: 1px solid var(--chip-border);
  border-radius: 999px;
  padding: 3px 11px;
  cursor: pointer;
}
.umc-scope-btn:hover { background: rgba(46,204,113,0.2); }
.umc-sub strong {
  color: var(--green);
}
.umc-lead {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-top: 4px;
}
.umc-card-accent {
  border-color: rgba(46, 204, 113, 0.35);
  background: rgba(46, 204, 113, 0.06);
}

/* Exam rows */
.pfb-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
/* Each row is its own grid, so the tracks only line up while every row hits the
   same floor: 88px clears a six-character code in Syne 800 (~86px), where the
   old fixed 62px clipped it into the date. Anything longer widens that one row
   instead of colliding. */
.pfb-row {
  display: grid;
  grid-template-columns: auto minmax(88px, max-content) minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 12px;
  padding: 10px 8px;
  border-radius: 10px;
  transition: background 0.18s;
}
.pfb-row:hover { background: rgba(46,204,113,0.05); }
/* Sat exams stay readable but stop competing with the ones still ahead. The
   date keeps its strikethrough-free weight; only the ink drops back. */
.pfb-row.is-past { opacity: 0.55; }
.pfb-row.is-past .pfb-row-code,
.pfb-row.is-past .pfb-row-when b { color: var(--text2); }
.pfb-row.is-past .pfb-row-dot { background: var(--text3); box-shadow: none; }
.pfb-row + .pfb-row { border-top: 1px solid var(--hairline); }
.pfb-row-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(46,204,113,0.16);
}
.pfb-row-dot.hot { background: #e74c3c; box-shadow: 0 0 0 3px rgba(231,76,60,0.16); }
.pfb-row-code { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800; color: var(--text); white-space: nowrap; }
/* Tabular figures so the clock times stack into a readable column. */
.pfb-row-when { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }
.pfb-row-when b { color: var(--text); font-weight: 600; white-space: nowrap; }
/* A floor here too: initials run 2–4 characters, and without it every row ends
   its chip at a different x. */
.pfb-row-meta { font-size: 11px; color: var(--text3); white-space: nowrap; min-width: 34px; text-align: right; }
/* Chips are content-width; ending them on one edge makes the column scannable. */
.pfb-row .pfb-chip { justify-self: end; }

/* Week stats */
.pfb-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 9px; }
.pfb-stat {
  padding: 11px 13px;
  border: 1px solid var(--border2);
  border-radius: 12px;
  background: rgba(46,204,113,0.04);
  transition: border-color 0.2s, background 0.2s;
}
.pfb-stat:hover { border-color: var(--border); background: rgba(46,204,113,0.07); }
.pfb-stat.alert { background: rgba(241,196,15,0.06); border-color: rgba(241,196,15,0.25); }
.pfb-stat.alert .pfb-stat-n { color: var(--ink-amber); }
.pfb-stat-n {
  font-family: 'Syne', sans-serif;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--text);
}
.pfb-stat-l {
  display: block;
  margin-top: 4px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text3);
}

/* Week grid — 08:00→19:00, one column per teaching day */
.pfb-week { display: grid; grid-template-columns: 38px repeat(6, 1fr); gap: 6px; }
.pfb-week-h {
  font-size: 10px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text3);
  text-align: center;
  padding-bottom: 4px;
}
.pfb-week-times { position: relative; height: 260px; }
.pfb-week-times span {
  position: absolute;
  right: 4px;
  font-size: 9px;
  color: var(--text3);
  transform: translateY(-50%);
}
.pfb-col {
  position: relative;
  height: 260px;
  border-radius: 10px;
  border: 1px solid var(--hairline);
  background: rgba(255,255,255,0.02);
  overflow: hidden;
}
.pfb-col.is-off { background: transparent; border-style: dashed; }
.pfb-blk {
  position: absolute;
  left: 3px;
  right: 3px;
  border-radius: 7px;
  padding: 5px 6px;
  overflow: hidden;
  background: linear-gradient(160deg, rgba(46,204,113,0.30), rgba(46,204,113,0.14));
  border: 1px solid rgba(46,204,113,0.4);
}
.pfb-blk.is-lab {
  background: linear-gradient(160deg, rgba(91,157,255,0.28), rgba(91,157,255,0.12));
  border-color: rgba(91,157,255,0.42);
}
.pfb-blk-code { display: block; font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 800; line-height: 1.2; color: var(--text); }
.pfb-blk-room { display: block; font-size: 8.5px; color: var(--text2); line-height: 1.3; margin-top: 1px; }
.pfb-gap {
  position: absolute;
  left: 3px;
  right: 3px;
  border-radius: 7px;
  border: 1px dashed var(--border2);
  background: repeating-linear-gradient(45deg, transparent 0 5px, rgba(241,196,15,0.07) 5px 10px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.pfb-gap span { font-size: 9px; font-weight: 700; color: var(--ink-amber); text-align: center; line-height: 1.3; }

/* Tight transitions */
.pfb-hops { display: flex; flex-direction: column; gap: 8px; }
.pfb-hop {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 13px;
  border-radius: 12px;
  border: 1px solid rgba(241,196,15,0.25);
  background: rgba(241,196,15,0.05);
  font-size: 12px;
  color: var(--text);
}
.pfb-hop b { font-family: 'Syne', sans-serif; font-weight: 800; }
.pfb-arrow { color: var(--ink-amber); font-weight: 700; }
.pfb-hop-rooms { color: var(--text2); }
.pfb-hop-min { margin-left: auto; font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 800; color: var(--ink-amber); white-space: nowrap; }

/* Where to wait */
.pfb-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 11px; }
.pfb-slot {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 15px;
  border: 1px solid var(--border2);
  border-radius: 13px;
  background: rgba(46,204,113,0.03);
  transition: border-color 0.2s;
}
.pfb-slot:hover { border-color: var(--border); }
.pfb-slot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pfb-slot-when { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); }
.pfb-slot-why { font-size: 12px; color: var(--text2); line-height: 1.5; }
.pfb-slot-why b { color: var(--text); font-weight: 600; }
.pfb-rooms { display: flex; flex-wrap: wrap; gap: 6px; }
.pfb-room {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  padding: 5px 11px;
  border-radius: 999px;
  border: 1px solid var(--chip-border);
  background: rgba(46,204,113,0.08);
}
.pfb-room.is-best { border-color: rgba(46,204,113,0.45); background: rgba(46,204,113,0.16); }
.pfb-room.is-more { background: transparent; color: var(--text3); }
.pfb-room small { color: var(--text3); font-weight: 500; margin-left: 5px; }

/* Loading skeleton */
.pfb-skel {
  height: 12px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--skel-lo), var(--skel-hi), var(--skel-lo));
  background-size: 200% 100%;
  animation: pfbShimmer 1.4s linear infinite;
}
@keyframes pfbShimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

@media (max-width: 640px) {
  .pfb-week { grid-template-columns: 30px repeat(6, 1fr); gap: 4px; }
  .pfb-blk-room { display: none; }
  /* Two lines instead of five squeezed columns: code + chip on top, the date
     underneath. Auto-flow used to drop the chip in the dot's column. */
  .pfb-row { grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; row-gap: 4px; }
  .pfb-row-code { grid-area: 1 / 2; }
  .pfb-row .pfb-chip { grid-area: 1 / 3; }
  .pfb-row-when { grid-area: 2 / 2 / 2 / -1; }
  .pfb-row-meta { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pfb-card { transition: none; }
  .pfb-card:hover { transform: none; }
  .pfb-skel { animation: none; }
}

/* ── Shohoj Assistant (#533) ───────────────────────────────────────────────────
   Floating launcher + chat drawer, mounted on <body> by js/ui/assistantFab.js.
   Pill language throughout, mirroring the shell's .assistant-* block in
   css/shell-routes.css so the two front-ends look like one product. Sits under
   the modal backdrops (z-index 9999) — a chat panel should never cover a
   confirm dialog — and above the nav (100). */
.assistant-fab {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 300;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 44px;
  padding: 10px 18px;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
  font-size: 14px;
  color: #06120b;
  background: var(--green);
  border: 1px solid var(--green);
  box-shadow: 0 8px 26px rgba(46, 204, 113, 0.35);
  transition: transform var(--transition);
  /* No entrance animation of its own any more: the pill's arrival is the
     closing morph's last act, and a pop on top of that read as a bounce. */
}
/* A slow ring breathing out of the launcher, so it reads as live rather than as
   one more static button in the corner. It rides a pseudo-element instead of the
   button's own box-shadow: the ring can then be called off on hover — the moment
   the student is already looking at it — without freezing a half-expanded ring,
   and it leaves the :hover lift on transform alone. */
@keyframes assistantFabPulse {
  0% {
    box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4);
  }
  70% {
    box-shadow: 0 0 0 13px rgba(46, 204, 113, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(46, 204, 113, 0);
  }
}
.assistant-fab::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  animation: assistantFabPulse 2800ms ease-out 900ms infinite;
}
.assistant-fab:hover::after,
.assistant-fab:focus-visible::after {
  animation: none;
}
.assistant-fab:hover {
  transform: translateY(-2px);
}
.assistant-fab:focus-visible {
  outline: 2px solid var(--ink-green);
  outline-offset: 3px;
}
/* During the morph the pill stays on screen, above the panel growing out from
   underneath it, and hands over: its label fades while the panel's own green
   wash — identical fill, same rectangle — takes the shape on. Hiding the pill
   at the click instead would break the one thing this move is for. */
@keyframes assistantFabHandoff {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}
@keyframes assistantFabReturn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.assistant-fab--morphing {
  z-index: 301;
  animation: assistantFabHandoff 130ms ease-in 90ms both;
}
.assistant-fab--returning {
  z-index: 301;
  animation: assistantFabReturn 150ms ease-out 130ms backwards;
}
.assistant-fab--morphing::after,
.assistant-fab--returning::after {
  animation: none;
}
/* The launcher pill becomes the panel, in view.
   The shape itself is animated in JS — js/core/assistantMorph.js clips the
   panel to the pill's rectangle and grows the clip — because the pill's rect
   has to be measured, not guessed. What is here are the layers that ride on
   top of that shape: a green wash that starts as the pill's own fill and
   drains away, and the chat contents arriving once the box is nearly formed.
   Contents deliberately wait: text reflowing inside a shape that is still
   changing is what makes this kind of move look cheap. */
/* The wash holds while the shape is still pill-sized and drains as it opens
   out. Fading it from the first frame instead leaves a dark green box next to a
   bright green pill during the handover — two objects, which is the opposite of
   what the move is for. */
@keyframes assistantWashOut {
  0% {
    opacity: 1;
  }
  30% {
    opacity: 0.94;
  }
  70% {
    opacity: 0;
  }
  100% {
    opacity: 0;
  }
}
@keyframes assistantWashIn {
  0% {
    opacity: 0;
  }
  35% {
    opacity: 0.15;
  }
  80% {
    opacity: 1;
  }
  100% {
    opacity: 1;
  }
}
@keyframes assistantRowIn {
  from {
    opacity: 0;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes assistantRowOut {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}
.assistant-drawer {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  width: min(380px, calc(100vw - 28px));
  height: min(560px, calc(100dvh - 28px));
  /* Opaque, like the maintenance banner: the drawer floats over the animated
     orbs, and a translucent surface drops text contrast below AA as they move. */
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
/* The wash: the pill's green, laid over the whole panel and drained off as the
   shape opens out. Because the panel is clipped to the pill at frame one, all
   that is on screen then is a green pill — the same one the student clicked. */
.assistant-drawer--morphing::before,
.assistant-drawer--closing::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: var(--green);
}
.assistant-drawer--morphing::before {
  animation: assistantWashOut 420ms linear both;
}
.assistant-drawer--closing::before {
  animation: assistantWashIn 280ms linear both;
}
.assistant-drawer--morphing .assistant-drawer-header,
.assistant-drawer--morphing .assistant-drawer-note,
.assistant-drawer--morphing .assistant-log,
.assistant-drawer--morphing .assistant-composer {
  animation: assistantRowIn 240ms ease-out both;
}
.assistant-drawer--morphing .assistant-drawer-header {
  animation-delay: 210ms;
}
.assistant-drawer--morphing .assistant-drawer-note {
  animation-delay: 245ms;
}
.assistant-drawer--morphing .assistant-log {
  animation-delay: 280ms;
}
.assistant-drawer--morphing .assistant-composer {
  animation-delay: 315ms;
}
.assistant-drawer--closing {

  pointer-events: none;

.assistant-drawer--closing .assistant-drawer-header,
.assistant-drawer--closing .assistant-drawer-note,

  CGPA_STORAGE_KEY,              // semesters, courses, grades, the plan
  'shohoj_cgpa_backup_v1',       // the shell's pre-migration copy of all of it
  'shohoj_routine_v1',           // class routine (legacy)
  'shohoj_routine_picks_v1',     // class routine (shell — a different key)
  'shohoj_my_reviews_v1',        // the record of reviews this student wrote
  'shohoj_seat_watch_v1',        // seat watchlist
  'shohoj_seat_alerts_enabled',  // seat-alert opt-in
  'shohoj_connect_profile_v1',   // their CONNECT profile snapshot

  'shohoj_last_sync',
  'shohoj_session_start',

];

// straight past the gate.
const PERSONAL_SESSION_KEYS = [
  'shohoj_active_tab',
  'shohoj_cloud_applied',
  'shohoj_skip_first_save',
  'shohoj_calc_unlocked',
];

// cannot reach — so every key is removed on its own.
function removeLocalKeys(keys) {
  keys.forEach(key => {

  keys.forEach(key => {
    try { sessionStorage.removeItem(key); } catch (e) {}

  removeLocalKeys(PERSONAL_LOCAL_KEYS);

// them it existed: the only removal was a Clear Data button at the foot of the
// calculator, which someone using Routine Builder or Seat Status never scrolls
// to. This turns the contents into a sentence the notice can show them (#627).
//
// Counts come from the stored shape, so a key that is present but empty says
// nothing rather than claiming a category the student would not recognise.
function readJson(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null; // unreadable is the same as absent for a summary
  }
}

function plural(count, one, many) {
  return `${count} ${count === 1 ? one : many}`;
}

/** Human labels for the personal data on this device, most substantial first.
 *  Empty when there is nothing to tell them about. */
function describeStoredPersonalData() {
  const parts = [];

  const semesters = readJson(CGPA_STORAGE_KEY)?.semesters;
  if (Array.isArray(semesters) && semesters.length > 0) {
    parts.push(plural(semesters.length, 'semester', 'semesters'));
  }

  // Either build's routine counts once — a student who has used both should not
  // be told they have two routines.
  const picks = PD_ROUTINE_KEYS
    .map(key => readJson(key)?.picks)
    .find(value => value && typeof value === 'object' && Object.keys(value).length > 0);
  if (picks) parts.push('your routine');

  const watches = readJson('shohoj_seat_watch_v1');
  if (Array.isArray(watches) && watches.length > 0) {
    parts.push(plural(watches.length, 'watched section', 'watched sections'));
  }

  const reviews = readJson('shohoj_my_reviews_v1');
  if (reviews && typeof reviews === 'object') {
    const written = Object.values(reviews).reduce(
      (total, list) => total + (Array.isArray(list) ? list.length : 0),
      0,
    );
    if (written > 0) parts.push(plural(written, 'review you wrote', 'reviews you wrote'));
  }

  if (readJson('shohoj_connect_profile_v1')) parts.push('your transcript profile');

  return parts;
}

// ── Devices the old sign-out already left dirty ──────────────────────────────
// Before #627, signing out ended the Firebase session and left everything in
// localStorage. Those devices are still out there, and the wipe above cannot
// help them: it runs at sign-out, and nobody signs out twice.
//
// They are identifiable, though. The old sign-out removed `shohoj_session_start`
// but left `shohoj_last_sync` behind, so a device carrying last-sync WITHOUT a
// session start was signed in once and signed out under the old code. A visitor
// who never signed in has neither, which is what keeps this off the local-first
// path that has always been Shohoj's default — their data is not ours to delete.
//
// A live session has BOTH (session start is written at sign-in and survives
// reloads), so a signed-in student reloading the page never matches. The 30-day
// expiry path does match, having cleared session start on its way out; wiping
// there is the same bargain as a sign-out, and the account still holds the data.
//
// This holds on the legacy build, which is the only one that writes session
// start. The shell does not, so it must not run this at boot — see the note on
// the same predicate in src/services/storage/personalData.ts.
function hasStaleSignedOutData() {
  try {
    return (
      localStorage.getItem('shohoj_last_sync') !== null
      && localStorage.getItem('shohoj_session_start') === null
    );
  } catch (e) {
    return false; // storage unreachable — nothing to read, nothing to clear
  }
}

/** Clear a pre-#627 leftover. True only once the residue is provably gone.
 *
 * The return value gates the caller's reload, and it is checked rather than
 * assumed: a storage that refuses removeItem would otherwise leave the residue
 * in place, keep this predicate true, and reload the page forever.
 */
function clearStaleSignedOutData() {
  if (!hasStaleSignedOutData()) return false;
  clearPersonalData();
  return !hasStaleSignedOutData();
}

/** Clear Data's wipe: the above, plus the preferences it promises to reset. */
function clearAllShohojData() {
  clearPersonalData();
  removeLocalKeys(PREFERENCE_LOCAL_KEYS);
}

// ── Cross-device slices ───────────────────────────────────────────────────────
// The cloud doc (users/{uid}.data) used to carry the calculator and nothing
// else: semesters, grades, the plan. Everything else a student built up — their
// routine, the seat watchlist, the reviews they wrote, the transcript-derived
// profile — lived on one device and died with it. That is what made clearing
// the device on sign-out a real loss, and what made "sign in on your phone" a
// half-truth (#627).
//
// These slices ride along in the same snapshot, so the sync machinery carries
// them for free: one doc, one fingerprint, one conflict prompt. Nothing here
// invents a second sync path.
//
// Every name in this file is prefixed because build3.py flattens both bundles
// into one scope each, and MY_REVIEWS_KEY / PROFILE_SNAPSHOT_KEY are already
// taken in the same scopes by js/auth/firebase.js and js/ui/modals.js.
/** The snapshot fields these functions own. Drift-guarded against the shell's
 *  copy — a mismatch here fails nothing, it just quietly stops syncing. */
const PERSONAL_SLICE_FIELDS = [
  'routine',
  'myReviews',
  'seatWatches',
  'seatAlertsEnabled',
  'profileSnapshot',
];

const PD_ROUTINE_KEYS   = ['shohoj_routine_v1', 'shohoj_routine_picks_v1'];
const PD_MY_REVIEWS_KEY = 'shohoj_my_reviews_v1';
const PD_SEAT_WATCH_KEY = 'shohoj_seat_watch_v1';
const PD_SEAT_ALERTS_KEY = 'shohoj_seat_alerts_enabled';
const PD_PROFILE_KEY    = 'shohoj_connect_profile_v1';

// Caps, so a doc that has been tampered with cannot make the app chew through
// an unbounded list on restore. MAX_WATCHES in js/core/seatWatch.js is 50.
const PD_MAX_PICKS   = 40;
const PD_MAX_WATCHES = 50;
const PD_MAX_REVIEWS = 200;

function pdReadJson(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// Reports whether the write actually landed. applyPersonalSlices's return value
// gates a page reload, and a storage that silently refuses every write would
// otherwise reload forever: nothing written means no local snapshot, which sends
// the sign-in flow straight back down the adopt-cloud path (#627).
function pdWriteJson(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

/** `{ picks: { COURSECODE: sectionId|null } }` or null. Both builds store the
 *  same shape under different keys (see the note on PERSONAL_LOCAL_KEYS). */
function pdCleanRoutine(value) {
  if (!value || typeof value !== 'object') return null;
  const source = value.picks;
  if (!source || typeof source !== 'object') return null;
  const picks = {};
  let count = 0;
  for (const [code, sectionId] of Object.entries(source)) {
    if (count >= PD_MAX_PICKS) break;
    if (typeof code !== 'string') continue;
    if (sectionId !== null && !(typeof sectionId === 'number' && isFinite(sectionId))) continue;
    picks[code.toUpperCase()] = sectionId;
    count += 1;
  }
  return { picks };
}

/** Read the routine from whichever key this build writes. */
function pdReadRoutine() {
  for (const key of PD_ROUTINE_KEYS) {
    const routine = pdCleanRoutine(pdReadJson(key));
    if (routine) return routine;
  }
  return null;
}

/** What this device holds beyond the calculator, ready to ride along in the
 *  cloud snapshot. A slice that is absent stays absent rather than becoming an
 *  empty one: an older client's doc must not read as "this student has no
 *  routine" and wipe a newer client's. */
function collectPersonalSlices(uid) {
  const slices = {};

  const routine = pdReadRoutine();
  if (routine) slices.routine = routine;

  // The local receipt is keyed by uid (one browser, several students). Only the
  // signed-in student's own slice belongs in their own doc.
  if (uid) {
    const all = pdReadJson(PD_MY_REVIEWS_KEY);
    const mine = all && typeof all === 'object' ? all[uid] : null;
    if (Array.isArray(mine)) slices.myReviews = mine.slice(0, PD_MAX_REVIEWS);
  }

  const watches = pdReadJson(PD_SEAT_WATCH_KEY);
  if (Array.isArray(watches)) slices.seatWatches = watches.slice(0, PD_MAX_WATCHES);

  try {
    const pref = localStorage.getItem(PD_SEAT_ALERTS_KEY);
    // seatsTab treats anything but '0' as on; keep that reading.
    if (pref !== null) slices.seatAlertsEnabled = pref !== '0';
  } catch (e) { /* storage off */ }

  const profile = pdReadJson(PD_PROFILE_KEY);
  if (profile && typeof profile === 'object') slices.profileSnapshot = profile;

  return slices;
}

/** Fan an adopted cloud snapshot back out to the keys each module reads.
 *
 * Called wherever a cloud doc becomes this device's copy. A slice the snapshot
 * does not carry is left alone — that is a doc written before these fields
 * existed, not a student with nothing. */
/** Fan a cloud snapshot's slices back out to the keys each module reads.
 *
 * Returns true when something was actually written. The caller needs that: the
 * routine, seats, reviews and profile modules each read their key ONCE at module
 * load, so writing the key on an already-booted page changes storage and nothing
 * else. A restore that lands the calculator and silently drops the rest is the
 * new-device bug this return value exists to prevent (#627).
 */
function applyPersonalSlices(snapshot, uid) {
  if (!snapshot || typeof snapshot !== 'object') return false;
  let wrote = false;

  const routine = pdCleanRoutine(snapshot.routine);
  // Written to both routine keys on purpose: a student who uses the shell on
  // one device and legacy on another has one routine, not two.
  if (routine) {
    // Reduce, not forEach: a refused write must not be reported as a restore.
    wrote = PD_ROUTINE_KEYS.reduce((ok, key) => pdWriteJson(key, routine) || ok, wrote);
  }

  if (uid && Array.isArray(snapshot.myReviews)) {
    const all = pdReadJson(PD_MY_REVIEWS_KEY);
    const merged = (all && typeof all === 'object') ? all : {};
    merged[uid] = snapshot.myReviews
      .filter(entry => entry && typeof entry === 'object')
      .slice(0, PD_MAX_REVIEWS);
    if (pdWriteJson(PD_MY_REVIEWS_KEY, merged)) wrote = true;
  }

  if (Array.isArray(snapshot.seatWatches)) {
    const watches = snapshot.seatWatches
      .filter(w => w && typeof w === 'object')
      .slice(0, PD_MAX_WATCHES);
    if (pdWriteJson(PD_SEAT_WATCH_KEY, watches)) wrote = true;
  }

  if (typeof snapshot.seatAlertsEnabled === 'boolean') {
    try {
      localStorage.setItem(PD_SEAT_ALERTS_KEY, snapshot.seatAlertsEnabled ? '1' : '0');
      wrote = true;
    } catch (e) { /* storage off */ }
  }

  if (snapshot.profileSnapshot && typeof snapshot.profileSnapshot === 'object') {
    if (pdWriteJson(PD_PROFILE_KEY, snapshot.profileSnapshot)) wrote = true;
  }

  return wrote;
}

// ── js/auth/admin-service.js ────────────────────────────────────
function installAdminAccessHooks({ isAdminUser }) {
  window._shohoj_isPaperAdmin = function() {
    return isAdminUser();
  };

  window._shohoj_isAdmin = function() {
    return isAdminUser();
  };
}

// ── js/auth/assistant-service.js ────────────────────────────────
// js/auth/assistant-service.js
//
// The two identity bridges the Shohoj Assistant launcher needs on the legacy
// page (#533). The launcher lives in the main bundle, which is a classic script
// and cannot import firebase.js (a separate type="module" block) — so, as with
// installReviewIdentityHooks, firebase.js installs window hooks and the UI
// module calls them.
//
// Nothing here is assistant-specific policy: it is the same trust model as the
// rest of the _shohoj_* bridges. The token is only ever handed to the Worker,
// which verifies it and scopes every lookup to that uid server-side.

/**
 * Install the Assistant's auth hooks.
 *
 * @param {object} deps
 * @param {() => unknown} deps.getCurrentUser  Current Firebase user, or null.
 * @param {() => boolean} deps.isCloudSettled  Whether sign-in reconciliation finished.
 * @param {() => Promise<string|null>} deps.getIdToken  Fresh ID token, or null.
 * @param {(snap: unknown) => Promise<boolean>} deps.saveSnapshot  Immediate cloud write.
 * @param {() => unknown} deps.readLocalSnapshot  Parsed local state, or null.
 * @param {(raw: unknown) => string} deps.fingerprint  Content hash of a snapshot.
 * @param {object} [scope]  Injectable global (tests).
 */
function installAssistantAuthHooks(
  { getCurrentUser, isCloudSettled, getIdToken, saveSnapshot, readLocalSnapshot, fingerprint },
  scope = typeof window !== 'undefined' ? window : undefined,
) {
  if (!scope) return;

  // What the cloud already has, as far as this tab knows. Lets a flush be
  // skipped when nothing has changed since the last one (#553).
  let lastFlushed = null;

  scope._shohoj_idToken = function() {
    return getCurrentUser() ? getIdToken() : Promise.resolve(null);
  };

  // The Assistant answers from users/{uid} in Firestore, not from localStorage,
  // so a student whose latest edits are still sitting in the debounce window
  // would be told they have no saved semesters. The drawer flushes through this
  // before every turn; without a signed-in user or local data there is nothing
  // to push and the caller carries on regardless.
  //
  // It deliberately does nothing while sign-in reconciliation is still open:
  // auth-changed fires before the local-vs-cloud comparison, so writing the
  // local snapshot here could overwrite the account's cloud copy before the
  // conflict is detected — or while the migration dialog is still on screen
  // waiting for the student to choose. A slightly stale answer is recoverable;
  // silently overwriting a semester of work is not.
  scope._shohoj_flushCloudSave = async function() {
    if (!getCurrentUser()) return false;
    if (typeof isCloudSettled === 'function' && !isCloudSettled()) return false;
    const snap = readLocalSnapshot();
    if (!snap) return false;

    // Only write when the data actually moved. The staleness this guards
    // against (#544) is caused by EDITS sitting in the save debounce; a second
    // question about unchanged data does not need a second write, and paying
    // one per question is a Firestore round trip added to every answer (#553).
    const mark = typeof fingerprint === 'function' ? fingerprint(snap) : null;
    if (mark && mark === lastFlushed) return true;

    try {
      const saved = await saveSnapshot(snap);
      if (saved && mark) lastFlushed = mark;
      return saved;
    } catch (_e) {
      return false;
    }
  };
}

// ── js/auth/auth-service.js ─────────────────────────────────────
function isSafeAvatarUrl(url) {
  if (!url || typeof url !== 'string') return false;
  try {
    const u = new URL(url);
    if (u.protocol !== 'https:') return false;
    return /(^|\.)googleusercontent\.com$/i.test(u.hostname);
  } catch (_e) {
    return false;
  }
}

function firstDisplayName(displayName) {
  return String(displayName || '').split(' ')[0] || 'you';
}

// ── js/auth/paper-service.js ────────────────────────────────────
function getPapersWorkerUrl() {
  const u = window._shohoj_papers_worker_url;
  return (typeof u === 'string' && u.startsWith('http')) ? u.replace(/\/$/, '') : null;
}

async function getCurrentUserIdToken(currentUser) {
  if (!currentUser) return null;
  try {
    return await currentUser.getIdToken();
  } catch (_e) {
    return null;
  }
}

// ── js/auth/review-service.js ───────────────────────────────────
function installReviewIdentityHooks({ getCurrentUser, isAuthReady }) {
  window._shohoj_currentUid = function() {
    return getCurrentUser()?.uid || null;
  };

  window._shohoj_currentEmail = function() {
    return getCurrentUser()?.email || null;
  };

  window._shohoj_isAuthReady = function() {
    return isAuthReady();
  };

  // Read-only identity snapshot for the Profile account hub. photoURL is passed
  // through the same isSafeAvatarUrl guard the signed-in pill uses, so a hostile
  // Google identity payload can't inject an arbitrary image/URL into the page.
  window._shohoj_userProfile = function() {
    const u = getCurrentUser();
    if (!u) return { signedIn: false, uid: null, email: null, displayName: null, photoURL: null };
    return {
      signedIn:    true,
      uid:         u.uid || null,
      email:       u.email || null,
      displayName: u.displayName || null,
      photoURL:    isSafeAvatarUrl(u.photoURL) ? u.photoURL : null,
    };
  };
}

// ── js/auth/user-sync-service.js ────────────────────────────────
function parseStoredState(raw, source = 'storage') {
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch (e) {
    console.warn(`[Shohoj] Ignoring invalid ${source} state:`, e);
    return null;
  }
}

function getDataFingerprint(raw) {
  if (!raw) return '';
  try {
    const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
    const { updatedAt, _serverTimestamp, ...dataOnly } = parsed;
    return JSON.stringify(dataOnly);
  } catch (_e) {
    return typeof raw === 'string' ? raw : JSON.stringify(raw);
  }
}

// ── js/auth/firebase.js ─────────────────────────────────────────
// ── js/auth/firebase.js ───────────────────────────────────────────────────────
// Firebase Authentication + Firestore cloud sync for Shohoj
// Features: Google Sign-In, Sign-Out, cloud save/load, migration modal,
//           real-time sync, offline detection, sync persistence, data deletion

// ── State ─────────────────────────────────────────────────────────────────────
let currentUser    = null;
let _authReady           = false;
// Whether the local-vs-cloud decision for this sign-in has been made.
// shohoj:auth-changed fires as soon as the user object exists, which is BEFORE
// loadFromCloud() and the migration modal — so anything that writes
// users/{uid} on a user action in that window (the Assistant's flush, see
// assistant-service.js) could overwrite the cloud copy before the conflict is
// even detected. Signed out there is nothing to reconcile.
let _cloudReconciled     = true;
let _unsubscribeSnapshot  = null;
const STORAGE_KEY         = 'shohoj_cgpa_v1';
const LAST_SYNC_KEY       = 'shohoj_last_sync';
const SESSION_START_KEY   = 'shohoj_session_start';
const SESSION_MAX_MS      = 30 * 24 * 60 * 60 * 1000; // 30 days
const CLOUD_SAVE_DEBOUNCE_MS = 700;
let _cloudSaveTimer       = null;
let _queuedCloudSnap      = null;
let _queuedCloudResolvers = [];
let _activeCloudSave      = Promise.resolve(false);

// ── Local-write guard ─────────────────────────────────────────────────────────
// When THIS tab writes to Firestore, the onSnapshot listener will fire with
// that same data. We must ignore it or it triggers a false "other device" reload.
// _localWriteAt records the timestamp of our last Firestore write.
// Any snapshot arriving within LOCAL_WRITE_GRACE_MS of that write is ignored.
let _localWriteAt = 0;
const LOCAL_WRITE_GRACE_MS = 5000; // 5 seconds is more than enough

// ── Firestore ref ─────────────────────────────────────────────────────────────
function userDocRef(uid) {
  return doc(db, 'users', uid);
}

function clearCloudAppliedFlag() {
  try { sessionStorage.removeItem('shohoj_cloud_applied'); } catch(e) {}
}

function notifyAuthStateReady() {
  _authReady = true;
  try {
    window.dispatchEvent(new CustomEvent('shohoj:auth-changed', {
      detail: { signedIn: !!currentUser },
    }));
  } catch (_e) {}
}

function drainQueuedCloudResolvers() {
  return _queuedCloudResolvers.splice(0);
}

function clearQueuedCloudSave(result = false) {
  if (_cloudSaveTimer) clearTimeout(_cloudSaveTimer);
  _cloudSaveTimer = null;
  _queuedCloudSnap = null;
  drainQueuedCloudResolvers().forEach(resolve => resolve(result));
}

async function persistCloudState(stateSnap) {
  if (!currentUser) return false;
  if (!navigator.onLine) { setSyncIndicator('offline'); return false; }
  setSyncIndicator('syncing');
  try {
    // Record that THIS tab is about to write so the snapshot listener can ignore it
    _localWriteAt = Date.now();
    await setDoc(userDocRef(currentUser.uid), {
      data:      JSON.stringify(stateSnap),
      updatedAt: serverTimestamp(),
    }, { merge: true });
    const now = Date.now();
    try { localStorage.setItem(LAST_SYNC_KEY, String(now)); } catch(e) {}
    setSyncIndicator('synced');
    updateLastSyncLabel(now);
    return true;
  } catch (e) {
    _localWriteAt = 0; // reset guard on failure
    console.error('[Shohoj] Cloud save failed:', e);
    setSyncIndicator('error');
    showToast('⚠ Cloud save failed — data saved locally', true);
    return false;
  }
}

// ── Save to cloud ─────────────────────────────────────────────────────────────
function saveToCloud(stateSnap, options = {}) {
  if (!currentUser) return Promise.resolve(false);

  const { immediate = false } = options;

  // If we just applied cloud data (page reloaded after applyCloudData), the very
  // first debounced saveToCloud call is just echoing cloud data back — skip it.
  // Uses a separate flag so it doesn't interfere with the migration modal check.
  // immediate=true calls (explicit uploads during sign-in) are never skipped.
  if (!immediate) {
    try {
      const skipEcho = sessionStorage.getItem('shohoj_skip_first_save');
      if (skipEcho) {
        sessionStorage.removeItem('shohoj_skip_first_save');
        console.log('[Shohoj] Skipping first save-back after cloud apply');
        return Promise.resolve(true);
      }
    } catch(e) {}
  }

  if (immediate) {
    const queuedResolvers = drainQueuedCloudResolvers();
    if (_cloudSaveTimer) clearTimeout(_cloudSaveTimer);
    _cloudSaveTimer = null;
    _queuedCloudSnap = null;
    _activeCloudSave = _activeCloudSave.then(() => persistCloudState(stateSnap));
    return _activeCloudSave.then(result => {
      queuedResolvers.forEach(resolve => resolve(result));
      return result;
    });
  }

  _queuedCloudSnap = stateSnap;
  if (!navigator.onLine) {
    setSyncIndicator('offline');
  } else {
    setSyncIndicator('syncing');
  }

  return new Promise(resolve => {
    _queuedCloudResolvers.push(resolve);
    if (_cloudSaveTimer) clearTimeout(_cloudSaveTimer);
    _cloudSaveTimer = setTimeout(() => {
      const snap = _queuedCloudSnap;
      const resolvers = drainQueuedCloudResolvers();
      _queuedCloudSnap = null;
      _cloudSaveTimer = null;
      _activeCloudSave = _activeCloudSave.then(() => persistCloudState(snap));
      _activeCloudSave.then(result => {
        resolvers.forEach(done => done(result));
      });
    }, CLOUD_SAVE_DEBOUNCE_MS);
  });
}

// ── Load from cloud ───────────────────────────────────────────────────────────
async function loadFromCloud() {
  if (!currentUser) return null;
  try {
    const snap = await getDoc(userDocRef(currentUser.uid));
    if (!snap.exists()) return null;
    const raw = snap.data().data;
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    console.error('[Shohoj] Cloud load failed:', e);
    return null;
  }
}

// ── Real-time listener ────────────────────────────────────────────────────────
function startRealtimeSync(uid) {
  // Reached only once the local-vs-cloud decision is settled, on every branch.
  _cloudReconciled = true;
  if (_unsubscribeSnapshot) { _unsubscribeSnapshot(); _unsubscribeSnapshot = null; }

  // Skip the very first snapshot — it's always the current state we just loaded,
  // not an update from another device.
  let isFirstSnapshot = true;

  _unsubscribeSnapshot = onSnapshot(userDocRef(uid), snap => {
    // Always skip the first snapshot on subscription — it's the current state
    if (isFirstSnapshot) {
      isFirstSnapshot = false;
      return;
    }

    // Skip snapshots that arrived within the grace window after THIS tab wrote.
    // This prevents our own saves from triggering a false "other device" reload.
    if (Date.now() - _localWriteAt < LOCAL_WRITE_GRACE_MS) {
      console.log('[Shohoj] Ignoring own-write snapshot');
      return;
    }

    // We have unsynced local changes queued (debounced save not yet flushed),
    // so local is ahead of cloud. Reloading now would clobber the user's
    // in-progress edit (e.g. a transcript import) with the stale cloud copy.
    // Let our pending write win instead.
    if (_cloudSaveTimer || _queuedCloudSnap) {
      console.log('[Shohoj] Pending local save — ignoring snapshot to avoid clobber');
      return;
    }

    if (!snap.exists()) return;
    const raw = snap.data()?.data;
    if (!raw) return;

    try {
      const localRaw = localStorage.getItem(STORAGE_KEY) || '';

      // Compare only the actual data content, ignoring Firestore metadata
      const localFingerprint = getDataFingerprint(localRaw);
      const cloudFingerprint = getDataFingerprint(raw);

      if (localFingerprint === cloudFingerprint) {
        // Data is identical — no action needed
        return;
      }

      // Genuine update from another device — apply and reload
      console.log('[Shohoj] Real update from another device — reloading');
      sessionStorage.setItem('shohoj_cloud_applied', '1');
      localStorage.setItem(STORAGE_KEY, raw);
      // The routine, watchlist, review receipt and profile travel in the same
      // doc; fan them back out to their own keys before the reload, or the
      // modules that read those keys would boot on the old device's copy.
      applyPersonalSlices(parseStoredState(raw), currentUser?.uid);
      showToast('📡 Data updated from another device — reloading…');
      setTimeout(() => window.location.reload(), 1500);
    } catch(e) {
      console.error('[Shohoj] Real-time sync error during comparison:', e);
    }
  }, err => { console.error('[Shohoj] Real-time sync error:', err); });
}

function stopRealtimeSync() {
  if (_unsubscribeSnapshot) { _unsubscribeSnapshot(); _unsubscribeSnapshot = null; }
}

// ── Account data deletion ─────────────────────────────────────────────────────
async function deleteCloudDataSilent() {
  if (!currentUser) return true;
  try {
    stopRealtimeSync();
    await deleteDoc(userDocRef(currentUser.uid));
    try { localStorage.removeItem(LAST_SYNC_KEY); } catch(e) {}
    return true;
  } catch (e) {
    console.error('[Shohoj] Silent delete failed:', e);
    if (currentUser?.uid) startRealtimeSync(currentUser.uid);
    return false;
  }
}

async function deleteCloudData() {
  if (!currentUser) return;
  const confirmed = await showConfirmModal({
    icon:          '🗑️',
    title:         'Delete cloud data?',
    body:          'This will permanently delete all your Shohoj data from the cloud. Your local data on this device will remain untouched.',
    confirmLabel:  'Delete cloud data',
    confirmDanger: true,
  });
  if (!confirmed) return;
  try {
    stopRealtimeSync();
    await deleteDoc(userDocRef(currentUser.uid));
    startRealtimeSync(currentUser.uid);
    showToast('Cloud data deleted successfully', false, true);
    setSyncIndicator('synced');
    try { localStorage.removeItem(LAST_SYNC_KEY); } catch(e) {}
  } catch (e) {
    console.error('[Shohoj] Delete failed:', e);
    showToast('⚠ Failed to delete cloud data — please try again', true);
  }
}

// ── Sync status persistence ───────────────────────────────────────────────────
function restoreSyncLabel() {
  try {
    const ts = localStorage.getItem(LAST_SYNC_KEY);
    if (ts) updateLastSyncLabel(parseInt(ts));
  } catch(e) {}
}

function updateLastSyncLabel(timestamp) {
  const el = document.getElementById('lastSyncLabel');
  if (!el || !timestamp) return;
  const diff = Math.floor((Date.now() - timestamp) / 1000);
  let text;
  if (diff < 60)         text = 'Synced just now';
  else if (diff < 3600)  text = `Synced ${Math.floor(diff / 60)}m ago`;
  else if (diff < 86400) text = `Synced ${Math.floor(diff / 3600)}h ago`;
  else                   text = `Synced ${Math.floor(diff / 86400)}d ago`;
  el.textContent   = text;
  el.style.display = '';
}

// ── Offline detection ─────────────────────────────────────────────────────────
function initOfflineDetection() {
  const handleOnline = () => {
    setSyncIndicator('synced');

  const handleOffline = () => { setSyncIndicator('offline'); showOfflineBanner(); };

// ── Sign out ──────────────────────────────────────────────────────────────────
// Signing out used to end the Firebase session and stop there, leaving every
// semester, the routine and the review record sitting in localStorage for
// whoever opened the browser next — and js/main.js reads them back at boot with
// no auth check, so a reload did not help either (#627). Sign-out now clears the
// device, which is what a student on a lab machine already believes it does.
//
// The cost of getting this wrong is somebody's transcript, so the erase is
// gated on two things: the account demonstrably holding the same data, and the
// student saying yes to a dialog that spells out what goes.

const SIGN_OUT_RELOAD_MS = 900;

/** Push the debounced save through, so the last seconds of typing get a chance
 *  to reach the account before we ask whether erasing is safe. */
async function flushPendingCloudSave() {
  const queued = _queuedCloudSnap;
  if (queued) await saveToCloud(queued, { immediate: true }).catch(() => false);
  await _activeCloudSave.catch(() => false);
}

/** Does the account hold everything this device holds?
 *
 * Compared by fingerprint — the same content compare startRealtimeSync uses —
 * because shohoj_last_sync only records that a write was attempted, not that it
 * carried what is on screen now. Every uncertainty (offline, an unreadable doc,
 * a queued save that never landed) answers false, which turns into a warning
 * rather than a silent erase. */
async function cloudCopyIsCurrent() {
  if (!currentUser) return false;
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return false; }
  if (!raw) return true;                   // nothing on this device to lose
  // Present but unreadable is not the same as absent: a snapshot truncated by a
  // quota error is still the only copy of something, and claiming it is backed
  // up would erase it under the reassuring half of the dialog.
  const local = parseStoredState(raw);
  if (!local) return false;
  if (!navigator.onLine) return false;
  const cloud = await loadFromCloud();
  if (!cloud) return false;
  return getDataFingerprint(local) === getDataFingerprint(cloud);
}

// The backup check can sit on a Firebase call for several seconds, during which
// the button looks dead and invites a second click — which would stack a second
// dialog over the first.
let _signOutInFlight = false;

async function signOutUser() {
  if (!auth || _signOutInFlight) return;
  _signOutInFlight = true;
  try {
    await runSignOut();
  } finally {
    _signOutInFlight = false;
  }
}

async function runSignOut() {
  await flushPendingCloudSave();
  const backedUp = await cloudCopyIsCurrent();

  // Everything named here rides in the cloud snapshot now (#627), so this is a
  // promise the restore path has to keep — see applyPersonalSlices.
  const confirmed = await showConfirmModal({
    icon:  backedUp ? '🚪' : '⚠️',
    title: 'Sign out and clear this device?',
    body:
      'Shohoj will remove your semesters, routine, watchlist and profile from this '
      + 'device. They stay in your account — sign in on any device and they come back.'
      + (backedUp
        ? ''
        : '<br><br><strong>Your account does not have your latest changes yet.</strong> '
          + 'Shohoj could not save them just now, so those changes would be lost.'),
    confirmLabel:  'Sign out and clear',
    confirmDanger: true,
  });
  if (!confirmed) return;

  const savedHook = window._shohoj_onSave;
  clearCloudAppliedFlag();
  clearQueuedCloudSave(false);
  stopRealtimeSync();
  // Detach the cloud-save hook before anything touches state: resetting the app
  // fires saveState(), and an empty snapshot reaching users/{uid} would destroy
  // the backup this flow just verified (handleClearData guards the same way).
  window._shohoj_onSave = null;

  try {
    await signOut(auth);
  } catch (e) {
    // The session is still live and the page stays put, so put the save hook
    // back and leave the device alone.
    console.error('[Shohoj] Sign-out failed:', e);
    window._shohoj_onSave = savedHook;
    showToast('⚠ Sign-out failed — please try again', true, true);
    return;
  }

  // Past here the session is gone, so the wipe has to happen whatever else
  // does: emptying the in-memory copy first is only there to stop a render on
  // the way out from writing the snapshot back.
  try {
    if (typeof window._shohoj_resetAppState === 'function') window._shohoj_resetAppState();
  } catch (e) {
    console.error('[Shohoj] State reset failed on sign-out:', e);
  }
  clearPersonalData();

  showToast('Signed out — this device is clear', false, true);
  // Then reload rather than hand-resetting each module: the routine, seats,
  // reviews, profile and planner tabs each hold their own copy in memory, and
  // one missed is the leak this fixes.
  setTimeout(() => window.location.reload(), SIGN_OUT_RELOAD_MS);
}

// ── Google One Tap ────────────────────────────────────────────────────────────
// Surfaces Google's One Tap prompt to signed-out visitors so first-time users
// can sign in without hunting for the button. Restricted to BRACU G-Suite via
// the `hd` hint; the credential is exchanged for a Firebase session, after which
// the existing onAuthStateChanged domain guard + sync flow take over unchanged.
// Fully disabled (no-op) when no client ID is configured. Closing the prompt
// triggers Google's own cooldown, so it won't nag on every reload.
let _oneTapReady    = null;   // Promise — resolves true once GIS is initialized
let _oneTapPrompted = false;  // already auto-prompted this page-load

function _loadGisScript() {
  return new Promise((resolve, reject) => {
    if (window.google?.accounts?.id) { resolve(); return; }
    const existing = document.getElementById('gsiClient');
    if (existing) {
      existing.addEventListener('load',  () => resolve());
      existing.addEventListener('error', reject);
      return;
    }
    const s = document.createElement('script');
    s.id = 'gsiClient';
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.defer = true;
    s.onload  = () => resolve();
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function _onOneTapCredential(response) {
  const idToken = response?.credential;
  if (!idToken || !auth) return;
  try {
    // onAuthStateChanged enforces the BRACU domain + runs the sync flow.
    await signInWithCredential(auth, GoogleAuthProvider.credential(idToken));
  } catch (e) {
    console.error('[Shohoj] One Tap sign-in failed:', e);
  }
}

function _initOneTap() {
  if (_oneTapReady) return _oneTapReady;
  if (!googleClientId || !auth) { _oneTapReady = Promise.resolve(false); return _oneTapReady; }
  _oneTapReady = _loadGisScript().then(() => {
    if (!window.google?.accounts?.id) return false;
    window.google.accounts.id.initialize({
      client_id:             googleClientId,
      callback:              _onOneTapCredential,
      auto_select:           false,            // never silently sign in
      cancel_on_tap_outside: true,
      context:               'signin',
      hd:                    'g.bracu.ac.bd',  // only surface BRACU accounts
      use_fedcm_for_prompt:  true,             // required path on modern Chrome
    });
    return true;
  }).catch(e => {
    console.warn('[Shohoj] One Tap unavailable:', e?.message || e);
    return false;
  });
  return _oneTapReady;
}

async function maybePromptOneTap() {
  if (!googleClientId || !auth) return;
  if (currentUser || _oneTapPrompted) return;
  _oneTapPrompted = true;
  const ok = await _initOneTap();
  if (!ok || currentUser || !window.google?.accounts?.id) return;
  try { window.google.accounts.id.prompt(); }
  catch (e) { console.warn('[Shohoj] One Tap prompt failed:', e?.message || e); }
}

function dismissOneTap() {
  if (!window.google?.accounts?.id) return;
  try { window.google.accounts.id.cancel(); } catch (_e) {}
}

// ── Init auth ─────────────────────────────────────────────────────────────────
function initAuth() {
  restoreSyncLabel();
  initOfflineDetection();
  _authReady = false;
  setAuthBtnLoading(true);

  if (!auth || !db) {
    currentUser = null;
    _isAdminCached = false;
    notifyAuthStateReady();
    setAuthBtnLoading(false);
    updateAuthUI(null);
    return;
  }

  onAuthStateChanged(auth, async user => {
    // ── Domain enforcement ─────────────────────────────────────────────────
    // Deliberately still BRACU-only, unlike the shell's registry-driven guard
    // in src/platform/auth/firebaseAuthSource.ts.
    //
    // This is the legacy bundle, and it is BRACU all the way down: the baked-in
    // bracu-section.json, the course catalog, seats, routine and the campus map
    // have no notion of another campus. Admitting an NSU student here would
    // sign them in to a BRACU app wearing their name, which is worse than
    // turning them away. Multi-campus sign-in belongs to the shell, which is
    // where the university registry is actually wired up.
    let tokenClaims = null;
    if (user) {
      const tokenResult = await user.getIdTokenResult(true).catch(() => null);
      tokenClaims = tokenResult?.claims || null;
      const isBracuEmail = user.email?.toLowerCase().endsWith('@g.bracu.ac.bd');
      const isVerifiedEmail = user.emailVerified === true || tokenClaims?.email_verified === true;
      const signInProvider = tokenClaims?.firebase?.sign_in_provider || '';
      const isGoogleProvider = signInProvider === 'google.com';
      const isAllowedBracuUser = isBracuEmail && isVerifiedEmail && isGoogleProvider;
      if (!isAllowedBracuUser && tokenClaims?.admin !== true) {
        await signOut(auth);
        setAuthBtnLoading(false);
        showToast('⚠ Only verified BRACU Google accounts are supported', true, true);
        return;
      }
    }

    _isAdminCached = tokenClaims?.admin === true;
    currentUser = user;
    notifyAuthStateReady();
    setAuthBtnLoading(false);

    if (user) {
      dismissOneTap();  // close any visible prompt now that we're signed in
      // ── 30-day session expiry ────────────────────────────────────────────
      let sessionStart = null;
      try { sessionStart = parseInt(localStorage.getItem(SESSION_START_KEY)); } catch(e) {}
      const now = Date.now();
      if (!sessionStart || isNaN(sessionStart)) {
        try { localStorage.setItem(SESSION_START_KEY, String(now)); } catch(e) {}
        const firstName = firstDisplayName(user.displayName);
        showToast(`Welcome to Shohoj, ${firstName} `, false, true);
      } else if (now - sessionStart > SESSION_MAX_MS) {
        try { localStorage.removeItem(SESSION_START_KEY); } catch(e) {}
        stopRealtimeSync();
        await signOut(auth);
        showToast('Your session expired — please sign in again', true, true);
        return;
      }

      updateAuthUI(user);

      _cloudReconciled = false;
      const cloudData = await loadFromCloud();
      let localRaw = null;
      try { localRaw = localStorage.getItem(STORAGE_KEY); } catch(e) {}
      const localParsed = parseStoredState(localRaw, 'local');
      const hasLocal = !!localParsed;
      const hasCloud = !!cloudData;

      if (!hasLocal && !hasCloud) {
        sessionStorage.setItem('shohoj_cloud_applied', '1');
        setSyncIndicator('synced'); startRealtimeSync(user.uid); return;
      }
      if (!hasLocal && hasCloud) { applyCloudData(cloudData); return; }
      if (hasLocal && !hasCloud) {
        setSyncIndicator('syncing');
        await saveToCloud(localParsed, { immediate: true });
        // Don't remove localStorage — keep it as the source of truth for this tab.
        // The realtime listener will ignore this write via the local-write guard
        // (_localWriteAt), so we don't need shohoj_skip_first_save here — that flag
        // would silently drop the user's first edit after sign-in.
        sessionStorage.setItem('shohoj_cloud_applied', '1');
        showToast('Data uploaded to your cloud account ✓', false, true);
        startRealtimeSync(user.uid); return;
      }

      // ── Both local and cloud data exist ───────────────────────────────
      const justApplied = sessionStorage.getItem('shohoj_cloud_applied');
      if (justApplied) {
        sessionStorage.setItem('shohoj_skip_first_save', '1');
        setSyncIndicator('synced'); startRealtimeSync(user.uid); return;
      }

      const localSems   = localParsed?.semesters?.length || 0;
      const cloudSems   = cloudData?.semesters?.length   || 0;

      if (localSems === 0) {
        applyCloudData(cloudData); return;
      }

      // Compare fingerprints — if they're the same data, skip migration modal
      const localFingerprint = getDataFingerprint(localRaw);
      const cloudFingerprint = getDataFingerprint(JSON.stringify(cloudData));
      if (localFingerprint === cloudFingerprint) {
        // Local already equals cloud, so nothing was applied and there is no
        // echo-back save to skip. Do NOT arm shohoj_skip_first_save here — that
        // flag would silently swallow the user's first real save after sign-in
        // (e.g. a transcript import), leaving the cloud stuck on the old data.
        sessionStorage.setItem('shohoj_cloud_applied', '1');
        setSyncIndicator('synced'); startRealtimeSync(user.uid); return;
      }

      const choice = await showMigrationModal(localSems, cloudSems);

      if (choice === 'local') {
        setSyncIndicator('syncing');
        await saveToCloud(localParsed, { immediate: true });
        sessionStorage.setItem('shohoj_cloud_applied', '1');
        showToast('Local data saved to cloud ✓', false, true);
        setSyncIndicator('synced');
      } else {
        applyCloudData(cloudData); return;
      }
      startRealtimeSync(user.uid);

    } else {
      currentUser = null;
      _cloudReconciled = true;
      notifyAuthStateReady();
      stopRealtimeSync();
      clearCloudAppliedFlag();
      clearQueuedCloudSave(false);
      _localWriteAt = 0;
      updateAuthUI(null);
      let raw = null;
      try { raw = localStorage.getItem(STORAGE_KEY); } catch(e) {}
      const parsed = parseStoredState(raw, 'local');
      maybePromptOneTap();  // auto-surface One Tap for signed-out visitors
    }
  });
}

// ── Apply cloud data ──────────────────────────────────────────────────────────
// Applies cloud data directly into the running app without reloading the page.
// Writes to localStorage so the app's state restore logic can read it, then
// calls the live state functions to update the UI immediately.
function applyCloudData(cloudData) {
  // The other terminal branch of the reconciliation (cloud wins).
  _cloudReconciled = true;
  let appliedSlices = false;
  try {
    sessionStorage.setItem('shohoj_cloud_applied', '1');
    sessionStorage.setItem('shohoj_skip_first_save', '1');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudData));
    // Same fan-out as the realtime path: the calculator is applied in memory
    // below, but the routine/seats/reviews/profile modules read their own keys.
    appliedSlices = applyPersonalSlices(cloudData, currentUser?.uid);
  } catch(e) {}

  // A slice landed, so reload rather than applying in memory.
  //
  // _shohoj_applyState restores the CALCULATOR only. The routine, seats,
  // reviews and profile modules each read their key once at module load, so on
  // an already-booted page the fan-out above changes storage and nothing else:
  // a student signing in on a second device got their semesters back and an
  // empty Routine Builder, with the routine sitting in localStorage unread.
  // Reloading is how every other module re-reads (#627).
  if (appliedSlices) {
    window.location.reload();
    return;
  }

  // Apply directly into the running app — no page reload needed.
  // window._shohoj_applyState is set by main.js and handles full state restoration.
  if (typeof window._shohoj_applyState === 'function') {
    window._shohoj_applyState(cloudData);
  } else {
    // Fallback: if the app isn't fully booted yet (e.g. very fast sign-in on
    // first load before main.js runs), a single reload is unavoidable.
    window.location.reload();
  }
}

// ── Seat-drop alert sync ──────────────────────────────────────────────────────
// Mirror the Seat Status watchlist to Firestore (seatAlertWatches/{uid}) so the
// cron Worker can email the signed-in student when a watched seat opens — even
// with Shohoj closed. No-op (resolves false) when signed out; the Seats tab then
// falls back to in-tab alerts only and prompts sign-in. The doc is fully
// overwritten each sync; `email` is pinned to the user's own address (enforced
// again by firestore.rules) so a watch can only ever notify its own owner.
window._shohoj_syncSeatAlerts = async function(sections, enabled) {
  if (!currentUser || !currentUser.email || !db) return false;
  try {
    const list = (Array.isArray(sections) ? sections : []).slice(0, 50)
      .map(s => ({ id: Number(s.id), code: String(s.code || ''), name: String(s.name || '') }))
      .filter(s => Number.isFinite(s.id));
    // The caller (Seats tab) owns the on/off preference and passes the resolved
    // flag; fall back to the old "armed when watching" rule if omitted.
    const armed = typeof enabled === 'boolean' ? enabled : list.length > 0;
    await setDoc(doc(db, 'seatAlertWatches', currentUser.uid), {
      email:     currentUser.email,
      enabled:   armed,
      sections:  list,
      updatedAt: serverTimestamp(),
    });
    return true;
  } catch (e) {
    console.error('[Shohoj] Seat-alert sync failed:', e);
    return false;
  }
};

// Reviews are written through the Cloudflare Worker (`POST /reviews`) using a
// service-account identity. Firestore rules deny all client creates on
// `facultyReviews`, so the canonical sha256(uid|initials|course) ID can't be
// subverted by clients posting under arbitrary hex suffixes.
// Privacy-preserving local "receipt" of reviews this browser submitted, keyed by
// uid. Public review docs store no uid (authorship is only the non-reversible
// sha256(uid|initials|course) doc id), so this local list is the only way the
// Profile tab can show a student "your reviews" without a de-anonymizing query.
// Best-effort: localStorage may be unavailable, and reviews written on another
// device won't appear here.
const MY_REVIEWS_KEY = 'shohoj_my_reviews_v1';
function _recordMyReview(uid, entry) {
  if (!uid) return;
  try {
    const all = JSON.parse(localStorage.getItem(MY_REVIEWS_KEY) || '{}');
    const list = Array.isArray(all[uid]) ? all[uid] : [];
    const key = `${entry.facultyInitials}|${entry.courseCode}`;
    const next = list.filter(r => `${r.facultyInitials}|${r.courseCode}` !== key);
    next.push(entry);
    all[uid] = next;
    localStorage.setItem(MY_REVIEWS_KEY, JSON.stringify(all));
    // The receipt rides in the cloud snapshot (#627), but nothing about writing
    // a review touches calculator state, so nothing would otherwise push it.
    if (typeof window._shohoj_saveState === 'function') window._shohoj_saveState();
  } catch { /* storage unavailable — non-fatal */ }
}

window._shohoj_submitReview = async function(payload) {
  if (!currentUser) return { ok: false, error: 'Not signed in' };
  const base = getPapersWorkerUrl();
  if (!base) return { ok: false, error: 'Review service not configured' };
  const token = await getCurrentUserIdToken(currentUser);
  if (!token) return { ok: false, error: 'Could not get auth token' };
  try {
    const res = await fetch(`${base}/reviews`, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        facultyInitials: payload?.facultyInitials,
        courseCode:      payload?.courseCode,
        semester:        payload?.semester || '',
        text:            payload?.text     || '',
        ratings:         payload?.ratings,
      }),
    });
    if (res.status === 409) {
      return {
        ok: false,
        code: 'already-exists',
        error: 'You have already submitted a review for this faculty-course pair. Reviews cannot be edited from the client.',
      };
    }
    if (!res.ok) {
      let msg = 'Submission failed';
      try { msg = (await res.json()).error || msg; } catch {}
      return { ok: false, error: msg };
    }
    const data = await res.json().catch(() => ({}));
    _recordMyReview(currentUser.uid, {
      id:              data.id || null,
      facultyInitials: payload?.facultyInitials || '',
      courseCode:      payload?.courseCode || '',
      semester:        payload?.semester || '',
      at:              Date.now(),
    });
    return { ok: true, id: data.id || null };
  } catch (e) {
    console.error('[Shohoj] submitReview failed:', e);
    return { ok: false, error: e.message || 'Submission failed' };
  }
};

window._shohoj_fetchReviewById = async function(id) {

window._shohoj_reportReview = async function({ id, reviewId, reason, reporterUid }) {
  if (!currentUser) return { ok: false, error: 'Not signed in' };
  if (!id || typeof id !== 'string') return { ok: false, error: 'Invalid report id' };
  if (reporterUid !== currentUser.uid) return { ok: false, error: 'Invalid reporter' };
  try {
    const ref = doc(db, 'reviewReports', id);
    await setDoc(ref, {
      reviewId: String(reviewId || '').slice(0, 128),
      reason:   String(reason || '').slice(0, 300),
      reporterUid: currentUser.uid,
      createdAt: serverTimestamp(),
    });
    return { ok: true };
  } catch (e) {
    console.error('[Shohoj] reportReview failed:', e);
    if (e.code === 'permission-denied') {
      return { ok: false, error: 'Report could not be submitted. The review may have already been removed or you may have reported it already.' };
    }
    return { ok: false, error: e.message || 'Report failed' };
  }
};

// Fetch reviews scoped to a faculty, optionally a course, with paging.
// `after` is the last review doc from the previous page (pass through).
window._shohoj_fetchReviews = async function({ facultyInitials, courseCode, pageSize = 50, after = null }) {
  if (!currentUser || !facultyInitials) return { reviews: [], nextCursor: null };
  try {
    const col = collection(db, 'facultyReviews');
    const constraints = [where('facultyInitials', '==', facultyInitials)];
    if (courseCode) constraints.push(where('courseCode', '==', courseCode));
    constraints.push(orderBy('createdAt', 'desc'));
    if (after && after._cursor) constraints.push(startAfter(after._cursor));
    constraints.push(qLimit(Math.min(pageSize, 200)));
    const q = query(col, ...constraints);
    const snap = await getDocs(q);
    const reviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const last = snap.docs[snap.docs.length - 1];
    const nextCursor = snap.docs.length === pageSize && last ? { _cursor: last } : null;
    return { reviews, nextCursor };
  } catch (e) {
    console.warn('[Shohoj] fetchReviews failed:', e);
    return { reviews: [], nextCursor: null };
  }
};

window._shohoj_fetchFacultyProfiles = async function(initialsArr) {
  if (!currentUser || !Array.isArray(initialsArr) || !initialsArr.length) return [];
  try {
    const normalized = [...new Set(initialsArr.map(i => String(i).toUpperCase().trim()).filter(Boolean))];
    const results = [];
    for (let i = 0; i < normalized.length; i += 30) {
      const chunk = normalized.slice(i, i + 30);
      const col = collection(db, 'facultyProfiles');
      const q = query(col, where(documentId(), 'in', chunk));
      const snap = await getDocs(q);
      snap.docs.forEach(d => results.push({ initials: d.id, ...d.data() }));
    }
    return results;
  } catch (e) {
    console.warn('[Shohoj] fetchFacultyProfiles failed:', e);
    return [];
  }
};

// ── Account dropdown menu ─────────────────────────────────────────────────────
// The signed-in account pill opens this lightweight menu (Profile / Seat
// watchlist / Admin / Sign out) instead of navigating straight to the Profile
// page, so the common actions — especially sign-out — are one click away
// without a full page navigation. The menu is appended to <body> and positioned
// `fixed` against the pill's bounding rect so the nav's backdrop-filter/overflow
// can't clip it and it stays glued to the pill on scroll/resize. Identity fields
// (displayName / email / photoURL) come from Google's identity data and are
// outside our trust boundary, so they're written via textContent / guarded src,
// never innerHTML. Icons are emoji set via textContent, matching the calc tabs.
let _accountMenuEl      = null;
let _accountMenuCleanup = null;

function _closeAccountMenu() {
  if (_accountMenuCleanup) { _accountMenuCleanup(); _accountMenuCleanup = null; }
  if (_accountMenuEl) { _accountMenuEl.remove(); _accountMenuEl = null; }
  const btn = document.getElementById('authBtn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

function _positionAccountMenu(btn, menu) {
  const r = btn.getBoundingClientRect();
  const margin = 8;
  const width = menu.offsetWidth;
  let left = Math.round(r.right - width);              // anchor menu's right edge to pill's
  const maxLeft = window.innerWidth - width - margin;
  if (left > maxLeft) left = maxLeft;
  if (left < margin)  left = margin;
  menu.style.top  = `${Math.round(r.bottom + 6)}px`;
  menu.style.left = `${left}px`;
}

function _accountMenuKeyNav(e, menu) {
  if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) return;
  e.preventDefault();
  const items = Array.from(menu.querySelectorAll('[role="menuitem"]'));
  if (!items.length) return;
  const idx = items.indexOf(document.activeElement);
  let next;
  if (e.key === 'ArrowDown')    next = idx < 0 ? 0 : (idx + 1) % items.length;
  else if (e.key === 'ArrowUp') next = idx <= 0 ? items.length - 1 : idx - 1;
  else if (e.key === 'Home')    next = 0;
  else                          next = items.length - 1;
  items[next].focus();
}

function _buildAccountMenu(user) {
  const menu = document.createElement('div');
  menu.className = 'account-menu';
  menu.setAttribute('role', 'menu');
  menu.setAttribute('aria-label', 'Account menu');

  // Identity header — avatar + name + email.
  const header = document.createElement('div');
  header.className = 'account-menu-header';
  const av = document.createElement('div');
  av.className = 'account-menu-avatar';
  if (isSafeAvatarUrl(user.photoURL)) {
    const img = document.createElement('img');
    img.setAttribute('referrerpolicy', 'no-referrer');
    img.src = user.photoURL;
    img.alt = '';
    av.appendChild(img);
  } else {
    av.classList.add('is-fallback');
    av.textContent = (user.displayName || user.email || '?').charAt(0).toUpperCase();
  }
  const idBlock = document.createElement('div');
  idBlock.className = 'account-menu-id';
  const nameEl = document.createElement('div');
  nameEl.className = 'account-menu-name';
  nameEl.textContent = user.displayName || 'Signed in';
  const emailEl = document.createElement('div');
  emailEl.className = 'account-menu-email';
  emailEl.textContent = user.email || '';
  idBlock.appendChild(nameEl);
  idBlock.appendChild(emailEl);
  header.appendChild(av);
  header.appendChild(idBlock);
  menu.appendChild(header);

  const addItem = (emoji, label, onActivate, opts = {}) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'account-menu-item' + (opts.danger ? ' is-danger' : '');
    item.setAttribute('role', 'menuitem');
    item.tabIndex = -1;
    const ic = document.createElement('span');
    ic.className = 'account-menu-icon';
    ic.setAttribute('aria-hidden', 'true');
    ic.textContent = emoji;
    const lb = document.createElement('span');
    lb.className = 'account-menu-label';
    lb.textContent = label;
    item.appendChild(ic);
    item.appendChild(lb);
    item.addEventListener('click', () => { _closeAccountMenu(); onActivate(); });
    menu.appendChild(item);
    return item;
  };
  const addSep = () => {
    const sep = document.createElement('div');
    sep.className = 'account-menu-sep';
    menu.appendChild(sep);
  };

  addItem('👤', 'View profile', () => { window.location.href = 'profile/'; });
  addItem('🪑', 'Seat watchlist', () => {
    if (typeof window.switchCalcTab === 'function') {
      window.switchCalcTab('seats');
      document.getElementById('calculator')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      window.location.href = './#calculator/seats';
    }
  });
  if (_isAdminUser()) {
    addItem('🛡️', 'Admin dashboard', () => { window.location.href = 'admin/'; });
  }
  addSep();
  addItem('🚪', 'Sign out', () => { signOutUser(); }, { danger: true });

  return menu;
}

function _toggleAccountMenu(user) {
  if (_accountMenuEl) { _closeAccountMenu(); return; }
  const btn = document.getElementById('authBtn');
  if (!btn) return;

  const menu = _buildAccountMenu(user);
  document.body.appendChild(menu);
  _accountMenuEl = menu;
  btn.setAttribute('aria-expanded', 'true');
  _positionAccountMenu(btn, menu);
  menu.querySelector('[role="menuitem"]')?.focus();

  const onDocClick = (e) => {
    if (!menu.contains(e.target) && !btn.contains(e.target)) _closeAccountMenu();
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { _closeAccountMenu(); btn.focus(); return; }
    _accountMenuKeyNav(e, menu);
  };
  const reposition = () => { if (_accountMenuEl) _positionAccountMenu(btn, _accountMenuEl); };
  // Defer the outside-click listener so the click that opened the menu doesn't
  // immediately close it.
  setTimeout(() => document.addEventListener('click', onDocClick), 0);
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', reposition);
  window.addEventListener('scroll', reposition, true);
  _accountMenuCleanup = () => {
    document.removeEventListener('click', onDocClick);
    document.removeEventListener('keydown', onKey);
    window.removeEventListener('resize', reposition);
    window.removeEventListener('scroll', reposition, true);
  };
}

function updateAuthUI(user) {
  _toggleAdminNavBtn();
  _closeAccountMenu();   // drop any open menu before repainting the pill
  const btn = document.getElementById('authBtn');
  if (!btn) return;

  if (user) {
    btn.className     = 'auth-btn-signed-in magnetic';
    btn.style.cssText = '';
    btn.disabled      = false;
    btn.title         = 'Account menu';
    btn.setAttribute('aria-haspopup', 'menu');
    btn.setAttribute('aria-expanded', 'false');
    // The pill opens the account menu (Profile / Seat watchlist / Admin / Sign
    // out) rather than navigating straight to the Profile page, so sign-out and
    // the other actions are reachable in one click. See _buildAccountMenu.
    btn.onclick       = (e) => { e.preventDefault(); e.stopPropagation(); _toggleAccountMenu(user); };
    btn.ondblclick    = null;

    const firstName = user.displayName?.split(' ')[0] || 'Account';

    // Build the signed-in pill via DOM APIs so that user.displayName /
    // user.photoURL / user.email (which come from Google's identity data
    // and are outside our trust boundary) never flow through innerHTML.
    btn.textContent = '';
    const wrap = document.createElement('div');
    wrap.className = 'auth-avatar-wrap';
    if (isSafeAvatarUrl(user.photoURL)) {
      const img = document.createElement('img');
      img.className = 'auth-avatar-img';
      img.setAttribute('referrerpolicy', 'no-referrer');
      img.src = user.photoURL;
      img.alt = firstName;
      wrap.appendChild(img);
    } else {
      const fb = document.createElement('div');
      fb.className = 'auth-avatar-fallback';
      fb.textContent = firstName.charAt(0).toUpperCase();
      wrap.appendChild(fb);
    }
    const dot = document.createElement('span');
    dot.id = 'syncDot';
    dot.className = 'auth-sync-dot';
    wrap.appendChild(dot);
    btn.appendChild(wrap);

    const nameEl = document.createElement('span');
    nameEl.className = 'auth-name';
    nameEl.textContent = firstName;
    btn.appendChild(nameEl);

    setSyncIndicator('synced');
    restoreSyncLabel();

    let syncLabel = document.getElementById('lastSyncLabel');
    if (!syncLabel) {
      syncLabel           = document.createElement('div');
      syncLabel.id        = 'lastSyncLabel';
      syncLabel.className = 'auth-last-sync';
      btn.parentNode?.insertBefore(syncLabel, btn.nextSibling);
    }
    syncLabel.style.display = '';

  } else {
    btn.className     = 'auth-btn-signed-out magnetic';
    btn.style.cssText = '';
    btn.disabled      = false;
    btn.title         = 'Sign in with your BRACU G-Suite account';
    btn.removeAttribute('aria-haspopup');
    btn.removeAttribute('aria-expanded');
    btn.onclick       = signInWithGoogle;
    btn.ondblclick    = null;
    btn.innerHTML = `
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;opacity:0.75">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" fill="currentColor"/>
      </svg>
      <span class="auth-signin-label">Sign in</span>
    `;
    const syncLabel = document.getElementById('lastSyncLabel');
    if (syncLabel) syncLabel.style.display = 'none';
  }
}

function showToast(msg, isError = false, isAuth = false) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `
    position:fixed;
    top:64px;left:50%;transform:translateX(-50%);
    background:${isError ? '#e74c3c' : '#2ECC71'};
    color:${isError ? '#fff' : '#0b0f0d'};
    padding:10px 20px;
    border-radius:100px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 4px 20px ${isError ? 'rgba(231,76,60,0.4)' : 'rgba(46,204,113,0.4)'};
    z-index:99998;
    pointer-events:none;
    animation:toastIn 0.3s ease;
    white-space:nowrap;
    max-width:calc(100vw - 40px);
  `;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0'; t.style.transition = 'opacity 0.3s';
    setTimeout(() => { if (t.parentNode) document.body.removeChild(t); }, 300);
  }, 3500);
}
