name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Tests & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Java (firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Run Firestore rules tests
        run: npm run test:rules

      - name: Build bundle (smoke test)
        run: python3 build3.py

      - name: Verify built bundle
        run: |
          test -s shohoj.html
          test -s admin.html
          # Fail if bare ES module syntax leaked into the non-module bundle
          # (firebase.js is kept as type="module"; other bundled JS must not be).
          # Also fail if 'unsafe-inline' is still present in the script-src
          # CSP directive — build3.py is supposed to replace it with sha256
          # hashes of every inline <script>. If it's still there, CSP can't
          # block injected inline scripts and we lose XSS protection.
          # Finally fail if `frame-ancestors` is missing — browser clickjacking
          # protection.
          python3 - <<'PY'
          import re, sys
          ok = True
          for path in ('shohoj.html', 'admin.html'):
              html = open(path, encoding='utf-8').read()
              stripped = re.sub(
                  r'<script\s+type=["\']module["\'][\s\S]*?</script>',
                  '', html, flags=re.IGNORECASE,
              )
              if re.search(r'\b(export|import)\s+(function|const|let|var|class|default|\{)', stripped):
                  print(f'ERROR: bare ES module syntax leaked into {path}', file=sys.stderr)
                  ok = False
              # CSP content uses single quotes for keywords like 'self' /
              # 'unsafe-inline'; capture the whole double-quoted attribute
              # value so the inner singles don't terminate the match.
              csp_m = re.search(
                  r'<meta\s+http-equiv=["\']Content-Security-Policy["\']\s+content="([^"]*)"',
                  html, flags=re.IGNORECASE,
              )
              if not csp_m:
                  print(f'ERROR: no CSP meta tag in {path}', file=sys.stderr)
                  ok = False
                  continue
              csp = csp_m.group(1)
              # Find script-src directive
              script_src_m = re.search(r'(?:^|;)\s*script-src\s+([^;]+)', csp, flags=re.IGNORECASE)
              if not script_src_m:
                  print(f'ERROR: no script-src directive in {path} CSP', file=sys.stderr)
                  ok = False
              elif "'unsafe-inline'" in script_src_m.group(1):
                  print(f'ERROR: script-src in {path} still contains \'unsafe-inline\' '
                        '(build3.py harden_script_csp should have replaced it with hashes)',
                        file=sys.stderr)
                  ok = False
              if not re.search(r'frame-ancestors\b', csp, flags=re.IGNORECASE):
                  print(f'ERROR: CSP in {path} is missing frame-ancestors '
                        '(needed to block clickjacking)', file=sys.stderr)
                  ok = False
          if not ok:
              sys.exit(1)
          print('bundles OK')
          PY
