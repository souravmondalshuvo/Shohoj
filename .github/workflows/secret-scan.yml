name: Secret scan

# On every pull request and every push to main, scan the full history reachable
# from the commit for committed credentials (API keys, tokens, private keys,
# service-account JSON). Known false positives are allowlisted narrowly in
# .gitleaks.toml.
#
# Kept out of ci.yml on purpose: editing ci.yml fires its deploy jobs, and this
# check needs neither secrets nor the build.
#
# The gitleaks binary is pinned and checksum-verified rather than pulled through
# gitleaks-action, so nothing third-party runs with a token.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the GitHub release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret added and removed within a PR is still leaked.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan history
        # --log-opts=HEAD: only commits reachable from this commit. The default
        # (--all) would also walk gh-pages, which holds generated build output.
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --log-opts=HEAD \
            --redact \
            --no-banner \
            --verbose
