<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Map — Shohoj</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232ECC71'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-size='38' font-weight='900' fill='%230b0f0d'>স</text></svg>">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('shohoj_theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <!-- The map's look: the same sheet the legacy site's Campus Map tab wears. -->
    <link rel="stylesheet" href="../css/campus-map.css" />
    <style>
      /* Standalone Campus Map page (#383), dressed as the legacy site (#887).

         The map is styled by css/campus-map.css, shared with the legacy page's
         Campus Map tab. What is here is the page around it: the legacy site's
         colour tokens, its background, its brand bar and a calculator-style
         glass card. The tokens below are css/style.css's own, verbatim —
         tests/campusMapStyles.test.js fails if the two drift. This page does
         not load style.css itself: its landing-page rules would restyle the
         map's <section>s and headings. */

/* ── TOKENS ─────────────────────────────────────────── */
    :root {
      --green:       #2ECC71;
      --green-dim:   #1a7a44;
      --green-glow:  rgba(46,204,113,0.15);
      --gold:        #F0A500;
      --accent:      #2ECC71;
      --radius:      16px;
      --transition:  0.35s cubic-bezier(.4,0,.2,1);
    }
    [data-theme="dark"] {
      --bg:          #060d09;
      --glass:       rgba(255,255,255,0.04);
      --glass2:      rgba(255,255,255,0.07);
      --glass3:      rgba(46,204,113,0.06);
      --glass-hover: rgba(255,255,255,0.09);
      --border:      rgba(46,204,113,0.18);
      --border2:     rgba(255,255,255,0.08);
      --text:        #e8f0ea;
      --text1:       #e8f0ea;
      --text2:       #8aab90;
      --text3:       #4d6b52;
      --input-bg:    rgba(0,0,0,0.25);
      --chip-border: rgba(255,255,255,0.10);
      --chip-hover:  rgba(255,255,255,0.05);
      --card-bg:     rgba(255,255,255,0.02);
      --card-bg-2:   rgba(255,255,255,0.03);
      --card-hover:  rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.08);
      --hairline:    rgba(255,255,255,0.05);
      --badge-bg:    rgba(255,255,255,0.06);
      --skel-lo:     rgba(255,255,255,0.04);
      --skel-hi:     rgba(255,255,255,0.09);
      --ink-green:   #2ecc71;
      --ink-blue:    #5b9dff;
      --ink-amber:   #f1c40f;
      --shadow:      0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(46,204,113,0.08);
      --shadow-card: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    [data-theme="light"] {
      --bg:          #f2f8f4;
      --glass:       rgba(255,255,255,0.70);
      --glass2:      rgba(255,255,255,0.85);
      --glass3:      rgba(46,204,113,0.08);
      --glass-hover: rgba(255,255,255,0.95);
      --border:      rgba(26,122,68,0.22);
      --border2:     rgba(13,41,20,0.12);
      --text:        #10241a;
      --text1:       #10241a;
      --text2:       #3f6b4d;
      --text3:       #7da28a;
      --input-bg:    rgba(255,255,255,0.85);
      --chip-border: rgba(13,41,20,0.14);
      --chip-hover:  rgba(13,41,20,0.045);
      --card-bg:     rgba(255,255,255,0.72);
      --card-bg-2:   rgba(255,255,255,0.85);
      --card-hover:  #ffffff;
      --card-border: rgba(13,41,20,0.10);
      --hairline:    rgba(13,41,20,0.08);
      --badge-bg:    rgba(13,41,20,0.06);
      --skel-lo:     rgba(0,0,0,0.04);
      --skel-hi:     rgba(0,0,0,0.09);
      --ink-green:   #187a43;
      --ink-blue:    #2b5c8f;
      --ink-amber:   #9a6c12;
      --shadow:      0 8px 32px rgba(13,41,20,0.08), 0 0 0 1px rgba(13,41,20,0.03);
      --shadow-card: 0 20px 60px rgba(13,41,20,0.07), inset 0 1px 0 rgba(255,255,255,0.9);
    }

      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: 'DM Sans', sans-serif; color: var(--text);
        background: var(--bg); min-height: 100vh; position: relative; overflow-x: hidden;
      }
      /* The legacy page's drifting background light (.orb), without the drift:
         the map's canvas repaints often enough. */
      .campus-orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1; }
      .campus-orb--1 {
        width: min(520px, 90vw); height: min(520px, 90vw); top: -120px; left: -100px;
        background: radial-gradient(circle, rgba(46,204,113,0.22) 0%, transparent 70%);
      }
      .campus-orb--2 {
        width: min(400px, 80vw); height: min(400px, 80vw); bottom: 10%; right: -80px;
        background: radial-gradient(circle, rgba(16,120,60,0.18) 0%, transparent 70%);
      }
      [data-theme="light"] .campus-orb--1 { background: radial-gradient(circle, rgba(46,204,113,0.16) 0%, transparent 70%); }
      [data-theme="light"] .campus-orb--2 { background: radial-gradient(circle, rgba(100,200,140,0.13) 0%, transparent 70%); }

      /* The legacy nav's brand (.nav-logo). Near-opaque and with no
         backdrop-filter: a blur over the map re-ran on every frame the canvas
         drew beneath it (#781). */
      .campus-topbar {
        position: sticky; top: 0; z-index: 20;
        display: flex; align-items: center; height: 64px; padding: 0 2rem;
        background: rgba(6,13,9,0.94); border-bottom: 1px solid var(--border2);
      }
      [data-theme="light"] .campus-topbar { background: rgba(242,248,244,0.96); }
      .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
      .nav-logo:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 8px; }
      .nav-logo-mark {
        width: 34px; height: 34px; background: var(--green); border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px; color: #0b0f0d; letter-spacing: -0.5px;
      }
      .nav-logo-text { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; color: var(--text); }
      .nav-logo-text span { color: var(--green); }

      /* The legacy calculator's card (.calc-wrapper + .calc-body), without its
         backdrop blur: behind it is only the already-blurred background, and
         the map's canvas inside it repaints often. */
      #campusMap {
        max-width: 1080px; margin: 2rem auto 3rem; padding: 1.8rem 2.5rem;
        background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
        box-shadow: var(--shadow-card);
      }
      [data-theme="light"] #campusMap { background: var(--glass2); }

      @media (max-width: 1080px) { #campusMap { margin: 1.5rem 1.2rem 2.5rem; padding: 1.4rem 1.6rem; } }
      @media (max-width: 480px) {
        .campus-topbar { height: 56px; padding: 0 1rem; }
        #campusMap { margin: 0.8rem 0.6rem 2rem; padding: 0.9rem; border-radius: 14px; }
      }
    </style>
  </head>
  <body>
    <div class="campus-orb campus-orb--1" aria-hidden="true"></div>
    <div class="campus-orb campus-orb--2" aria-hidden="true"></div>
    <header class="campus-topbar">
      <a class="nav-logo" href="../" aria-label="Back to Shohoj">
        <span class="nav-logo-mark" aria-hidden="true">স</span>
        <span class="nav-logo-text">Shohoj <span>সহজ</span></span>
      </a>
    </header>
    <main id="campusMap">
      <div id="root"></div>
    </main>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
