<!doctype html>
<!-- GitHub Pages custom 404 (#449).

     Two jobs:
       1. SPA fallback for the shell beta: /Shohoj/app/<route> has no file on
          static hosting, so redirect it to /Shohoj/app/?/<route> ('&' escaped
          as ~and~ so the original query survives the round-trip); the shell's
          index.html decodes that back into the pathname before the router
          boots (spa-github-pages pattern).
       2. A plain not-found page for every other missing path — legacy URLs
          must NOT get hijacked into the shell.

     Served from the site root, so the deploy job copies this file to
     _deploy/404.html verbatim. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Shohoj — page not found</title>
    <script>
      (function (l) {
        var base = '/Shohoj/app/';
        if (l.pathname.indexOf(base) !== 0) return;
        var route = l.pathname.slice(base.length).replace(/&/g, '~and~');
        l.replace(
          base + '?/' + route
            + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '')
            + l.hash
        );
      })(window.location);
    </script>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #071a0f;
        color: #d8eee0;
        font-family: 'DM Sans', system-ui, sans-serif;
        text-align: center;
      }
      main { padding: 2rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.25rem; color: #9dbfa9; }
      a {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border-radius: 999px;
        background: #2ecc71;
        color: #071a0f;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The page you were looking for doesn't exist.</p>
      <a href="/Shohoj/">Back to Shohoj</a>
    </main>
  </body>
</html>
