<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shohoj</title>
    <style>
      /* Minimal structural styling for the Phase 3 skeleton. The full visual
         system is integrated when feature routes migrate (no CSS rewrite). */
      body { margin: 0; font-family: system-ui, sans-serif; }
      .shell-skip-link {
        position: absolute; left: -999px; top: 0;
        background: #fff; padding: 8px 12px; z-index: 10;
      }
      .shell-skip-link:focus { left: 8px; }
      .shell-header { border-bottom: 1px solid rgba(0,0,0,0.12); }
      .shell-nav { display: flex; gap: 4px; padding: 12px 16px; flex-wrap: wrap; align-items: center; }
      .shell-nav-list { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .shell-nav-link { padding: 6px 12px; text-decoration: none; border-radius: 6px; color: #2d5a3d; }
      .shell-nav-link--active { background: rgba(46,204,113,0.12); font-weight: 600; }
      /* Desktop shows the full nav; the toggle only appears under the breakpoint. */
      .shell-nav-toggle { display: none; }
      @media (max-width: 720px) {
        .shell-nav-toggle {
          display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px;
          font: inherit; font-weight: 600; border-radius: 6px; cursor: pointer;
          border: 1px solid rgba(46,204,113,0.35); background: rgba(46,204,113,0.08); color: #1c7c45;
        }
        .shell-nav-toggle:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }
        /* The link list collapses to a full-width drawer below the top row. */
        .shell-nav-list { display: none; flex-basis: 100%; flex-direction: column; gap: 2px; margin-top: 8px; }
        .shell-nav-list--open { display: flex; }
        .shell-nav-link { display: block; min-height: 44px; padding: 11px 12px; }
      }
      .shell-auth { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .shell-auth-loading { color: rgba(0,0,0,0.45); font-size: 12px; }
      .shell-auth-email { color: #2d5a3d; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .shell-auth-btn {
        font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 6px;
        cursor: pointer; border: 1px solid rgba(46,204,113,0.35); background: rgba(46,204,113,0.08); color: #1c7c45;
      }
      .shell-auth-btn:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }
      .shell-main:focus { outline: none; }
      .shell-page { padding: 24px 16px; max-width: 720px; }
      .shell-muted { color: #5a8a6a; }
      .shell-route-error { padding: 24px 16px; }
      .shell-btn {
        font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
        border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #0d2914;
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      }
      .shell-btn--primary { background: #27ae60; border-color: #27ae60; color: #fff; }
      .shell-btn--danger { background: #e74c3c; border-color: #e74c3c; color: #fff; }
      .shell-btn:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }
      .shell-modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.4);
        display: flex; align-items: center; justify-content: center; padding: 16px;
      }
      .shell-modal {
        background: #fff; border-radius: 12px; padding: 20px; max-width: 420px;
        width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      }
      .shell-modal-title { margin: 0 0 8px; font-size: 18px; }
      .shell-modal-message { margin: 0 0 16px; color: #2d5a3d; }
      .shell-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
      .calc-setup {
        display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
        margin-bottom: 16px;
      }
      .calc-setup-field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #2d5a3d; }
      .calc-setup-select {
        font: inherit; padding: 6px 8px; border-radius: 8px;
        border: 1px solid rgba(0,0,0,0.2); background: #fff; max-width: 320px;
      }
      .calc-setup-credits { font-size: 13px; font-weight: 600; color: #1c7c45; padding-bottom: 8px; }
      .simulator-box { margin-top: 20px; padding: 14px 0; border-top: 1px solid rgba(0,0,0,0.12); }
      .simulator-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 12px; }
      .simulator-row label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #2d5a3d; }
      .simulator-row input { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.2); width: 130px; }
      .sim-callout { padding: 12px 14px; border-radius: 10px; border: 1px solid; margin-bottom: 8px; }
      .sim-callout--good { background: rgba(46,204,113,0.08); border-color: rgba(46,204,113,0.22); }
      .sim-callout--bad { background: rgba(231,76,60,0.06); border-color: rgba(231,76,60,0.25); }
      .sim-callout-title { font-size: 16px; font-weight: 800; color: #1c7c45; }
      .sim-callout-body { font-size: 12px; color: #2d5a3d; margin-top: 4px; }
      .sim-before-after { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 10px 12px; border: 1px solid rgba(0,0,0,0.12); border-radius: 10px; margin-bottom: 12px; }
      .sim-before-after--bad { border-color: rgba(231,76,60,0.25); background: rgba(231,76,60,0.06); }
      .sim-ba-left { display: flex; align-items: center; gap: 14px; }
      .sim-ba-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(0,0,0,0.45); }
      .sim-ba-val { font-size: 20px; font-weight: 800; }
      .sim-ba-val.red { color: #e74c3c; }
      .sim-ba-delta { font-size: 10px; font-weight: 700; color: #1c7c45; }
      .sim-difficulty-label { display: flex; justify-content: space-between; font-size: 11px; color: rgba(0,0,0,0.55); margin-bottom: 4px; }
      .sim-difficulty-bar { height: 6px; border-radius: 4px; background: rgba(0,0,0,0.08); overflow: hidden; }
      .sim-difficulty-fill { height: 100%; border-radius: 4px; }
      .sim-difficulty-fill.easy { background: #2ECC71; }
      .sim-difficulty-fill.medium { background: #F0A500; }
      .sim-difficulty-fill.hard { background: #e74c3c; }
      .sim-plan-table th, .sim-retake-table th { padding: 4px 8px; text-align: center; color: rgba(0,0,0,0.45); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(0,0,0,0.12); }
      .sim-plan-table td, .sim-retake-table td { padding: 6px 8px; border-bottom: 1px solid rgba(0,0,0,0.08); font-size: 12px; }
      .sim-retake-row { cursor: pointer; }
      .sim-retake-row.selected { background: rgba(29,185,84,0.07); }
      .sim-retake-course { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sim-retake-heading { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(0,0,0,0.45); margin-bottom: 4px; }
      .sim-strategy-badge { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; white-space: nowrap; border: 1px solid; }
      .sim-strategy-badge.retake { background: rgba(231,76,60,0.10); color: #e74c3c; border-color: rgba(231,76,60,0.28); }
      .sim-strategy-badge.repeat { background: rgba(86,180,233,0.12); color: #2d5a8a; border-color: rgba(86,180,233,0.30); }
      .sim-impact-box { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(29,185,84,0.08); border: 1px solid rgba(29,185,84,0.2); }
      .sim-legend { margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: rgba(0,0,0,0.5); }
      .sim-legend > span { display: flex; align-items: center; gap: 5px; }
      .sim-nudge { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: rgba(86,180,233,0.07); border: 1px solid rgba(86,180,233,0.22); display: flex; align-items: flex-start; gap: 10px; }
      .sim-nudge-btn { margin-top: 10px; padding: 7px 14px; border-radius: 8px; background: rgba(46,204,113,0.10); border: 1px solid rgba(46,204,113,0.25); color: #1c7c45; font-size: 12px; font-weight: 600; cursor: pointer; font: inherit; }
      .rv-modal { max-width: 440px; max-height: 92vh; overflow-y: auto; }
      .rv-subtitle { font-size: 12px; line-height: 1.5; }
      .rv-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
      .rv-field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #3a6b47; }
      .rv-input {
        font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px;
        border: 1px solid rgba(46,204,113,0.28); background: rgba(0,0,0,0.04);
        outline: none; box-sizing: border-box; font-size: 13px;
      }
      .rv-input:focus { border-color: rgba(46,204,113,0.55); }
      .rv-initials { text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; }
      .rv-text { resize: vertical; min-height: 64px; }
      .rv-count { font-size: 11px; color: #3a6b47; text-align: right; }
      .rv-field-error, .rv-error { font-size: 12px; color: #e74c3c; }
      .rv-error { margin-bottom: 10px; }
      .rv-stars-box { border: 1px solid rgba(46,204,113,0.28); border-radius: 12px; padding: 2px 14px; margin-bottom: 14px; background: rgba(0,0,0,0.04); }
      .rv-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
      .rv-row:last-of-type { border-bottom: none; }
      .rv-row-label { flex: 1; min-width: 0; }
      .rv-row-title { font-size: 13px; font-weight: 600; }
      .rv-row-hint { font-size: 11px; opacity: 0.6; margin-top: 2px; }
      .rv-row-stars { display: flex; gap: 2px; flex-shrink: 0; }
      .rv-star {
        cursor: pointer; font-size: 20px; line-height: 1; padding: 2px; color: #999;
        background: none; border: none; transition: color 0.15s, transform 0.1s; user-select: none;
      }
      .rv-star:hover { transform: scale(1.15); }
      .rv-star.filled { color: #F0A500; }
      .rv-star:focus-visible { outline: 2px solid #1c7c45; outline-offset: 1px; border-radius: 4px; }
      .ti-modal { max-width: 460px; max-height: 92vh; overflow-y: auto; }
      .ti-table {
        width: 100%; border-collapse: collapse; margin-bottom: 12px;
        border: 1px solid rgba(0,0,0,0.12); border-radius: 8px;
      }
      .ti-table th {
        padding: 6px 8px; text-align: left; font-size: 10px; color: rgba(0,0,0,0.45);
        text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(0,0,0,0.12);
      }
      .ti-table td { padding: 4px 8px; font-size: 12px; border-bottom: 1px solid rgba(0,0,0,0.08); }
      .ti-table tr:last-child td { border-bottom: none; }
      .ti-table th:not(:first-child), .ti-table td:not(:first-child) { text-align: center; }
      .ti-table td:last-child { color: #1c7c45; font-weight: 600; }
      .ti-dept { font-size: 12px; color: #2d5a3d; margin: 0 0 12px; }
      .pl-empty { text-align: center; padding: 40px 16px; color: #2d5a3d; }
      .pl-empty-icon { font-size: 32px; margin-bottom: 8px; }
      .pl-empty-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: #0d2914; }
      .pl-empty-desc { font-size: 13px; max-width: 460px; margin: 0 auto; line-height: 1.6; }
      .pl-stats { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
      .pl-stat { flex: 1; min-width: 70px; padding: 8px 10px; border-radius: 8px; border: 1px solid; text-align: center; }
      .pl-stat--green { background: rgba(46,204,113,0.06); border-color: rgba(46,204,113,0.15); }
      .pl-stat--red { background: rgba(231,76,60,0.05); border-color: rgba(231,76,60,0.12); }
      .pl-stat--blue { background: rgba(86,180,233,0.06); border-color: rgba(86,180,233,0.12); }
      .pl-stat-val { font-size: 18px; font-weight: 800; color: #1c7c45; }
      .pl-stat--red .pl-stat-val { color: #e74c3c; }
      .pl-stat--blue .pl-stat-val { color: #2d5a8a; }
      .pl-stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: rgba(0,0,0,0.45); font-weight: 600; }
      .pl-section-head { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 8px; }
      .pl-section-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(0,0,0,0.45); }
      .pl-found { font-size: 11px; color: rgba(0,0,0,0.45); }
      .pl-link-btn { font: inherit; font-size: 11px; color: rgba(0,0,0,0.45); background: none; border: none; cursor: pointer; text-decoration: underline; }
      .pl-plan-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: rgba(46,204,113,0.04); border: 1px solid rgba(46,204,113,0.12); margin-bottom: 4px; }
      .pl-plan-row-main { flex: 1; min-width: 0; }
      .pl-plan-row-name { display: flex; align-items: center; gap: 6px; }
      .pl-ok { color: #1c7c45; }
      .pl-miss { color: #e74c3c; }
      .pl-code { font-size: 11px; font-weight: 700; color: #1c7c45; background: rgba(46,204,113,0.10); border-radius: 4px; padding: 1px 6px; flex-shrink: 0; }
      .pl-name { font-size: 12px; color: #0d2914; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .pl-credits { font-size: 12px; color: #2d5a3d; flex-shrink: 0; }
      .pl-warn-hard { font-size: 10px; color: #e74c3c; margin-top: 2px; }
      .pl-warn-soft { font-size: 10px; color: #b07d1a; margin-top: 2px; }
      .pl-warn-soft-inline { font-size: 10px; color: #b07d1a; }
      .pl-icon-btn { background: none; border: none; color: rgba(0,0,0,0.4); cursor: pointer; font-size: 14px; padding: 2px; flex-shrink: 0; }
      .pl-remove { font-size: 16px; }
      .pl-credit-total { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: rgba(46,204,113,0.06); border: 1px solid rgba(46,204,113,0.15); }
      .pl-credit-total-val { font-size: 13px; font-weight: 700; }
      .pl-credit--good { color: #1c7c45; }
      .pl-credit--warn { color: #b07d1a; }
      .pl-credit--bad { color: #e74c3c; }
      .pl-credit-target { font-size: 11px; color: rgba(0,0,0,0.45); }
      .pl-impact { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: rgba(86,180,233,0.05); border: 1px solid rgba(86,180,233,0.15); flex-wrap: wrap; }
      .pl-impact-left { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #2d5a3d; }
      .pl-impact-left select { font: inherit; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.2); background: #fff; cursor: pointer; }
      .pl-impact-right { display: flex; align-items: center; gap: 10px; font-size: 12px; }
      .pl-impact-label { color: rgba(0,0,0,0.45); }
      .pl-impact-current { color: #2d5a3d; font-weight: 700; }
      .pl-impact-projected { color: #0d2914; font-weight: 800; font-size: 14px; }
      .pl-delta-up { color: #1c7c45; font-weight: 700; }
      .pl-delta-down { color: #e74c3c; font-weight: 700; }
      .pl-delta-flat { color: rgba(0,0,0,0.45); font-weight: 700; }
      .pl-promote { width: 100%; margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.35); color: #1c7c45; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }

      .pl-validation { padding: 8px 12px; border-radius: 8px; background: rgba(231,76,60,0.05); border: 1px solid rgba(231,76,60,0.12); margin-top: 10px; }
      .pl-issue { font-size: 12px; color: #e74c3c; padding: 3px 0; }
      .pl-warning { font-size: 12px; color: #b07d1a; padding: 3px 0; }
      .pl-tree { padding: 12px 14px; border-radius: 10px; background: rgba(86,180,233,0.06); border: 1px solid rgba(86,180,233,0.18); margin: 12px 0; }

      .pl-search { width: 100%; padding: 8px 12px; margin-bottom: 8px; border: 1px solid rgba(0,0,0,0.2); border-radius: 8px; font: inherit; font-size: 13px; outline: none; box-sizing: border-box; }
      .pl-filters { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }

      .pl-filter--active { border-color: rgba(46,204,113,0.35); background: rgba(46,204,113,0.08); color: #1c7c45; }

      .campus-floor-btn {

        border-radius: 6px; cursor: pointer; border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #2d5a3d;
      }
