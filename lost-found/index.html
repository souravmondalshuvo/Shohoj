<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lost &amp; Found — Shohoj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Standalone lost-and-found page (#390): the shell's LostFoundRoute
         published at /lost-found/ ahead of the full cutover. Styles are the
         lf slice of app/index.html plus the shell primitives it renders
         (auth chrome, buttons, modals, toasts) — keep the two in sync until
         the cutover retires this page. */
      /* Shohoj brand layer (light theme) — matches the shell's app/index.html so
         this standalone page reads as the real app. Keep in sync with it. */
      :root {
        --green: #2ECC71; --gold: #F0A500; --bg: #d4edde;
        --glass2: rgba(255,255,255,0.75); --border: rgba(46,204,113,0.25);
        --text: #0d2914; --text2: #3a6b47;
        --shadow-card: 0 20px 60px rgba(46,204,113,0.10), inset 0 1px 0 rgba(255,255,255,0.9);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: 'DM Sans', system-ui, sans-serif; color: var(--text);
        background: var(--bg); min-height: 100vh; position: relative; overflow-x: hidden;
      }
      body::before, body::after {
        content: ''; position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
      }
      body::before {
        width: min(520px,90vw); height: min(520px,90vw); top: -140px; left: -120px;
        background: radial-gradient(circle, rgba(46,204,113,0.30) 0%, transparent 70%);
      }
      body::after {
        width: min(400px,80vw); height: min(400px,80vw); bottom: 5%; right: -100px;
        background: radial-gradient(circle, rgba(100,200,140,0.25) 0%, transparent 70%);
      }
      h1, h2, h3 { font-family: 'Syne','DM Sans',sans-serif; letter-spacing: -0.02em; }
      .lf-topbar {
        position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
        padding: 12px 16px; border-bottom: 1px solid var(--border);
        background: rgba(212,237,222,0.75); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      }
      .pg-brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; }
      .pg-brand-mark {
        width: 32px; height: 32px; flex-shrink: 0; background: var(--green); border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Syne',sans-serif; font-weight: 800; font-size: 15px; color: #0b0f0d; letter-spacing: -0.5px;
      }
      .pg-brand:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 8px; }
      .pg-brand-text { font-family: 'Syne',sans-serif; font-weight: 700; font-size: 17px; color: var(--text); }
      .pg-brand-text span { color: var(--green); }

      .shell-skip-link {
        position: absolute; left: -999px; top: 0;
        background: #fff; padding: 8px 12px; z-index: 10;
      }

      .shell-skip-link:focus { left: 8px; }

      .shell-auth { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; }

      .shell-auth-loading { color: rgba(0,0,0,0.45); font-size: 12px; }

      .shell-auth-email { color: #2d5a3d; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .shell-auth-btn {
        font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 6px;
        cursor: pointer; border: 1px solid rgba(46,204,113,0.35); background: rgba(46,204,113,0.08); color: #1c7c45;
      }

      .shell-auth-btn:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }

      .shell-page {
        margin: 20px auto; padding: 24px; max-width: 720px; background: var(--glass2);
        border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-card);
      }

      .shell-muted { color: var(--text2); }

      .shell-btn {
        font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
        border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #0d2914;
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      }

      .shell-btn--primary { background: #27ae60; border-color: #27ae60; color: #fff; }

      .shell-btn--danger { background: #e74c3c; border-color: #e74c3c; color: #fff; }

      .shell-btn:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }

      .shell-modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.4);
        display: flex; align-items: center; justify-content: center; padding: 16px;
      }

      .shell-modal {
        background: #fff; border-radius: 12px; padding: 20px; max-width: 420px;
        width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      }

      .shell-modal-title { margin: 0 0 8px; font-size: 18px; }

      .shell-modal-message { margin: 0 0 16px; color: #2d5a3d; }

      .shell-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

      .shell-toast-viewport {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 8px; z-index: 20;
        max-width: min(420px, calc(100vw - 32px));
      }

      .shell-toast {
        display: flex; align-items: center; gap: 12px; padding: 10px 14px;
        border-radius: 10px; border: 1px solid; background: #fff; font-size: 14px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      }

      .shell-toast--success { border-color: #27ae60; color: #0d2914; }

      .shell-toast--info { border-color: #2d5a8a; color: #0d1a29; }

      .shell-toast--warning { border-color: #b07d1a; color: #291f0d; }

      .shell-toast--error { border-color: #c0392b; color: #290d0d; }

      .shell-toast-dismiss {
        font: inherit; margin-left: auto; border: none; background: none;
        cursor: pointer; padding: 0 4px; color: inherit;
      }

      .shell-toast-dismiss:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }

      .lf-page { max-width: 720px; }

      .lf-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }

      .lf-filters { display: flex; gap: 4px; }

      .lf-filter {
        font: inherit; font-size: 12px; font-weight: 600; padding: 8px 14px; min-height: 44px;
        border-radius: 6px; cursor: pointer; border: 1px solid rgba(0,0,0,0.15); background: transparent; color: rgba(0,0,0,0.55);
      }

      .lf-filter--active { border-color: rgba(46,204,113,0.45); background: rgba(46,204,113,0.10); color: #1c7c45; }

      .lf-filter:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }

      .lf-form {
        border: 1px solid rgba(46,204,113,0.25); background: rgba(46,204,113,0.04);
        border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
        display: flex; flex-direction: column; gap: 12px;
      }

      .lf-type { border: none; margin: 0; padding: 0; display: flex; gap: 16px; align-items: center; font-size: 13px; }

      .lf-type label { display: flex; align-items: center; gap: 6px; }

      .lf-form-row { display: flex; flex-wrap: wrap; gap: 12px; }

      .lf-form-row .lf-field { flex: 1; min-width: 180px; }

      .lf-field { display: flex; flex-direction: column; gap: 4px; }

      .lf-field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #3a6b47; }

      .lf-input {
        font: inherit; font-size: 13px; width: 100%; padding: 9px 12px; border-radius: 8px;
        border: 1px solid rgba(0,0,0,0.2); background: #fff; box-sizing: border-box;
      }

      .lf-input:focus { border-color: rgba(46,204,113,0.55); outline: none; }

      .lf-note { resize: vertical; min-height: 56px; }

      .lf-error { font-size: 12px; color: #e74c3c; }

      .lf-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

      .lf-item { border: 1px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 12px 14px; }

      .lf-item-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }

      .lf-badge {
        font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
        border-radius: 4px; padding: 2px 8px; border: 1px solid;
      }

      .lf-badge--lost { background: rgba(231,76,60,0.10); color: #e74c3c; border-color: rgba(231,76,60,0.28); }

      .lf-badge--found { background: rgba(46,204,113,0.12); color: #1c7c45; border-color: rgba(46,204,113,0.30); }

      .lf-title { font-size: 14px; }

      .lf-age { margin-left: auto; font-size: 11px; }

      .lf-desc { margin: 6px 0 0; font-size: 13px; color: #0d2914; }

      .lf-where { margin: 4px 0 0; font-size: 12px; }

      .lf-where a { color: #1c7c45; }

      .lf-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

      .lf-btn { min-height: 40px; padding: 6px 14px; font-size: 12px; }

      .lf-claimed { font-size: 12px; font-weight: 600; color: #1c7c45; }

      .lf-claim-box {
        margin-top: 10px; padding: 12px; border-radius: 10px;
        border: 1px solid rgba(86,180,233,0.25); background: rgba(86,180,233,0.05);
        display: flex; flex-direction: column; gap: 8px;
      }

      .lf-privacy { font-size: 11px; margin: 0; }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
    <script type="module" crossorigin src="../assets/lost-found-CKtQsg6D.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/preload-helper-HclGiUj8.js">
    <link rel="modulepreload" crossorigin href="../assets/jsx-runtime-CrLzfYuc.js">
    <link rel="modulepreload" crossorigin href="../assets/campusRooms-CbJy1Jr_.js">
  </head>
  <body>
    <!-- The generated runtime config (window._shohoj_* globals) — served/emitted
         by the vite.pages.config.js plugin; a comment stub when not generated,

    <script src="../runtime-config.js"></script>
    <div id="root"></div>
  </body>
</html>
