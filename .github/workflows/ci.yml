name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Least privilege: this workflow only reads the repo to test and build.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # ESLint is configured for correctness, not style (see eslint.config.js).
      # The job fails on errors; warnings are printed but don't block.
      - name: Run ESLint
        run: npm run lint

  test:
    name: Tests & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Java (firebase emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # build3.py flattens every module into one script scope, so two modules
      # declaring the same top-level name silently keep only the last one. Guard
      # against that before building (static check, fails on unsafe collisions).
      - name: Check bundle identifier collisions
        run: npm run check:collisions

      # Build the production bundle before E2E so tests can exercise the
      # CSP-hardened shohoj.html (e.g. the summary-form Enter-key test).
      - name: Build bundle (smoke test)
        run: python3 build3.py

      - name: Run E2E tests
        run: npm run test:e2e

      # Unlike the shell/island builds below, the standalone pages (#383) ARE
      # deployed (CD ships dist-pages/ next to the legacy bundle), so CI runs
      # their e2e — a broken standalone mount must not merge.
      - name: Run standalone pages E2E tests
        run: npm run test:e2e:pages

      - name: Run production bundle smoke test
        run: npm run test:bundle

      - name: Run CSP inline-handler guard
        run: npm run test:csp

      - name: Verify built bundle
        run: |
          test -s shohoj.html
          test -s admin.html
          test -s profile.html
          # Fail if bare ES module syntax leaked into the non-module bundle
          # (firebase.js is kept as type="module"; other bundled JS must not be).
          # Also fail if 'unsafe-inline' is still present in the script-src
          # CSP directive — build3.py is supposed to replace it with sha256
          # hashes of every inline <script>. If it's still there, CSP can't
          # block injected inline scripts and we lose XSS protection.
          # Finally fail if `frame-ancestors` is missing — browser clickjacking
          # protection.
          python3 - <<'PY'
          import re, sys
          ok = True
          for path in ('shohoj.html', 'admin.html', 'profile.html'):
              html = open(path, encoding='utf-8').read()
              stripped = re.sub(
                  r'<script\s+type=["\']module["\'][\s\S]*?</script>',
                  '', html, flags=re.IGNORECASE,
              )
              if re.search(r'\b(export|import)\s+(function|const|let|var|class|default|\{)', stripped):
                  print(f'ERROR: bare ES module syntax leaked into {path}', file=sys.stderr)
                  ok = False
              # CSP content uses single quotes for keywords like 'self' /
              # 'unsafe-inline'; capture the whole double-quoted attribute
              # value so the inner singles don't terminate the match.
              csp_m = re.search(
                  r'<meta\s+http-equiv=["\']Content-Security-Policy["\']\s+content="([^"]*)"',
                  html, flags=re.IGNORECASE,
              )
              if not csp_m:
                  print(f'ERROR: no CSP meta tag in {path}', file=sys.stderr)
                  ok = False
                  continue
              csp = csp_m.group(1)
              # Find script-src directive
              script_src_m = re.search(r'(?:^|;)\s*script-src\s+([^;]+)', csp, flags=re.IGNORECASE)
              if not script_src_m:
                  print(f'ERROR: no script-src directive in {path} CSP', file=sys.stderr)
                  ok = False
              elif "'unsafe-inline'" in script_src_m.group(1):
                  print(f'ERROR: script-src in {path} still contains \'unsafe-inline\' '
                        '(build3.py harden_script_csp should have replaced it with hashes)',
                        file=sys.stderr)
                  ok = False
              if not re.search(r'frame-ancestors\b', csp, flags=re.IGNORECASE):
                  print(f'ERROR: CSP in {path} is missing frame-ancestors '
                        '(needed to block clickjacking)', file=sys.stderr)
                  ok = False
          if not ok:
              sys.exit(1)
          print('bundles OK')
          PY

      - name: Vite build (non-deploying smoke check)
        run: |
          # Verify the Vite build path (docs/REACT_VITE_MIGRATION.md Step 3)
          # compiles. This output is NOT deployed — gh-pages still ships the
          # build3.py bundle. Vite needs a resolvable runtime-config.js; the
          # template is valid JS and its __PLACEHOLDER__ tokens are fine for a
          # build-compile check (the bundle is never served, so no secrets are
          # needed — this also keeps fork PRs green).
          cp js/config/runtime-config.template.js js/config/runtime-config.js
          npm run build:vite
          test -s dist/index.html
          test -s dist/admin/index.html

      - name: Shell build (non-deploying smoke check)
        run: |
          # Compile-check the React Router shell (vite.shell.config.js → dist-shell/).
          # Like the Vite build above, this output is NOT deployed — gh-pages ships
          # the build3.py bundle. The full shell e2e (test:e2e:shell) runs locally,
          # matching how the island e2e (test:e2e:vite) is treated; CI guards the
          # build so a broken shell entry can't merge.
          npm run build:shell
          # Accept either layout so this stays green regardless of merge order with
          # the root-served-shell fix (PR #298), which moves the entry from
          # dist-shell/app/index.html to dist-shell/index.html.
          test -s dist-shell/index.html || test -s dist-shell/app/index.html
