<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Map — Shohoj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Standalone campus-map page (#383): the shell's CampusRoute published at
         /campus/ ahead of the full cutover. Styles are the campus slice of
         app/index.html plus the shell primitives the route renders — keep the
         two in sync until the cutover retires this page. */
      /* Shohoj brand layer (light theme) — matches the shell's app/index.html so
         this standalone page reads as the real app. Keep in sync with it. */
      :root {
        --green: #2ECC71; --gold: #F0A500; --bg: #d4edde;
        --glass2: rgba(255,255,255,0.75); --border: rgba(46,204,113,0.25);
        --text: #0d2914; --text2: #3a6b47;
        --shadow-card: 0 20px 60px rgba(46,204,113,0.10), inset 0 1px 0 rgba(255,255,255,0.9);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: 'DM Sans', system-ui, sans-serif; color: var(--text);
        background: var(--bg); min-height: 100vh; position: relative; overflow-x: hidden;
      }
      body::before, body::after {
        content: ''; position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
      }
      body::before {
        width: min(520px,90vw); height: min(520px,90vw); top: -140px; left: -120px;
        background: radial-gradient(circle, rgba(46,204,113,0.30) 0%, transparent 70%);
      }
      body::after {
        width: min(400px,80vw); height: min(400px,80vw); bottom: 5%; right: -100px;
        background: radial-gradient(circle, rgba(100,200,140,0.25) 0%, transparent 70%);
      }
      h1, h2, h3 { font-family: 'Syne','DM Sans',sans-serif; letter-spacing: -0.02em; }
      .campus-topbar {
        position: sticky; top: 0; z-index: 20; padding: 12px 16px; border-bottom: 1px solid var(--border);
        background: rgba(212,237,222,0.75); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      }
      .pg-brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; }
      .pg-brand-mark {
        width: 32px; height: 32px; flex-shrink: 0; background: var(--green); border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Syne',sans-serif; font-weight: 800; font-size: 15px; color: #0b0f0d; letter-spacing: -0.5px;
      }
      .pg-brand:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 8px; }
      .pg-brand-text { font-family: 'Syne',sans-serif; font-weight: 700; font-size: 17px; color: var(--text); }
      .pg-brand-text span { color: var(--green); }
      .shell-page {
        margin: 20px auto; padding: 24px; max-width: 720px; background: var(--glass2);
        border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-card);
      }
      .shell-muted { color: var(--text2); }
      .shell-btn {
        font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
        border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #0d2914;
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      }
      .shell-btn:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }
      .campus-page { max-width: 860px; }
      .campus-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; color: #2d5a3d; }
      .campus-meta-btn { min-height: 36px; padding: 5px 12px; font-size: 12px; }
      .campus-location { font-weight: 600; color: #1c7c45; }
      .campus-floors { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
      .campus-floor-btn {
        font: inherit; font-size: 12px; font-weight: 600; padding: 8px 12px; min-height: 44px;
        border-radius: 6px; cursor: pointer; border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #2d5a3d;
      }
      .campus-floor-btn--active { border-color: rgba(46,204,113,0.45); background: rgba(46,204,113,0.12); color: #1c7c45; }
      .campus-floor-btn:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }
      .campus-canvas {
        height: min(420px, 60vh); border: 1px solid rgba(0,0,0,0.12); border-radius: 12px;
        overflow: hidden; background: linear-gradient(rgba(46,204,113,0.04), rgba(86,180,233,0.05));
        touch-action: none;
      }
      .campus-canvas canvas { display: block; width: 100%; height: 100%; }
      .campus-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0 14px; font-size: 11px; color: rgba(0,0,0,0.55); }
      .campus-legend span { display: flex; align-items: center; gap: 5px; }
      .campus-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; background: #9aa59e; flex-shrink: 0; }
      .campus-dot--free { background: #27ae60; }
      .campus-dot--busy { background: #e74c3c; }
      .campus-dot--selected { background: #2d5a8a; }
      .campus-room-panel { border: 1px solid rgba(46,204,113,0.25); background: rgba(46,204,113,0.05); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
      .campus-room-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font-size: 14px; }
      .campus-room-status { margin: 6px 0 0; font-size: 13px; color: #0d2914; font-weight: 600; }
      .campus-room-schedule { margin: 8px 0 0; padding-left: 18px; font-size: 12px; color: #2d5a3d; }
      .campus-zone-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(0,0,0,0.45); margin: 12px 0 6px; }
      .campus-zone-rooms { display: flex; flex-wrap: wrap; gap: 6px; }
      .campus-room-btn {
        display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; font-weight: 600;
        padding: 8px 10px; min-height: 44px; border-radius: 8px; cursor: pointer;
        border: 1px solid rgba(0,0,0,0.12); background: #fff; color: #0d2914;
      }
      .campus-room-btn--selected { border-color: #2d5a8a; background: rgba(86,180,233,0.10); }
      .campus-room-btn:focus-visible { outline: 2px solid #1c7c45; outline-offset: 2px; }
      .campus-room-sr {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
      .campus-error { padding: 16px 0; }
      .campus-other { margin-top: 16px; font-size: 13px; color: #2d5a3d; }
      .campus-wip {
        margin: 16px 16px 0; padding: 10px 14px; max-width: 828px;
        border: 1px solid rgba(240,165,0,0.35); border-radius: 10px;
        background: rgba(240,165,0,0.08); color: #7a5a10; font-size: 13px; line-height: 1.5;
      }
      .campus-wip a { color: #7a5a10; font-weight: 600; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
    <script type="module" crossorigin src="../assets/campus-CzJ-nNa7.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/preload-helper-HclGiUj8.js">
    <link rel="modulepreload" crossorigin href="../assets/jsx-runtime-CrLzfYuc.js">
    <link rel="modulepreload" crossorigin href="../assets/campusRooms-CbJy1Jr_.js">
  </head>
  <body>
    <header class="campus-topbar">
      <a class="pg-brand" href="../" aria-label="Back to Shohoj">
        <span class="pg-brand-mark" aria-hidden="true">স</span>
        <span class="pg-brand-text">Shohoj <span>সহজ</span></span>
      </a>
    </header>
    <!-- Removed when the v2 visual/interactivity upgrade (#385) ships. -->
    <div class="campus-wip" role="note" data-testid="campus-wip">
      🚧 <strong>Under development</strong> — the map and live room data work,
      but richer visuals and interactions are on the way
      (<a href="https://github.com/souravmondalshuvo/Shohoj/issues/385">follow progress</a>).
    </div>
    <div id="root"></div>
  </body>
</html>
