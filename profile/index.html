}
[data-theme='light'] .papers-empty,
[data-theme='light'] .papers-empty-list {
  border-color: rgba(0, 0, 0, 0.14);
}
.papers-empty h3 {
  margin: 0 0 8px;
}
.papers-empty p {
  margin: 0 0 14px;
}

.papers-retry-btn {
  margin-left: 8px;
  padding: 5px 14px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.06);
  color: inherit;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
[data-theme='light'] .papers-retry-btn {
  border-color: rgba(0, 0, 0, 0.18);
  background: rgba(0, 0, 0, 0.05);
}

.paper-card {
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 14px 14px 12px;
  background: rgba(255, 255, 255, 0.03);
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition:
    transform 0.15s ease,
    border-color 0.15s ease;
}
[data-theme='light'] .paper-card {
  border-color: rgba(0, 0, 0, 0.1);
  background: rgba(0, 0, 0, 0.02);
}
.paper-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.22);
}
.paper-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.paper-card-course {
  font-weight: 700;
  letter-spacing: 0.4px;
  font-size: 0.85rem;
  opacity: 0.92;
}
.paper-card-type {
  font-size: 0.72rem;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(82, 160, 255, 0.16);
  color: #6cb0ff;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.paper-card-title {
  margin: 2px 0 0;
  font-size: 0.98rem;
  line-height: 1.3;
}
.paper-card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}
.paper-card-meta-pill {
  font-size: 0.72rem;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  opacity: 0.88;
}
[data-theme='light'] .paper-card-meta-pill {
  background: rgba(0, 0, 0, 0.05);
}
.paper-card-actions {
  display: flex;
  gap: 8px;
  align-items: stretch;
  margin-top: 6px;
  flex-wrap: wrap;
}
.paper-card-preview,
.paper-card-download {
  flex: 1 1 0;
  min-width: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  line-height: 1;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  transition:
    transform 0.15s,
    background 0.15s,
    border-color 0.15s,
    color 0.15s;
}
.paper-card-icon {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  display: inline-block;
}
.paper-card-preview {
  background: var(--green);
  color: #0b0f0d;
  border: 1px solid var(--green);
}
.paper-card-preview:hover {
  transform: translateY(-1px);
}
.paper-card-preview:disabled {
  opacity: 0.7;
  cursor: wait;
  transform: none;
}
.paper-card-download {
  background: transparent;
  color: inherit;
  border: 1px solid rgba(255, 255, 255, 0.18);
}
.paper-card-download:hover {
  border-color: var(--green);
  color: var(--green);
  background: rgba(46, 204, 113, 0.08);
  transform: translateY(-1px);
}
.paper-card-download:disabled {
  opacity: 0.7;
  cursor: wait;
  transform: none;
}
[data-theme='light'] .paper-card-download {
  border-color: rgba(0, 0, 0, 0.18);
}
.paper-card-report {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: inherit;
  opacity: 0.7;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1;
}
.paper-card-report:hover {
  opacity: 1;
  border-color: rgba(255, 90, 90, 0.55);
  color: #ff7676;
}
[data-theme='light'] .paper-card-report {
  border-color: rgba(0, 0, 0, 0.14);
}

/* Skeleton cards */
.paper-card--skeleton {
  pointer-events: none;
}
.paper-card--skeleton:hover {
  transform: none;
  border-color: rgba(255, 255, 255, 0.1);
}
[data-theme='light'] .paper-card--skeleton:hover {
  border-color: rgba(0, 0, 0, 0.1);
}
.paper-skel {
  background: linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.04) 0%,
    rgba(255, 255, 255, 0.1) 50%,
    rgba(255, 255, 255, 0.04) 100%
  );
  background-size: 200% 100%;
  animation: rvSkelShimmer 1.4s ease-in-out infinite;
  border-radius: 6px;
}
[data-theme='light'] .paper-skel {
  background: linear-gradient(
    90deg,
    rgba(0, 0, 0, 0.04) 0%,
    rgba(0, 0, 0, 0.09) 50%,
    rgba(0, 0, 0, 0.04) 100%
  );
  background-size: 200% 100%;
}
.paper-skel-course {
  height: 14px;
  width: 72px;
}
.paper-skel-type {
  height: 18px;
  width: 60px;
  border-radius: 999px;
}
.paper-skel-title {
  height: 14px;
  width: 90%;
}
.paper-skel-title--short {
  width: 55%;
}
.paper-skel-pill {
  height: 16px;
  width: 64px;
  border-radius: 999px;
}
.paper-skel-pill--sm {
  width: 44px;
}
.paper-skel-btn {
  flex: 1;
  height: 32px;
  border-radius: 8px;
}
.paper-skel-btn--sm {
  flex: 0 0 72px;
}

/* Upload + report modal */
.paper-modal-backdrop {
  position: fixed;

.paper-modal {

[data-theme='light'] .paper-modal {

.paper-modal-head {

.paper-modal-close {

.paper-modal-form {

}
.paper-modal-form label {

  flex-direction: column;
  gap: 4px;
  font-size: 0.85rem;
}
.paper-modal-form input,
.paper-modal-form select,
.paper-modal-form textarea {
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.04);
  color: inherit;
  font-size: 0.92rem;
  font-family: inherit;
}
[data-theme='light'] .paper-modal-form input,
[data-theme='light'] .paper-modal-form select,
[data-theme='light'] .paper-modal-form textarea {
  border-color: rgba(0, 0, 0, 0.14);

.paper-modal-note {
  font-size: 0.78rem;
  opacity: 0.7;
  margin: 4px 0 0;
}
.paper-modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 6px;
}
.paper-modal-error {
  color: #ff7676;
  font-size: 0.85rem;
  min-height: 1em;
}
.paper-modal-file-info {
  display: block;
  font-size: 0.78rem;

}
.paper-modal-file-info--error {

.paper-modal-clear-draft {

/* ── Mobile product polish: avoid page-level horizontal scroll ───────────── */
@media (max-width: 640px) {
  body {
    min-width: 0;
  }

  nav {
    gap: 8px;
  }

  .nav-right {
    min-width: 0;
    gap: 6px;
  }

  #authBtn {
    max-width: 128px;
    overflow: hidden;
  }

  #authLabel,
  .auth-name,
  .auth-email {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .footer-btn-group {
    flex-wrap: wrap !important;
    overflow-x: visible !important;
  }

  .footer-btn-group button {
    flex: 1 1 calc(50% - 6px);
    min-width: 132px;
  }

  .course-suggestions {
    left: 12px !important;
    width: calc(100vw - 24px) !important;
    max-height: 52vh;
    overflow-y: auto;
  }

  .shohoj-modal-card,
  .paper-modal,
  .admin-preview-modal {
    max-height: calc(100svh - 24px);
    overflow-y: auto;
  }

  .papers-tab-head,
  .papers-tab-controls,
  .paper-card-actions,
  .paper-modal-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .papers-upload-btn,
  .papers-search,
  .papers-type-filter,
  .paper-card-preview,
  .paper-card-download,
  .paper-card-report {
    width: 100%;
  }
}

/* Between the ≤480px grid and the desktop layout: the five top-level items wrap
   to a second row when they don't fit, instead of scrolling — so the dropdown
   menus stay fully visible (a scroll container would clip them). */
@media (min-width: 481px) and (max-width: 640px) {
  .calc-tabs {
    justify-content: flex-start;
    margin: 10px 0.8rem 12px;
    border-radius: 16px;
  }

  .calc-tab-slider {
    display: none;
  }
}

/* ── Papers admin moderation panel ───────────────────────────────────────── */
/* ── Admin dashboard (full-page) ─────────────────────────────────────────── */
body.admin-mode > nav,
body.admin-mode > footer,
body.admin-mode > section,
body.admin-mode > .reveal,
body.admin-mode > .orb,
body.admin-mode > .hero {

}
body.admin-mode {
  overflow-y: auto;
}
#adminPageRoot {

  cursor:

}

[data-theme='light'] .paper-mod-row-actions button {
  background: rgba(0, 0, 0, 0.03);
  border-color: rgba(0, 0, 0, 0.12);
}
.paper-mod-row-actions button:hover {
  border-color: rgba(255, 255, 255, 0.32);
}
.paper-mod-approve {
  background: rgba(60, 200, 120, 0.14) !important;
  border-color: rgba(60, 200, 120, 0.45) !important;
  color: #6cd992 !important;
}
.paper-mod-delete {
  background: rgba(255, 90, 90, 0.14) !important;
  border-color: rgba(255, 90, 90, 0.45) !important;
  color: #ff7676 !important;
}
.paper-mod-row-actions button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ─── Shohoj inline-style replacements (was inline style='' on shell elements) ── */
.shohoj-modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
  align-items: center;
  justify-content: center;
}
.shohoj-modal-backdrop--strong {
  background: rgba(0, 0, 0, 0.72);
}
.shohoj-modal-backdrop--fade {
  opacity: 0;
  transition: opacity 0.18s;
}

.shohoj-modal-card {
  background: #0f1f14;
  border: 1px solid rgba(46, 204, 113, 0.25);
  border-radius: 16px;
  padding: 28px 32px;
  width: 90%;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
  max-height: 85vh;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  z-index: 10000;
}
.shohoj-modal-card--md {
  max-width: 480px;
}
.shohoj-modal-card--sm {
  max-width: 320px;
  padding: 28px 28px 24px;
  border-radius: 20px;
  text-align: center;
}
.shohoj-modal-card--feedback {
  background: transparent;
  border-radius: 20px;
  padding: 28px 28px 24px;
  max-width: 440px;
  z-index: auto;
}

.shohoj-modal-close-x {
  position: absolute;
  top: 14px;
  right: 16px;
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.4);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
}

.start-form-select {
  background: var(--input-bg);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 10px;
  -webkit-appearance: none;
  appearance: none;
  background-image: url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 12 12%27%3E%3Cpath d=%27M3 4.5L6 7.5L9 4.5%27 stroke=%27%238aab90%27 stroke-width=%271.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 fill=%27none%27/%3E%3C/svg%3E');
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 28px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 10px 6px 10px;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s;
  height: 36px;
  box-sizing: border-box;
}
.start-form-select--dept {
  max-width: 420px;
}

.start-form-confirm {
  background: var(--green);
  color: #0b0f0d;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: opacity 0.2s;
  height: 36px;
  box-sizing: border-box;
}

.dept-credits-badge {
  display: none;
  align-items: center;
  gap: 5px;
  background: rgba(46, 204, 113, 0.1);
  border: 1px solid rgba(46, 204, 113, 0.28);
  border-radius: 10px;
  padding: 5px 11px;
  height: 36px;
  box-sizing: border-box;
}
.dept-credits-badge.is-visible {
  display: inline-flex;
}
.dept-credits-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--green);
  letter-spacing: 0.3px;
  white-space: nowrap;
}

/* ─────────────────────────────────────────────────────────────────────────────
 * Routine Builder tab
 * ─────────────────────────────────────────────────────────────────────────── */
.routine-tab {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 4px 0;
}

.routine-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.routine-header h3 {
  margin: 0 8px 0 0;
  display: inline-block;
  font-size: 18px;
}
.routine-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.routine-header-right {
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
}
/* Overlaid (not in the flex flow) so the transient confirmation can't widen
   the row and wrap the whole toolbar onto a second line — see #204. The
   opaque backdrop keeps it legible over the search input it floats above. */
.routine-share-note {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 5;
  pointer-events: none; /* floats over the row below — never block its clicks */
  font-size: 11px;
  font-weight: 600;
  color: #2ecc71;
  background: rgba(16, 34, 24, 0.95);
  border: 1px solid rgba(46, 204, 113, 0.35);
  padding: 3px 9px;
  border-radius: 999px;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}

/* QR-of-share-link panel. The code sits on a solid white card so dark modules
   stay scannable in both themes (a transparent QR on the dark UI would not). */
.routine-qr-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 16px;
  margin: 6px 0 4px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--card-bg);
}
.routine-qr-code {
  background: #fff;
  padding: 12px;
  border-radius: 10px;
  width: 220px;
  max-width: 72vw;
  line-height: 0;
}
.routine-qr-code svg {
  display: block;
  width: 100%;
  height: auto;
}
.routine-qr-cap {
  font-size: 12px;
  color: var(--text2);
  text-align: center;
}

.routine-source-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--badge-bg);
  color: var(--text2);
  border: 1px solid var(--chip-border);
}
.routine-source--live {
  background: rgba(46, 204, 113, 0.12);
  color: #2ecc71;
  border-color: rgba(46, 204, 113, 0.28);
}
.routine-source--cache {
  background: rgba(241, 196, 15, 0.1);
  color: #f1c40f;
  border-color: rgba(241, 196, 15, 0.24);
}
.routine-source--fallback {
  background: rgba(231, 76, 60, 0.1);
  color: #e74c3c;
  border-color: rgba(231, 76, 60, 0.24);
}

.routine-clash-warn {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(231, 76, 60, 0.1);
  color: #e74c3c;
  border: 1px solid rgba(231, 76, 60, 0.24);
}

.routine-loading,
.routine-error,
.routine-empty {
  text-align: center;
  padding: 36px 18px;
  color: var(--text2);
}
.routine-spinner {
  width: 28px;
  height: 28px;
  margin: 0 auto 12px;
  border: 3px solid var(--chip-border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.routine-error h3 {
  color: #e74c3c;
  margin: 0 0 6px;
}

/* Skeleton loading state — shimmer placeholders shaped like the real layout. */
.routine-skeleton {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 4px 0;
}
.rsk {
  border-radius: 8px;
  background: linear-gradient(90deg, var(--skel-lo) 25%, var(--skel-hi) 37%, var(--skel-lo) 63%);
  background-size: 400% 100%;
  animation: rsk-shimmer 1.4s ease infinite;
}
.rsk-header {
  height: 26px;
  width: 220px;
}
.rsk-picker {
  height: 40px;
  width: 100%;
}
.rsk-block {
  height: 84px;
  width: 100%;
}
@keyframes rsk-shimmer {
  from {
    background-position: 100% 0;
  }
  to {
    background-position: 0 0;
  }
}
.routine-loading-note {
  text-align: center;
  color: var(--text3);
  font-size: 12px;
  margin-top: 10px;
}
@media (prefers-reduced-motion: reduce) {
  .rsk {
    animation: none;
  }
}

.routine-picker {
  display: flex;
  gap: 8px;
  align-items: center;
}
.routine-input {
  flex: 1;
  min-width: 200px;
  background: var(--glass);
  border: 1px solid var(--chip-border);
  color: var(--text1);
  border-radius: 10px;
  padding: 10px 14px;
  font:
    13px 'DM Sans',
    sans-serif;
  letter-spacing: 0.5px;
  transition:
    border-color 0.2s,
    background 0.2s;
}
.routine-input:focus {
  outline: none;
  border-color: var(--green);
  background: var(--glass2);
}
.routine-input--err {
  border-color: #e74c3c;
  animation: routine-shake 0.3s;
}
@keyframes routine-shake {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-4px);
  }
  75% {
    transform: translateX(4px);
  }
}

.routine-suggestions {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.routine-suggest-item {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 12px;
  align-items: center;
  text-align: left;
  padding: 8px 12px;
  background: var(--card-bg-2);
  border: 1px solid var(--hairline);
  color: var(--text1);
  border-radius: 8px;
  cursor: pointer;
  font:
    12px 'DM Sans',
    sans-serif;
}
.routine-suggest-item:hover {
  background: var(--card-hover);
}
.routine-suggest-item.is-active {
  background: rgba(46, 204, 113, 0.12);
  border-color: rgba(46, 204, 113, 0.4);
}
.routine-suggest-code {
  font-weight: 700;
  letter-spacing: 0.4px;
  color: var(--green);
}
.routine-suggest-name {
  color: var(--text2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.routine-suggest-count {
  color: var(--text3);
  font-size: 11px;
}
.routine-suggest-empty {
  padding: 8px 12px;
  color: var(--text3);
  font-size: 12px;
}

.routine-picked-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.routine-course-block {
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--card-bg);
  overflow: hidden;
}
.routine-course-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: var(--card-bg-2);
  border-bottom: 1px solid var(--hairline);
}
.routine-course-code {
  font-weight: 700;
  color: var(--green);
  letter-spacing: 0.4px;
  margin-right: 10px;
}
.routine-course-name {
  color: var(--text2);
  font-size: 13px;
}
.routine-remove-x {
  background: none;
  border: none;
  color: var(--text3);
  font-size: 18px;
  cursor: pointer;
  padding: 0 6px;
  line-height: 1;
}
.routine-remove-x:hover {
  color: #e74c3c;
}

.routine-section-list {
  display: flex;
  flex-direction: column;
}
.routine-section-row {
  display: grid;
  grid-template-columns: 44px 56px 1fr 100px 80px 1fr auto auto;
  gap: 10px;
  align-items: center;
  text-align: left;
  padding: 10px 14px;
  background: transparent;
  border: none;
  border-top: 1px solid var(--hairline);
  color: var(--text1);
  cursor: pointer;
  font:
    12px 'DM Sans',
    sans-serif;
  transition: background 0.15s;
}
.routine-section-row:hover {
  background: var(--chip-hover);
}
.routine-section--picked {
  background: rgba(46, 204, 113, 0.06);
}
.routine-section--picked:hover {
  background: rgba(46, 204, 113, 0.1);
}
.routine-section--clash {
  background: rgba(231, 76, 60, 0.1) !important;
}

.routine-section-name {
  font-weight: 700;
}
.routine-section-faculty {
  color: var(--text2);
  letter-spacing: 0.4px;
  font-weight: 600;
}
.routine-section-schedule {
  color: var(--text1);
}
.routine-section-room {
  color: var(--text3);
  font-size: 11px;
}
.routine-section-seats {
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  text-align: center;
}
.routine-seats--open {
  background: rgba(46, 204, 113, 0.1);
  color: #2ecc71;
}
.routine-seats--tight {
  background: rgba(241, 196, 15, 0.1);
  color: #f1c40f;
}
.routine-seats--full {
  background: rgba(231, 76, 60, 0.1);
  color: #e74c3c;
}
.routine-section-exam {
  color: var(--text3);
  font-size: 11px;
}

.routine-clash-pill {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(231, 76, 60, 0.18);
  color: #e74c3c;
  letter-spacing: 0.5px;
}
.routine-clash-pill--exam {
  background: rgba(155, 89, 182, 0.18);
  color: #9b59b6;
}
.routine-clash-pill--cand {
  background: rgba(231, 76, 60, 0.12);
  color: #e74c3c;
  font-weight: 600;
  text-transform: lowercase;
  letter-spacing: 0.2px;
}
.routine-clash-pill--candexam {
  background: rgba(155, 89, 182, 0.12);
  color: #9b59b6;
}

/* Controls: status bar + sort + clash filter */
.routine-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 14px 0 10px;
}
.routine-stats {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.routine-stat {
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--badge-bg);
}
.routine-stat--ok {
  color: #2ecc71;
  background: rgba(46, 204, 113, 0.1);
}
.routine-stat--clash {
  color: #e74c3c;
  background: rgba(231, 76, 60, 0.12);
}
.routine-controls-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.routine-sort {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.routine-sort-label {
  font-size: 11px;
  color: var(--text3);
  margin-right: 2px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.routine-sort-btn {
  font:
    12px 'DM Sans',
    sans-serif;
  cursor: pointer;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--chip-border);
  background: transparent;
  color: var(--text2);
  transition:
    background 0.15s,
    color 0.15s,
    border-color 0.15s;
}
.routine-sort-btn:hover {
  background: var(--chip-hover);
  color: var(--text1);
}
.routine-sort-btn.is-active {
  background: rgba(46, 204, 113, 0.14);
  color: var(--ink-green);
  border-color: rgba(46, 204, 113, 0.35);
}
.routine-chip-toggle {
  font:
    12px 'DM Sans',
    sans-serif;
  cursor: pointer;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--chip-border);
  background: transparent;
  color: var(--text2);
  transition:
    background 0.15s,
    color 0.15s,
    border-color 0.15s;
}
.routine-chip-toggle:hover {
  background: var(--chip-hover);
  color: var(--text1);
}
.routine-chip-toggle.is-active {
  background: rgba(241, 196, 15, 0.12);
  color: var(--ink-amber);
  border-color: rgba(241, 196, 15, 0.35);
}

/* ── Section time filters ──────────────────────────────────────────────── */
.routine-filters {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 2px 0;
}
.routine-filter-label {
  font-size: 11px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.routine-filter-sep {
  width: 1px;
  align-self: stretch;
  min-height: 16px;
  background: var(--chip-border);
  margin: 0 2px;
}
.routine-filter-days {
  display: inline-flex;
  gap: 4px;
  flex-wrap: wrap;
}
.routine-filter-toggle,
.routine-filter-day {
  font:
    12px 'DM Sans',
    sans-serif;
  cursor: pointer;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--chip-border);
  background: transparent;
  color: var(--text2);
  transition:
    background 0.15s,
    color 0.15s,
    border-color 0.15s;
}
.routine-filter-day {
  padding: 5px 10px;
}
.routine-filter-toggle:hover,
.routine-filter-day:hover {
  background: var(--chip-hover);
  color: var(--text1);
}
.routine-filter-toggle.is-active,
.routine-filter-day.is-active {
  background: rgba(91, 157, 255, 0.14);
  color: var(--ink-blue);
  border-color: rgba(91, 157, 255, 0.38);
}

/* Per-course actions + section legend */
.routine-course-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.routine-change-btn {
  font:
    12px 'DM Sans',
    sans-serif;
  cursor: pointer;
  white-space: nowrap;
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid var(--chip-border);
  background: transparent;
  color: var(--text2);
  transition:
    background 0.15s,
    color 0.15s;
}
.routine-change-btn:hover {
  background: var(--chip-hover);
  color: var(--text1);
}
.routine-section-head {
  display: grid;
  grid-template-columns: 44px 56px 1fr 100px 80px 1fr;
  gap: 10px;
  padding: 6px 14px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text3);
  border-bottom: 1px solid var(--hairline);
}
.routine-section-empty,
.routine-section-hidden {
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text3);
}
.routine-section-hidden {
  border-top: 1px solid var(--hairline);
  font-style: italic;
}

/* A section that clashes with the current picks: still pickable, just muted */
.routine-section--candclash {
  opacity: 0.5;
}
.routine-section--candclash:hover {
  opacity: 0.85;
  background: rgba(231, 76, 60, 0.05);
}

/* Collapsed course summary */
.routine-course-block--collapsed .routine-course-head {
  border-bottom: none;
}
.routine-course-block--clash {
  border-color: rgba(231, 76, 60, 0.35);
}
.routine-collapsed-main {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  min-width: 0;
}
.routine-collapsed-pick {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text2);
}
.routine-collapsed-sec {
  font-weight: 700;
  color: var(--text1);
}
.routine-collapsed-fac {
  font-weight: 600;
  letter-spacing: 0.3px;
}
.routine-collapsed-sched {
  color: var(--text2);
}

@media (max-width: 720px) {
  .routine-section-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }
  .routine-section-room,
  .routine-section-exam {
    font-size: 10px;
  }
  .routine-section-head {
    display: none;
  }
  .routine-controls {
    flex-direction: column;
    align-items: stretch;
  }
  .routine-controls-right {
    justify-content: space-between;
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
 * Routine Builder — weekly grid (PR 4)
 * ─────────────────────────────────────────────────────────────────────────── */
.routine-grid-wrap {
  margin-top: 8px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--card-bg);
  padding: 14px;
  overflow-x: auto;
}
.routine-grid-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 10px;
  letter-spacing: 0.4px;
}
.routine-grid {
  display: grid;
  position: relative;
  min-width: 540px;
  font-family: 'DM Sans', sans-serif;
}
.routine-grid-day-header {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text2);
  text-align: center;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--card-border);
  align-self: end;
}
.routine-grid-time {
  font-size: 10px;
  color: var(--text3);
  text-align: right;
  padding-right: 8px;
  font-variant-numeric: tabular-nums;
  align-self: start;
}
.routine-grid-row {
  border-top: 1px dashed var(--hairline);
}
.routine-grid-row--hour {
  border-top: 1px solid var(--card-border);
}
/* Current-time line across the day columns. Blue, not red — red means clash. */
.routine-grid-now {
  position: relative;
  align-self: start;
  height: 0;
  border-top: 2px solid #5b9dff;
  pointer-events: none;
  z-index: 3;
}
.routine-grid-now::before {
  content: '';
  position: absolute;
  left: -3px;
  top: -4px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #5b9dff;
}
.routine-grid-day-header--today {
  color: #cfe0ff;
  font-weight: 600;
  align-self: stretch;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 3px;
  padding: 0 4px;
  border-bottom: 2px solid rgba(91, 157, 255, 0.65);
  border-radius: 3px;
}
[data-theme='light'] .routine-grid-day-header--today {
  color: var(--ink-blue);
}
/* Every day except today gets a soft dark wash, so the current day reads as the
   bright one with no accent bar of its own; on an off-day with no classes every
   column is washed, so a fully lit grid never fakes a class day. Sits above the blocks (z-index 1)
   to gently shade them, but below the now-line (3); hovering a block lifts it to
   z-index 2, restoring full colour. Pointer-events off so clicks pass through. */
.routine-grid-dim-col {
  background: rgba(6, 12, 9, 0.42);
  pointer-events: none;
  z-index: 1;
}
/* Light theme fades the other days toward the page instead of shading them. */
[data-theme='light'] .routine-grid-dim-col {
  background: rgba(255, 255, 255, 0.5);
}
.routine-grid-block {
  margin: 1px 2px;
  border-radius: 6px;
  padding: 4px 6px;
  background: hsl(var(--routine-hue, 200), 65%, 22%);
  border-left: 3px solid hsl(var(--routine-hue, 200), 75%, 55%);
  color: hsl(var(--routine-hue, 200), 90%, 92%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 28px;
  font-size: 10px;
  line-height: 1.2;
  cursor: default;
  transition: transform 0.12s;
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
  /* --sub-x is 0 unless the block is tiled side-by-side (see --split). */
  transform: translateX(var(--sub-x, 0));
}
.routine-grid-block:hover {
  transform: translateX(var(--sub-x, 0)) translateY(-1px);
  z-index: 2;
}
.routine-grid-block:focus-visible {
  outline: 2px solid #5b9dff;
  outline-offset: 1px;
  z-index: 4;
}
.routine-grid-block-clashmark {
  margin-right: 3px;
}
/* Overlapping blocks tiled into N side-by-side sub-columns within one day.
   Width is set inline to 100%/N; border-box + zeroed h-margins make the
   tiles add up exactly, and the colored left accent keeps them readable. */
.routine-grid-block--split {
  box-sizing: border-box;
  justify-self: start;
  margin-left: 0;
  margin-right: 0;
}
.routine-grid-block--clash {
  background: rgba(231, 76, 60, 0.3);
  border-left-color: #e74c3c;
  color: #ffd1cc;
  box-shadow: 0 0 0 1px rgba(231, 76, 60, 0.4);
}
.routine-grid-block-code {
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.4px;
}
.routine-grid-block-meta {
  font-size: 9px;
  opacity: 0.85;
  letter-spacing: 0.3px;
}
.routine-grid-block-time {
  font-size: 9px;
  opacity: 0.7;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 720px) {
  .routine-grid {
    min-width: 480px;
  }
  .routine-grid-block-meta,
  .routine-grid-block-time {
    display: none;
  }
}

  color: #e74c3c;
  margin: 0 0 6px;
}

/* Skeleton loading state — shimmer placeholders shaped like the real layout. */
.seats-skeleton {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 4px 0;
}
.ssk {
  border-radius: 8px;
  background: linear-gradient(90deg, var(--skel-lo) 25%, var(--skel-hi) 37%, var(--skel-lo) 63%);
  background-size: 400% 100%;
  animation: rsk-shimmer 1.4s ease infinite;
}
.ssk-header {
  height: 26px;
  width: 200px;
}
.ssk-search {
  height: 42px;
  width: 100%;
}
.ssk-row {
  height: 64px;
  width: 100%;
}
.seats-loading-note {
  text-align: center;
  color: var(--text3);
  font-size: 12px;
  margin-top: 10px;
}

.seats-searchbar {
  position: relative;
  display: flex;
  align-items: center;
}
.seats-search-icon {
  position: absolute;
  left: 14px;
  font-size: 13px;
  opacity: 0.5;
  pointer-events: none;
}
.seats-search-input {
  flex: 1;
  min-width: 200px;
  background: var(--glass);
  border: 1px solid var(--chip-border);
  color: var(--text1);
  border-radius: 10px;
  padding: 11px 14px 11px 38px;
  font:
    13px 'DM Sans',
    sans-serif;
  letter-spacing: 0.5px;
  transition:
    border-color 0.2s,
    background 0.2s,
    box-shadow 0.2s;
}
.seats-search-input::placeholder {
  color: var(--text3);
}
.seats-search-input:focus {
  outline: none;
  border-color: var(--green);
  background: var(--glass2);
  box-shadow: 0 0 0 3px var(--green-glow);
}

.seats-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.seats-sort {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.seats-sort-label {
  font-size: 12px;
  color: var(--text3);
}
.seats-chip {
  font:
    12px 'DM Sans',
    sans-serif;
  cursor: pointer;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--chip-border);
  background: transparent;
  color: var(--text2);
  transition:
    background 0.15s,
    color 0.15s,
    border-color 0.15s;
}
.seats-chip:hover {
  background: var(--chip-hover);
  color: var(--text1);
}
.seats-chip.is-active {
  background: rgba(46, 204, 113, 0.12);
  color: var(--ink-green);
  border-color: rgba(46, 204, 113, 0.38);
}
.seats-chip--filter.is-active {
  background: rgba(46, 204, 113, 0.12);
  color: var(--ink-green);
  border-color: rgba(46, 204, 113, 0.38);
}

.seats-results {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Friendly empty state — centered, with data-driven quick-pick chips. */
.seats-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
  padding: 40px 18px 34px;
  color: var(--text3);
}
.seats-empty-icon {
  font-size: 34px;
  line-height: 1;
  opacity: 0.85;
  margin-bottom: 4px;
}
.seats-empty-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text1);
}
.seats-empty-sub {
  font-size: 13px;
  color: var(--text2);
  max-width: 360px;
  line-height: 1.5;
}
.seats-quickpicks {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}
.seats-quickpick {
  font-weight: 700;
  letter-spacing: 0.4px;
  color: var(--text2);
}
.seats-quickpick:hover {
  border-color: rgba(46, 204, 113, 0.38);
  color: var(--green);
}

.seats-trimmed-note {
  color: var(--text3);
  font-size: 12px;
  padding: 2px 2px 6px;
}

.seats-course {
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--card-bg);
  overflow: hidden;
}
.seats-course-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: var(--card-bg-2);
  border-bottom: 1px solid var(--hairline);
}
.seats-course-code {
  font-weight: 700;
  color: var(--green);
  letter-spacing: 0.4px;
}
.seats-course-name {
  color: var(--text2);
  font-size: 13px;
}
.seats-course-summary {
  margin-left: auto;
  color: var(--text3);
  font-size: 11px;
  font-weight: 600;
}

.seats-section-list {
  display: flex;
  flex-direction: column;
}
.seats-section-row {
  display: grid;
  grid-template-columns: 30px 44px 56px 1fr 100px 80px;
  gap: 10px;
  align-items: center;
  text-align: left;
  padding: 10px 14px;
  border-top: 1px solid var(--hairline);
  color: var(--text1);
  font:
    12px 'DM Sans',
    sans-serif;
  transition: background 0.15s ease;
}
.seats-section-row:hover {
  background: var(--chip-hover);
}
.seats-section-name {
  font-weight: 700;
}
.seats-section-faculty {
  color: var(--text2);
  letter-spacing: 0.4px;
  font-weight: 600;
}
.seats-section-schedule {
  color: var(--text1);
}
.seats-section-room {
  color: var(--text3);
  font-size: 11px;
}
.seats-section-seats {
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  text-align: center;
}
.seats-seats--open {
  background: rgba(46, 204, 113, 0.1);
  color: #2ecc71;
}
.seats-seats--tight {
  background: rgba(241, 196, 15, 0.1);
  color: #f1c40f;
}
.seats-seats--full {
  background: rgba(231, 76, 60, 0.1);
  color: #e74c3c;
}

/* Per-row watch toggle (bell). Dim until armed, blue-tinted once watching. */
.seats-watch-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px;
  line-height: 1;
  font-size: 15px;
  opacity: 0.4;
  filter: grayscale(0.6);
  transition:
    opacity 0.15s ease,
    transform 0.1s ease;
}
.seats-watch-btn:hover {
  opacity: 0.85;
  transform: scale(1.1);
}
.seats-watch-btn.is-watched {
  opacity: 1;
  filter: none;
  animation: seats-bell-pop 0.3s ease;
}
@keyframes seats-bell-pop {
  0% {
    transform: scale(0.7);
  }
  60% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .seats-watch-btn.is-watched {
    animation: none;
  }
}

/* "Watching (N)" panel above the search box. Amber tint reads as an alert/bell
   channel and keeps the tab inside Shohoj's green-and-gold palette. */
.seats-watch-panel {
  margin: 12px 0 4px;
  padding: 12px 14px;
  border: 1px solid rgba(241, 196, 15, 0.3);
  background: rgba(241, 196, 15, 0.06);
  border-radius: 12px;
}
.seats-watch-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.seats-watch-head h4 {
  margin: 0;
  font-size: 13px;
  color: var(--text1);
}
.seats-watch-note {
  color: var(--text3);
  font-size: 11px;
}
/* The email-channel line sits on its own row under the notification note. */
.seats-watch-note--email {
  flex-basis: 100%;
  color: var(--text2);
}
.seats-watch-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.seats-watch-row {
  display: grid;
  grid-template-columns: 1fr 64px 24px;
  gap: 10px;
  align-items: center;
  font:
    12px 'DM Sans',
    sans-serif;
  color: var(--text1);
}
.seats-watch-label {
  font-weight: 600;
}
.seats-watch-status {
  font-weight: 700;
  font-size: 11px;
  text-align: center;
  padding: 2px 8px;
  border-radius: 999px;
}
.seats-watch-status--unknown {
  background: var(--chip-hover);
  color: var(--text3);
}
.seats-watch-remove {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text3);
  font-size: 13px;
  line-height: 1;
  padding: 2px;
  transition: color 0.15s ease;
}
.seats-watch-remove:hover {
  color: #e74c3c;
}

@media (max-width: 720px) {
  .seats-section-row {
    grid-template-columns: auto 1fr auto;
    gap: 4px 10px;
  }
  .seats-watch-btn {
    grid-row: 1;
    grid-column: 1;
  }
  .seats-section-name {
    grid-column: 2;
  }
  .seats-section-seats {
    grid-column: 3;
  }
  .seats-section-faculty {
    grid-column: 2 / -1;
  }
  .seats-section-schedule,
  .seats-section-room {
    grid-column: 1 / -1;
  }
}

/* ═══ Profile tab (#196) ═══ */
.pf-empty {
  padding: 40px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.pf-empty-icon {
  font-size: 32px;
  opacity: 0.8;
  margin-bottom: 4px;
}
.pf-empty-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.pf-empty-sub {
  font-size: 12px;
  color: var(--text2);
  max-width: 320px;
  line-height: 1.5;
  margin-bottom: 8px;
}
.pf-signin-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  border-radius: 8px;
  background: var(--accent);
  border: 1px solid var(--accent);
  color: #06140b;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: filter 0.2s;
}
.pf-signin-btn:hover {
  filter: brightness(1.08);
}
.pf-signin-icon {
  font-size: 15px;
}

.pf-hub {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.pf-header {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  background:
    radial-gradient(120% 150% at 0% 0%, rgba(46, 204, 113, 0.16), transparent 58%),
    linear-gradient(180deg, rgba(46, 204, 113, 0.06), rgba(255, 255, 255, 0.015));
}
.pf-avatar {
  position: relative;
  flex-shrink: 0;
}
.pf-avatar-img,
.pf-avatar-fallback {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: block;
  box-shadow:
    0 0 0 2px var(--bg),
    0 0 0 4px rgba(46, 204, 113, 0.45),
    0 6px 18px rgba(0, 0, 0, 0.35);
}
.pf-avatar-img {
  object-fit: cover;
}
.pf-avatar-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(150deg, var(--accent), #1f8f4e);
  color: #06140b;
  font-size: 24px;
  font-weight: 800;
}
.pf-identity {
  flex: 1;
  min-width: 0;
}
.pf-name {
  font-family: 'Syne', sans-serif;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pf-email {
  font-size: 12px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pf-signout-btn {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition:
    border-color 0.2s,
    color 0.2s;
}
.pf-signout-btn:hover {
  border-color: var(--border);
  color: var(--text);
}

.pf-sections {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Profile cards (academic, seat alerts, routine, reviews) */
.pf-card {
  position: relative;
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.022), rgba(255, 255, 255, 0));
  transition:
    border-color 0.2s,
    transform 0.2s,
    box-shadow 0.2s;
}
.pf-card:hover {
  border-color: var(--border);
  transform: translateY(-1px);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
}
.pf-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.pf-card-title {
  margin: 0;
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}
.pf-card-count {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(46, 204, 113, 0.12);
  border: 1px solid var(--border);
}

/* Email-alert switch */
.pf-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
}
.pf-toggle-track {
  flex-shrink: 0;
  width: 38px;
  height: 22px;
  border-radius: 999px;
  background: var(--border2);
  position: relative;
  transition: background 0.2s;
}
.pf-toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}
.pf-toggle.is-on .pf-toggle-track {
  background: var(--accent);
}
.pf-toggle.is-on .pf-toggle-thumb {
  transform: translateX(16px);
}
.pf-toggle-text {
  font-size: 12px;
  color: var(--text);
  line-height: 1.4;
}
.pf-toggle-off {
  color: var(--text2);
  font-style: italic;
}

/* Watchlist */
.pf-watch-empty {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
  padding: 4px 0;
}
.pf-watch-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.pf-watch-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--border);
}
.pf-watch-code {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}
.pf-watch-sec {
  font-size: 12px;
  color: var(--text2);
}

/* Routine / planner course chips */
.pf-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.pf-chip {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--border);
}
.pf-chip-plan {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
}
.pf-subhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  padding-top: 2px;
}
.pf-note {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.5;
}

/* Academic-profile card: CGPA gauge + mini stats, identity list, term timeline */
.pf-acard-top {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.pf-gauge {
  --pf-pct: 0;
  --pf-color: var(--accent);
  position: relative;
  width: 100px;
  height: 100px;
  flex-shrink: 0;
  border-radius: 50%;
  background: conic-gradient(var(--pf-color) calc(var(--pf-pct) * 1%), var(--border2) 0);
}
.pf-gauge::after {
  content: '';
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  background: var(--bg);
}
.pf-gauge-core {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.pf-gauge-num {
  font-family: 'Syne', sans-serif;
  font-size: 25px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}
.pf-gauge-cap {
  font-size: 10px;
  color: var(--text3);
  margin-top: 3px;
  letter-spacing: 0.5px;
}
.pf-gauge--high {
  --pf-color: #2ecc71;
}
.pf-gauge--good {
  --pf-color: #6dd36d;
}
.pf-gauge--mid {
  --pf-color: #e6b800;
}
.pf-gauge--low {
  --pf-color: #e67e22;
}
.pf-gauge--na {
  --pf-color: var(--border2);
}

.pf-minis {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-width: 140px;
}
.pf-mini {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(46, 204, 113, 0.045);
}
.pf-mini-num {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
}
.pf-mini-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text3);
}

.pf-details {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border2);
  border-radius: 10px;
  overflow: hidden;
}
.pf-detail-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  font-size: 13px;
  border-bottom: 1px solid var(--border2);
}
.pf-detail-row:last-child {
  border-bottom: none;
}
.pf-detail-key {
  color: var(--text3);
  flex: 0 0 auto;
}
.pf-detail-val {
  color: var(--text);
  font-weight: 600;
  text-align: right;
  word-break: break-word;
}

/* Semester history timeline — relative course-load bars per term */
.pf-timeline {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}
.pf-tl-item {
  display: grid;
  grid-template-columns: 10px 96px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
}
.pf-tl-item + .pf-tl-item {
  border-top: 1px solid var(--border2);
}
.pf-tl-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.16);
}
.pf-tl-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}
.pf-tl-bar {
  height: 6px;
  border-radius: 999px;
  background: var(--border2);
  overflow: hidden;
}
.pf-tl-fill {
  display: block;
  height: 100%;
  width: calc(var(--pf-w) * 1%);
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), #6dd36d);
}
.pf-tl-count {
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  white-space: nowrap;
}

/* Last-synced line in the account header */
.pf-synced {
  font-size: 11px;
  color: var(--text3);
  margin-top: 2px;
}

/* Dedicated /profile/ page shell (mirrors the standalone admin page layout) */
.pf-page {
  position: relative;
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 64px;
}
.pf-page::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(80% 50% at 50% 0%, rgba(46, 204, 113, 0.1), transparent 70%);
}
.pf-page-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
}
.pf-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  text-decoration: none;
  padding: 7px 12px;
  border: 1px solid var(--border2);
  border-radius: 999px;
  transition:
    border-color 0.2s,
    color 0.2s;
}
.pf-back:hover {
  color: var(--green);
  border-color: var(--border);
}
.pf-page-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text);
}

/* Danger zone */
.pf-danger {
  border-color: rgba(231, 76, 60, 0.4);
}

/* ═══ Profile — "This semester" briefing (#476) ═══ */
.pf-briefing {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}

.pfb-zone {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 4px 2px 2px;
}
.pfb-zone h2 {
  margin: 0;
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text3);
  white-space: nowrap;
}
.pfb-zone::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--hairline);
}
.pfb-zone-sub {
  font-size: 12px;
  color: var(--text3);
  white-space: nowrap;
}

.pfb-card {
  position: relative;
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.022), rgba(255, 255, 255, 0));
  transition:
    border-color 0.2s,
    transform 0.2s,
    box-shadow 0.2s;
}
.pfb-card:hover {
  border-color: var(--border);
  transform: translateY(-1px);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
}
.pfb-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.pfb-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0;
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}
.pfb-ico {
  width: 26px;
  height: 26px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 13px;
  background: rgba(46, 204, 113, 0.12);
  border: 1px solid var(--border);
}

/* The verdict line — the reason the card exists. */
.pfb-verdict {
  margin: 0;
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: -0.01em;
  color: var(--text);
}
.pfb-verdict em {
  font-style: normal;
  color: var(--ink-amber);
}
.pfb-verdict b {
  color: var(--ink-green);
  font-weight: 700;
}
.pfb-verdict .hot {
  color: #e74c3c;
}

.pfb-chip {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 11px;
  border-radius: 999px;
  color: var(--ink-green);
  background: rgba(46, 204, 113, 0.12);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.pfb-chip.warn {
  color: var(--ink-amber);
  background: rgba(241, 196, 15, 0.12);
  border-color: rgba(241, 196, 15, 0.32);
}
.pfb-chip.hot {
  color: #e74c3c;
  background: rgba(231, 76, 60, 0.12);
  border-color: rgba(231, 76, 60, 0.35);
}
.pfb-chip.cool {
  color: var(--ink-blue);
  background: rgba(91, 157, 255, 0.12);
  border-color: rgba(91, 157, 255, 0.3);
}
/* An exam already sat: neutral on purpose — it is a record, not a warning. */
.pfb-chip.done {
  color: var(--text3);
  background: transparent;
  border-color: var(--hairline);
  font-weight: 600;
}

.pfb-note {
  font-size: 11px;
  color: var(--text3);
  line-height: 1.55;
}
.pfb-empty {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.55;
  padding: 4px 0;
}
.pfb-subhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--hairline);
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
}
.pfb-cta {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 17px;
  border-radius: 999px;
  background: var(--accent);
  border: 1px solid var(--accent);
  color: #06140b;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  transition: filter 0.2s;
}
.pfb-cta:hover {
  filter: brightness(1.08);
}

/* Midterms ⇄ Finals segmented switch */
.pfb-toggle {
  display: inline-flex;
  gap: 4px;
  padding: 3px;
  border: 1px solid var(--border2);
  border-radius: 999px;
}
.pfb-seg {
  padding: 5px 13px;
  border-radius: 999px;
  border: none;
  background: transparent;
  color: var(--text3);
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition:
    background 0.2s,
    color 0.2s;
}
.pfb-seg:hover {
  color: var(--text);
}
.pfb-seg.is-on {
  background: rgba(46, 204, 113, 0.14);
  color: var(--ink-green);
}

/* Exam rows */
.pfb-rows {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}
/* Each row is its own grid, so the tracks only line up while every row hits the
   same floor: 88px clears a six-character code in Syne 800 (~86px), where the
   old fixed 62px clipped it into the date. Anything longer widens that one row
   instead of colliding. */
/* ── Next registration / unlock map (#478) ──────────────────────────────── */
.umc-list {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
}
.umc-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 8px;
  border-radius: 10px;
  transition: background 0.18s;
}
.umc-row:hover {
  background: rgba(46, 204, 113, 0.05);
}
.umc-row + .umc-row {
  border-top: 1px solid var(--hairline);
}
.umc-row-main {
  min-width: 0;
  font-size: 13px;
  color: var(--text);
}
.umc-row-side {
  flex: none;
  font-size: 11.5px;
  color: var(--text3);
  white-space: nowrap;
}
.umc-row-side strong {
  color: var(--green);
  font-weight: 700;
}
.umc-dim {
  color: var(--text3);
  font-size: 12px;
}
.umc-more {
  font-size: 11px;
  color: var(--text3);
  padding: 6px 8px 0;
}
.umc-count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  background: var(--chip-hover);
  border: 1px solid var(--chip-border);
  border-radius: 999px;
  padding: 2px 9px;
}
.umc-sub {
  font-size: 11.5px;
  color: var(--text3);
  line-height: 1.55;
  margin-top: 4px;
}
.umc-sub strong {
  color: var(--green);
}
.umc-lead {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-top: 4px;
}
.umc-card-accent {
  border-color: rgba(46, 204, 113, 0.35);
  background: rgba(46, 204, 113, 0.06);
}

.pfb-row {
  display: grid;
  grid-template-columns: auto minmax(88px, max-content) minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 12px;
  padding: 10px 8px;
  border-radius: 10px;
  transition: background 0.18s;
}
.pfb-row:hover {
  background: rgba(46, 204, 113, 0.05);
}
/* Sat exams stay readable but stop competing with the ones still ahead. The
   date keeps its strikethrough-free weight; only the ink drops back. */
.pfb-row.is-past {
  opacity: 0.55;
}
.pfb-row.is-past .pfb-row-code,
.pfb-row.is-past .pfb-row-when b {
  color: var(--text2);
}
.pfb-row.is-past .pfb-row-dot {
  background: var(--text3);
  box-shadow: none;
}
.pfb-row + .pfb-row {
  border-top: 1px solid var(--hairline);
}
.pfb-row-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.16);
}
.pfb-row-dot.hot {
  background: #e74c3c;
  box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.16);
}
.pfb-row-code {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 800;
  color: var(--text);
  white-space: nowrap;
}
/* Tabular figures so the clock times stack into a readable column. */
.pfb-row-when {
  font-size: 12px;
  color: var(--text2);
  font-variant-numeric: tabular-nums;
}
.pfb-row-when b {
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
}
/* A floor here too: initials run 2–4 characters, and without it every row ends
   its chip at a different x. */
.pfb-row-meta {
  font-size: 11px;
  color: var(--text3);
  white-space: nowrap;
  min-width: 34px;
  text-align: right;
}
/* Chips are content-width; ending them on one edge makes the column scannable. */
.pfb-row .pfb-chip {
  justify-self: end;
}

/* Week stats */
.pfb-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: 9px;
}
.pfb-stat {
  padding: 11px 13px;
  border: 1px solid var(--border2);
  border-radius: 12px;
  background: rgba(46, 204, 113, 0.04);
  transition:
    border-color 0.2s,
    background 0.2s;
}
.pfb-stat:hover {
  border-color: var(--border);
  background: rgba(46, 204, 113, 0.07);
}
.pfb-stat.alert {
  background: rgba(241, 196, 15, 0.06);
  border-color: rgba(241, 196, 15, 0.25);
}
.pfb-stat.alert .pfb-stat-n {
  color: var(--ink-amber);
}
.pfb-stat-n {
  font-family: 'Syne', sans-serif;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--text);
}
.pfb-stat-l {
  display: block;
  margin-top: 4px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text3);
}

/* Week grid — 08:00→19:00, one column per teaching day */
.pfb-week {
  display: grid;
  grid-template-columns: 38px repeat(6, 1fr);
  gap: 6px;
}
.pfb-week-h {
  font-size: 10px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text3);
  text-align: center;
  padding-bottom: 4px;
}
.pfb-week-times {
  position: relative;
  height: 260px;
}
.pfb-week-times span {
  position: absolute;
  right: 4px;
  font-size: 9px;
  color: var(--text3);
  transform: translateY(-50%);
}
.pfb-col {
  position: relative;
  height: 260px;
  border-radius: 10px;
  border: 1px solid var(--hairline);
  background: rgba(255, 255, 255, 0.02);
  overflow: hidden;
}
.pfb-col.is-off {
  background: transparent;
  border-style: dashed;
}
.pfb-blk {
  position: absolute;
  left: 3px;
  right: 3px;
  border-radius: 7px;
  padding: 5px 6px;
  overflow: hidden;
  background: linear-gradient(160deg, rgba(46, 204, 113, 0.3), rgba(46, 204, 113, 0.14));
  border: 1px solid rgba(46, 204, 113, 0.4);
}
.pfb-blk.is-lab {
  background: linear-gradient(160deg, rgba(91, 157, 255, 0.28), rgba(91, 157, 255, 0.12));
  border-color: rgba(91, 157, 255, 0.42);
}
.pfb-blk-code {
  display: block;
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 800;
  line-height: 1.2;
  color: var(--text);
}
.pfb-blk-room {
  display: block;
  font-size: 8.5px;
  color: var(--text2);
  line-height: 1.3;
  margin-top: 1px;
}
.pfb-gap {
  position: absolute;
  left: 3px;
  right: 3px;
  border-radius: 7px;
  border: 1px dashed var(--border2);
  background: repeating-linear-gradient(
    45deg,
    transparent 0 5px,
    rgba(241, 196, 15, 0.07) 5px 10px
  );
  display: flex;
  align-items: center;
  justify-content: center;
}
.pfb-gap span {
  font-size: 9px;
  font-weight: 700;
  color: var(--ink-amber);
  text-align: center;
  line-height: 1.3;
}

/* Tight transitions */
.pfb-hops {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pfb-hop {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 13px;
  border-radius: 12px;
  border: 1px solid rgba(241, 196, 15, 0.25);
  background: rgba(241, 196, 15, 0.05);
  font-size: 12px;
  color: var(--text);
}
.pfb-hop b {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
}
.pfb-arrow {
  color: var(--ink-amber);
  font-weight: 700;
}
.pfb-hop-rooms {
  color: var(--text2);
}
.pfb-hop-min {
  margin-left: auto;
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 800;
  color: var(--ink-amber);
  white-space: nowrap;
}

/* Where to wait */
.pfb-slots {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 11px;
}
.pfb-slot {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 15px;
  border: 1px solid var(--border2);
  border-radius: 13px;
  background: rgba(46, 204, 113, 0.03);
  transition: border-color 0.2s;
}
.pfb-slot:hover {
  border-color: var(--border);
}
.pfb-slot-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.pfb-slot-when {
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.pfb-slot-why {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
}
.pfb-slot-why b {
  color: var(--text);
  font-weight: 600;
}
.pfb-rooms {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.pfb-room {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  padding: 5px 11px;
  border-radius: 999px;
  border: 1px solid var(--chip-border);
  background: rgba(46, 204, 113, 0.08);
}
.pfb-room.is-best {
  border-color: rgba(46, 204, 113, 0.45);
  background: rgba(46, 204, 113, 0.16);
}
.pfb-room.is-more {
  background: transparent;
  color: var(--text3);
}
.pfb-room small {
  color: var(--text3);
  font-weight: 500;
  margin-left: 5px;
}

/* Loading skeleton */
.pfb-skel {
  height: 12px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--skel-lo), var(--skel-hi), var(--skel-lo));
  background-size: 200% 100%;
  animation: pfbShimmer 1.4s linear infinite;
}
@keyframes pfbShimmer {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}

@media (max-width: 640px) {
  .pfb-week {
    grid-template-columns: 30px repeat(6, 1fr);
    gap: 4px;
  }
  .pfb-blk-room {
    display: none;
  }
  /* Two lines instead of five squeezed columns: code + chip on top, the date
     underneath. Auto-flow used to drop the chip in the dot's column. */
  .pfb-row {
    grid-template-columns: auto minmax(0, 1fr) auto;
    column-gap: 10px;
    row-gap: 4px;
  }
  .pfb-row-code {
    grid-area: 1 / 2;
  }
  .pfb-row .pfb-chip {
    grid-area: 1 / 3;
  }
  .pfb-row-when {
    grid-area: 2 / 2 / 2 / -1;
  }
  .pfb-row-meta {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .pfb-card {
    transition: none;
  }
  .pfb-card:hover {
    transform: none;
  }
  .pfb-skel {
    animation: none;
  }
}

  // Google identity payload can't inject an arbitrary image/URL into the page.
  window._shohoj_userProfile = function() {
    const u = getCurrentUser();
    if (!u) return { signedIn: false, uid: null, email: null, displayName: null, photoURL: null };
    return {
      signedIn:    true,
      uid:         u.uid || null,
      email:       u.email || null,
      displayName: u.displayName || null,
      photoURL:    isSafeAvatarUrl(u.photoURL) ? u.photoURL : null,
    };
  };
}

// ── js/auth/user-sync-service.js ────────────────────────────────
function parseStoredState(raw, source = 'storage') {
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch (e) {
    console.warn(`[Shohoj] Ignoring invalid ${source} state:`, e);
    return null;
  }
}

function getDataFingerprint(raw) {
  if (!raw) return '';
  try {
    const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
    const { updatedAt, _serverTimestamp, ...dataOnly } = parsed;
    return JSON.stringify(dataOnly);
  } catch (_e) {
    return typeof raw === 'string' ? raw : JSON.stringify(raw);
  }
}

// ── js/auth/firebase.js ─────────────────────────────────────────
// ── js/auth/firebase.js ───────────────────────────────────────────────────────
// Firebase Authentication + Firestore cloud sync for Shohoj
// Features: Google Sign-In, Sign-Out, cloud save/load, migration modal,
//           real-time sync, offline detection, sync persistence, data deletion

// ── State ─────────────────────────────────────────────────────────────────────
let currentUser    = null;
let _authReady           = false;
let _unsubscribeSnapshot  = null;
const STORAGE_KEY         = 'shohoj_cgpa_v1';
const LAST_SYNC_KEY       = 'shohoj_last_sync';
const SESSION_START_KEY   = 'shohoj_session_start';
const SESSION_MAX_MS      = 30 * 24 * 60 * 60 * 1000; // 30 days
const CLOUD_SAVE_DEBOUNCE_MS = 700;
let _cloudSaveTimer       = null;
let _queuedCloudSnap      = null;
let _queuedCloudResolvers = [];
let _activeCloudSave      = Promise.resolve(false);

// ── Local-write guard ─────────────────────────────────────────────────────────
// When THIS tab writes to Firestore, the onSnapshot listener will fire with
// that same data. We must ignore it or it triggers a false "other device" reload.
// _localWriteAt records the timestamp of our last Firestore write.
// Any snapshot arriving within LOCAL_WRITE_GRACE_MS of that write is ignored.
let _localWriteAt = 0;
const LOCAL_WRITE_GRACE_MS = 5000; // 5 seconds is more than enough

// ── Firestore ref ─────────────────────────────────────────────────────────────
function userDocRef(uid) {
  return doc(db, 'users', uid);
}

function clearCloudAppliedFlag() {
  try { sessionStorage.removeItem('shohoj_cloud_applied'); } catch(e) {}
}

function notifyAuthStateReady() {
  _authReady = true;
  try {
    window.dispatchEvent(new CustomEvent('shohoj:auth-changed', {
      detail: { signedIn: !!currentUser },
    }));
  } catch (_e) {}
}

function drainQueuedCloudResolvers() {
  return _queuedCloudResolvers.splice(0);
}

function clearQueuedCloudSave(result = false) {
  if (_cloudSaveTimer) clearTimeout(_cloudSaveTimer);
  _cloudSaveTimer = null;
  _queuedCloudSnap = null;
  drainQueuedCloudResolvers().forEach(resolve => resolve(result));
}

async function persistCloudState(stateSnap) {
  if (!currentUser) return false;
  if (!navigator.onLine) { setSyncIndicator('offline'); return false; }
  setSyncIndicator('syncing');
  try {
    // Record that THIS tab is about to write so the snapshot listener can ignore it
    _localWriteAt = Date.now();
    await setDoc(userDocRef(currentUser.uid), {
      data:      JSON.stringify(stateSnap),
      updatedAt: serverTimestamp(),
    }, { merge: true });
    const now = Date.now();
    try { localStorage.setItem(LAST_SYNC_KEY, String(now)); } catch(e) {}
    setSyncIndicator('synced');
    updateLastSyncLabel(now);
    return true;
  } catch (e) {
    _localWriteAt = 0; // reset guard on failure
    console.error('[Shohoj] Cloud save failed:', e);
    setSyncIndicator('error');
    showToast('⚠ Cloud save failed — data saved locally', true);
    return false;
  }
}

// ── Save to cloud ─────────────────────────────────────────────────────────────
function saveToCloud(stateSnap, options = {}) {
  if (!currentUser) return Promise.resolve(false);

  const { immediate = false } = options;

  // If we just applied cloud data (page reloaded after applyCloudData), the very
  // first debounced saveToCloud call is just echoing cloud data back — skip it.
  // Uses a separate flag so it doesn't interfere with the migration modal check.
  // immediate=true calls (explicit uploads during sign-in) are never skipped.
  if (!immediate) {
    try {
      const skipEcho = sessionStorage.getItem('shohoj_skip_first_save');
      if (skipEcho) {
        sessionStorage.removeItem('shohoj_skip_first_save');
        console.log('[Shohoj] Skipping first save-back after cloud apply');
        return Promise.resolve(true);
      }
    } catch(e) {}
  }

  if (immediate) {
    const queuedResolvers = drainQueuedCloudResolvers();
    if (_cloudSaveTimer) clearTimeout(_cloudSaveTimer);
    _cloudSaveTimer = null;
    _queuedCloudSnap = null;
    _activeCloudSave = _activeCloudSave.then(() => persistCloudState(stateSnap));
    return _activeCloudSave.then(result => {
      queuedResolvers.forEach(resolve => resolve(result));
      return result;
    });
  }

  _queuedCloudSnap = stateSnap;
  if (!navigator.onLine) {
    setSyncIndicator('offline');
  } else {
    setSyncIndicator('syncing');
  }

  return new Promise(resolve => {
    _queuedCloudResolvers.push(resolve);
    if (_cloudSaveTimer) clearTimeout(_cloudSaveTimer);
    _cloudSaveTimer = setTimeout(() => {
      const snap = _queuedCloudSnap;
      const resolvers = drainQueuedCloudResolvers();
      _queuedCloudSnap = null;
      _cloudSaveTimer = null;
      _activeCloudSave = _activeCloudSave.then(() => persistCloudState(snap));
      _activeCloudSave.then(result => {
        resolvers.forEach(done => done(result));
      });
    }, CLOUD_SAVE_DEBOUNCE_MS);
  });
}

// ── Load from cloud ───────────────────────────────────────────────────────────
async function loadFromCloud() {
  if (!currentUser) return null;
  try {
    const snap = await getDoc(userDocRef(currentUser.uid));
    if (!snap.exists()) return null;
    const raw = snap.data().data;
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    console.error('[Shohoj] Cloud load failed:', e);
    return null;
  }
}

// ── Real-time listener ────────────────────────────────────────────────────────
function startRealtimeSync(uid) {
  if (_unsubscribeSnapshot) { _unsubscribeSnapshot(); _unsubscribeSnapshot = null; }

  // Skip the very first snapshot — it's always the current state we just loaded,
  // not an update from another device.
  let isFirstSnapshot = true;

  _unsubscribeSnapshot = onSnapshot(userDocRef(uid), snap => {
    // Always skip the first snapshot on subscription — it's the current state
    if (isFirstSnapshot) {
      isFirstSnapshot = false;
      return;
    }

    // Skip snapshots that arrived within the grace window after THIS tab wrote.
    // This prevents our own saves from triggering a false "other device" reload.
    if (Date.now() - _localWriteAt < LOCAL_WRITE_GRACE_MS) {
      console.log('[Shohoj] Ignoring own-write snapshot');
      return;
    }

    // We have unsynced local changes queued (debounced save not yet flushed),
    // so local is ahead of cloud. Reloading now would clobber the user's
    // in-progress edit (e.g. a transcript import) with the stale cloud copy.
    // Let our pending write win instead.
    if (_cloudSaveTimer || _queuedCloudSnap) {
      console.log('[Shohoj] Pending local save — ignoring snapshot to avoid clobber');
      return;
    }

    if (!snap.exists()) return;
    const raw = snap.data()?.data;
    if (!raw) return;

    try {
      const localRaw = localStorage.getItem(STORAGE_KEY) || '';

      // Compare only the actual data content, ignoring Firestore metadata
      const localFingerprint = getDataFingerprint(localRaw);
      const cloudFingerprint = getDataFingerprint(raw);

      if (localFingerprint === cloudFingerprint) {
        // Data is identical — no action needed
        return;
      }

      // Genuine update from another device — apply and reload
      console.log('[Shohoj] Real update from another device — reloading');
      sessionStorage.setItem('shohoj_cloud_applied', '1');
      localStorage.setItem(STORAGE_KEY, raw);
      showToast('📡 Data updated from another device — reloading…');
      setTimeout(() => window.location.reload(), 1500);
    } catch(e) {
      console.error('[Shohoj] Real-time sync error during comparison:', e);
    }
  }, err => { console.error('[Shohoj] Real-time sync error:', err); });
}

function stopRealtimeSync() {
  if (_unsubscribeSnapshot) { _unsubscribeSnapshot(); _unsubscribeSnapshot = null; }
}

// ── Account data deletion ─────────────────────────────────────────────────────
async function deleteCloudDataSilent() {
  if (!currentUser) return true;
  try {
    stopRealtimeSync();
    await deleteDoc(userDocRef(currentUser.uid));
    try { localStorage.removeItem(LAST_SYNC_KEY); } catch(e) {}
    return true;
  } catch (e) {
    console.error('[Shohoj] Silent delete failed:', e);
    if (currentUser?.uid) startRealtimeSync(currentUser.uid);
    return false;
  }
}

async function deleteCloudData() {
  if (!currentUser) return;
  const confirmed = await showConfirmModal({
    icon:          '🗑️',
    title:         'Delete cloud data?',
    body:          'This will permanently delete all your Shohoj data from the cloud. Your local data on this device will remain untouched.',
    confirmLabel:  'Delete cloud data',
    confirmDanger: true,
  });
  if (!confirmed) return;
  try {
    stopRealtimeSync();
    await deleteDoc(userDocRef(currentUser.uid));
    startRealtimeSync(currentUser.uid);
    showToast('Cloud data deleted successfully', false, true);
    setSyncIndicator('synced');
    try { localStorage.removeItem(LAST_SYNC_KEY); } catch(e) {}
  } catch (e) {
    console.error('[Shohoj] Delete failed:', e);
    showToast('⚠ Failed to delete cloud data — please try again', true);
  }
}

// ── Sync status persistence ───────────────────────────────────────────────────
function restoreSyncLabel() {
  try {
    const ts = localStorage.getItem(LAST_SYNC_KEY);
    if (ts) updateLastSyncLabel(parseInt(ts));
  } catch(e) {}
}

function updateLastSyncLabel(timestamp) {
  const el = document.getElementById('lastSyncLabel');
  if (!el || !timestamp) return;
  const diff = Math.floor((Date.now() - timestamp) / 1000);
  let text;
  if (diff < 60)         text = 'Synced just now';
  else if (diff < 3600)  text = `Synced ${Math.floor(diff / 60)}m ago`;
  else if (diff < 86400) text = `Synced ${Math.floor(diff / 3600)}h ago`;
  else                   text = `Synced ${Math.floor(diff / 86400)}d ago`;
  el.textContent   = text;
  el.style.display = '';
}

function initOfflineDetection() {
  const handleOnline = () => {
    setSyncIndicator('synced');
    hideOfflineBanner();
    if (currentUser && typeof window._shohoj_recalc === 'function') window._shohoj_recalc();
  };
  const handleOffline = () => { setSyncIndicator('offline'); showOfflineBanner(); };
  window.addEventListener('online',  handleOnline);
  window.addEventListener('offline', handleOffline);
  if (!navigator.onLine) handleOffline();

          </div>
        </div>
        <div style="font-size:11px;color:${text2};margin-bottom:16px;text-align:center">The other will be discarded. This cannot be undone.</div>
        <div style="display:flex;gap:10px">
          <button id="keepLocalBtn" style="flex:1;padding:11px;border-radius:10px;background:#2ECC71;color:#0b0f0d;border:none;font-size:13px;font-weight:700;cursor:pointer;">Keep this device's data</button>
          <button id="keepCloudBtn" style="flex:1;padding:11px;border-radius:10px;background:rgba(86,180,233,0.15);color:#56B4E9;border:1px solid rgba(86,180,233,0.3);font-size:13px;font-weight:700;cursor:pointer;">Keep cloud data</button>
        </div>
      </div>`;
    document.body.classList.add('modal-open');
    document.body.appendChild(modal);
    const close = (val) => {
      _clearModalOpen();
      document.body.removeChild(modal);
      resolve(val);
    };
    document.getElementById('keepLocalBtn').onclick = () => close('local');
    document.getElementById('keepCloudBtn').onclick = () => close('cloud');
  });
}

async function signInWithGoogle() {
  if (!auth) {
    showToast('⚠ Sign-in is not configured on this build', true, true);
    return;
  }
  const proceed = await showSignInModal();
  if (!proceed) return;
  setAuthBtnLoading(true);
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    setAuthBtnLoading(false);
    if (e.code !== 'auth/popup-closed-by-user') {
      console.error('[Shohoj] Sign-in failed:', e);
      showToast('⚠ Sign-in failed — please try again', true, true);
    }
  }
}

// ── Sign out ──────────────────────────────────────────────────────────────────
async function signOutUser() {
  if (!auth) return;
  try {
    try { localStorage.removeItem(SESSION_START_KEY); } catch(e) {}
    clearCloudAppliedFlag();
    clearQueuedCloudSave(false);
    stopRealtimeSync();
