// ── Google One Tap ────────────────────────────────────────────────────────────
// Surfaces Google's One Tap prompt to signed-out visitors so first-time users
// can sign in without hunting for the button. Restricted to BRACU G-Suite via
// the `hd` hint; the credential is exchanged for a Firebase session, after which
// the existing onAuthStateChanged domain guard + sync flow take over unchanged.
// Fully disabled (no-op) when no client ID is configured. Closing the prompt
// triggers Google's own cooldown, so it won't nag on every reload.
let _oneTapReady    = null;   // Promise — resolves true once GIS is initialized
let _oneTapPrompted = false;  // already auto-prompted this page-load

function _loadGisScript() {
  return new Promise((resolve, reject) => {
    if (window.google?.accounts?.id) { resolve(); return; }
    const existing = document.getElementById('gsiClient');
    if (existing) {
      existing.addEventListener('load',  () => resolve());
      existing.addEventListener('error', reject);
      return;
    }
    const s = document.createElement('script');
    s.id = 'gsiClient';
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.defer = true;
    s.onload  = () => resolve();
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function _onOneTapCredential(response) {
  const idToken = response?.credential;
  if (!idToken || !auth) return;
  try {
    // onAuthStateChanged enforces the BRACU domain + runs the sync flow.
    await signInWithCredential(auth, GoogleAuthProvider.credential(idToken));
  } catch (e) {
    console.error('[Shohoj] One Tap sign-in failed:', e);
  }
}

function _initOneTap() {
  if (_oneTapReady) return _oneTapReady;
  if (!googleClientId || !auth) { _oneTapReady = Promise.resolve(false); return _oneTapReady; }
  _oneTapReady = _loadGisScript().then(() => {
    if (!window.google?.accounts?.id) return false;
    window.google.accounts.id.initialize({
      client_id:             googleClientId,
      callback:              _onOneTapCredential,
      auto_select:           false,            // never silently sign in
      cancel_on_tap_outside: true,
      context:               'signin',
      hd:                    'g.bracu.ac.bd',  // only surface BRACU accounts
      use_fedcm_for_prompt:  true,             // required path on modern Chrome
    });
    return true;
  }).catch(e => {
    console.warn('[Shohoj] One Tap unavailable:', e?.message || e);
    return false;
  });
  return _oneTapReady;
}

async function maybePromptOneTap() {
  if (!googleClientId || !auth) return;
  if (currentUser || _oneTapPrompted) return;
  _oneTapPrompted = true;
  const ok = await _initOneTap();
  if (!ok || currentUser || !window.google?.accounts?.id) return;
  try { window.google.accounts.id.prompt(); }
  catch (e) { console.warn('[Shohoj] One Tap prompt failed:', e?.message || e); }
}

function dismissOneTap() {
  if (!window.google?.accounts?.id) return;
  try { window.google.accounts.id.cancel(); } catch (_e) {}
}

// ── Init auth ─────────────────────────────────────────────────────────────────
function initAuth() {
  restoreSyncLabel();
  initOfflineDetection();
  _authReady = false;
  setAuthBtnLoading(true);

  if (!auth || !db) {
    currentUser = null;
    _isAdminCached = false;
    notifyAuthStateReady();
    setAuthBtnLoading(false);
    updateAuthUI(null);
    showNudgeBanner(false);
    return;
  }

  onAuthStateChanged(auth, async user => {
    // ── Domain enforcement ─────────────────────────────────────────────────
    let tokenClaims = null;
    if (user) {
      const tokenResult = await user.getIdTokenResult(true).catch(() => null);
      tokenClaims = tokenResult?.claims || null;
      const isBracuEmail = user.email?.toLowerCase().endsWith('@g.bracu.ac.bd');
      const isVerifiedEmail = user.emailVerified === true || tokenClaims?.email_verified === true;
      const signInProvider = tokenClaims?.firebase?.sign_in_provider || '';
      const isGoogleProvider = signInProvider === 'google.com';
      const isAllowedBracuUser = isBracuEmail && isVerifiedEmail && isGoogleProvider;
      if (!isAllowedBracuUser && tokenClaims?.admin !== true) {
        await signOut(auth);
        setAuthBtnLoading(false);
        showToast('⚠ Only verified BRACU Google accounts are supported', true, true);
        return;
      }
    }

    _isAdminCached = tokenClaims?.admin === true;
    currentUser = user;
    notifyAuthStateReady();
    setAuthBtnLoading(false);

    if (user) {
      dismissOneTap();  // close any visible prompt now that we're signed in
      // ── 30-day session expiry ────────────────────────────────────────────
      let sessionStart = null;
      try { sessionStart = parseInt(localStorage.getItem(SESSION_START_KEY)); } catch(e) {}
      const now = Date.now();
      if (!sessionStart || isNaN(sessionStart)) {
        try { localStorage.setItem(SESSION_START_KEY, String(now)); } catch(e) {}
        const firstName = firstDisplayName(user.displayName);
        showToast(`Welcome to Shohoj, ${firstName} `, false, true);
      } else if (now - sessionStart > SESSION_MAX_MS) {
        try { localStorage.removeItem(SESSION_START_KEY); } catch(e) {}
        stopRealtimeSync();
        await signOut(auth);
        showToast('Your session expired — please sign in again', true, true);
        return;
      }

      updateAuthUI(user);
      showNudgeBanner(false);
      const cloudData = await loadFromCloud();
      let localRaw = null;
      try { localRaw = localStorage.getItem(STORAGE_KEY); } catch(e) {}
      const localParsed = parseStoredState(localRaw, 'local');
      const hasLocal = !!localParsed;
      const hasCloud = !!cloudData;

      if (!hasLocal && !hasCloud) {
        sessionStorage.setItem('shohoj_cloud_applied', '1');
        setSyncIndicator('synced'); startRealtimeSync(user.uid); showNudgeBanner(false); return;
      }
      if (!hasLocal && hasCloud) { applyCloudData(cloudData); return; }
      if (hasLocal && !hasCloud) {
        setSyncIndicator('syncing');
        await saveToCloud(localParsed, { immediate: true });
        // Don't remove localStorage — keep it as the source of truth for this tab.
        // The realtime listener will ignore this write via the local-write guard
        // (_localWriteAt), so we don't need shohoj_skip_first_save here — that flag
        // would silently drop the user's first edit after sign-in.
        sessionStorage.setItem('shohoj_cloud_applied', '1');
        showToast('Data uploaded to your cloud account ✓', false, true);
        startRealtimeSync(user.uid); showNudgeBanner(false); return;
      }

      // ── Both local and cloud data exist ───────────────────────────────
      const justApplied = sessionStorage.getItem('shohoj_cloud_applied');
      if (justApplied) {
        sessionStorage.setItem('shohoj_skip_first_save', '1');
        setSyncIndicator('synced'); startRealtimeSync(user.uid); showNudgeBanner(false); return;
      }

      const localSems   = localParsed?.semesters?.length || 0;
      const cloudSems   = cloudData?.semesters?.length   || 0;

      if (localSems === 0) {
        applyCloudData(cloudData); return;
      }

      // Compare fingerprints — if they're the same data, skip migration modal
      const localFingerprint = getDataFingerprint(localRaw);
      const cloudFingerprint = getDataFingerprint(JSON.stringify(cloudData));
      if (localFingerprint === cloudFingerprint) {
        // Local already equals cloud, so nothing was applied and there is no
        // echo-back save to skip. Do NOT arm shohoj_skip_first_save here — that
        // flag would silently swallow the user's first real save after sign-in
        // (e.g. a transcript import), leaving the cloud stuck on the old data.
        sessionStorage.setItem('shohoj_cloud_applied', '1');
        setSyncIndicator('synced'); startRealtimeSync(user.uid); showNudgeBanner(false); return;
      }

      const choice = await showMigrationModal(localSems, cloudSems);

      if (choice === 'local') {
        setSyncIndicator('syncing');
        await saveToCloud(localParsed, { immediate: true });
        sessionStorage.setItem('shohoj_cloud_applied', '1');
        showToast('Local data saved to cloud ✓', false, true);
        setSyncIndicator('synced');
      } else {
        applyCloudData(cloudData); return;
      }
      startRealtimeSync(user.uid); showNudgeBanner(false);

    } else {
      currentUser = null;
      notifyAuthStateReady();
      stopRealtimeSync();
      clearCloudAppliedFlag();
      clearQueuedCloudSave(false);
      _localWriteAt = 0;
      updateAuthUI(null);
      let raw = null;
      try { raw = localStorage.getItem(STORAGE_KEY); } catch(e) {}
      const parsed = parseStoredState(raw, 'local');
      showNudgeBanner(parsed?.semesters?.length > 0);
      maybePromptOneTap();  // auto-surface One Tap for signed-out visitors
    }
  });
}

// ── Apply cloud data ──────────────────────────────────────────────────────────
// Applies cloud data directly into the running app without reloading the page.
// Writes to localStorage so the app's state restore logic can read it, then
// calls the live state functions to update the UI immediately.
function applyCloudData(cloudData) {
  try {
    sessionStorage.setItem('shohoj_cloud_applied', '1');
    sessionStorage.setItem('shohoj_skip_first_save', '1');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudData));
  } catch(e) {}

  // Apply directly into the running app — no page reload needed.
  // window._shohoj_applyState is set by main.js and handles full state restoration.
  if (typeof window._shohoj_applyState === 'function') {
    window._shohoj_applyState(cloudData);
  } else {
    // Fallback: if the app isn't fully booted yet (e.g. very fast sign-in on
    // first load before main.js runs), a single reload is unavoidable.
    window.location.reload();
  }
}

// ── Seat-drop alert sync ──────────────────────────────────────────────────────
// Mirror the Seat Status watchlist to Firestore (seatAlertWatches/{uid}) so the
// cron Worker can email the signed-in student when a watched seat opens — even
// with Shohoj closed. No-op (resolves false) when signed out; the Seats tab then
// falls back to in-tab alerts only and prompts sign-in. The doc is fully
// overwritten each sync; `email` is pinned to the user's own address (enforced
// again by firestore.rules) so a watch can only ever notify its own owner.
window._shohoj_syncSeatAlerts = async function(sections, enabled) {
  if (!currentUser || !currentUser.email || !db) return false;
  try {
    const list = (Array.isArray(sections) ? sections : []).slice(0, 50)
      .map(s => ({ id: Number(s.id), code: String(s.code || ''), name: String(s.name || '') }))
      .filter(s => Number.isFinite(s.id));
    // The caller (Seats tab) owns the on/off preference and passes the resolved
    // flag; fall back to the old "armed when watching" rule if omitted.
    const armed = typeof enabled === 'boolean' ? enabled : list.length > 0;
    await setDoc(doc(db, 'seatAlertWatches', currentUser.uid), {
      email:     currentUser.email,
      enabled:   armed,
      sections:  list,
      updatedAt: serverTimestamp(),
    });
    return true;
  } catch (e) {
    console.error('[Shohoj] Seat-alert sync failed:', e);
    return false;
  }
};

// ── Faculty review hooks ──────────────────────────────────────────────────────
// Expose a thin Firestore bridge so the bundled code (js/core/reviews.js) can
// submit and fetch reviews without importing Firebase itself.

installReviewIdentityHooks({
  getCurrentUser: () => currentUser,
  isAuthReady: () => _authReady,
});

// Reviews are written through the Cloudflare Worker (`POST /reviews`) using a
// service-account identity. Firestore rules deny all client creates on
// `facultyReviews`, so the canonical sha256(uid|initials|course) ID can't be
// subverted by clients posting under arbitrary hex suffixes.
// Privacy-preserving local "receipt" of reviews this browser submitted, keyed by
// uid. Public review docs store no uid (authorship is only the non-reversible
// sha256(uid|initials|course) doc id), so this local list is the only way the
// Profile tab can show a student "your reviews" without a de-anonymizing query.
// Best-effort: localStorage may be unavailable, and reviews written on another
// device won't appear here.
const MY_REVIEWS_KEY = 'shohoj_my_reviews_v1';
function _recordMyReview(uid, entry) {
  if (!uid) return;
  try {
    const all = JSON.parse(localStorage.getItem(MY_REVIEWS_KEY) || '{}');
    const list = Array.isArray(all[uid]) ? all[uid] : [];
    const key = `${entry.facultyInitials}|${entry.courseCode}`;
    const next = list.filter(r => `${r.facultyInitials}|${r.courseCode}` !== key);
    next.push(entry);
    all[uid] = next;
    localStorage.setItem(MY_REVIEWS_KEY, JSON.stringify(all));
  } catch { /* storage unavailable — non-fatal */ }
}

window._shohoj_submitReview = async function(payload) {
  if (!currentUser) return { ok: false, error: 'Not signed in' };
  const base = getPapersWorkerUrl();
  if (!base) return { ok: false, error: 'Review service not configured' };
  const token = await getCurrentUserIdToken(currentUser);
  if (!token) return { ok: false, error: 'Could not get auth token' };
  try {
    const res = await fetch(`${base}/reviews`, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        facultyInitials: payload?.facultyInitials,
        courseCode:      payload?.courseCode,
        semester:        payload?.semester || '',
        text:            payload?.text     || '',
        ratings:         payload?.ratings,
      }),
    });
    if (res.status === 409) {
      return {
        ok: false,
        code: 'already-exists',
        error: 'You have already submitted a review for this faculty-course pair. Reviews cannot be edited from the client.',
      };
    }
    if (!res.ok) {
      let msg = 'Submission failed';
      try { msg = (await res.json()).error || msg; } catch {}
      return { ok: false, error: msg };
    }
    const data = await res.json().catch(() => ({}));
    _recordMyReview(currentUser.uid, {
      id:              data.id || null,
      facultyInitials: payload?.facultyInitials || '',
      courseCode:      payload?.courseCode || '',
      semester:        payload?.semester || '',
      at:              Date.now(),
    });
    return { ok: true, id: data.id || null };
  } catch (e) {
    console.error('[Shohoj] submitReview failed:', e);
    return { ok: false, error: e.message || 'Submission failed' };
  }
};

window._shohoj_reportReview = async function({ id, reviewId, reason, reporterUid }) {
  if (!currentUser) return { ok: false, error: 'Not signed in' };
  if (!id || typeof id !== 'string') return { ok: false, error: 'Invalid report id' };
  if (reporterUid !== currentUser.uid) return { ok: false, error: 'Invalid reporter' };
  try {
    const ref = doc(db, 'reviewReports', id);
    await setDoc(ref, {
      reviewId: String(reviewId || '').slice(0, 128),
      reason:   String(reason || '').slice(0, 300),
      reporterUid: currentUser.uid,
      createdAt: serverTimestamp(),
    });
    return { ok: true };
  } catch (e) {
    console.error('[Shohoj] reportReview failed:', e);
    if (e.code === 'permission-denied') {
      return { ok: false, error: 'Report could not be submitted. The review may have already been removed or you may have reported it already.' };
    }
    return { ok: false, error: e.message || 'Report failed' };
  }
};

// Fetch reviews scoped to a faculty, optionally a course, with paging.
// `after` is the last review doc from the previous page (pass through).
window._shohoj_fetchReviews = async function({ facultyInitials, courseCode, pageSize = 50, after = null }) {
  if (!currentUser || !facultyInitials) return { reviews: [], nextCursor: null };
  try {
    const col = collection(db, 'facultyReviews');
    const constraints = [where('facultyInitials', '==', facultyInitials)];
    if (courseCode) constraints.push(where('courseCode', '==', courseCode));
    constraints.push(orderBy('createdAt', 'desc'));
    if (after && after._cursor) constraints.push(startAfter(after._cursor));
    constraints.push(qLimit(Math.min(pageSize, 200)));
    const q = query(col, ...constraints);
    const snap = await getDocs(q);
    const reviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const last = snap.docs[snap.docs.length - 1];
    const nextCursor = snap.docs.length === pageSize && last ? { _cursor: last } : null;
    return { reviews, nextCursor };
  } catch (e) {
    console.warn('[Shohoj] fetchReviews failed:', e);
    return { reviews: [], nextCursor: null };
  }
};

window._shohoj_fetchFacultyProfiles = async function(initialsArr) {

// ── Account dropdown menu ─────────────────────────────────────────────────────
// The signed-in account pill opens this lightweight menu (Profile / Seat
// watchlist / Admin / Sign out) instead of navigating straight to the Profile
// page, so the common actions — especially sign-out — are one click away
// without a full page navigation. The menu is appended to <body> and positioned
// `fixed` against the pill's bounding rect so the nav's backdrop-filter/overflow
// can't clip it and it stays glued to the pill on scroll/resize. Identity fields
// (displayName / email / photoURL) come from Google's identity data and are
// outside our trust boundary, so they're written via textContent / guarded src,
// never innerHTML. Icons are emoji set via textContent, matching the calc tabs.
let _accountMenuEl      = null;
let _accountMenuCleanup = null;

function _closeAccountMenu() {
  if (_accountMenuCleanup) { _accountMenuCleanup(); _accountMenuCleanup = null; }
  if (_accountMenuEl) { _accountMenuEl.remove(); _accountMenuEl = null; }
  const btn = document.getElementById('authBtn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

function _positionAccountMenu(btn, menu) {
  const r = btn.getBoundingClientRect();
  const margin = 8;
  const width = menu.offsetWidth;
  let left = Math.round(r.right - width);              // anchor menu's right edge to pill's
  const maxLeft = window.innerWidth - width - margin;
  if (left > maxLeft) left = maxLeft;
  if (left < margin)  left = margin;
  menu.style.top  = `${Math.round(r.bottom + 6)}px`;
  menu.style.left = `${left}px`;
}

function _accountMenuKeyNav(e, menu) {
  if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) return;
  e.preventDefault();
  const items = Array.from(menu.querySelectorAll('[role="menuitem"]'));
  if (!items.length) return;
  const idx = items.indexOf(document.activeElement);
  let next;
  if (e.key === 'ArrowDown')    next = idx < 0 ? 0 : (idx + 1) % items.length;
  else if (e.key === 'ArrowUp') next = idx <= 0 ? items.length - 1 : idx - 1;
  else if (e.key === 'Home')    next = 0;
  else                          next = items.length - 1;
  items[next].focus();
}

function _buildAccountMenu(user) {
  const menu = document.createElement('div');
  menu.className = 'account-menu';
  menu.setAttribute('role', 'menu');
  menu.setAttribute('aria-label', 'Account menu');

  // Identity header — avatar + name + email.
  const header = document.createElement('div');
  header.className = 'account-menu-header';
  const av = document.createElement('div');
  av.className = 'account-menu-avatar';
  if (isSafeAvatarUrl(user.photoURL)) {
    const img = document.createElement('img');
    img.setAttribute('referrerpolicy', 'no-referrer');
    img.src = user.photoURL;
    img.alt = '';
    av.appendChild(img);
  } else {
    av.classList.add('is-fallback');
    av.textContent = (user.displayName || user.email || '?').charAt(0).toUpperCase();
  }
  const idBlock = document.createElement('div');
  idBlock.className = 'account-menu-id';
  const nameEl = document.createElement('div');
  nameEl.className = 'account-menu-name';
  nameEl.textContent = user.displayName || 'Signed in';
  const emailEl = document.createElement('div');
  emailEl.className = 'account-menu-email';
  emailEl.textContent = user.email || '';
  idBlock.appendChild(nameEl);
  idBlock.appendChild(emailEl);
  header.appendChild(av);
  header.appendChild(idBlock);
  menu.appendChild(header);

  const addItem = (emoji, label, onActivate, opts = {}) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'account-menu-item' + (opts.danger ? ' is-danger' : '');
    item.setAttribute('role', 'menuitem');
    item.tabIndex = -1;
    const ic = document.createElement('span');
    ic.className = 'account-menu-icon';
    ic.setAttribute('aria-hidden', 'true');
    ic.textContent = emoji;
    const lb = document.createElement('span');
    lb.className = 'account-menu-label';
    lb.textContent = label;
    item.appendChild(ic);
    item.appendChild(lb);
    item.addEventListener('click', () => { _closeAccountMenu(); onActivate(); });
    menu.appendChild(item);
    return item;
  };
  const addSep = () => {
    const sep = document.createElement('div');
    sep.className = 'account-menu-sep';
    menu.appendChild(sep);
  };

  addItem('👤', 'View profile', () => { window.location.href = 'profile/'; });
  addItem('🪑', 'Seat watchlist', () => {
    if (typeof window.switchCalcTab === 'function') {
      window.switchCalcTab('seats');
      document.getElementById('calculator')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      window.location.href = './#calculator/seats';
    }
  });
  if (_isAdminUser()) {
    addItem('🛡️', 'Admin dashboard', () => { window.location.href = 'admin/'; });
  }
  addSep();
  addItem('🚪', 'Sign out', () => { signOutUser(); }, { danger: true });

  return menu;
}

function _toggleAccountMenu(user) {
  if (_accountMenuEl) { _closeAccountMenu(); return; }
  const btn = document.getElementById('authBtn');
  if (!btn) return;

  const menu = _buildAccountMenu(user);
  document.body.appendChild(menu);
  _accountMenuEl = menu;
  btn.setAttribute('aria-expanded', 'true');
  _positionAccountMenu(btn, menu);
  menu.querySelector('[role="menuitem"]')?.focus();

  const onDocClick = (e) => {
    if (!menu.contains(e.target) && !btn.contains(e.target)) _closeAccountMenu();
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { _closeAccountMenu(); btn.focus(); return; }
    _accountMenuKeyNav(e, menu);
  };
  const reposition = () => { if (_accountMenuEl) _positionAccountMenu(btn, _accountMenuEl); };
  // Defer the outside-click listener so the click that opened the menu doesn't
  // immediately close it.
  setTimeout(() => document.addEventListener('click', onDocClick), 0);
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', reposition);
  window.addEventListener('scroll', reposition, true);
  _accountMenuCleanup = () => {
    document.removeEventListener('click', onDocClick);
    document.removeEventListener('keydown', onKey);
    window.removeEventListener('resize', reposition);
    window.removeEventListener('scroll', reposition, true);
  };
}

function updateAuthUI(user) {
  _toggleAdminNavBtn();
  _closeAccountMenu();   // drop any open menu before repainting the pill
  const btn = document.getElementById('authBtn');
  if (!btn) return;

  if (user) {
    btn.className     = 'auth-btn-signed-in magnetic';
    btn.style.cssText = '';
    btn.disabled      = false;
    btn.title         = 'Account menu';
    btn.setAttribute('aria-haspopup', 'menu');
    btn.setAttribute('aria-expanded', 'false');
    // The pill opens the account menu (Profile / Seat watchlist / Admin / Sign
    // out) rather than navigating straight to the Profile page, so sign-out and
    // the other actions are reachable in one click. See _buildAccountMenu.
    btn.onclick       = (e) => { e.preventDefault(); e.stopPropagation(); _toggleAccountMenu(user); };
    btn.ondblclick    = null;

    const firstName = user.displayName?.split(' ')[0] || 'Account';

    // Build the signed-in pill via DOM APIs so that user.displayName /
    // user.photoURL / user.email (which come from Google's identity data
    // and are outside our trust boundary) never flow through innerHTML.
    btn.textContent = '';
    const wrap = document.createElement('div');
    wrap.className = 'auth-avatar-wrap';
    if (isSafeAvatarUrl(user.photoURL)) {
      const img = document.createElement('img');
      img.className = 'auth-avatar-img';
      img.setAttribute('referrerpolicy', 'no-referrer');
      img.src = user.photoURL;
      img.alt = firstName;
      wrap.appendChild(img);
    } else {
      const fb = document.createElement('div');
      fb.className = 'auth-avatar-fallback';
      fb.textContent = firstName.charAt(0).toUpperCase();
      wrap.appendChild(fb);
    }
    const dot = document.createElement('span');
    dot.id = 'syncDot';
    dot.className = 'auth-sync-dot';
    wrap.appendChild(dot);
    btn.appendChild(wrap);

    const nameEl = document.createElement('span');
    nameEl.className = 'auth-name';
    nameEl.textContent = firstName;
    btn.appendChild(nameEl);

    setSyncIndicator('synced');
    restoreSyncLabel();

    let syncLabel = document.getElementById('lastSyncLabel');
    if (!syncLabel) {
      syncLabel           = document.createElement('div');
      syncLabel.id        = 'lastSyncLabel';
      syncLabel.className = 'auth-last-sync';
      btn.parentNode?.insertBefore(syncLabel, btn.nextSibling);
    }
    syncLabel.style.display = '';

  } else {
    btn.className     = 'auth-btn-signed-out magnetic';
    btn.style.cssText = '';
    btn.disabled      = false;
    btn.title         = 'Sign in with your BRACU G-Suite account';
    btn.removeAttribute('aria-haspopup');
    btn.removeAttribute('aria-expanded');
    btn.onclick       = signInWithGoogle;
    btn.ondblclick    = null;
    btn.innerHTML = `
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;opacity:0.75">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" fill="currentColor"/>
      </svg>
      <span class="auth-signin-label">Sign in</span>
    `;
    const syncLabel = document.getElementById('lastSyncLabel');
    if (syncLabel) syncLabel.style.display = 'none';
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, isError = false, isAuth = false) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `
    position:fixed;
    top:64px;left:50%;transform:translateX(-50%);
    background:${isError ? '#e74c3c' : '#2ECC71'};
    color:${isError ? '#fff' : '#0b0f0d'};
    padding:10px 20px;
    border-radius:100px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 4px 20px ${isError ? 'rgba(231,76,60,0.4)' : 'rgba(46,204,113,0.4)'};
    z-index:99998;
    pointer-events:none;
    animation:toastIn 0.3s ease;
    white-space:nowrap;
    max-width:calc(100vw - 40px);
  `;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0'; t.style.transition = 'opacity 0.3s';
    setTimeout(() => { if (t.parentNode) document.body.removeChild(t); }, 300);
  }, 3500);
}

window._shohoj_submitFeedback = async function({ type, text, context, anonymous, uid: submitterUid }) {
  if (!currentUser) return { ok: false, error: 'Not signed in' };
  const validTypes = ['bug', 'feature', 'general'];
  if (!validTypes.includes(type)) return { ok: false, error: 'Invalid type' };
  const trimmed = String(text || '').trim().slice(0, 500);
  if (trimmed.length < 3) return { ok: false, error: 'Feedback too short' };
  try {
    const data = {
      type,
      text: trimmed,
      context: (context && typeof context === 'object') ? context : {},
      anonymous: !!anonymous,
      createdAt: serverTimestamp(),
    };
    if (!anonymous && submitterUid === currentUser.uid) {
      data.uid = currentUser.uid;
    }
    await addDoc(collection(db, 'appFeedback'), data);
    return { ok: true };
  } catch (e) {
    console.error('[Shohoj] submitFeedback failed:', e);
    return { ok: false, error: e.message || 'Submission failed' };
  }
};

  if (!groupId) return { ok: false, error: 'Missing group id' };
  try {
    const groupRef = doc(db, 'studyGroups', String(groupId));
    const groupSnap = await getDoc(groupRef);

      const reportRes = await window._shohoj_deleteStudyGroupReport(reportId);

      return { ok: true, missingGroup: true };

    if (!reportRes?.ok) {
      return { ok: false, error: reportRes.error || 'Group deleted, but report dismissal failed' };
    }
    return { ok: true };
  } catch (e) {
    console.error('[Shohoj] deleteStudyGroupByReport failed:', e);
    return { ok: false, error: e.message || 'Delete failed' };
  }
};

// ── R2-backed paper storage (via Cloudflare Worker proxy) ─────────────────
// Download is keyed on the Firestore paper id, not the raw storage path. The
// worker re-fetches the paper doc using the caller's own ID token, so
// Firestore rules enforce that the requester is allowed to read it
// (approved == true OR uploaderUid == self OR admin). This closes the
// path-guessing bypass where an attacker who guessed a storagePath could
// download an unapproved file directly.
// Map a file's leading magic bytes to a renderable MIME type. Pre-migration R2
// objects can be served without a usable Content-Type (application/octet-stream
// or empty), so `res.blob()` yields a typeless blob and the preview <iframe>
// renders blank. Sniffing lets us re-tag the blob with a type the browser will
// render inline. Returns null when the signature isn't a supported preview type.
function _sniffPreviewMime(bytes) {
  const b = bytes;
  if (b.length < 4) return null;
  // %PDF
  if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return 'application/pdf';
  // PNG: 89 50 4E 47
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return 'image/png';
  // JPEG: FF D8 FF
  if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return 'image/jpeg';
  // GIF: "GIF"
  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return 'image/gif';
  // WEBP: "RIFF"…"WEBP"
  if (b.length >= 12 &&
      b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 &&
      b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'image/webp';
  return null;
}

// When the server hands back a generic/empty Content-Type, re-wrap the blob
// with a sniffed type so the preview renders inline instead of blank.
async function _retypeGenericBlob(blob) {
  const t = (blob.type || '').toLowerCase();
  if (t === 'application/pdf' || t.startsWith('image/')) return blob;
  try {
    const head = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
    const sniffed = _sniffPreviewMime(head);
    if (sniffed) return new Blob([blob], { type: sniffed });
  } catch { /* sniff failed — fall through to original blob */ }
  return blob;
}

    });

      console.warn('[Shohoj] paperDownloadUrl: worker returned', res.status);
      return null;
    }

window._shohoj_uploadPaper = async function({ file, courseCode, type, title, semester, facultyInitials }) {
  if (!currentUser) return { ok: false, error: 'Not signed in' };
  if (!file || !courseCode || !type || !title) return { ok: false, error: 'Missing fields' };
  const base = getPapersWorkerUrl();
  if (!base) return { ok: false, error: 'Upload service not configured. Contact admin.' };
  try {
    const safeCourse = String(courseCode).toUpperCase();
    const ext = (file.name.split('.').pop() || 'pdf').toLowerCase().replace(/[^a-z0-9]/g, '');
    const filename = `${Date.now()}_${Math.random().toString(36).slice(2, 10)}.${ext}`;

    const token = await getCurrentUserIdToken(currentUser);
    if (!token) return { ok: false, error: 'Could not get auth token' };

    // Extra metadata is passed as URL params so the Worker can validate the
    // upload, write the authoritative Firestore paper doc, and include the
    // fields in the admin notification email.
    const params = new URLSearchParams({
      courseCode: safeCourse,
      filename,
      title: String(title || '').slice(0, 120),
      type: String(type || ''),
    });
    if (semester)        params.set('semester', String(semester).slice(0, 40));
    if (facultyInitials) params.set('facultyInitials', String(facultyInitials).toUpperCase().slice(0, 20));

    const uploadRes = await fetch(
      `${base}/upload?${params.toString()}`,
      {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${token}`,
          'Content-Type': file.type || 'application/octet-stream',
        },
        body: file,
      },
    );
    if (!uploadRes.ok) {
      let msg = 'Upload failed';
      try { msg = (await uploadRes.json()).error || msg; } catch {}
      return { ok: false, error: msg };
    }
    const uploadPayload = await uploadRes.json().catch(() => ({}));
    if (!uploadPayload?.id) return { ok: false, error: 'Upload metadata was not saved' };
    return { ok: true, id: uploadPayload.id };
  } catch (e) {
    console.error('[Shohoj] uploadPaper failed:', e);
    return { ok: false, error: e.message || 'Upload failed' };
  }
};

window._shohoj_fetchAdminStats = async function() {
  if (!_isAdminUser()) return null;
  const since = Date.now() - 30 * 24 * 60 * 60 * 1000;
  const sinceTs = new Date(since);

  const _toMs = (ts) => {
    if (!ts) return 0;
    if (typeof ts === 'object' && ts.toMillis) return ts.toMillis();
    return Number(ts) || 0;
  };

  // Pull recent (last 30d) + a larger sample for top-N aggregation.
  const [reviewsRecent, papersRecent, feedbackRecent,
         reviewsAll, papersAll, feedbackAll,
         paperReports, reviewReports, pendingPapers] = await Promise.all([
    getDocs(query(collection(db, 'facultyReviews'),
                  where('createdAt', '>=', sinceTs), orderBy('createdAt', 'desc'),
                  qLimit(1000))).then(s => s.docs.map(d => d.data())).catch(() => []),
    getDocs(query(collection(db, 'papers'),
                  where('createdAt', '>=', sinceTs), orderBy('createdAt', 'desc'),
                  qLimit(1000))).then(s => s.docs.map(d => d.data())).catch(() => []),
    getDocs(query(collection(db, 'appFeedback'),
                  where('createdAt', '>=', sinceTs), orderBy('createdAt', 'desc'),
                  qLimit(1000))).then(s => s.docs.map(d => d.data())).catch(() => []),
    getDocs(query(collection(db, 'facultyReviews'),
                  orderBy('createdAt', 'desc'), qLimit(1000)))
      .then(s => s.docs.map(d => d.data())).catch(() => []),
    getDocs(query(collection(db, 'papers'),
                  orderBy('createdAt', 'desc'), qLimit(1000)))
      .then(s => s.docs.map(d => d.data())).catch(() => []),
    getDocs(query(collection(db, 'appFeedback'),
                  orderBy('createdAt', 'desc'), qLimit(1000)))
      .then(s => s.docs.map(d => d.data())).catch(() => []),
    window._shohoj_fetchPaperReports(),
    window._shohoj_fetchReviewReports(),
    window._shohoj_fetchUnapprovedPapers(),
  ]);

  // Build 30-day daily buckets (UTC date key). Pre-fill with zeros.
  const buckets = {};
  for (let i = 29; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const key = d.toISOString().slice(0, 10);
    buckets[key] = { date: key, reviews: 0, papers: 0, feedback: 0 };
  }
  const _bump = (rows, kind) => {
    rows.forEach(r => {
      const ms = _toMs(r.createdAt);
      if (!ms) return;
      const key = new Date(ms).toISOString().slice(0, 10);
      if (buckets[key]) buckets[key][kind]++;
    });
  };
  _bump(reviewsRecent,  'reviews');
  _bump(papersRecent,   'papers');
  _bump(feedbackRecent, 'feedback');

  // Filter seeded reviews from analytics so the chart reflects real activity.
  const reviewsRecentReal = reviewsRecent.filter(r => r.seeded !== true);
  const reviewsAllReal    = reviewsAll.filter(r => r.seeded !== true);

  // Re-bucket reviews using the real-only set (papers + feedback already real).
  Object.values(buckets).forEach(b => { b.reviews = 0; });
  _bump(reviewsRecentReal, 'reviews');

  // Top faculty (by review count) and top courses (by paper count).
  const facultyMap = new Map();
  reviewsAllReal.forEach(r => {
    const k = r.facultyInitials || '?';
    facultyMap.set(k, (facultyMap.get(k) || 0) + 1);
  });
  const topFaculty = [...facultyMap.entries()]
    .map(([initials, count]) => ({ initials, count }))
    .sort((a, b) => b.count - a.count).slice(0, 5);

  const courseMap = new Map();
  papersAll.forEach(p => {
    const k = p.courseCode || '?';
    courseMap.set(k, (courseMap.get(k) || 0) + 1);
  });
  const topCourses = [...courseMap.entries()]
    .map(([code, count]) => ({ code, count }))
    .sort((a, b) => b.count - a.count).slice(0, 5);

  // Type breakdowns.
  const paperTypes = {};
  papersAll.forEach(p => {
    const t = p.type || 'other';
    paperTypes[t] = (paperTypes[t] || 0) + 1;
  });
  const feedbackTypes = {};
  feedbackAll.forEach(f => {
    const t = f.type || 'general';
    feedbackTypes[t] = (feedbackTypes[t] || 0) + 1;
  });

  const approvedPapers = papersAll.filter(p => p.approved === true).length;

  return {
    counts: {
      reviews:        reviewsAllReal.length,
      papers:         approvedPapers,
      pendingPapers:  pendingPapers.length,
      feedback:       feedbackAll.length,
      paperReports:   paperReports.length,
      reviewReports:  reviewReports.length,
    },
    activity: Object.values(buckets),
    topFaculty,
    topCourses,
    paperTypes,
    feedbackTypes,
  };
};

  do { prev = out; out = out.replace(/<[^>]+>/g, ''); } while (out !== prev);
  return out;
}

function sanitizeGradePointValue(value) {
  if (value === undefined || value === null) return '';
  if (value === 'NT') return 'NT';

  if (typeof value === 'number') {
    return Number.isFinite(value) && value >= 0 && value <= 4 ? value : '';
  }

  if (typeof value !== 'string') return '';

  const trimmed = value.trim();
  if (trimmed === '') return '';
  if (trimmed.toUpperCase() === 'NT') return 'NT';
  if (!/^(?:\d+(?:\.\d+)?)$/.test(trimmed)) return '';

  const numeric = Number.parseFloat(trimmed);
  return Number.isFinite(numeric) && numeric >= 0 && numeric <= 4 ? trimmed : '';
}

/**
 * Upper bound on tracked components per course (#500). Not a syllabus
 * judgement — a bound on what restore will accept, so a corrupted or hostile
 * document cannot grow the cloud doc without limit.
 */
const MAX_MARK_COMPONENTS = 20;

/**
 * Validate persisted mark components. Returns undefined rather than an empty
 * array when there is nothing usable, so a course that never tracked marks
 * stays byte-identical through a save/restore cycle.
 */
function sanitizeMarkComponents(value) {
  if (!Array.isArray(value)) return undefined;

  const out = [];
  for (const raw of value) {
    if (out.length >= MAX_MARK_COMPONENTS) break;
    if (!raw || typeof raw !== 'object') continue;

    const weight = typeof raw.weight === 'number' && Number.isFinite(raw.weight) ? raw.weight : NaN;
    const outOf = typeof raw.outOf === 'number' && Number.isFinite(raw.outOf) ? raw.outOf : NaN;
    // A component with no weight or no denominator cannot contribute to any
    // answer, so it is dropped rather than stored as a broken row.
    if (!(weight > 0) || !(outOf > 0)) continue;

    const score =
      typeof raw.score === 'number' && Number.isFinite(raw.score) ? Math.max(0, raw.score) : null;

    out.push({
      name: typeof raw.name === 'string' ? stripTags(raw.name).slice(0, 40) : '',
      weight: Math.min(100, weight),
      score,
      outOf,
    });
  }

  return out.length ? out : undefined;
}

function sanitizeRestoredState(saved) {
  if (!saved || typeof saved !== 'object') return null;
  if (!Array.isArray(saved.semesters)) return null;

  if (saved.currentDept && typeof saved.currentDept === 'string') {
    if (!/^[A-Z]{2,4}$/.test(saved.currentDept)) saved.currentDept = '';
  }

  saved.semesters = saved.semesters.filter(sem => {
    if (!sem || typeof sem !== 'object') return false;
    if (typeof sem.id !== 'number') return false;

    // ── Summary blocks pass through as-is after basic validation ──────────
    if (sem.summary === true) {
      const cgpa = parseFloat(sem.summaryCGPA);
      const cr   = parseFloat(sem.summaryCredits);
      if (isNaN(cgpa) || cgpa < 0 || cgpa > 4.0) return false;
      if (isNaN(cr)   || cr < 0)                  return false;
      // Normalize attempted credits — default to earned if missing
      const att = parseFloat(sem.summaryAttempted);
      sem.summaryAttempted = (!isNaN(att) && att >= 0) ? att : cr;
      // normalise optional semesters count
      sem.summarySemesters = typeof sem.summarySemesters === 'number'
        ? sem.summarySemesters : 0;
      sem.courses = [];   // always empty
      sem.running = false;
      return true;
    }

    sem.name = sanitizeSemName(sem.name || '');
    if (!Array.isArray(sem.courses)) { sem.courses = []; return true; }
    // This map is an allowlist: a field absent here is dropped on restore.
    sem.courses = sem.courses.filter(c => c && typeof c === 'object').map(c => {
      const marks = sanitizeMarkComponents(c.marks);
      return {
        name:       typeof c.name === 'string' ? c.name : '',
        credits:    typeof c.credits === 'number' && isFinite(c.credits) ? c.credits : 0,
        grade:      typeof c.grade === 'string' ? c.grade : '',
        gradePoint: sanitizeGradePointValue(c.gradePoint),
        faculty:    typeof c.faculty === 'string' ? c.faculty.toUpperCase().slice(0, 6) : '',
        ...(marks ? { marks } : {}),
      };
    });
    return true;
  });

  saved.semesterCounter = typeof saved.semesterCounter === 'number'
    ? saved.semesterCounter : saved.semesters.length;

  saved.planCourses = Array.isArray(saved.planCourses)
    ? saved.planCourses.filter(c => typeof c === 'string' && /^[A-Z]{2,4}\d{3}[A-Z]?$/.test(c))
    : [];

  return saved;
}

function getCurrentSeason() {
  const m = new Date().getMonth() + 1;
  if (m <= 4) return 'Spring';
  if (m <= 8) return 'Summer';
  return 'Fall';
}

function getLastCompletedSemester(seasons) {
  const order = seasons || SEASON_ORDER;
  const curSeason = getCurrentSeason();
  const curYear = new Date().getFullYear();
  const curGlobalIdx = SEASON_ORDER.indexOf(curSeason);

  const offeredBeforeCurrent = order.filter(season =>
    SEASON_ORDER.indexOf(season) < curGlobalIdx
  );

  if (offeredBeforeCurrent.length > 0) {
    return { season: offeredBeforeCurrent[offeredBeforeCurrent.length - 1], year: curYear };
  }

  return { season: order[order.length - 1], year: curYear - 1 };
}

function countSemesters(startSeason, startYear, endSeason, endYear, seasons) {
  const order = seasons || SEASON_ORDER;
  let si = order.indexOf(startSeason);
  if (si === -1) si = 0;
  let yr = parseInt(startYear);
  let count = 0;
  while (true) {
    count++;
    if (order[si] === endSeason && yr === parseInt(endYear)) break;
    si++;
    if (si >= order.length) { si = 0; yr++; }
    if (yr > parseInt(endYear) + 1) break;
  }
  return count;
}

function generateSemesterNames(startSeason, startYear, count, seasons) {
  const order = seasons || SEASON_ORDER;
  const names = [];
  let si = order.indexOf(startSeason);
  if (si === -1) si = 0;
  let yr = parseInt(startYear);
  for (let i = 0; i < count; i++) {
    names.push(`${order[si]} ${yr} (${ordinalSup(i + 1)} Semester)`);
    si++;
    if (si >= order.length) { si = 0; yr++; }
  }
  return names;
}

// ── js/core/dispatch.js ─────────────────────────────────────────
// ── ACTION DISPATCH ───────────────────────────────────────────────────────────
// Replaces inline onclick/onchange/oninput attributes with delegated listeners
// resolved from a single data-action attribute plus a registry of handlers.
// This lets the bundled HTML drop 'unsafe-inline' from script-src in CSP.
//
// Usage from a module's template literal:
//   <button data-action="addCourse" data-sem-id="${sem.id}">+ Add</button>
//
// And from the module's top-level code (runs once at module load):
//   registerAction('addCourse', (el) => addCourse(Number(el.dataset.semId)));
//
// The handler receives (element, event). The event type is whichever of
// click / change / input fired — each element should declare a data-action
// for exactly one event type.

const _actions = Object.create(null);

function registerAction(name, handler) {
  _actions[name] = handler;
}

function _dispatch(event) {
  const el = event.target.closest('[data-action]');
  if (!el) return;
  const fn = _actions[el.dataset.action];
  if (typeof fn === 'function') fn(el, event);
}

// Enter-to-submit, CSP-safe. An element can carry data-enter-action to run a
// registered action when Enter is pressed inside it (replaces inline
// onkeydown="...Enter..." attributes, which the bundle's CSP blocks).
function _dispatchEnter(event) {
  if (event.key !== 'Enter') return;
  // keydown can fire with document/window as target, which lack closest().
  if (!event.target || typeof event.target.closest !== 'function') return;
  const el = event.target.closest('[data-enter-action]');
  if (!el) return;
  const fn = _actions[el.dataset.enterAction];
  if (typeof fn === 'function') fn(el, event);
}

if (typeof document !== 'undefined') {
  ['click', 'change', 'input'].forEach(type => {
    document.addEventListener(type, _dispatch);
  });
  document.addEventListener('keydown', _dispatchEnter);
}

// Expose globally so modules can register without importing (e.g. firebase.js
// is a separate module script that does not consume the bundle's exports).
if (typeof window !== 'undefined') {
  window._shohoj_registerAction = registerAction;
}

// Saved routine + semester-plan snapshot — read locally, no network. The
// Routine tab persists { picks: { COURSE: sectionId|null } } under this key
// (see routineTab.js), and the planner exposes its course codes via a global.
// Both are data the student already entered; nothing here touches CONNECT.
const PF_ROUTINE_STORAGE_KEY = 'shohoj_routine_v1';
function _routineSummary() {
  let pickedCourses = [];
  try {
    const raw = (typeof localStorage !== 'undefined') ? localStorage.getItem(PF_ROUTINE_STORAGE_KEY) : null;
    if (raw) {
      const parsed = JSON.parse(raw);
      const picks = (parsed && parsed.picks && typeof parsed.picks === 'object') ? parsed.picks : {};
      pickedCourses = Object.entries(picks)
        .filter(([, v]) => typeof v === 'number')
        .map(([code]) => String(code).toUpperCase())
        .sort();
    }
  } catch { pickedCourses = []; }

  let plannerCourses = [];
  try {
    if (typeof window !== 'undefined' && typeof window._shohoj_getPlanCourses === 'function') {
      plannerCourses = (window._shohoj_getPlanCourses() || [])
        .map(c => String(c || '').toUpperCase())
        .filter(Boolean);
    }

  return { pickedCourses, plannerCourses };
}

// Reviews the student has written, read from a privacy-preserving local receipt
// (see firebase.js submitReview). Public review docs deliberately store NO uid —
// authorship is only a non-reversible sha256(uid|initials|course) in the doc id
// — so there is no uid-indexed query that could de-anonymize a review. We keep a
// per-uid local list of what *this* browser submitted instead.
const PF_MY_REVIEWS_KEY = 'shohoj_my_reviews_v1';
function _myReviews() {
  try {
    if (typeof localStorage === 'undefined') return [];
    const uid = (typeof window !== 'undefined' && typeof window._shohoj_currentUid === 'function')
      ? window._shohoj_currentUid()
      : null;
    if (!uid) return [];

    return Array.isArray(all[uid]) ? all[uid] : [];

// "Last synced" timestamp — firebase.js stamps localStorage on every successful
// cloud write/read (see LAST_SYNC_KEY). Read locally, no network. Returns a unix
// ms timestamp or null when the device has never synced.
const PF_LAST_SYNC_KEY = 'shohoj_last_sync';
function _lastSync() {
  try {
    if (typeof localStorage === 'undefined') return null;
    const raw = localStorage.getItem(PF_LAST_SYNC_KEY);
    if (!raw) return null;
    const ts = parseInt(raw, 10);
    return Number.isFinite(ts) ? ts : null;

// history), written by the import flow (see modals.js persistAcademicProfile).
// Read locally — never from CONNECT, never from credentials. Absent until the
// student imports their own grade sheet, in which case the card shows a CTA.

// ── Pure view builders (exported for unit tests) ──────────────────────────────

// Relative "last synced" label. Pure — takes the timestamp and a clock so the
// unit test is deterministic. Null/invalid → an em-dash placeholder.
function pfFormatLastSync(ts, now = Date.now()) {
  if (!Number.isFinite(ts) || ts <= 0) return 'Not synced yet';
  const diff = Math.floor((now - ts) / 1000);
  if (diff < 0)      return 'Synced just now';
  if (diff < 60)     return 'Synced just now';
  if (diff < 3600)   return `Synced ${Math.floor(diff / 60)}m ago`;
  if (diff < 86400)  return `Synced ${Math.floor(diff / 3600)}h ago`;
  return `Synced ${Math.floor(diff / 86400)}d ago`;
}

// Defensive strip of a trailing student-level token (UNDERGRADUATE / GRADUATE /
// POSTGRADUATE) that older imports swallowed into the stored name. The parser
// now stops before it (see detectStudentIdentity), but snapshots saved before
// that fix still carry it — so clean at render time too, so existing profiles
// read correctly without forcing a re-import. Pure; exported for unit tests.
function pfCleanName(name) {
  return String(name || '')
    .replace(/\s+(?:UNDER\s*GRAD(?:UATE)?|POST\s*GRADUATE|GRADUATE)\s*$/i, '')
    .replace(/\s+/g, ' ')
    .trim();
}

// Twin of src/core/connectFeed.ts — hand-maintained, not generated.
// src/core/connectFeed.ts is the source of truth: change it there first, then mirror the
// change here. tests/twinParity.test.js fails if the two drift.
//
// Pure helpers for parsing and reasoning about the live BRACU CONNECT section
// data served by `usis-cdn.eniamza.com/connect.json`. I/O-free on purpose —
// fetch/cache live in the runtime client.

const WEEKDAYS = new Set([
    'SATURDAY',
    'SUNDAY',
    'MONDAY',
    'TUESDAY',
    'WEDNESDAY',
    'THURSDAY',
    'FRIDAY',
]);

function parseTimeToMinutes(value) {
    if (typeof value !== 'string') return null;
    const match = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(value.trim());
    if (!match) return null;
    const hours = Number(match[1]);
    const minutes = Number(match[2]);
    if (!Number.isFinite(hours) || !Number.isFinite(minutes)) return null;
    if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59) return null;
    return hours * 60 + minutes;
}

function normalizeDay(value) {
    if (typeof value !== 'string') return null;
    const upper = value.trim().toUpperCase();
    return WEEKDAYS.has(upper) ? upper : null;
}

function normalizeSlots(raw, kind, room) {
    if (!Array.isArray(raw)) return [];
    const out = [];
    for (const slot of raw) {
        const day = normalizeDay(slot && slot.day);
        const startMin = parseTimeToMinutes(slot && slot.startTime);
        const endMin = parseTimeToMinutes(slot && slot.endTime);
        if (day === null || startMin === null || endMin === null) continue;
        if (endMin <= startMin) continue;
        out.push({ day, startMin, endMin, kind, room });
    }
    return out;
}

function normalizeDateOnly(value) {
    return typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : null;
}

function normalizeExam(date, start, end) {
    if (typeof date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
    const startMin = parseTimeToMinutes(start);
    const endMin = parseTimeToMinutes(end);
    if (startMin === null || endMin === null || endMin <= startMin) return null;
    return { date, startMin, endMin };
}

function normalizeSection(raw) {
    if (!raw || typeof raw.sectionId !== 'number') return null;
    if (typeof raw.courseCode !== 'string' || raw.courseCode.trim() === '') return null;

    const capacity = Number.isFinite(raw.capacity) ? Number(raw.capacity) : 0;
    const consumedSeat = Number.isFinite(raw.consumedSeat) ? Number(raw.consumedSeat) : 0;

    const schedule = raw.sectionSchedule || null;
    // The feed rooms theory and lab separately: theory uses roomName, the lab
    // component carries its own labRoomName. Tag each slot with its real room
    // so a section's lab isn't mis-attributed to its theory classroom.
    const roomName = (raw.roomName || raw.roomNumber || '').trim();
    const labRoomName = (raw.labRoomName || '').trim() || roomName;
    const theorySlots = normalizeSlots(schedule && schedule.classSchedules, 'theory', roomName);
    const labSlots = normalizeSlots(raw.labSchedules, 'lab', labRoomName);
    const classSlots = theorySlots.concat(labSlots);

    const midExam = schedule
        ? normalizeExam(schedule.midExamDate, schedule.midExamStartTime, schedule.midExamEndTime)
        : null;
    const finalExam = schedule
        ? normalizeExam(schedule.finalExamDate, schedule.finalExamStartTime, schedule.finalExamEndTime)
        : null;

    return {
        sectionId: raw.sectionId,
        courseCode: raw.courseCode.trim().toUpperCase(),
        courseName: (raw.courseName || '').trim(),
        credits: Number.isFinite(raw.courseCredit) ? Number(raw.courseCredit) : 0,
        sectionName: (raw.sectionName || '').trim(),
        capacity,
        consumedSeat,
        isFull: capacity > 0 && consumedSeat >= capacity,
        facultyInitials: (raw.faculties || '').trim().toUpperCase(),
        roomName,
        semesterSessionId:
            typeof raw.semesterSessionId === 'number' ? raw.semesterSessionId : null,
        classSlots,
        classStartDate: normalizeDateOnly(schedule && schedule.classStartDate),
        classEndDate: normalizeDateOnly(schedule && schedule.classEndDate),
        midExam,
        finalExam,
        // Kept raw: the boolean expression is the prereq module's to parse
        // (#478), and normalizing it here would put a grammar in the feed layer.
        prerequisiteCourses: (raw.prerequisiteCourses ?? '').trim(),
    };
}

function parseFeed(payload) {
    if (!Array.isArray(payload)) return { sections: [], dropped: [] };
    const sections = [];
    const dropped = [];
    for (const entry of payload) {
        const normalized = normalizeSection(entry);
        if (normalized) sections.push(normalized);
        else if (entry && typeof entry.sectionId === 'number') {
            dropped.push(entry.sectionId);
        }
    }
    return { sections, dropped };
}

function indexByCourse(sections) {
    const out = new Map();
    for (const s of sections) {
        const list = out.get(s.courseCode);
        if (list) list.push(s);
        else out.set(s.courseCode, [s]);
    }
    return out;
}

function listCourseCodes(index) {
    return Array.from(index.keys()).sort();
}

function rangesOverlap(aStart, aEnd, bStart, bEnd) {
    return aStart < bEnd && bStart < aEnd;
}

function hasClassClash(a, b) {
    if (a.sectionId === b.sectionId) return false;
    for (const sa of a.classSlots) {
        for (const sb of b.classSlots) {
            if (sa.day !== sb.day) continue;
            if (rangesOverlap(sa.startMin, sa.endMin, sb.startMin, sb.endMin)) return true;
        }
    }
    return false;
}

function hasExamClash(a, b) {
    if (a.sectionId === b.sectionId) return false;
    const pairs = [
        [a.midExam, b.midExam],
        [a.midExam, b.finalExam],
        [a.finalExam, b.midExam],
        [a.finalExam, b.finalExam],
    ];
    for (const [x, y] of pairs) {
        if (!x || !y) continue;
        if (x.date !== y.date) continue;
        if (rangesOverlap(x.startMin, x.endMin, y.startMin, y.endMin)) return true;
    }
    return false;
}

function detectClashes(routine) {
    const classClashes = [];
    const examClashes = [];
    for (let i = 0; i < routine.length; i++) {
        for (let j = i + 1; j < routine.length; j++) {
            const a = routine[i];
            const b = routine[j];
            const pair = a.sectionId < b.sectionId
                ? [a.sectionId, b.sectionId]
                : [b.sectionId, a.sectionId];
            if (hasClassClash(a, b)) classClashes.push(pair);
            if (hasExamClash(a, b)) examClashes.push(pair);
        }
    }
    return { classClashes, examClashes };
}

function isClashFree(routine) {
    const report = detectClashes(routine);
    return report.classClashes.length === 0 && report.examClashes.length === 0;
}

function summarizeFeed(sections) {
    const courses = new Set();
    const faculty = new Set();
    const sessions = new Set();
    for (const s of sections) {
        courses.add(s.courseCode);
        if (s.facultyInitials) faculty.add(s.facultyInitials);
        if (s.semesterSessionId !== null) sessions.add(s.semesterSessionId);
    }
    return {
        totalSections: sections.length,
        totalCourses: courses.size,
        totalFaculty: faculty.size,
        semesterSessionIds: Array.from(sessions).sort((a, b) => a - b),
    };
}

// ── js/core/connectFeedClient.js ────────────────────────────────
// Twin of src/core/connectFeedClient.ts — hand-maintained, not generated.
// src/core/connectFeedClient.ts is the source of truth: change it there first, then mirror the
// change here. tests/twinParity.test.js fails if the two drift.
//
// Thin wrapper around `usis-cdn.eniamza.com/connect.json` with a localStorage
// TTL cache, ETag-aware refresh, and stale-cache fallback on network failure.
// I/O-free helpers live in ./connectFeed.js; this module composes them.

const DEFAULT_FEED_URL = 'https://usis-cdn.eniamza.com/connect.json';
const DEFAULT_CACHE_KEY = 'shohoj_connect_feed_v1';
const DEFAULT_CACHE_TTL_MS = 10 * 60 * 1000;

function safeRead(storage, key) {
    if (!storage) return null;
    let raw;
    try { raw = storage.getItem(key); }
    catch { return null; }
    if (typeof raw !== 'string' || raw.length === 0) return null;

    let parsed;
    try { parsed = JSON.parse(raw); }
    catch { return null; }
    if (!parsed || typeof parsed !== 'object') return null;
    if (typeof parsed.fetchedAt !== 'number' || !Array.isArray(parsed.payload)) return null;

    const etag = typeof parsed.etag === 'string' ? parsed.etag : null;
    return { fetchedAt: parsed.fetchedAt, etag, payload: parsed.payload };
}

function safeWrite(storage, key, entry) {
    if (!storage) return;
    try { storage.setItem(key, JSON.stringify(entry)); }
    catch { /* QuotaExceeded etc. — silent on purpose */ }
}

function safeRemove(storage, key) {
    if (!storage) return;
    try { storage.removeItem(key); }
    catch { /* ignore */ }
}

function materialize(payload, source, fetchedAt, etag) {
    const { sections, dropped } = parseFeed(payload);
    const summary = summarizeFeed(sections);
    return { sections, summary, source, fetchedAt, etag, dropped };
}

async function fetchConnectFeed(options = {}) {
    const url = options.url ?? DEFAULT_FEED_URL;
    const cacheKey = options.cacheKey ?? DEFAULT_CACHE_KEY;
    const ttlMs = typeof options.ttlMs === 'number' ? options.ttlMs : DEFAULT_CACHE_TTL_MS;
    const storage =
        options.storage === undefined
            ? (typeof localStorage !== 'undefined' ? localStorage : null)
            : options.storage;
    const fetcher =
        options.fetcher === undefined
            ? (typeof fetch !== 'undefined' ? fetch : null)
            : options.fetcher;
    const now = options.now ?? (() => Date.now());

    const cache = safeRead(storage, cacheKey);
    const cacheFresh = cache !== null && now() - cache.fetchedAt < ttlMs;

    if (cache !== null && cacheFresh && !options.forceRefresh) {
        return materialize(cache.payload, 'cache', cache.fetchedAt, cache.etag);
    }

    if (fetcher === null) {
        if (cache !== null) {
            return materialize(cache.payload, 'fallback', cache.fetchedAt, cache.etag);
        }
        throw new Error('Connect feed: no fetcher available and no cache.');
    }

    const headers = { Accept: 'application/json' };
    if (cache !== null && cache.etag) headers['If-None-Match'] = cache.etag;

    try {
        const response = await fetcher(url, { headers, signal: options.signal });
        if (response.status === 304 && cache !== null) {
            const refreshed = {
                fetchedAt: now(),
                etag: cache.etag,
                payload: cache.payload,
            };
            safeWrite(storage, cacheKey, refreshed);
            return materialize(cache.payload, 'cache', refreshed.fetchedAt, refreshed.etag);
        }
        if (!response.ok) {
            throw new Error(`Connect feed: HTTP ${response.status}`);
        }
        const payload = await response.json();
        if (!Array.isArray(payload)) {
            throw new Error('Connect feed: response was not a JSON array.');
        }
        const etag = response.headers.get('etag');
        const fetchedAt = now();
        safeWrite(storage, cacheKey, { fetchedAt, etag, payload });
        return materialize(payload, 'live', fetchedAt, etag);
    } catch (err) {
        if (cache !== null) {
            return materialize(cache.payload, 'fallback', cache.fetchedAt, cache.etag);
        }
        throw err instanceof Error ? err : new Error(String(err));
    }
}

function clearConnectFeedCache(
    storage = typeof localStorage !== 'undefined' ? localStorage : null,
    cacheKey = DEFAULT_CACHE_KEY,
) {
    safeRemove(storage, cacheKey);
}

function peekConnectFeedCache(
    storage = typeof localStorage !== 'undefined' ? localStorage : null,
    cacheKey = DEFAULT_CACHE_KEY,
) {
    const entry = safeRead(storage, cacheKey);
    return entry === null ? null : { fetchedAt: entry.fetchedAt, etag: entry.etag };
}

// Twin of src/core/freeRooms.ts — hand-maintained, not generated.
// src/core/freeRooms.ts is the source of truth: change it there first, then mirror the
// change here. tests/twinParity.test.js fails if the two drift.
//
// Free-room finder — pure helpers that invert the normalized section list into
// room-availability queries (which rooms are busy when), so the UI can answer
// "what's free right now / on day D". UI-agnostic.

const CAMPUS_START_MIN = 8 * 60;   // 08:00
const CAMPUS_END_MIN = 22 * 60;    // 22:00

const FR_WEEK_ORDER = [
    'SATURDAY', 'SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY',
];

function isRealRoom(name) {
    if (typeof name !== 'string') return false;
    const trimmed = name.trim();
    if (trimmed === '') return false;
    const upper = trimmed.toUpperCase();
    if (upper === 'TBA') return false;
    // The live feed sometimes stuffs a class schedule into roomName
    // (e.g. "MON 11:00AM: 07A-08C; WED 2:00PM: 09G-31T"); real room codes
    // never contain whitespace or schedule punctuation.
    if (/[\s:;]/.test(trimmed)) return false;
    // UB (old University Building) is gone post campus-move; its "UB0000"
    // placeholder still lingers in the feed.
    if (upper.startsWith('UB')) return false;
    return true;
}

// Map each room to its busy intervals across the week, sorted by day
// (canonical Sat→Fri order) then start time. Blank/TBA rooms contribute nothing.
function buildRoomBusyIndex(sections) {
    const index = new Map();
    for (const s of sections) {
        for (const slot of s.classSlots) {
            // Each slot carries its own room (theory→roomName, lab→labRoomName),
            // so a lab lands in its real lab, not the section's theory classroom.
            const room = (slot.room || s.roomName || '').trim();
            if (!isRealRoom(room)) continue;
            const interval = {
                day: slot.day,
                startMin: slot.startMin,
                endMin: slot.endMin,
                courseCode: s.courseCode,
                sectionName: s.sectionName,
                kind: slot.kind,
            };
            const list = index.get(room);
            if (list) list.push(interval);
            else index.set(room, [interval]);
        }
    }
    for (const list of index.values()) {
        list.sort((a, b) =>
            (FR_WEEK_ORDER.indexOf(a.day) - FR_WEEK_ORDER.indexOf(b.day)) ||
            (a.startMin - b.startMin) ||
            (a.endMin - b.endMin));
    }
    return index;
}

// Busy intervals for a room on a single day (already sorted by start).
function busyOnDay(index, room, day) {
    return (index.get(room) ?? []).filter(i => i.day === day);
}

// Every room in the feed, sorted alphabetically.
function listAllRooms(index) {
    return [...index.keys()].sort((a, b) => a.localeCompare(b));
}

// The class/lab occupying `room` at `minute` on `day`, or null if free. When
// intervals overlap (rare), the one ending latest wins so "busy until" reflects
// when the room actually frees up. Half-open [startMin, endMin).
function occupantAt(index, room, day, minute) {
    let occupant = null;
    for (const i of index.get(room) ?? []) {
        if (i.day !== day || minute < i.startMin || minute >= i.endMin) continue;
        if (!occupant || i.endMin > occupant.endMin) occupant = i;
    }
    return occupant;
}

// Rooms with no class covering `minute` on `day`, sorted alphabetically. A room
// with no class that day counts as free all day. Classes are half-open
// [startMin, endMin): a room frees up exactly at endMin.
function freeRoomsAt(index, day, minute) {
    const free = [];
    for (const [room, intervals] of index) {
        const occupied = intervals.some(i =>
            i.day === day && minute >= i.startMin && minute < i.endMin);
        if (!occupied) free.push(room);
    }
    return free.sort((a, b) => a.localeCompare(b));
}

// Free time windows for one room on a given day = complement of its busy
// intervals within [dayStart, dayEnd). Overlaps are merged first.
function freeWindowsForRoom(index, room, day, dayStart = CAMPUS_START_MIN, dayEnd = CAMPUS_END_MIN) {
    if (dayEnd <= dayStart) return [];
    const busy = busyOnDay(index, room, day)
        .map(i => ({ startMin: Math.max(i.startMin, dayStart), endMin: Math.min(i.endMin, dayEnd) }))
        .filter(i => i.endMin > i.startMin)
        .sort((a, b) => a.startMin - b.startMin);

    const windows = [];
    let cursor = dayStart;
    for (const b of busy) {
        if (b.startMin > cursor) windows.push({ startMin: cursor, endMin: b.startMin });
        if (b.endMin > cursor) cursor = b.endMin;
    }
    if (cursor < dayEnd) windows.push({ startMin: cursor, endMin: dayEnd });
    return windows;
}

//
// Semester briefing — turns a student's own routine picks into the three things
// no single tab can answer, because each needs the picks joined against the

// Pure and UI-agnostic: no DOM, no fetch.

/** Canonical BRACU week order (Friday is the off day, kept last). */
const BRIEFING_WEEK_ORDER = [
    'SATURDAY',
    'SUNDAY',
    'MONDAY',
    'TUESDAY',
    'WEDNESDAY',
    'THURSDAY',
    'FRIDAY',
