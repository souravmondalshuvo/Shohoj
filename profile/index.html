/**
 * Idle stretch below this is a transition between rooms, not a usable gap —
 * BRACU's standard break between consecutive slots is 10 minutes.
 */
const MIN_GAP_MINUTES = 45;

/** A back-to-back pair this tight, in a different room, is worth warning about. */
const TIGHT_HOP_MINUTES = 15;

/** Floors apart before a tight transition counts as a real climb. */
const NOTABLE_FLOOR_DELTA = 2;

/**
 * Floor number from a room code. Post-move codes lead with a two-digit floor
 * (`09A-01C` → 9, `12B-20L` → 12). Anything else is unparseable rather than
 * guessed — a wrong floor is worse than no floor.
 */
function parseRoomFloor(room) {
    if (typeof room !== 'string') return null;
    const match = /^(\d{2})[A-Z]/.exec(room.trim().toUpperCase());
    if (!match) return null;
    const floor = Number.parseInt(match[1], 10);
    return Number.isFinite(floor) ? floor : null;
}

/**
 * A slot's real room. The runtime feed tags each slot with its own room so a
 * section's lab isn't mis-attributed to its theory classroom; sections parsed
 * before that landed fall back to the section room.
 */
function sbSlotRoom(slot, section) {
    const own = typeof slot.room === 'string' ? slot.room.trim() : '';
    return own !== '' ? own : section.roomName;
}

/** Flatten picked sections into per-day slots, sorted by day then start time. */
function collectRoutineSlots(sections) {
    const out = [];
    for (const section of sections) {
        for (const slot of section.classSlots) {
            out.push({
                day: slot.day,
                startMin: slot.startMin,
                endMin: slot.endMin,
                kind: slot.kind,
                room: sbSlotRoom(slot, section),
                courseCode: section.courseCode,
                sectionName: section.sectionName,
                facultyInitials: section.facultyInitials,
            });
        }
    }
    out.sort((a, b) => BRIEFING_WEEK_ORDER.indexOf(a.day) - BRIEFING_WEEK_ORDER.indexOf(b.day)
        || a.startMin - b.startMin
        || a.courseCode.localeCompare(b.courseCode));
    return out;
}

/**
 * Measure the student's week: time in class, time waiting, and the transitions
 * that are too tight for the distance. Overlapping slots (a clashing routine)
 * contribute their own duration to contact time but never a negative gap.
 */
function buildWeekSummary(sections, options = {}) {
    const minGap = options.minGapMinutes ?? MIN_GAP_MINUTES;
    const tightHop = options.tightHopMinutes ?? TIGHT_HOP_MINUTES;

    const slots = collectRoutineSlots(sections);
    const byDay = new Map();
    for (const slot of slots) {
        const list = byDay.get(slot.day);
        if (list) list.push(slot);
        else byDay.set(slot.day, [slot]);
    }

    let contactMinutes = 0;
    let deadGapMinutes = 0;
    let longestDayMinutes = 0;
    let longestDay = null;
    let earliestStartMin = null;
    const gaps = [];
    const hops = [];

    for (const day of BRIEFING_WEEK_ORDER) {
        const list = byDay.get(day);
        if (!list || list.length === 0) continue;

        const dayStart = list[0].startMin;
        const dayEnd = list.reduce((max, s) => Math.max(max, s.endMin), 0);
        if (earliestStartMin === null || dayStart < earliestStartMin) earliestStartMin = dayStart;
        if (dayEnd - dayStart > longestDayMinutes) {
            longestDayMinutes = dayEnd - dayStart;
            longestDay = day;
        }
        for (const slot of list) contactMinutes += Math.max(0, slot.endMin - slot.startMin);

        for (let i = 1; i < list.length; i++) {
            const prev = list[i - 1];
            const next = list[i];
            const idle = next.startMin - prev.endMin;
            if (idle >= minGap) {
                deadGapMinutes += idle;
                gaps.push({
                    day,
                    startMin: prev.endMin,
                    endMin: next.startMin,
                    minutes: idle,
                    afterCourse: prev.courseCode,
                    beforeCourse: next.courseCode,
                    nextRoom: next.room,
                    nextFloor: parseRoomFloor(next.room),
                });
            } else if (idle >= 0 && idle <= tightHop && prev.room !== next.room) {
                const fromFloor = parseRoomFloor(prev.room);
                const toFloor = parseRoomFloor(next.room);
                hops.push({
                    day,
                    minutes: idle,
                    fromCourse: prev.courseCode,
                    toCourse: next.courseCode,
                    fromRoom: prev.room,
                    toRoom: next.room,
                    floorDelta: fromFloor !== null && toFloor !== null ? toFloor - fromFloor : null,
                });
            }
        }
    }

    return {
        slots,
        byDay,
        contactMinutes,
        deadGapMinutes,
        campusDays: byDay.size,
        earliestStartMin,
        longestDayMinutes,
        longestDay,
        gaps,
        hops,
    };
}

/**
 * Campus runs on Asia/Dhaka — UTC+6 all year, no DST. Exam dates arrive as a
 * bare `YYYY-MM-DD` plus a minute-of-day and are placed on the UTC line below,
 * so a wall clock has to be shifted into that same frame before the two can be
 * compared. Read the viewer's clock as UTC instead and an exam would flip to
 * "done" hours early or late for anyone outside Bangladesh.
 */
const CAMPUS_UTC_OFFSET_MIN = 6 * 60;

/** A wall-clock instant in the same absolute-minute frame as the exam dates. */
function campusMinutesAt(now) {
    return Math.floor(now / 60000) + CAMPUS_UTC_OFFSET_MIN;
}

/** Absolute minutes since epoch for an ISO date + minute-of-day. UTC, so DST-free. */
function sbAbsoluteMinutes(date, minuteOfDay) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date);
    if (!match) return null;
    const year = Number.parseInt(match[1], 10);
    const month = Number.parseInt(match[2], 10);
    const day = Number.parseInt(match[3], 10);
    const ms = Date.UTC(year, month - 1, day);
    if (!Number.isFinite(ms)) return null;
    return Math.round(ms / 60000) + minuteOfDay;
}

/**
 * Crunch measurements over `run`, which must be consecutive exams in date
 * order. Links into whatever preceded the run are ignored: for a slice of the
 * exams still ahead, the gap back to an exam already sat is history, not
 * something the student still has to recover from.
 */
function sbCrunchOver(run) {
    let tightestGapHours = null;
    let sameDayCount = 0;
    for (let i = 1; i < run.length; i++) {
        if (run[i].sameDayAsPrev) sameDayCount++;
        const gapHours = run[i].gapHoursFromPrev;
        if (gapHours !== null && (tightestGapHours === null || gapHours < tightestGapHours)) {
            tightestGapHours = gapHours;
        }
    }
    const last = run.reduce((max, e) => (e.absEnd > max.absEnd ? e : max), run[0]);
    return {
        count: run.length,
        spanHours: (last.absEnd - run[0].absStart) / 60,
        tightestGapHours,
        sameDayCount,
    };
}

/**
 * Order the student's exams for one kind and measure the recovery time between
 * them. Sections without a date for that kind are reported in `missing` rather
 * than silently dropped — a half-known exam season is worth flagging.
 * Returns null when no picked section carries a date at all.
 *
 * `now` splits the period into sat and pending: an exam counts as past once it
 * has *finished*, so one in progress still reads as the exam at hand.
 */
function buildExamBriefing(sections, kind, now = Date.now()) {
    const missing = [];
    const dated = [];

    for (const section of sections) {
        const exam = kind === 'mid' ? section.midExam : section.finalExam;
        if (!exam) {
            missing.push(section.courseCode);
            continue;
        }
        const absStart = sbAbsoluteMinutes(exam.date, exam.startMin);
        const absEnd = sbAbsoluteMinutes(exam.date, exam.endMin);
        if (absStart === null || absEnd === null) {
            missing.push(section.courseCode);
            continue;
        }
        dated.push({
            courseCode: section.courseCode,
            sectionName: section.sectionName,
            facultyInitials: section.facultyInitials,
            date: exam.date,
            startMin: exam.startMin,
            endMin: exam.endMin,
            gapHoursFromPrev: null,
            sameDayAsPrev: false,
            isPast: false,
            absStart,
            absEnd,
        });
    }

    if (dated.length === 0) return null;
    dated.sort((a, b) => a.absStart - b.absStart || a.courseCode.localeCompare(b.courseCode));

    const nowMin = campusMinutesAt(now);
    for (let i = 0; i < dated.length; i++) {
        dated[i].isPast = dated[i].absEnd <= nowMin;
        if (i === 0) continue;
        const prev = dated[i - 1];
        const current = dated[i];
        current.gapHoursFromPrev = (current.absStart - prev.absEnd) / 60;
        current.sameDayAsPrev = current.date === prev.date;
    }

    const whole = sbCrunchOver(dated);
    const firstAhead = dated.findIndex(entry => !entry.isPast);
    const ahead = firstAhead === -1 ? [] : dated.slice(firstAhead);

    // The absolute-minute fields are working state; the public entries drop them.
    const exams = dated.map(entry => ({
        courseCode: entry.courseCode,
        sectionName: entry.sectionName,
        facultyInitials: entry.facultyInitials,
        date: entry.date,
        startMin: entry.startMin,
        endMin: entry.endMin,
        gapHoursFromPrev: entry.gapHoursFromPrev,
        sameDayAsPrev: entry.sameDayAsPrev,
        isPast: entry.isPast,
    }));

    return {
        kind,
        exams,
        spanHours: whole.spanHours,
        tightestGapHours: whole.tightestGapHours,
        sameDayCount: whole.sameDayCount,
        missing,
        upcoming: ahead.length > 0 ? sbCrunchOver(ahead) : null,
        nextExam: firstAhead === -1 ? null : exams[firstAhead],
        hoursUntilNext: firstAhead === -1 ? null : (dated[firstAhead].absStart - nowMin) / 60,
        pastCount: dated.length - ahead.length,
    };
}

/**
 * Which exam period the student should be looking at right now.
 *
 * Midterms hold the view while any of them is still ahead; once the last one
 * has been sat, finals are what's left of the semester — even before their
 * dates are published, because "no final dates yet" is the honest answer at
 * that point and the old midterm list is not. With nothing dated either way
 * there is no season to be wrong about, so midterms lead as before.
 *
 * Pure, and only ever a default: the card's toggle still overrides it.
 */
function pickExamKind(sections, now = Date.now()) {
    const nowMin = campusMinutesAt(now);
    let midDated = false;
    let finalDated = false;
    let midAhead = false;

    for (const section of sections) {
        for (const kind of ['mid', 'final']) {
            const exam = kind === 'mid' ? section.midExam : section.finalExam;
            if (!exam) continue;
            const absEnd = sbAbsoluteMinutes(exam.date, exam.endMin);
            if (absEnd === null) continue;
            if (kind === 'mid') {
                midDated = true;
                if (absEnd > nowMin) midAhead = true;
            } else {
                finalDated = true;
            }
        }
    }

    if (midAhead) return 'mid';
    return midDated || finalDated ? 'final' : 'mid';
}

/**
 * Rooms with no booking overlapping `[startMin, endMin)` on `day` — free for
 * the student's whole wait, not merely free at one instant. Rooms outside
 * campus hours are excluded so we never suggest sitting somewhere at 06:00.
 */
function roomsFreeThroughout(index, day, startMin, endMin, dayStart = CAMPUS_START_MIN, dayEnd = CAMPUS_END_MIN) {
    if (endMin <= startMin) return [];
    if (startMin < dayStart || endMin > dayEnd) return [];
    const free = [];
    for (const room of listAllRooms(index)) {
        const busy = busyOnDay(index, room, day);
        const clashes = busy.some(interval => interval.startMin < endMin && startMin < interval.endMin);
        if (!clashes) free.push(room);
    }
    return free;
}

/**
 * Where to wait out a gap: rooms free for its whole span, with those on the
 * next class's floor listed first so the student is already there when it
 * starts. `limit` caps each list; `total` always reports the true count.
 */
function suggestGapRooms(index, gap, options = {}) {
    const limit = options.limit ?? 3;
    const free = roomsFreeThroughout(index, gap.day, gap.startMin, gap.endMin, options.dayStart, options.dayEnd);

    const sameFloor = [];
    const elsewhere = [];
    for (const room of free) {
        if (gap.nextFloor !== null && parseRoomFloor(room) === gap.nextFloor) sameFloor.push(room);
        else elsewhere.push(room);
    }

    return {
        sameFloor: sameFloor.slice(0, limit),
        elsewhere: elsewhere.slice(0, limit),
        total: free.length,
    };
}

/** `545` → `"09:05"`. Minute-of-day to a 24h clock label. */
function formatClock(minuteOfDay) {
    const hours = Math.floor(minuteOfDay / 60);
    const minutes = Math.round(minuteOfDay % 60);
    return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
}

/** `280` → `"4h 40m"`, `60` → `"1h"`, `45` → `"45m"`. */
function formatDuration(minutes) {
    const total = Math.max(0, Math.round(minutes));
    const hours = Math.floor(total / 60);
    const rest = total % 60;
    if (hours === 0) return `${rest}m`;
    if (rest === 0) return `${hours}h`;
    return `${hours}h ${rest}m`;
}

// ── js/ui/semesterBriefingCard.js ───────────────────────────────
// js/ui/semesterBriefingCard.js
// "This semester" block for the dedicated /profile/ page (#476).
//
// The rest of the Profile page restates the calculator and the tracker. This
// block is the part only the Profile page can show: the student's own routine
// picks joined against the live section feed, which yields three things no
// single tab can answer — when their exams actually bunch up, what their week
// really costs them, and where to sit out the gaps.
//
// View layer only. Every measurement lives in js/core/semesterBriefing.js so
// the React shell can reuse it; this file turns those numbers into HTML and
// writes the plain-language verdict that goes above each visual.
//
// Names are prefixed `sbc`/`SBC` because build3.py flattens every module into
// one scope (see scripts/check_bundle_collisions.py).

// Weeks in a BRACU semester — turns a recurring gap into the number that makes
// it feel real ("4h 40m every Saturday" → "65 hours this semester").
const SBC_SEMESTER_WEEKS = 13;

// Grid bounds for the week strip. Slots outside are clamped, not dropped.
const SBC_GRID_START_MIN = 8 * 60;
const SBC_GRID_END_MIN = 19 * 60;

const SBC_DAY_LABELS = {
  SATURDAY: 'Sat',
  SUNDAY: 'Sun',
  MONDAY: 'Mon',
  TUESDAY: 'Tue',
  WEDNESDAY: 'Wed',
  THURSDAY: 'Thu',
  FRIDAY: 'Fri',
};

// Friday is off; a student with no Friday class shouldn't see a dead column.
const SBC_GRID_DAYS = BRIEFING_WEEK_ORDER.filter(d => d !== 'FRIDAY');

// ── Formatting helpers ────────────────────────────────────────────────────────

/** `"2026-07-27"` → `"Mon 27 Jul"`. Parsed as UTC so the label can't shift a day. */
function sbcFormatExamDate(iso) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if (!match) return String(iso || '');
  const date = new Date(Date.UTC(+match[1], +match[2] - 1, +match[3]));
  if (Number.isNaN(date.getTime())) return String(iso);
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${days[date.getUTCDay()]} ${date.getUTCDate()} ${months[date.getUTCMonth()]}`;
}

/** Whole hours read better than `19.5h` in a chip; halves are kept when present. */
function sbcFormatHours(hours) {
  if (!Number.isFinite(hours)) return '—';
  const rounded = Math.round(hours * 10) / 10;
  return Number.isInteger(rounded) ? `${rounded}h` : `${rounded.toFixed(1)}h`;
}

/**
 * How far off the next exam is, in the words a student would use. Always a
 * noun phrase so it can follow a course code after a comma ("CSE251, tomorrow"),
 * including the case where the exam has already started but not finished.
 */
function sbcFormatCountdown(hours) {
  if (!Number.isFinite(hours)) return '';
  if (hours <= 0) return 'underway now';
  if (hours < 1) return 'within the hour';
  if (hours < 24) return `in ${Math.round(hours)}h`;
  if (hours < 48) return 'tomorrow';
  return `in ${Math.round(hours / 24)} days`;
}

/** Singular noun for an exam period — "midterm" / "final". */
function sbcKindLabel(kind) {
  return kind === 'final' ? 'final' : 'midterm';
}

/** A gap this tight between exams is the thing worth shouting about. */
function sbcGapTone(hours) {
  if (!Number.isFinite(hours)) return '';
  if (hours < 6) return 'hot';
  if (hours < 20) return 'warn';
  return '';
}

// ── Exam crunch ───────────────────────────────────────────────────────────────

/**
 * The sentence a student actually reads. Everything else in the card is
 * evidence for it, so it has to be true of *their* data, not a template with
 * numbers dropped in — a comfortable exam spread must read as comfortable.
 *
 * It also has to be true of *today*: the crunch that matters is the one still
 * ahead, so the measurements come from `brief.upcoming` and the exams already
 * sat only ever appear as history. A finished period says it is finished
 * instead of restating a spread the student has already lived through.
 */
function sbcExamVerdict(brief) {
  if (!brief || !Array.isArray(brief.exams) || brief.exams.length === 0) return '';
  const label = sbcKindLabel(brief.kind);

  if (!brief.upcoming) {
    const last = brief.exams[brief.exams.length - 1];
    const when = escHtml(sbcFormatExamDate(last.date));
    return brief.exams.length === 1
      ? `Your only ${label}, <b>${escHtml(last.courseCode)}</b>, is done — sat ${when}.`
      : `All ${brief.exams.length} ${label}s are done — the last was ${when}.`;
  }

  const { count, spanHours, tightestGapHours, sameDayCount } = brief.upcoming;
  const next = brief.nextExam;
  const lead = `Next: <b>${escHtml(next.courseCode)}</b>, ${escHtml(sbcFormatCountdown(brief.hoursUntilNext))}.`;

  if (count === 1) {
    return brief.pastCount > 0
      ? `${lead} The last ${label} of the round.`
      : `${lead} Your only ${label} this round.`;
  }

  const span = escHtml(sbcFormatHours(spanHours));
  const left = brief.pastCount > 0 ? `${count} left` : `All ${count}`;

  if (spanHours <= 72) {
    const tail = sameDayCount > 0
      ? ` — and <em>${sameDayCount} share${sameDayCount === 1 ? 's' : ''} a day with the exam before it</em>`
      : '';
    return `${lead} ${left} fall inside <span class="hot">${span}</span>${tail}.`;
  }
  if (sameDayCount > 0) {
    return `${lead} ${left} across ${span}, with <em>${sameDayCount} landing on a day that already has one</em>.`;
  }
  if (Number.isFinite(tightestGapHours) && tightestGapHours < 24) {
    return `${lead} ${left} across ${span}; your tightest turnaround is <em>${escHtml(sbcFormatHours(tightestGapHours))}</em>.`;
  }
  return `${lead} ${left} across ${span}, with at least a day between each. <b>That's a kind spread.</b>`;
}

function sbcExamCardHtml(brief, kind = 'mid') {
  const isMid = kind === 'mid';
  const toggle = `
        <div class="pfb-toggle" role="group" aria-label="Exam period">
          <button class="pfb-seg ${isMid ? 'is-on' : ''}" data-action="briefing:examKind" data-kind="mid"
                  aria-pressed="${isMid ? 'true' : 'false'}">Midterms</button>
          <button class="pfb-seg ${isMid ? '' : 'is-on'}" data-action="briefing:examKind" data-kind="final"
                  aria-pressed="${isMid ? 'false' : 'true'}">Finals</button>
        </div>`;

  if (!brief) {
    return `
      <section class="pfb-card">
        <div class="pfb-head"><h3 class="pfb-title"><span class="pfb-ico">📕</span> Exam crunch</h3>${toggle}</div>
        <div class="pfb-empty">No ${isMid ? 'midterm' : 'final'} dates published for your sections yet. They appear here as soon as the feed carries them.</div>
      </section>`;
  }

  // The first exam still ahead opens a fresh run: whatever gap separates it
  // from the one before is a recovery the student has already made, so it gets
  // the same "first up" treatment as a period that hasn't started.
  const firstAhead = brief.exams.findIndex(e => !e.isPast);

  const rows = brief.exams.map((exam, i) => {
    // A sat exam keeps its place in the order (the sequence is the story) but
    // drops the crunch chip: a turnaround already survived is not a warning.
    const opensRun = i === firstAhead;
    const tone = exam.isPast || opensRun ? '' : exam.sameDayAsPrev ? 'hot' : sbcGapTone(exam.gapHoursFromPrev);
    const chip = exam.isPast
      ? '<span class="pfb-chip done">done</span>'
      : opensRun
        ? `<span class="pfb-chip cool">${brief.pastCount > 0 ? 'next up' : 'first up'}</span>`
        : exam.sameDayAsPrev
          ? `<span class="pfb-chip hot">same day · ${escHtml(sbcFormatHours(exam.gapHoursFromPrev))} later</span>`
          : `<span class="pfb-chip ${tone}">${escHtml(sbcFormatHours(exam.gapHoursFromPrev))} gap</span>`;
    return `
        <li class="pfb-row${exam.isPast ? ' is-past' : ''}">
          <span class="pfb-row-dot ${tone === 'hot' ? 'hot' : ''}" aria-hidden="true"></span>
          <span class="pfb-row-code">${escHtml(exam.courseCode)}</span>
          <span class="pfb-row-when"><b>${escHtml(sbcFormatExamDate(exam.date))}</b> · ${escHtml(formatClock(exam.startMin))}–${escHtml(formatClock(exam.endMin))}</span>
          ${chip}
          <span class="pfb-row-meta">${escHtml(exam.facultyInitials || '')}</span>
        </li>`;
  }).join('');

  const missing = brief.missing.length > 0
    ? `<div class="pfb-note">No date yet for ${escHtml(brief.missing.join(', '))}.</div>`
    : '';

  return `
      <section class="pfb-card">
        <div class="pfb-head"><h3 class="pfb-title"><span class="pfb-ico">📕</span> Exam crunch</h3>${toggle}</div>
        <p class="pfb-verdict">${sbcExamVerdict(brief)}</p>
        <ul class="pfb-rows">${rows}</ul>
        ${missing}
        <div class="pfb-note">Dates come from the sections you picked on the Routine tab — read from the public feed, nothing uploaded.</div>
      </section>`;
}

// ── Week on campus ────────────────────────────────────────────────────────────

function sbcWeekVerdict(week) {
  if (!week || week.campusDays === 0) return '';
  const contact = formatDuration(week.contactMinutes);
  const dead = formatDuration(week.deadGapMinutes);
  if (week.deadGapMinutes === 0) {
    return `<b>${week.campusDays} day${week.campusDays === 1 ? '' : 's'}</b> on campus for ${escHtml(contact)} of class, back to back. <b>No waiting around.</b>`;
  }
  return `You're on campus <b>${week.campusDays} day${week.campusDays === 1 ? '' : 's'}</b> for ${escHtml(contact)} of class — and <em>${escHtml(dead)} of waiting</em>.`;
}

/** Percent offsets for a slot inside the 08:00–19:00 grid, clamped to it. */
function sbcGridBand(startMin, endMin) {
  const span = SBC_GRID_END_MIN - SBC_GRID_START_MIN;
  const from = Math.max(SBC_GRID_START_MIN, Math.min(startMin, SBC_GRID_END_MIN));
  const to = Math.max(from, Math.min(endMin, SBC_GRID_END_MIN));
  return {
    top: ((from - SBC_GRID_START_MIN) / span) * 100,
    height: Math.max(2, ((to - from) / span) * 100),
  };
}

function sbcWeekCardHtml(week) {
  if (!week || week.campusDays === 0) {
    return `
      <section class="pfb-card">
        <div class="pfb-head"><h3 class="pfb-title"><span class="pfb-ico">🗓️</span> Your week on campus</h3></div>
        <div class="pfb-empty">Pick your sections on the <strong>Routine</strong> tab and your week shows up here.</div>
      </section>`;
  }

  const stats = [
    ['', formatDuration(week.contactMinutes), 'Contact time'],
    [week.deadGapMinutes > 0 ? 'alert' : '', formatDuration(week.deadGapMinutes), 'Dead time'],
    ['', `${week.campusDays} / ${SBC_GRID_DAYS.length}`, 'Campus days'],
    ['', week.earliestStartMin === null ? '—' : formatClock(week.earliestStartMin), 'Earliest start'],
    [week.longestDayMinutes >= 6 * 60 ? 'alert' : '', formatDuration(week.longestDayMinutes), 'Longest day'],
  ].map(([tone, value, label]) => `
        <div class="pfb-stat ${tone}">
          <div class="pfb-stat-n">${escHtml(String(value))}</div>
          <span class="pfb-stat-l">${escHtml(label)}</span>
        </div>`).join('');

  const columns = SBC_GRID_DAYS.map(day => {
    const slots = week.byDay.get(day) || [];
    if (slots.length === 0) return '<div class="pfb-col is-off"></div>';
    const blocks = slots.map(slot => {
      const band = sbcGridBand(slot.startMin, slot.endMin);
      return `
          <div class="pfb-blk ${slot.kind === 'lab' ? 'is-lab' : ''}"
               style="top:${band.top.toFixed(2)}%;height:${band.height.toFixed(2)}%"
               title="${escHtml(slot.courseCode)} ${escHtml(slot.kind)} · ${escHtml(formatClock(slot.startMin))}–${escHtml(formatClock(slot.endMin))} · ${escHtml(slot.room)}">
            <span class="pfb-blk-code">${escHtml(slot.courseCode)}${slot.kind === 'lab' ? ' lab' : ''}</span>
            <span class="pfb-blk-room">${escHtml(slot.room)}</span>
          </div>`;
    }).join('');
    const gapBands = (week.gaps.filter(g => g.day === day)).map(gap => {
      const band = sbcGridBand(gap.startMin, gap.endMin);
      return `
          <div class="pfb-gap" style="top:${band.top.toFixed(2)}%;height:${band.height.toFixed(2)}%" aria-hidden="true">
            <span>${escHtml(formatDuration(gap.minutes))}</span>
          </div>`;
    }).join('');
    return `<div class="pfb-col">${gapBands}${blocks}</div>`;
  }).join('');

  const headers = SBC_GRID_DAYS
    .map(day => `<div class="pfb-week-h">${escHtml(SBC_DAY_LABELS[day] || day)}</div>`)
    .join('');

  // Only the hops worth acting on: a couple of floors is a jog, one floor isn't.
  const notableHops = week.hops.filter(
    h => h.floorDelta === null || Math.abs(h.floorDelta) >= NOTABLE_FLOOR_DELTA,
  );
  const hopsBlock = notableHops.length === 0 ? '' : `
        <div class="pfb-subhead">
          <span>⚠️ Tight transitions</span>
          <span class="pfb-chip warn">${notableHops.length} this week</span>
        </div>
        <div class="pfb-hops">${notableHops.map(hop => {
          const floors = hop.floorDelta === null
            ? ''
            : ` · <b>${Math.abs(hop.floorDelta)} floor${Math.abs(hop.floorDelta) === 1 ? '' : 's'} ${hop.floorDelta > 0 ? 'up' : 'down'}</b>`;
          return `
          <div class="pfb-hop">
            <b>${escHtml(SBC_DAY_LABELS[hop.day] || hop.day)}</b>
            <span>${escHtml(hop.fromCourse)} <span class="pfb-arrow">→</span> ${escHtml(hop.toCourse)}</span>
            <span class="pfb-hop-rooms">${escHtml(hop.fromRoom)} → ${escHtml(hop.toRoom)}${floors}</span>
            <span class="pfb-hop-min">${escHtml(formatDuration(hop.minutes))}</span>
          </div>`;
        }).join('')}</div>`;

  return `
      <section class="pfb-card">
        <div class="pfb-head">
          <h3 class="pfb-title"><span class="pfb-ico">🗓️</span> Your week on campus</h3>
          <span class="pfb-chip">${week.campusDays} day${week.campusDays === 1 ? '' : 's'} on campus</span>
        </div>
        <p class="pfb-verdict">${sbcWeekVerdict(week)}</p>
        <div class="pfb-stats">${stats}</div>
        <div class="pfb-week">
          <div></div>${headers}
          <div class="pfb-week-times">
            <span style="top:0%">08:00</span><span style="top:27.3%">11:00</span>
            <span style="top:54.5%">14:00</span><span style="top:81.8%">17:00</span>
          </div>
          ${columns}
        </div>
        ${hopsBlock}
      </section>`;
}

// ── Where to wait ─────────────────────────────────────────────────────────────

function sbcGapsVerdict(gaps) {
  if (!Array.isArray(gaps) || gaps.length === 0) return '';
  const longest = gaps.reduce((max, g) => (g.minutes > max.minutes ? g : max), gaps[0]);
  const term = Math.round((longest.minutes * SBC_SEMESTER_WEEKS) / 60);
  return `${escHtml(SBC_DAY_LABELS[longest.day] || longest.day)}'s <em>${escHtml(formatDuration(longest.minutes))} gap</em> repeats every week — that's <b>${term} hours</b> across the semester.`;
}

function sbcGapRoomsCardHtml(gaps, suggestionsByIndex) {
  if (!Array.isArray(gaps) || gaps.length === 0) {
    return `
      <section class="pfb-card">
        <div class="pfb-head"><h3 class="pfb-title"><span class="pfb-ico">🚪</span> Where to wait</h3></div>
        <div class="pfb-empty">No long gaps in your week — your classes run back to back.</div>
      </section>`;
  }

  const slots = gaps.map((gap, i) => {
    const picks = (suggestionsByIndex && suggestionsByIndex[i]) || { sameFloor: [], elsewhere: [], total: 0 };
    const floor = gap.nextFloor;
    const rooms = [
      ...picks.sameFloor.map(r => `<span class="pfb-room is-best">${escHtml(r)}<small>same floor</small></span>`),
      ...picks.elsewhere.map(r => `<span class="pfb-room">${escHtml(r)}</span>`),
    ];
    const shown = picks.sameFloor.length + picks.elsewhere.length;
    if (picks.total > shown) rooms.push(`<span class="pfb-room is-more">+${picks.total - shown} more</span>`);

    const why = picks.total === 0
      ? `Nothing is free for the whole gap — the Free Rooms tab can find a room for part of it.`
      : floor === null
        ? `${picks.total} room${picks.total === 1 ? '' : 's'} free for the whole gap.`
        : `${picks.total} room${picks.total === 1 ? '' : 's'} free right through it${picks.sameFloor.length > 0 ? `, and these sit on floor ${floor} — where <b>${escHtml(gap.beforeCourse)}</b> starts` : ''}.`;

    return `
        <div class="pfb-slot">
          <div class="pfb-slot-head">
            <span class="pfb-slot-when">${escHtml(SBC_DAY_LABELS[gap.day] || gap.day)} · ${escHtml(formatClock(gap.startMin))} → ${escHtml(formatClock(gap.endMin))}</span>
            <span class="pfb-chip ${gap.minutes >= 180 ? 'warn' : ''}">${escHtml(formatDuration(gap.minutes))}</span>
          </div>
          <div class="pfb-slot-why">After ${escHtml(gap.afterCourse)}, before ${escHtml(gap.beforeCourse)} in <b>${escHtml(gap.nextRoom)}</b>. ${why}</div>
          ${rooms.length > 0 ? `<div class="pfb-rooms">${rooms.join('')}</div>` : ''}
        </div>`;
  }).join('');

  return `
      <section class="pfb-card">
        <div class="pfb-head">
          <h3 class="pfb-title"><span class="pfb-ico">🚪</span> Where to wait</h3>
          <span class="pfb-chip">${gaps.length} recurring gap${gaps.length === 1 ? '' : 's'}</span>
        </div>
        <p class="pfb-verdict">${sbcGapsVerdict(gaps)}</p>
        <div class="pfb-slots">${slots}</div>
        <div class="pfb-note">Availability is computed from the same feed the Free Rooms tab uses — pointed at your gaps instead of the whole campus.</div>
      </section>`;
}

// ── Block assembly ────────────────────────────────────────────────────────────

function sbcLoadingHtml() {
  return `
    <div class="pfb-zone"><h2>This semester</h2></div>
    <section class="pfb-card">
      <div class="pfb-skel" style="width:38%"></div>
      <div class="pfb-skel" style="width:82%"></div>
      <div class="pfb-skel" style="width:64%"></div>
    </section>`;
}

function sbcUnavailableHtml() {
  return `
    <div class="pfb-zone"><h2>This semester</h2></div>
    <section class="pfb-card">
      <div class="pfb-empty">Couldn't reach the section feed. Your exam dates, week and gaps appear here once it's back.</div>
    </section>`;
}

function sbcNoRoutineHtml() {
  return `
    <div class="pfb-zone"><h2>This semester</h2></div>
    <section class="pfb-card">
      <div class="pfb-head"><h3 class="pfb-title"><span class="pfb-ico">🗓️</span> This semester</h3></div>
      <div class="pfb-empty">Pick your sections on the <strong>Routine</strong> tab and this page will show when your exams bunch up, what your week costs you, and where to wait out the gaps.</div>
      <a class="pfb-cta" href="../#routine">Build your routine</a>
    </section>`;
}

/**
 * The whole block. `sections` are the student's picked sections; `busyIndex`
 * is the campus-wide room index (all sections, not just theirs) so gap rooms
 * can be suggested. Pure — the caller does the fetching.
 */
function sbcBriefingHtml(sections, busyIndex, kind = null, now = Date.now()) {
  const picked = Array.isArray(sections) ? sections : [];
  if (picked.length === 0) return sbcNoRoutineHtml();

  // No explicit kind means "whichever period is still ahead" — see pickExamKind.
  const shown = (kind === 'mid' || kind === 'final') ? kind : pickExamKind(picked, now);
  const week = buildWeekSummary(picked);
  const brief = buildExamBriefing(picked, shown, now);
  const suggestions = busyIndex
    ? week.gaps.map(gap => suggestGapRooms(busyIndex, gap))
    : week.gaps.map(() => ({ sameFloor: [], elsewhere: [], total: 0 }));

  return `
    <div class="pfb-zone">
      <h2>This semester</h2>
      <span class="pfb-zone-sub">${picked.length} course${picked.length === 1 ? '' : 's'} · from your saved routine</span>
    </div>
    ${sbcExamCardHtml(brief, shown)}
    ${sbcWeekCardHtml(week)}
    ${sbcGapRoomsCardHtml(week.gaps, suggestions)}`;
}

// ── DOM wiring ────────────────────────────────────────────────────────────────

// Held so the Midterms/Finals switch can repaint without re-fetching the feed.
let _sbcState = { hostId: null, sections: [], busyIndex: null, kind: null };

// `kind` is optional: omit it and the period is chosen from the clock, which is
// what the first paint wants. The toggle passes an explicit kind, and that
// choice then sticks for the session — a student who went looking for the other
// period shouldn't have it swapped back out from under them on a repaint.
function renderSemesterBriefing(hostId, sections, busyIndex, kind) {
  if (typeof document === 'undefined') return;
  const host = document.getElementById(hostId);
  if (!host) return;
  const picked = Array.isArray(sections) ? sections : [];
  _sbcState = {
    hostId,
    sections: picked,
    busyIndex: busyIndex || null,
    kind: (kind === 'mid' || kind === 'final') ? kind : pickExamKind(picked),
  };
  // Every interpolation above goes through escHtml.
  // nosemgrep: javascript.browser.security.insecure-document-method.insecure-document-method
  // nosemgrep: javascript.browser.security.insecure-innerhtml.insecure-innerhtml
  host.innerHTML = sbcBriefingHtml(_sbcState.sections, _sbcState.busyIndex, _sbcState.kind);
}

/** Paint a non-data state (loading / feed down) into the same host. */
function renderSemesterBriefingState(hostId, html) {
  if (typeof document === 'undefined') return;
  const host = document.getElementById(hostId);
  if (!host) return;
  // Static markup from this module, no interpolation.
  // nosemgrep: javascript.browser.security.insecure-document-method.insecure-document-method
  // nosemgrep: javascript.browser.security.insecure-innerhtml.insecure-innerhtml
  host.innerHTML = html;
}

// Midterms ⇄ Finals. Wired through dispatch because the production CSP blocks
// inline handlers (script-src-attr), so an onclick here would silently die.
registerAction('briefing:examKind', el => {
  const kind = el && el.dataset ? el.dataset.kind : null;
  if (kind !== 'mid' && kind !== 'final') return;
  if (!_sbcState.hostId || kind === _sbcState.kind) return;
  renderSemesterBriefing(_sbcState.hostId, _sbcState.sections, _sbcState.busyIndex, kind);
});

// Exported for the room-floor label in tests and for callers that want to show
// a floor next to a room without importing the core module directly.

// ── js/animations/cursor.js ─────────────────────────────────────
function initCursor() {
  const dot        = document.getElementById('cursor-dot');
  const ring       = document.getElementById('cursor-ring');
  const cursorGlow = document.getElementById('cursor-glow');
  const body       = document.body;

  let mX = window.innerWidth / 2,  mY = window.innerHeight / 2;
  let dX = mX, dY = mY;
  let rX = mX, rY = mY;
  let gX = mX, gY = mY;

  // Derive the cursor shape from the element currently under the pointer on
  // every mouse event, instead of paired add/remove listeners. Paired
  // listeners get stuck when the hovered element vanishes without a mouseout
  // (innerHTML repaints, a modal opening on top) — the stale cursor-text
  // I-beam then follows the pointer everywhere.
  const HOVER_TARGETS = 'a, button, .feature-card, .nav-logo';
  const TEXT_TARGETS  = 'input, textarea, select, .pf-select';
  function syncCursorState(target) {
    const el = target instanceof Element ? target : null;
    body.classList.toggle('cursor-hover', !!(el && el.closest(HOVER_TARGETS)));
    body.classList.toggle('cursor-text',  !!(el && el.closest(TEXT_TARGETS)));
  }

  document.addEventListener('mousemove', e => {
    mX = e.clientX; mY = e.clientY;
    syncCursorState(e.target);
  }, { passive: true });
  document.addEventListener('mouseover', e => syncCursorState(e.target));
  document.addEventListener('mousedown', () => body.classList.add('cursor-click'));
  document.addEventListener('mouseup',   () => body.classList.remove('cursor-click'));
  document.addEventListener('mouseleave', () => {
    dot.style.opacity = '0'; ring.style.opacity = '0'; cursorGlow.style.opacity = '0';
  });
  document.addEventListener('mouseenter', () => {
    dot.style.opacity = ''; ring.style.opacity = ''; cursorGlow.style.opacity = '';
  });

  function animateCursor() {
    dX += (mX - dX) * 0.85; dY += (mY - dY) * 0.85;
    rX += (mX - rX) * 0.14; rY += (mY - rY) * 0.14;
    gX += (mX - gX) * 0.07; gY += (mY - gY) * 0.07;
    dot.style.transform        = `translate(${dX}px, ${dY}px) translate(-50%, -50%)`;
    ring.style.transform       = `translate(${rX}px, ${rY}px) translate(-50%, -50%)`;
    cursorGlow.style.transform = `translate(${gX}px, ${gY}px) translate(-50%, -50%)`;
    requestAnimationFrame(animateCursor);
  }
  animateCursor();

  document.querySelectorAll('.magnetic').forEach(el => {
    el.addEventListener('mousemove', e => {
      if (document.body.classList.contains('modal-open')) return;
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width  / 2;
      const cy = rect.top  + rect.height / 2;
      el.style.transform = `translate(${(e.clientX - cx) * 0.35}px, ${(e.clientY - cy) * 0.35}px)`;
    });
    el.addEventListener('mouseleave', () => {
      if (document.body.classList.contains('modal-open')) return;
      el.style.transform = 'translate(0,0)';
    });
  });
}

// ── js/profile-entry.js ─────────────────────────────────────────
// ── js/profile-entry.js ───────────────────────────────────────────────────────
// Entry point for the dedicated /profile/ page. Paints a page shell (back link +
// title) once, then lets renderProfileTab fill the inner host with the account
// hub — the auth gate (loading / signed-out prompt / signed-in hub) is handled
// inside profileTab.js itself, so this entry just routes and repaints.
//
// Bundled into the same JS as the rest of the site, so it gates on
// `document.body.dataset.page === 'profile'` to stay inert on other pages.
// Helpers are prefixed `_pentry_` to avoid collisions with other UI modules.
//
// The seat-alerts card is intentionally omitted here (includeSeatAlerts:false):
// it needs the Seats tab's live runtime globals, which aren't loaded standalone.
// The inner host id is `profilePageContent` (not `profileContent`) so the
// module-level repaint listener inside profileTab.js stays a no-op on this page.

// Where the Routine tab persists `{ picks: { COURSE: sectionId|null } }`.
const PENTRY_ROUTINE_KEY = 'shohoj_routine_v1';
const PENTRY_BRIEFING_HOST = 'pfBriefingHost';
const PENTRY_UNLOCK_HOST = 'pfUnlockHost';

// Transcript-derived snapshot, written by the calculator's import flow.
const PENTRY_PROFILE_SNAPSHOT_KEY = 'shohoj_connect_profile_v1';

function _pentry_academicSnapshot() {
  try {
    if (typeof localStorage === 'undefined') return null;
    const raw = localStorage.getItem(PENTRY_PROFILE_SNAPSHOT_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : null;
  } catch {
    return null;
  }
}

function _pentry_onProfilePage() {
  return document.body && document.body.dataset && document.body.dataset.page === 'profile';
}

/** Section ids the student actually picked. Unpicked courses persist as null. */
function _pentry_pickedSectionIds() {
  try {
    if (typeof localStorage === 'undefined') return [];
    const raw = localStorage.getItem(PENTRY_ROUTINE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    const picks = (parsed && parsed.picks && typeof parsed.picks === 'object') ? parsed.picks : {};
    return Object.values(picks).filter(v => typeof v === 'number' && Number.isFinite(v));
  } catch {
    return [];
  }
}

/**
 * Fill the briefing slot. Runs after the account hub paints so a slow or dead
 * feed never delays the rest of the page — the slot carries its own loading,
 * empty and unavailable states.
 *
 * The feed read is anonymous and cached (same client, same 10-minute TTL as the
 * Seats and Routine tabs), so opening this page costs at most one extra request.
 */
async function _pentry_loadBriefing() {
  if (!document.getElementById(PENTRY_BRIEFING_HOST)) return;

  const pickedIds = _pentry_pickedSectionIds();
  if (pickedIds.length === 0) {
    renderSemesterBriefingState(PENTRY_BRIEFING_HOST, sbcNoRoutineHtml());
    return;
  }

  renderSemesterBriefingState(PENTRY_BRIEFING_HOST, sbcLoadingHtml());
  try {
    const feed = await fetchConnectFeed();
    const wanted = new Set(pickedIds);
    const picked = feed.sections.filter(s => wanted.has(s.sectionId));
    if (picked.length === 0) {
      // Picks that no longer exist in the feed — a new semester has rolled over.
      renderSemesterBriefingState(PENTRY_BRIEFING_HOST, sbcNoRoutineHtml());
      return;
    }
    // No kind passed: the card opens on whichever exam period is still ahead.
    renderSemesterBriefing(PENTRY_BRIEFING_HOST, picked, buildRoomBusyIndex(feed.sections));
  } catch {
    renderSemesterBriefingState(PENTRY_BRIEFING_HOST, sbcUnavailableHtml());
  }
}

/**
 * Fill the "Next registration" slot (#478).
 *
 * Shares the briefing's feed read: same client, same 10-minute cache, so this
 * zone costs no extra request. Without an imported transcript there is nothing
 * to join against, so it invites the import rather than showing an empty map.
 */
async function _pentry_loadUnlockMap() {
  if (!document.getElementById(PENTRY_UNLOCK_HOST)) return;

  const snapshot = _pentry_academicSnapshot();
  if (!snapshot) {
    renderUnlockMap(PENTRY_UNLOCK_HOST, umcNoTranscriptHtml());
    return;
  }

  renderUnlockMap(PENTRY_UNLOCK_HOST, umcLoadingHtml());
  try {
    const feed = await fetchConnectFeed();
    renderUnlockMap(PENTRY_UNLOCK_HOST, umcHtmlFor(snapshot, feed.sections));
  } catch {
    renderUnlockMap(PENTRY_UNLOCK_HOST, umcUnavailableHtml());
  }
}

function _pentry_mountShell() {
  const host = document.getElementById('profilePageHost');
  if (!host || host.dataset.mounted === '1') return;
  host.dataset.mounted = '1';
  // Static markup, no interpolation.
  // nosemgrep: javascript.browser.security.insecure-document-method.insecure-document-method
  // nosemgrep: javascript.browser.security.insecure-innerhtml.insecure-innerhtml
  host.innerHTML = `
    <div class="pf-page">
      <header class="pf-page-bar">
        <a class="pf-back" href="../">← Back to Shohoj</a>
        <span class="pf-page-title">Your profile</span>
      </header>
      <main id="profilePageContent" class="pf-page-body"></main>
    </div>`;
}

function _pentry_route() {
  if (!_pentry_onProfilePage()) return;
  _pentry_mountShell();
  renderProfileTab('profilePageContent', { includeSeatAlerts: false, includeBriefing: true });
  // Fire-and-forget: each zone fills its own slot when the feed lands.
  _pentry_loadBriefing();
  _pentry_loadUnlockMap();
}

document.addEventListener('DOMContentLoaded', () => {
  initCursor();
  _pentry_route();
});
window.addEventListener('shohoj:auth-changed', _pentry_route);

</script>
