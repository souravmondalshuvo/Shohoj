name = "shohoj-papers"
main = "index.js"
compatibility_date = "2025-09-01"

# Cron trigger for seat-drop email alerts. The scheduled() handler polls the
# CONNECT feed once for everyone, edge-detects watched sections going full→open,
# and emails via Resend. Every 2 minutes balances responsiveness during
# registration week against CDN politeness (one fetch serves all users). Reuses
# the existing RESEND_API_KEY + SERVICE_ACCOUNT_JSON secrets — none new.
#
# The same handler also archives the CONNECT feed into PAPERS_BUCKET (#633).
# That feed carries one semester and drops it when the next opens for advising,
# so without a snapshot the running semester simply disappears mid-term. It
# gates itself on the manifest and writes about four times a day, so it does not
# inherit this 2-minute cadence — see worker/semesterArchive.js. No new binding.
[triggers]
crons = ["*/2 * * * *"]

# R2 bucket binding — create the bucket in the Cloudflare dashboard first.
[[r2_buckets]]
binding = "PAPERS_BUCKET"
bucket_name = "shohoj-papers"

# Per-UID rate limit. Each /upload and /reviews call increments a counter
# keyed on the Firebase UID (`<namespace>:<uid>`); over the threshold returns
# HTTP 429. The simple_action enforces a sliding-window limit on the worker.
# Tune `limit` and `period` for your traffic; current values target a single
# active student burst (≈ a dozen uploads / reviews per minute).
[[unsafe.bindings]]
name = "PAPERS_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Per-UID rate limit for /api/assistant (#435). Each chat turn is a Claude API
# call, so this bounds per-student spend as well as abuse: 10 turns/min is
# generous for a human conversation and cheap protection against a scripted
# loop.
[[unsafe.bindings]]
name = "ASSISTANT_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Plain-text env vars — safe to commit. Do NOT put secrets here; use
# `wrangler secret put` for anything sensitive:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put SERVICE_ACCOUNT_JSON   # Firebase service-account JSON, used for /upload metadata and /reviews writes
#   wrangler secret put ANTHROPIC_API_KEY      # Claude API key for /api/assistant — set BEFORE merging, merges auto-deploy
#
# Admin authorization is enforced via the Firebase `admin` custom claim
# (see scripts/set_admin_claim.js).
[vars]
FIREBASE_PROJECT_ID = "shohoj"
ALLOWED_ORIGINS = "https://souravmondalshuvo.github.io,http://localhost:5173,http://127.0.0.1:5173"
ADMIN_EMAIL = "admin.shohoj@gmail.com"
ADMIN_MODERATION_URL = "https://souravmondalshuvo.github.io/Shohoj/admin/"
# Ceiling on estimated Assistant model spend per calendar month, in USD. The
# assistant runs on ONE person's API key while serving a campus, so this is the
# stop on an unbounded bill. Reaching it makes /api/assistant refuse turns until
# the month rolls over; "0" switches the assistant off without removing keys.
ASSISTANT_MONTHLY_BUDGET_USD = "5"
# Sender for seat-alert + admin-upload emails. MUST be a sender on a domain you
# have verified in Resend (SPF + DKIM) — see worker/README.md. Leave UNSET until
# then: the Resend test sender (onboarding@resend.dev) only delivers to the
# Resend account owner, so the Worker treats a missing or test EMAIL_FROM as
# "not configured" and skips sends (logging a loud operational error) rather
# than silently dropping every student's email.
# EMAIL_FROM = "Shohoj Alerts <alerts@your-verified-domain.example>"
