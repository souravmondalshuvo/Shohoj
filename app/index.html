<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shohoj</title>
    <script>
      // Apply the saved theme before first paint (no flash). Default dark, the
      // same shohoj_theme key the production app uses.
      (function () {
        try {
          var t = localStorage.getItem('shohoj_theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Shohoj brand layer (light theme) — makes the shell read as the real app
         ahead of the full cutover: DM Sans / Syne, the green-glass palette, an
         ambient orb backdrop, a branded glass header + logo, and glass content
         panels. The existing route rules ride on top (they already use green
         accents on light surfaces), so no per-route rewrite. Dark theme + the
         complete css/style.css port land at cutover. */
      /* Semantic tokens — each LIGHT value equals the color it replaced, so light
         mode is byte-identical to before; dark supplies the glass counterpart.
         The route rules below reference these via a mechanical find-replace. */
      :root, :root[data-theme="light"] {
        --green: #2ECC71;
        --green-dim: #1a7a44;
        --gold: #F0A500;
        --bg: #d4edde;
        --glass2: rgba(255,255,255,0.75);
        --shadow-card: 0 20px 60px rgba(46,204,113,0.10), inset 0 1px 0 rgba(255,255,255,0.9);
        --c-text: #0d2914;
        --c-text-muted: #2d5a3d;
        --c-faint: rgba(0,0,0,0.5);
        --c-green-ink: #1c7c45;
        --c-card: #ffffff;
        --c-surface: rgba(0,0,0,0.04);
        --c-line: rgba(0,0,0,0.08);
        --c-border: rgba(0,0,0,0.12);
        --c-border2: rgba(0,0,0,0.15);
        --c-border3: rgba(0,0,0,0.2);
        --border: rgba(46,204,113,0.25);
        --text: var(--c-text);
        --text2: var(--c-text-muted);
        --c-warn-ink: #b07d1a;
        --c-blue-ink: #2d5a8a;
        --c-danger-ink: #c0392b;
        --header-bg: rgba(212,237,222,0.75);
      }
      :root[data-theme="dark"] {
        --bg: #071009;
        --glass2: rgba(255,255,255,0.055);
        --shadow-card: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
        --c-text: #e8f0ea;
        --c-text-muted: #9fc4ab;
        --c-faint: rgba(232,240,234,0.55);
        --c-green-ink: #5fe0a0;
        --c-card: rgba(255,255,255,0.05);
        --c-surface: rgba(255,255,255,0.05);
        --c-line: rgba(255,255,255,0.09);
        --c-border: rgba(46,204,113,0.2);
        --c-border2: rgba(46,204,113,0.24);
        --c-border3: rgba(46,204,113,0.3);
        --border: rgba(46,204,113,0.22);
        --c-warn-ink: #e8c06a;
        --c-blue-ink: #8fb8e8;
        --c-danger-ink: #ff8b7d;
        --header-bg: rgba(9,18,12,0.8);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'DM Sans', system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }
      /* Ambient orbs — pure CSS backdrop, no markup needed. */
      body::before, body::after {
        content: ''; position: fixed; border-radius: 50%; filter: blur(80px);
        pointer-events: none; z-index: -1;
      }
      body::before {
        width: min(520px, 90vw); height: min(520px, 90vw); top: -140px; left: -120px;
        background: radial-gradient(circle, rgba(46,204,113,0.30) 0%, transparent 70%);
      }
      body::after {
        width: min(400px, 80vw); height: min(400px, 80vw); bottom: 5%; right: -100px;
        background: radial-gradient(circle, rgba(100,200,140,0.25) 0%, transparent 70%);
      }
      h1, h2, h3 { font-family: 'Syne', 'DM Sans', sans-serif; letter-spacing: -0.02em; }
      /* Header + brand logo */
      .shell-header {
        position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border);
        background: var(--header-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      }
      .shell-brand { display: flex; align-items: center; gap: 9px; text-decoration: none; margin-right: 6px; }
      .shell-brand-mark {
        width: 32px; height: 32px; flex-shrink: 0; background: var(--green); border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Syne', sans-serif; font-weight: 800; font-size: 15px; color: #0b0f0d; letter-spacing: -0.5px;
      }
      .shell-brand-text { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 17px; color: var(--text); white-space: nowrap; }
      .shell-brand-text span { color: var(--green); }
      .shell-theme-toggle {
        font: inherit; font-size: 15px; line-height: 1; min-height: 36px; min-width: 36px; padding: 4px 8px;
        border-radius: 999px; cursor: pointer; border: 1px solid var(--border); background: var(--c-surface); color: var(--c-text);
      }
      .shell-theme-toggle:focus-visible { outline: 2px solid var(--c-green-ink); outline-offset: 2px; }
      /* Content sits on a branded glass panel; the orbs stay at z-index:-1. */
      .shell-page {
        margin: 20px auto; background: var(--glass2); border: 1px solid var(--border);
        border-radius: 16px; box-shadow: var(--shadow-card);
      }
      .shell-btn--primary { background: var(--green); border-color: var(--green); }
      .shell-skip-link {
        position: absolute; left: -999px; top: 0;
        background: var(--c-card); padding: 8px 12px; z-index: 10;
      }
      .shell-skip-link:focus { left: 8px; }
      .shell-header { border-bottom: 1px solid var(--c-border); }
      .shell-nav { display: flex; gap: 4px; padding: 12px 16px; flex-wrap: wrap; align-items: center; }
      .shell-nav-list { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .shell-nav-link { padding: 6px 14px; text-decoration: none; border-radius: 999px; color: var(--c-text-muted); }
      .shell-nav-link--active { background: rgba(46,204,113,0.12); font-weight: 600; }
      /* Desktop shows the full nav; the toggle only appears under the breakpoint. */
      .shell-nav-toggle { display: none; }
      @media (max-width: 720px) {
        .shell-nav-toggle {
          display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px;
          font: inherit; font-weight: 600; border-radius: 999px; cursor: pointer;
          border: 1px solid rgba(46,204,113,0.35); background: rgba(46,204,113,0.08); color: var(--c-green-ink);
        }
        .shell-nav-toggle:focus-visible { outline: 2px solid var(--c-green-ink); outline-offset: 2px; }
        /* The link list collapses to a full-width drawer below the top row. */
        .shell-nav-list { display: none; flex-basis: 100%; flex-direction: column; gap: 2px; margin-top: 8px; }
        .shell-nav-list--open { display: flex; }
        .shell-nav-link { display: block; min-height: 44px; padding: 11px 12px; }
      }
      .shell-auth { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .shell-auth-loading { color: var(--c-faint); font-size: 12px; }
      .shell-auth-email { color: var(--c-text-muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .shell-auth-btn {
        font: inherit; font-size: 12px; font-weight: 600; padding: 5px 14px; border-radius: 999px;
        cursor: pointer; border: 1px solid rgba(46,204,113,0.35); background: rgba(46,204,113,0.08); color: var(--c-green-ink);
      }
      .shell-auth-btn:focus-visible { outline: 2px solid var(--c-green-ink); outline-offset: 2px; }
      .shell-main:focus { outline: none; }
      .shell-page { padding: 24px 16px; max-width: 720px; }
      .shell-muted { color: var(--c-text-muted); }
      .shell-brand-bn { color: var(--c-green-ink); }
      .home-links {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px; margin: 20px 0 4px;
      }
      .home-link {
        display: flex; flex-direction: column; gap: 4px; padding: 14px 16px;
        border-radius: 14px; border: 1px solid var(--border); background: var(--c-surface);
        text-decoration: none; color: var(--c-text); transition: border-color 0.15s, transform 0.15s;
      }
      .home-link:hover { border-color: var(--green); transform: translateY(-1px); }
      .home-link:focus-visible { outline: 2px solid var(--c-green-ink); outline-offset: 2px; }
      .home-link-label { font-weight: 700; color: var(--c-green-ink); }
      .home-link-blurb { font-size: 13px; color: var(--c-text-muted); }
      .home-cloud { font-size: 13px; margin-top: 16px; }
      .shell-route-error { padding: 24px 16px; }
      .shell-btn {
        font: inherit; padding: 8px 18px; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--c-border2); background: var(--c-card); color: var(--c-text);
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      }
      .shell-btn--primary { background: #27ae60; border-color: #27ae60; color: #fff; }
      .shell-btn--danger { background: #e74c3c; border-color: #e74c3c; color: #fff; }
      .shell-btn:focus-visible { outline: 2px solid var(--c-green-ink); outline-offset: 2px; }
      .shell-modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.4);
        display: flex; align-items: center; justify-content: center; padding: 16px;
      }
      .shell-modal {
        background: var(--c-card); border-radius: 12px; padding: 20px; max-width: 420px;
        width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      }
      .shell-modal-title { margin: 0 0 8px; font-size: 18px; }
      .shell-modal-message { margin: 0 0 16px; color: var(--c-text-muted); }
      .shell-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
      .calc-setup {
        display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
        margin-bottom: 16px;
      }
      .calc-setup-field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--c-text-muted); }
      .calc-setup-select {
        font: inherit; padding: 6px 8px; border-radius: 8px;
        border: 1px solid var(--c-border3); background: var(--c-card); max-width: 320px;
      }
      .calc-setup-credits { font-size: 13px; font-weight: 600; color: var(--c-green-ink); padding-bottom: 8px; }
      .simulator-box { margin-top: 20px; padding: 14px 0; border-top: 1px solid var(--c-border); }
      .simulator-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 12px; }
      .simulator-row label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--c-text-muted); }
      .simulator-row input { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--c-border3); width: 130px; }
      .sim-callout { padding: 12px 14px; border-radius: 10px; border: 1px solid; margin-bottom: 8px; }
      .sim-callout--good { background: rgba(46,204,113,0.08); border-color: rgba(46,204,113,0.22); }
      .sim-callout--bad { background: rgba(231,76,60,0.06); border-color: rgba(231,76,60,0.25); }
      .sim-callout-title { font-size: 16px; font-weight: 800; color: var(--c-green-ink); }
      .sim-callout-body { font-size: 12px; color: var(--c-text-muted); margin-top: 4px; }
      .sim-before-after { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 10px 12px; border: 1px solid var(--c-border); border-radius: 10px; margin-bottom: 12px; }
      .sim-before-after--bad { border-color: rgba(231,76,60,0.25); background: rgba(231,76,60,0.06); }
      .sim-ba-left { display: flex; align-items: center; gap: 14px; }
      .sim-ba-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--c-faint); }
      .sim-ba-val { font-size: 20px; font-weight: 800; }
      .sim-ba-val.red { color: #e74c3c; }
      .sim-ba-delta { font-size: 10px; font-weight: 700; color: var(--c-green-ink); }
      .sim-difficulty-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--c-faint); margin-bottom: 4px; }
      .sim-difficulty-bar { height: 6px; border-radius: 4px; background: var(--c-line); overflow: hidden; }
      .sim-difficulty-fill { height: 100%; border-radius: 4px; }
      .sim-difficulty-fill.easy { background: #2ECC71; }
      .sim-difficulty-fill.medium { background: #F0A500; }
      .sim-difficulty-fill.hard { background: #e74c3c; }
      .sim-plan-table th, .sim-retake-table th { padding: 4px 8px; text-align: center; color: var(--c-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--c-border); }
      .sim-plan-table td, .sim-retake-table td { padding: 6px 8px; border-bottom: 1px solid var(--c-line); font-size: 12px; }
      .sim-retake-row { cursor: pointer; }
      .sim-retake-row.selected { background: rgba(29,185,84,0.07); }
      .sim-retake-course { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sim-retake-heading { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--c-faint); margin-bottom: 4px; }
      .sim-strategy-badge { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; white-space: nowrap; border: 1px solid; }
      .sim-strategy-badge.retake { background: rgba(231,76,60,0.10); color: #e74c3c; border-color: rgba(231,76,60,0.28); }
      .sim-strategy-badge.repeat { background: rgba(86,180,233,0.12); color: var(--c-blue-ink); border-color: rgba(86,180,233,0.30); }
      .sim-impact-box { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(29,185,84,0.08); border: 1px solid rgba(29,185,84,0.2); }
      .sim-legend { margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: rgba(0,0,0,0.5); }
      .sim-legend > span { display: flex; align-items: center; gap: 5px; }
      .sim-nudge { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: rgba(86,180,233,0.07); border: 1px solid rgba(86,180,233,0.22); display: flex; align-items: flex-start; gap: 10px; }
      .sim-nudge-btn { margin-top: 10px; padding: 7px 16px; border-radius: 999px; background: rgba(46,204,113,0.10); border: 1px solid rgba(46,204,113,0.25); color: var(--c-green-ink); font-size: 12px; font-weight: 600; cursor: pointer; font: inherit; }
      .rv-modal { max-width: 440px; max-height: 92vh; overflow-y: auto; }
      .rv-subtitle { font-size: 12px; line-height: 1.5; }
      .rv-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
      .rv-field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--c-text-muted); }
      .rv-input {
        font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px;
        border: 1px solid rgba(46,204,113,0.28); background: var(--c-surface);
        outline: none; box-sizing: border-box; font-size: 13px;
      }
      .rv-input:focus { border-color: rgba(46,204,113,0.55); }
      .rv-initials { text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; }
      .rv-text { resize: vertical; min-height: 64px; }
      .rv-count { font-size: 11px; color: var(--c-text-muted); text-align: right; }
      .rv-field-error, .rv-error { font-size: 12px; color: #e74c3c; }
      .rv-error { margin-bottom: 10px; }
      .rv-stars-box { border: 1px solid rgba(46,204,113,0.28); border-radius: 12px; padding: 2px 14px; margin-bottom: 14px; background: var(--c-surface); }
      .rv-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--c-surface); }
      .rv-row:last-of-type { border-bottom: none; }
      .rv-row-label { flex: 1; min-width: 0; }
      .rv-row-title { font-size: 13px; font-weight: 600; }
      .rv-row-hint { font-size: 11px; opacity: 0.6; margin-top: 2px; }
      .rv-row-stars { display: flex; gap: 2px; flex-shrink: 0; }
      .rv-star {
        cursor: pointer; font-size: 20px; line-height: 1; padding: 2px; color: #999;
        background: none; border: none; transition: color 0.15s, transform 0.1s; user-select: none;
      }
      .rv-star:hover { transform: scale(1.15); }
      .rv-star.filled { color: #F0A500; }
      .rv-star:focus-visible { outline: 2px solid var(--c-green-ink); outline-offset: 1px; border-radius: 4px; }
      .ti-modal { max-width: 460px; max-height: 92vh; overflow-y: auto; }
      .ti-table {
        width: 100%; border-collapse: collapse; margin-bottom: 12px;
        border: 1px solid var(--c-border); border-radius: 8px;
      }
      .ti-table th {
        padding: 6px 8px; text-align: left; font-size: 10px; color: var(--c-faint);
        text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--c-border);
      }
      .ti-table td { padding: 4px 8px; font-size: 12px; border-bottom: 1px solid var(--c-line); }
      .ti-table tr:last-child td { border-bottom: none; }
      .ti-table th:not(:first-child), .ti-table td:not(:first-child) { text-align: center; }
      .ti-table td:last-child { color: var(--c-green-ink); font-weight: 600; }
      .ti-dept { font-size: 12px; color: var(--c-text-muted); margin: 0 0 12px; }
      .pl-empty { text-align: center; padding: 40px 16px; color: var(--c-text-muted); }
      .pl-empty-icon { font-size: 32px; margin-bottom: 8px; }
      .pl-empty-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: var(--c-text); }
      .pl-empty-desc { font-size: 13px; max-width: 460px; margin: 0 auto; line-height: 1.6; }
      .pl-stats { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
      .pl-stat { flex: 1; min-width: 70px; padding: 8px 10px; border-radius: 8px; border: 1px solid; text-align: center; }
      .pl-stat--green { background: rgba(46,204,113,0.06); border-color: rgba(46,204,113,0.15); }
      .pl-stat--red { background: rgba(231,76,60,0.05); border-color: rgba(231,76,60,0.12); }
      .pl-stat--blue { background: rgba(86,180,233,0.06); border-color: rgba(86,180,233,0.12); }
      .pl-stat-val { font-size: 18px; font-weight: 800; color: var(--c-green-ink); }
      .pl-stat--red .pl-stat-val { color: #e74c3c; }
      .pl-stat--blue .pl-stat-val { color: var(--c-blue-ink); }
      .pl-stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--c-faint); font-weight: 600; }
      .pl-section-head { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 8px; }
      .pl-section-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--c-faint); }
      .pl-found { font-size: 11px; color: var(--c-faint); }
      .pl-link-btn { font: inherit; font-size: 11px; color: var(--c-faint); background: none; border: none; cursor: pointer; text-decoration: underline; }
      .pl-plan-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: rgba(46,204,113,0.04); border: 1px solid rgba(46,204,113,0.12); margin-bottom: 4px; }
      .pl-plan-row-main { flex: 1; min-width: 0; }
      .pl-plan-row-name { display: flex; align-items: center; gap: 6px; }
      .pl-ok { color: var(--c-green-ink); }
      .pl-miss { color: #e74c3c; }
      .pl-code { font-size: 11px; font-weight: 700; color: var(--c-green-ink); background: rgba(46,204,113,0.10); border-radius: 4px; padding: 1px 6px; flex-shrink: 0; }
      .pl-name { font-size: 12px; color: var(--c-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .pl-credits { font-size: 12px; color: var(--c-text-muted); flex-shrink: 0; }
      .pl-warn-hard { font-size: 10px; color: #e74c3c; margin-top: 2px; }
      .pl-warn-soft { font-size: 10px; color: var(--c-warn-ink); margin-top: 2px; }
      .pl-warn-soft-inline { font-size: 10px; color: var(--c-warn-ink); }
      .pl-icon-btn { background: none; border: none; color: rgba(0,0,0,0.4); cursor: pointer; font-size: 14px; padding: 2px; flex-shrink: 0; }
      .pl-remove { font-size: 16px; }
      .pl-credit-total { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: rgba(46,204,113,0.06); border: 1px solid rgba(46,204,113,0.15); }
      .pl-credit-total-val { font-size: 13px; font-weight: 700; }
      .pl-credit--good { color: var(--c-green-ink); }
      .pl-credit--warn { color: var(--c-warn-ink); }
      .pl-credit--bad { color: #e74c3c; }
      .pl-credit-target { font-size: 11px; color: var(--c-faint); }
