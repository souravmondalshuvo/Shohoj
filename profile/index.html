<!DOCTYPE html>
<html lang="en" data-theme="dark" data-page="profile">
<head>
  <!-- Clickjacking defense. GitHub Pages can't send X-Frame-Options or a real
       frame-ancestors header (that CSP directive is ignored in a <meta> tag),
       so guard against framing in JS: keep the page hidden until we confirm
       we're the top window, then try to break out of any frame. A sandboxed
       frame that blocks top-navigation simply leaves the page hidden — there is
       nothing to click-jack. build3.py hashes this inline script into the CSP. -->
  <style id="antiClickjack">body{display:none !important;}</style>
  <script>
    if (self === top) {
      var n = document.getElementById('antiClickjack');
      n.parentNode.removeChild(n);
    } else {
      try { top.location = self.location; } catch (e) {}
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <script>
    (function(){
      try {
        var t = localStorage.getItem('shohoj_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch(e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.gstatic.com https://www.google.com https://www.googletagmanager.com https://apis.google.com 'unsafe-inline'; worker-src 'self' https://cdnjs.cloudflare.com blob:; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src blob: https://www.gstatic.com https://www.google.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseappcheck.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.googleapis.com https://shohoj-papers.souravmondal033.workers.dev https://usis-cdn.eniamza.com; img-src 'self' data: https://*.googleusercontent.com; frame-src 'self' blob: https://accounts.google.com https://www.google.com https://*.firebaseapp.com; frame-ancestors 'none';">
  <title>Profile · Shohoj</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231DB954'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-size='44' font-weight='900' fill='%23062012'>স</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <!-- Public runtime config — see js/config/runtime-config.template.js. -->
  <script src="../js/config/runtime-config.js"></script>
</head>
<body data-page="profile">
  <!-- CUSTOM CURSOR -->
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>
  <div id="cursor-glow"></div>

  <div id="profilePageHost">
    <div class="admin-bootstrap">
      <div class="admin-bootstrap-spinner"></div>
      <p>Loading your profile…</p>
    </div>
  </div>

  <!-- Toast container for sign-in/sign-out feedback -->
  <div id="toast-container"></div>

  <!-- Firebase auth init — inlined by build3.py -->
  <script type="module">
    import { initAuth } from '../js/auth/firebase.js';
    initAuth();
  </script>
  <script type="module" src="../js/profile-entry.js"></script>
</body>
</html>
